<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kitchen Companion</title>
<meta name="theme-color" content="#1F2620">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --color-bg: #FAF7F0;
  --color-ink: #1F2620;
  --color-ink-soft: #4A524C;
  --color-paper: #FFFFFF;
  --color-line: #E4DFD3;

  --color-accent: #C97A3D;       /* primary action / pantry */
  --color-accent-dark: #A8602C;
  --color-fridge: #5B7A6B;       /* sage */
  --color-freezer: #7C8CA8;      /* steel-blue */
  --color-leftovers: #9A8C5E;    /* muted gold */
  --color-warn: #A8472E;         /* rust — expiry/discard */
  --color-warn-bg: #F6E4DE;

  --font-display: 'Avenir Next', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  --radius-card: 14px;
  --radius-sm: 8px;
  --nav-height: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--color-bg);
  color: var(--color-ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

body {
  padding-bottom: calc(var(--nav-height) + var(--safe-bottom));
  min-height: 100vh;
}

h1, h2, h3 {
  font-family: var(--font-display);
  margin: 0;
  letter-spacing: -0.01em;
}

.eyebrow {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-ink-soft);
}

/* ============================================================
   HEADER
   ============================================================ */
.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--color-bg);
  padding: 18px 18px 12px;
  border-bottom: 1px solid var(--color-line);
}
.app-header h1 { font-size: 22px; font-weight: 800; }
.app-header .subtitle { font-size: 13px; color: var(--color-ink-soft); margin-top: 2px; }

/* ============================================================
   MAIN CONTENT
   ============================================================ */
#app-content {
  padding: 16px;
  max-width: 640px;
  margin: 0 auto;
}

.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--color-ink-soft);
}
.empty-state .glyph { font-size: 40px; margin-bottom: 10px; opacity: 0.6; }
.empty-state h3 { font-size: 16px; margin-bottom: 6px; color: var(--color-ink); }
.empty-state p { font-size: 14px; line-height: 1.4; margin: 0; }

.phase-placeholder {
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-card);
  padding: 32px 20px;
  text-align: center;
  margin-top: 24px;
}
.phase-placeholder .eyebrow { display: block; margin-bottom: 8px; }
.phase-placeholder p { color: var(--color-ink-soft); font-size: 14px; line-height: 1.5; margin: 8px 0 0; }

/* ============================================================
   HOME DASHBOARD
   ============================================================ */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--color-paper);
  border-radius: var(--radius-card);
  padding: 14px 16px;
  border: 1px solid var(--color-line);
}
.stat-card .count { font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1; }
.stat-card .label { font-size: 12px; color: var(--color-ink-soft); margin-top: 4px; }
.stat-card.loc-pantry { border-left: 4px solid var(--color-accent); }
.stat-card.loc-fridge { border-left: 4px solid var(--color-fridge); }
.stat-card.loc-freezer { border-left: 4px solid var(--color-freezer); }
.stat-card.loc-leftovers { border-left: 4px solid var(--color-leftovers); }

.section-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 24px 0 10px;
}
.section-heading h2 { font-size: 15px; font-weight: 800; }
.section-heading .count-badge {
  font-size: 12px;
  color: var(--color-ink-soft);
}

.expiry-list { display: flex; flex-direction: column; gap: 8px; }
.expiry-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
}
.expiry-row.urgent { background: var(--color-warn-bg); border-color: #E3C3B7; }
.expiry-row .name { flex: 1; font-size: 14px; font-weight: 600; }
.expiry-row .when { font-size: 12px; color: var(--color-warn); font-weight: 700; }
.expiry-row.urgent .when { color: var(--color-warn); }

/* ============================================================
   INVENTORY LIST (Kitchen screen)
   ============================================================ */
.location-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 16px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.location-tabs::-webkit-scrollbar { display: none; }
.loc-tab {
  flex: 0 0 auto;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  border: 1px solid var(--color-line);
  background: var(--color-paper);
  color: var(--color-ink-soft);
  cursor: pointer;
  white-space: nowrap;
}
.loc-tab.active {
  background: var(--color-ink);
  border-color: var(--color-ink);
  color: var(--color-bg);
}

.item-card {
  display: flex;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-card);
  margin-bottom: 10px;
  overflow: hidden;
  cursor: pointer;
}
.item-card .edge {
  width: 5px;
  flex-shrink: 0;
}
.item-card.loc-pantry .edge { background: var(--color-accent); }
.item-card.loc-fridge .edge { background: var(--color-fridge); }
.item-card.loc-freezer .edge { background: var(--color-freezer); }
.item-card.loc-leftovers .edge { background: var(--color-leftovers); }

.item-card .body { flex: 1; padding: 12px 14px; }
.item-card .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.item-card .name { font-size: 15px; font-weight: 700; }
.item-card .qty { font-size: 13px; color: var(--color-ink-soft); font-weight: 600; white-space: nowrap; }
.item-card .meta-row {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.tag {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 2px 8px;
  border-radius: 20px;
  background: var(--color-bg);
  color: var(--color-ink-soft);
  border: 1px solid var(--color-line);
}
.tag.state-frozen { color: var(--color-freezer); }
.tag.state-defrosting { color: var(--color-warn); }
.tag.state-leftover, .tag.state-cooked { color: var(--color-leftovers); }
.item-card .expiry-flag { font-size: 11px; font-weight: 700; color: var(--color-warn); margin-top: 4px; }

/* ============================================================
   FAB
   ============================================================ */
.fab {
  position: fixed;
  right: 18px;
  bottom: calc(var(--nav-height) + var(--safe-bottom) + 18px);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--color-accent);
  color: white;
  border: none;
  font-size: 28px;
  line-height: 1;
  box-shadow: 0 6px 16px rgba(31,38,32,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 15;
}
.fab:active { transform: scale(0.94); }

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(var(--nav-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--color-paper);
  border-top: 1px solid var(--color-line);
  display: flex;
  z-index: 20;
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--color-ink-soft);
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  padding: 6px 0;
}
.nav-btn .icon { font-size: 20px; line-height: 1; }
.nav-btn.active { color: var(--color-accent); }

/* ============================================================
   MODAL / FORM
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(31,38,32,0.45);
  z-index: 30;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }

.modal-sheet {
  background: var(--color-bg);
  width: 100%;
  max-height: 85vh;
  overflow: hidden;
  border-radius: 20px 20px 0 0;
  padding: 18px 18px 0;
  transform: translateY(16px);
  transition: transform 0.2s ease;
  display: flex;
  flex-direction: column;
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }

#item-form { display: flex; flex-direction: column; min-height: 0; flex: 1; }

.modal-scroll-area {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 12px;
  min-height: 0;
}

.modal-action-bar {
  flex-shrink: 0;
  padding: 10px 0 calc(16px + var(--safe-bottom));
  background: var(--color-bg);
  border-top: 1px solid var(--color-line);
}

.more-fields { margin-top: 4px; }
.more-fields summary {
  font-size: 13px;
  font-weight: 700;
  color: var(--color-accent);
  cursor: pointer;
  padding: 10px 0;
  list-style: none;
}
.more-fields summary::-webkit-details-marker { display: none; }
.more-fields summary::before { content: "+ "; }
.more-fields[open] summary::before { content: "− "; }
.more-fields-inner { padding-top: 6px; }

.modal-handle {
  width: 36px;
  height: 4px;
  background: var(--color-line);
  border-radius: 4px;
  margin: 0 auto 14px;
}

.modal-title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.modal-title-row h2 { font-size: 18px; }
.close-btn {
  background: none;
  border: none;
  font-size: 22px;
  color: var(--color-ink-soft);
  cursor: pointer;
  padding: 4px 8px;
}

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-ink-soft);
  margin-bottom: 6px;
}
.field input[type="text"],
.field input[type="number"],
.field input[type="date"],
.field select,
.field textarea {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: var(--font-body);
  background: var(--color-paper);
  color: var(--color-ink);
}
.field textarea { resize: vertical; min-height: 60px; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }

.segmented {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.segmented button {
  flex: 1 1 auto;
  min-width: 70px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-line);
  background: var(--color-paper);
  color: var(--color-ink-soft);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.segmented button.selected {
  background: var(--color-ink);
  border-color: var(--color-ink);
  color: var(--color-bg);
}

.btn-primary {
  width: 100%;
  padding: 14px;
  background: var(--color-accent);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 6px;
}
.btn-primary:active { background: var(--color-accent-dark); }

.btn-secondary {
  width: 100%;
  padding: 12px;
  background: none;
  color: var(--color-ink-soft);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}

.btn-danger {
  width: 100%;
  padding: 12px;
  background: none;
  color: var(--color-warn);
  border: 1px solid #E3C3B7;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}

/* History trail */
.history-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.history-row {
  font-size: 13px;
  padding: 8px 10px;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
}
.history-row .h-action { font-weight: 700; }
.history-row .h-date { font-size: 11px; color: var(--color-ink-soft); margin-top: 2px; }

/* Settings */
.settings-row {
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.settings-row .label { font-size: 14px; font-weight: 700; }
.settings-row .desc { font-size: 12px; color: var(--color-ink-soft); margin-top: 2px; }
.settings-row .chev { color: var(--color-ink-soft); }

.toast {
  position: fixed;
  bottom: calc(var(--nav-height) + var(--safe-bottom) + 18px);
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--color-ink);
  color: var(--color-bg);
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

<script>
/* ============================================================
   DATABASE
   ============================================================ */
const DB_NAME = 'KitchenCompanionDB';
const DB_VERSION = 1;
let db = null;

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = (event) => {
      const _db = event.target.result;

      if (!_db.objectStoreNames.contains('inventoryItems')) {
        const store = _db.createObjectStore('inventoryItems', { keyPath: 'id', autoIncrement: true });
        store.createIndex('location', 'location', { unique: false });
        store.createIndex('state', 'state', { unique: false });
        store.createIndex('expiryDate', 'expiryDate', { unique: false });
        store.createIndex('category', 'category', { unique: false });
      }

      if (!_db.objectStoreNames.contains('inventoryHistory')) {
        const store = _db.createObjectStore('inventoryHistory', { keyPath: 'id', autoIncrement: true });
        store.createIndex('inventoryItemId', 'inventoryItemId', { unique: false });
        store.createIndex('date', 'date', { unique: false });
      }

      if (!_db.objectStoreNames.contains('freezerRatingsReference')) {
        _db.createObjectStore('freezerRatingsReference', { keyPath: 'ingredientName' });
      }

      if (!_db.objectStoreNames.contains('quickAddTemplates')) {
        const store = _db.createObjectStore('quickAddTemplates', { keyPath: 'id', autoIncrement: true });
        store.createIndex('usageCount', 'usageCount', { unique: false });
      }

      if (!_db.objectStoreNames.contains('recipes')) {
        const store = _db.createObjectStore('recipes', { keyPath: 'id', autoIncrement: true });
        store.createIndex('cuisine', 'cuisine', { unique: false });
        store.createIndex('mealType', 'mealType', { unique: false });
      }

      if (!_db.objectStoreNames.contains('mealPlans')) {
        _db.createObjectStore('mealPlans', { keyPath: 'id', autoIncrement: true });
      }

      if (!_db.objectStoreNames.contains('batchCookEvents')) {
        _db.createObjectStore('batchCookEvents', { keyPath: 'id', autoIncrement: true });
      }

      if (!_db.objectStoreNames.contains('purchaseEvents')) {
        _db.createObjectStore('purchaseEvents', { keyPath: 'id', autoIncrement: true });
      }

      if (!_db.objectStoreNames.contains('settings')) {
        _db.createObjectStore('settings', { keyPath: 'key' });
      }
    };

    request.onsuccess = (event) => {
      db = event.target.result;
      resolve(db);
    };

    request.onerror = (event) => reject(event.target.error);
  });
}

function dbGetAll(storeName, indexName, query) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const source = indexName ? store.index(indexName) : store;
    const request = query !== undefined ? source.getAll(query) : source.getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function dbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    if (!db) { reject(new Error('Database is not open')); return; }
    try {
      const tx = db.transaction(storeName, 'readonly');
      tx.onerror = () => reject(tx.error || new Error('Transaction failed'));
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      const request = tx.objectStore(storeName).get(key);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    } catch (err) { reject(err); }
  });
}

function dbPut(storeName, value) {
  return new Promise((resolve, reject) => {
    if (!db) { reject(new Error('Database is not open')); return; }
    try {
      const tx = db.transaction(storeName, 'readwrite');
      tx.onerror = () => reject(tx.error || new Error('Transaction failed'));
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      const request = tx.objectStore(storeName).put(value);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    } catch (err) { reject(err); }
  });
}

function dbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    if (!db) { reject(new Error('Database is not open')); return; }
    try {
      const tx = db.transaction(storeName, 'readwrite');
      tx.onerror = () => reject(tx.error || new Error('Transaction failed'));
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      const request = tx.objectStore(storeName).delete(key);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    } catch (err) { reject(err); }
  });
}

function dbClearAndBulkPut(storeName, items) {
  return new Promise((resolve, reject) => {
    if (!db) { reject(new Error('Database is not open')); return; }
    try {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      store.clear();
      items.forEach((item) => store.put(item));
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
    } catch (err) { reject(err); }
  });
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(dateStr);
  target.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}

function formatExpiry(dateStr) {
  const d = daysUntil(dateStr);
  if (d === null) return '';
  if (d < 0) return `Expired ${Math.abs(d)}d ago`;
  if (d === 0) return 'Expires today';
  if (d === 1) return 'Expires tomorrow';
  return `Expires in ${d}d`;
}

  raw: 'Raw', frozen: 'Frozen', defrosting: 'Defrosting', fresh: 'Fresh',

async function renderHomeScreen() {
  const items = await dbGetAll('inventoryItems');

  const counts = { pantry: 0, fridge: 0, freezer: 0, leftovers: 0 };
  items.forEach((item) => { if (counts[item.location] !== undefined) counts[item.location]++; });

  const expiringSoon = items
    .filter((item) => item.expiryDate && daysUntil(item.expiryDate) <= 3)
    .sort((a, b) => daysUntil(a.expiryDate) - daysUntil(b.expiryDate))
    .slice(0, 6);

  const statCardsHtml = Object.keys(counts).map((loc) => `
    <div class="stat-card loc-${loc}">
      <div class="count">${counts[loc]}</div>
      <div class="label">${LOCATION_LABELS[loc]}</div>
    </div>
  `).join('');

  let expiryHtml;
  if (expiringSoon.length === 0) {
    expiryHtml = `
      <div class="empty-state">
        <div class="glyph">✓</div>
        <h3>Nothing expiring soon</h3>
        <p>Items with an expiry date within 3 days will show up here.</p>
      </div>
    `;
  } else {
    expiryHtml = `<div class="expiry-list">` + expiringSoon.map((item) => {
      const d = daysUntil(item.expiryDate);
      const urgent = d <= 1;
      return `
        <div class="expiry-row ${urgent ? 'urgent' : ''}">
          <span class="name">${item.name}</span>
          <span class="when">${formatExpiry(item.expiryDate)}</span>
        </div>
      `;
    }).join('') + `</div>`;
  }

  const totalItems = items.length;

  return `
    <div class="stat-grid">${statCardsHtml}</div>
    ${totalItems === 0 ? `
      <div class="empty-state">
        <div class="glyph">🧺</div>
        <h3>Your kitchen is empty — for now</h3>
        <p>Head to the Kitchen tab and tap + to log your first item.</p>
      </div>
    ` : `
      <div class="section-heading">
        <h2>Expiring soon</h2>
        <span class="count-badge">${expiringSoon.length} item${expiringSoon.length === 1 ? '' : 's'}</span>
      </div>
      ${expiryHtml}
    `}
  `;
}

async function renderKitchenScreen() {
  const items = await dbGetAll('inventoryItems');
  AppState.inventory = items;

  const filtered = AppState.activeLocationFilter === 'all'
    ? items
    : items.filter((i) => i.location === AppState.activeLocationFilter);

  const tabsHtml = `
    <div class="location-tabs">
      ${['all', 'pantry', 'fridge', 'freezer', 'leftovers'].map((loc) => `
        <button class="loc-tab ${AppState.activeLocationFilter === loc ? 'active' : ''}" data-loc="${loc}">
          ${loc === 'all' ? 'All' : LOCATION_LABELS[loc]}
        </button>
      `).join('')}
    </div>
  `;

  if (filtered.length === 0) {
    return tabsHtml + `
      <div class="empty-state">
        <div class="glyph">🧺</div>
        <h3>No items here yet</h3>
        <p>Tap the + button to add something to your ${AppState.activeLocationFilter === 'all' ? 'kitchen' : LOCATION_LABELS[AppState.activeLocationFilter].toLowerCase()}.</p>
      </div>
    `;
  }

  const sorted = [...filtered].sort((a, b) => {
    const ea = a.expiryDate ? new Date(a.expiryDate).getTime() : Infinity;
    const eb = b.expiryDate ? new Date(b.expiryDate).getTime() : Infinity;
    if (ea !== eb) return ea - eb;
    return a.name.localeCompare(b.name);
  });

  const itemsHtml = sorted.map((item) => {
    const qtyLabel = item.portionCount
      ? `${item.portionCount} × ${item.portionSize || ''}`.trim()
      : `${item.quantity}${item.unit === 'each' ? '' : item.unit}`;

    const expiryFlag = item.expiryDate
      ? `<div class="expiry-flag">${formatExpiry(item.expiryDate)}</div>`
      : '';

    return `
      <div class="item-card loc-${item.location}" data-id="${item.id}">
        <div class="edge"></div>
        <div class="body">
          <div class="top-row">
            <span class="name">${item.name}</span>
            <span class="qty">${qtyLabel}</span>
          </div>
          <div class="meta-row">
            <span class="tag state-${item.state}">${STATE_LABELS[item.state] || item.state}</span>
            ${item.category ? `<span class="tag">${item.category}</span>` : ''}
          </div>
          ${expiryFlag}
        </div>
      </div>
    `;
  }).join('');

  return tabsHtml + itemsHtml;
}

async function saveItemFromForm(existingItem) {
  const getSelected = (id) => {
    const el = document.querySelector(`#${id} button.selected`);
    return el ? el.dataset.val : null;
  };

  const name = document.getElementById('f-name').value.trim();
  if (!name) return;

  const now = new Date().toISOString();
  const portionCount = document.getElementById('f-portionCount').value;
  const portionSize = document.getElementById('f-portionSize').value.trim();

  const itemData = {
    name,
    quantity: parseFloat(document.getElementById('f-quantity').value) || 0,
    unit: document.getElementById('f-unit').value,
    portionCount: portionCount ? parseInt(portionCount, 10) : null,
    portionSize: portionSize || null,
    location: getSelected('f-location') || 'pantry',
    subLocation: null,
    state: getSelected('f-state') || 'raw',
    category: document.getElementById('f-category').value.trim(),
    purchaseDate: document.getElementById('f-purchaseDate').value || null,
    expiryDate: document.getElementById('f-expiryDate').value || null,
    cost: document.getElementById('f-cost').value ? parseFloat(document.getElementById('f-cost').value) : null,
    notes: document.getElementById('f-notes').value.trim(),
    freezerFriendlyRating: null,
    linkedPurchaseEventId: null,
    updatedAt: now
  };

  const submitBtn = document.querySelector('.modal-action-bar button[type="submit"]');

  try {
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Saving…'; }

    if (existingItem) {
      itemData.id = existingItem.id;
      itemData.createdAt = existingItem.createdAt;
      await dbPut('inventoryItems', itemData);
      await logHistory(existingItem.id, 'adjusted', null, existingItem.location, itemData.location, 'Item details edited');
      showToast('Item updated');
    } else {
      itemData.createdAt = now;
      const newId = await dbPut('inventoryItems', itemData);
      await logHistory(newId, 'created', itemData.quantity, null, itemData.location, 'Item added to kitchen');
      showToast('Item added');
    }

    closeModal();
    renderRoute();
  } catch (err) {
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = existingItem ? 'Save changes' : 'Add to kitchen'; }
    alert('Couldn\'t save this item: ' + (err && err.message ? err.message : 'unknown storage error') + '\n\nYour local storage may be full or restricted by this browser.');
  }
}

async function deleteItem(id, name) {
  await dbDelete('inventoryItems', id);
  await logHistory(id, 'discarded', null, null, null, `Removed: ${name}`);
  closeModal();
  showToast('Item removed');
  renderRoute();
}

      <h2>History</h2>
    </div>
    ${historyHtml}

  openModal(html);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('edit-item-btn').addEventListener('click', () => openItemForm(item));

function formatHistoryAction(h) {
  const actionVerbs = {
    created: 'Added to kitchen',
    moved: `Moved ${h.fromLocation ? LOCATION_LABELS[h.fromLocation] || h.fromLocation : '?'} → ${h.toLocation ? LOCATION_LABELS[h.toLocation] || h.toLocation : '?'}`,
    used: `Used${h.quantityChanged ? ' ' + h.quantityChanged : ''}`,
    portioned: 'Created freezer portions',
    discarded: 'Discarded',
    adjusted: 'Edited'
  };
  let label = actionVerbs[h.action] || h.action;
  if (h.notes) label += ` — ${h.notes}`;
  return label;
}

async function logHistory(inventoryItemId, action, quantityChanged, fromLocation, toLocation, notes) {
  await dbPut('inventoryHistory', {
    inventoryItemId,
    action,
    quantityChanged,
    fromLocation,
    toLocation,
    date: new Date().toISOString(),
    notes: notes || ''
  });
}

async function exportKitchenData() {
  const storeNames = ['inventoryItems', 'inventoryHistory', 'freezerRatingsReference', 'quickAddTemplates', 'recipes', 'mealPlans', 'batchCookEvents', 'purchaseEvents', 'settings'];
  const backup = { exportedAt: new Date().toISOString(), version: DB_VERSION, data: {} };

  for (const storeName of storeNames) {
    backup.data[storeName] = await dbGetAll(storeName);
  }

  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `kitchen_backup_${dateStamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}

async function handleImportFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  try {
    const text = await file.text();
    const backup = JSON.parse(text);
    if (!backup.data) throw new Error('Invalid backup file');

    const confirmed = confirm('Importing will replace all current kitchen data with the backup. Continue?');
    if (!confirmed) { e.target.value = ''; return; }

    for (const storeName of Object.keys(backup.data)) {
      if (db.objectStoreNames.contains(storeName)) {
        await dbClearAndBulkPut(storeName, backup.data[storeName]);
      }
    }
    showToast('Kitchen data restored');
    renderRoute();
  } catch (err) {
    alert('Could not read this backup file. Make sure it was exported from Kitchen Companion.');
  } finally {
    e.target.value = '';
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
function registerServiceWorker() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {
      // Offline caching unavailable (e.g. file:// protocol) — app still works online.
    });
  }
}

/* ============================================================
   INIT
   ============================================================ */
document.querySelectorAll('.nav-btn').forEach((btn) => {
  btn.addEventListener('click', () => navigateTo(btn.dataset.route));
});

window.addEventListener('hashchange', handleHashChange);

(async function init() {
  try {
    if (!window.indexedDB) {
      showFatalError('This browser doesn\'t support local storage (IndexedDB), so Kitchen Companion can\'t save data here. Try opening this file in Safari or Chrome instead of the app you\'re currently using — or better, host it online and open that link.');
      return;
    }
    await openDatabase();
    await seedIfEmpty();
    registerServiceWorker();
    handleHashChange();
  } catch (err) {
    showFatalError('Kitchen Companion couldn\'t start because local storage failed to open. This usually happens when opening the file directly from a Files app. Try opening it in Safari or Chrome, or host it online (e.g. GitHub Pages) and open that link instead.<br><br><span style="opacity:0.7;font-size:11px;">' + (err && err.message ? err.message : String(err)) + '</span>');
  }
})();

function showFatalError(message) {
  document.getElementById('app-content').innerHTML = `
    <div class="empty-state" style="text-align:left;">
      <div class="glyph" style="text-align:center;">⚠</div>
      <h3 style="text-align:center;">Couldn't load your kitchen</h3>
      <p>${message}</p>
    </div>
  `;
  document.getElementById('fab-btn').style.display = 'none';
}

</script>
