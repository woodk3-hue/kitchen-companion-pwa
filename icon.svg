<?xml version="1.0" encoding="UTF-8"?>
<!-- PantryFit icon: black rounded square. A central shield with Pf monogram, a fork and spoon
     crossing behind it, PantryFit wordmark and a dumbbell underneath. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1B1E"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Fork and spoon crossing behind, handles pointing down -->
  <g fill="#fff">
    <!-- Fork, tines upper-left -->
    <g transform="translate(170 170) rotate(-30)">
      <rect x="-32" y="-70" width="12" height="42" rx="3"/>
      <rect x="-6"  y="-70" width="12" height="42" rx="3"/>
      <rect x="20"  y="-70" width="12" height="42" rx="3"/>
      <path d="M-40 -28 h80 v22 a40 40 0 0 1 -80 0 z"/>
      <rect x="-10" y="-6" width="20" height="200" rx="8"/>
    </g>
    <!-- Spoon, bowl upper-right -->
    <g transform="translate(342 170) rotate(30)">
      <ellipse cx="0" cy="-36" rx="38" ry="48"/>
      <rect x="-10" y="4" width="20" height="196" rx="8"/>
    </g>
  </g>

  <!-- Shield in front -->
  <path fill="#fff" d="M256 160
                      c -56 0 -92 10 -108 16
                      v 70
                      c 0 70 44 118 108 152
                      c 64 -34 108 -82 108 -152
                      v -70
                      c -16 -6 -52 -16 -108 -16 z"/>

  <!-- Pf monogram inside the shield (two layered Georgia letters) -->
  <g fill="#0E0F11" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-style="italic">
    <text x="236" y="280" text-anchor="middle" font-size="130">P</text>
    <text x="296" y="328" text-anchor="middle" font-size="110">f</text>
  </g>

  <!-- PantryFit wordmark -->
  <text x="256" y="420" fill="#fff" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="52" font-weight="800" letter-spacing="1">PantryFit</text>

  <!-- Dumbbell -->
  <g fill="#fff" transform="translate(256 466)">
    <rect x="-56" y="-5"  width="112" height="10" rx="3"/>
    <rect x="-72" y="-14" width="14"  height="28" rx="3"/>
    <rect x="58"  y="-14" width="14"  height="28" rx="3"/>
    <rect x="-90" y="-20" width="14"  height="40" rx="3"/>
    <rect x="76"  y="-20" width="14"  height="40" rx="3"/>
  </g>
</svg>
