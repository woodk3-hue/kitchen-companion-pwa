/* ============================================================
   ITEM CALORIES
   Stored per item as kcal per 100 g or 100 ml, with where the number
   came from: read off a label, estimated by AI, or typed in.
   ============================================================ */
// Protein / carbs / fat per 100 g or ml: a number, or null when unknown
function macroOrNull(value) {
  const n = Number(value);
  return Number.isFinite(n) && n > 0 ? Math.round(n * 10) / 10 : null;
}

function macrosFrom(source) {
  return { proteinPer100: macroOrNull(source.proteinPer100), carbsPer100: macroOrNull(source.carbsPer100), fatPer100: macroOrNull(source.fatPer100) };
}

const CALORIE_SOURCE_LABELS = { label: 'from label', database: 'from barcode database', estimated: 'estimated', manual: 'entered' };

function itemCaloriesText(item) {
  if (!item.caloriesPer100) return '';
  return `${Math.round(item.caloriesPer100)} kcal/100${item.caloriesUnit === 'ml' ? 'ml' : 'g'}`;
}

// Estimate calories from the item's name alone (no photo). Returns { caloriesPer100, caloriesUnit } or { error }.
async function estimateItemCalories(name, category) {
  let Anthropic = null;
  try {
    const loaded = await getAnthropicClient();
    Anthropic = loaded.Anthropic;
    const response = await loaded.client.beta.messages.create({
      model: AI_MODEL,
      max_tokens: 2000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: {
        effort: 'low',
        format: {
          type: 'json_schema',
          schema: {
            type: 'object',
            additionalProperties: false,
            required: ['caloriesPer100', 'caloriesUnit', 'proteinPer100', 'carbsPer100', 'fatPer100'],
            properties: {
              caloriesPer100: { type: 'number' },
              caloriesUnit: { type: 'string', enum: ['g', 'ml'] },
              proteinPer100: { type: 'number' },
              carbsPer100: { type: 'number' },
              fatPer100: { type: 'number' }
            }
          }
        }
      },
      messages: [{
        role: 'user',
        content: `Typical nutrition of this food as sold in Australian supermarkets, per 100 g (or per 100 ml for liquids and sauces sold by volume): energy in kcal, and protein, carbohydrate and fat in grams. Use 0 for everything if it isn't a food or you can't tell.\nItem: ${name}\nCategory: ${category || 'unknown'}`
      }]
    });
    if (response.stop_reason === 'refusal') return { error: 'Claude couldn\'t estimate this one. Enter it from the label instead.' };
    const text = response.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
    const parsed = JSON.parse(text);
    if (!parsed.caloriesPer100) return { error: 'Claude couldn\'t tell for this item. Enter it from the label instead.' };
    return parsed;
  } catch (err) {
    if (err instanceof SyntaxError) return { error: 'Claude\'s reply couldn\'t be read. Please try again.' };
    return { error: describeAiError(err, Anthropic) };
  }
}

/* ============================================================
   PHOTO SCAN
   Photos of a shelf, fridge or a few jars go to Claude, which lists the
   items it can see (reading labels for names, sizes and calories where
   visible). Nothing is saved until the person confirms the list.
   ============================================================ */
const PHOTO_MAX_EDGE = 1568; // larger images cost more and aren't read any better
const PHOTO_MAX_COUNT = 5;

// Shrink a photo on the phone and return base64 JPEG (without the data: prefix)
function photoToBase64Jpeg(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, PHOTO_MAX_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      resolve({ data: dataUrl.split(',')[1], preview: dataUrl });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Couldn\'t read that photo')); };
    img.src = url;
  });
}

function photoScanSchema() {
  return {
    type: 'object',
    additionalProperties: false,
    required: ['items'],
    properties: {
      items: {
        type: 'array',
        items: {
          type: 'object',
          additionalProperties: false,
          required: ['name', 'category', 'quantity', 'unit', 'states', 'isStaple', 'caloriesPer100', 'caloriesUnit', 'caloriesSource', 'proteinPer100', 'carbsPer100', 'fatPer100', 'confidence'],
          properties: {
            name: { type: 'string' },
            category: { type: 'string', enum: CATEGORIES },
            quantity: { type: 'number' },
            unit: { type: 'string', enum: ITEM_UNITS },
            states: { type: 'array', items: { type: 'string', enum: STATES_V2 } },
            isStaple: { type: 'boolean' },
            caloriesPer100: { type: 'number' },
            caloriesUnit: { type: 'string', enum: ['g', 'ml'] },
            caloriesSource: { type: 'string', enum: ['label', 'estimated', 'unknown'] },
            proteinPer100: { type: 'number' },
            carbsPer100: { type: 'number' },
            fatPer100: { type: 'number' },
            confidence: { type: 'string', enum: ['high', 'medium', 'low'] }
          }
        }
      }
    }
  };
}

async function requestPhotoScan(photos, location) {
  let Anthropic = null;
  try {
    const loaded = await getAnthropicClient();
    Anthropic = loaded.Anthropic;
    const instructions = [
      `These photos show food in my ${LOCATION_LABELS[location].toLowerCase()} in Brisbane, Australia. List each distinct food item you can see.`,
      '- name: what I would call it, with the brand if the label shows one, e.g. "Kikkoman Soy Sauce", "Mutti Crushed Tomatoes", "Basmati rice".',
      '- quantity and unit: how many of that item (e.g. 3 cans, 2 bottles, 1 jar), or the pack size in metric if there is just one (e.g. 1 kg, 500 g, 750 ml). Count identical items once with the total.',
      '- states: Frozen for freezer items; Opened if clearly opened; Fresh for fresh produce; otherwise Raw.',
      '- isStaple: true for salt, pepper, oils, dried spices, rice, flour, dals, soy sauce and similar basics.',
      '- caloriesPer100: energy in kcal per 100 g, or per 100 ml (caloriesUnit "ml") for liquids and sauces sold by volume. If a nutrition panel is readable, use it and set caloriesSource "label" (convert kJ to kcal by dividing by 4.184). Otherwise give a typical value and set "estimated". Use 0 with "unknown" if you can\'t tell.',
      '- proteinPer100, carbsPer100, fatPer100: grams per 100 g (or ml), from the same nutrition panel or typical values. 0 if unknown.',
      '- confidence: low if the item is partly hidden or you are guessing what it is.',
      'Skip non-food items. If the photos show nothing you can identify, return an empty list.'
    ].join('\n');
    const content = [
      ...photos.map((p) => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: p.data } })),
      { type: 'text', text: instructions }
    ];
    const response = await loaded.client.beta.messages.create({
      model: AI_MODEL,
      max_tokens: 16000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: { effort: 'medium', format: { type: 'json_schema', schema: photoScanSchema() } },
      messages: [{ role: 'user', content }]
    });
    if (response.stop_reason === 'refusal') return { error: 'Claude couldn\'t read these photos. Try different photos.' };
    if (response.stop_reason === 'max_tokens') return { error: 'Too many items to list in one go. Try fewer photos at a time.' };
    const text = response.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
    const parsed = JSON.parse(text);
    return { items: Array.isArray(parsed.items) ? parsed.items : [] };
  } catch (err) {
    if (err instanceof SyntaxError) return { error: 'Claude\'s reply couldn\'t be read. Please try again.' };
    return { error: describeAiError(err, Anthropic) };
  }
}

function photoScanRowHtml(row, i) {
  const units = ITEM_UNITS.map((u) => `<option value="${u}" ${row.unit === u ? 'selected' : ''}>${u}</option>`).join('');
  const cats = CATEGORIES.map((c) => `<option value="${c}" ${row.category === c ? 'selected' : ''}>${c}</option>`).join('');
  const kcalNote = row.caloriesPer100 ? (row.caloriesSource === 'label' ? 'from label' : 'estimated') : '';
  return `
    <div class="st-row ps-row ${row.selected ? 'ticked' : ''}" data-i="${i}">
      <div class="ps-top">
        <button type="button" class="st-box ps-tick" aria-label="Include">${row.selected ? '✓' : ''}</button>
        <input type="text" class="ps-name" value="${escapeHtml(row.name)}">
      </div>
      <div class="ps-tags">
        ${row.existingId ? '<span class="tag">Already in kitchen: updates it</span>' : '<span class="tag kcal-ok">New</span>'}
        ${row.confidence === 'low' ? '<span class="tag kcal-over">Check this one</span>' : ''}
      </div>
      <div class="ps-fields">
        <input type="number" class="ps-qty" min="0" step="any" inputmode="decimal" placeholder="Amount" value="${row.quantity ?? ''}">
        <select class="ps-unit">${units}</select>
        <select class="ps-cat">${cats}</select>
      </div>
      <div class="ps-fields">
        <input type="number" class="ps-kcal" min="0" step="any" inputmode="decimal" placeholder="kcal" value="${row.caloriesPer100 || ''}">
        <select class="ps-kunit"><option value="g" ${row.caloriesUnit !== 'ml' ? 'selected' : ''}>kcal / 100 g</option><option value="ml" ${row.caloriesUnit === 'ml' ? 'selected' : ''}>kcal / 100 ml</option></select>
        <span class="ps-knote">${kcalNote}</span>
      </div>
    </div>
  `;
}

function renderPhotoScanBody() {
  const body = document.getElementById('ps-body');
  if (!body) return;
  const thumbs = PhotoScan.photos.map((p, i) => `
    <div class="ps-thumb"><img src="${p.preview}" alt="Photo ${i + 1}"><button type="button" class="ps-remove" data-i="${i}" aria-label="Remove photo">×</button></div>`).join('');

  if (!PhotoScan.rows.length) {
    body.innerHTML = `
      <p class="st-intro">Photograph a shelf, the fridge door, or a few jars. For calories, include the nutrition panels on the back. Up to ${PHOTO_MAX_COUNT} photos.</p>
      <div class="ps-thumbs">${thumbs}
        ${PhotoScan.photos.length < PHOTO_MAX_COUNT ? '<label class="ps-add">📷<span>Add photo</span><input type="file" id="ps-file" accept="image/*" multiple hidden></label>' : ''}
      </div>
      <p class="ai-error" id="ps-error"></p>
    `;
  } else {
    const selected = PhotoScan.rows.filter((r) => r.selected).length;
    body.innerHTML = `
      <p class="st-intro">Here's what Claude found. Untick anything wrong and fix names, amounts or calories before adding.</p>
      ${PhotoScan.rows.map(photoScanRowHtml).join('')}
      <p class="recipe-muted">${selected} of ${PhotoScan.rows.length} ticked.</p>
    `;
  }
  attachPhotoScanListeners();
  updatePhotoScanButton();
}

function updatePhotoScanButton() {
  const btn = document.getElementById('ps-action');
  if (!btn) return;
  if (!PhotoScan.rows.length) {
    btn.textContent = PhotoScan.photos.length ? `Read ${PhotoScan.photos.length} photo${PhotoScan.photos.length === 1 ? '' : 's'}` : 'Add a photo first';
    btn.disabled = !PhotoScan.photos.length;
  } else {
    const n = PhotoScan.rows.filter((r) => r.selected).length;
    btn.textContent = n ? `Save ${n} item${n === 1 ? '' : 's'}` : 'Tick items to save';
    btn.disabled = !n;
  }
}

function attachPhotoScanListeners() {
  const file = document.getElementById('ps-file');
  if (file) {
    file.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []).slice(0, PHOTO_MAX_COUNT - PhotoScan.photos.length);
      for (const f of files) {
        try { PhotoScan.photos.push(await photoToBase64Jpeg(f)); } catch (err) { showToast(err.message); }
      }
      renderPhotoScanBody();
    });
  }
  document.querySelectorAll('.ps-remove').forEach((btn) => btn.addEventListener('click', () => {
    PhotoScan.photos.splice(parseInt(btn.dataset.i, 10), 1);
    renderPhotoScanBody();
  }));

  document.querySelectorAll('.ps-row').forEach((rowEl) => {
    const row = PhotoScan.rows[parseInt(rowEl.dataset.i, 10)];
    rowEl.querySelector('.ps-tick').addEventListener('click', () => {
      row.selected = !row.selected;
      const scroll = document.getElementById('ps-body').scrollTop;
      renderPhotoScanBody();
      document.getElementById('ps-body').scrollTop = scroll;
    });
    rowEl.querySelector('.ps-name').addEventListener('input', (e) => { row.name = e.target.value; });
    rowEl.querySelector('.ps-qty').addEventListener('input', (e) => { row.quantity = e.target.value === '' ? null : parseFloat(e.target.value); });
    rowEl.querySelector('.ps-unit').addEventListener('change', (e) => { row.unit = e.target.value; });
    rowEl.querySelector('.ps-cat').addEventListener('change', (e) => { row.category = e.target.value; });
    rowEl.querySelector('.ps-kcal').addEventListener('input', (e) => {
      row.caloriesPer100 = e.target.value === '' ? null : parseFloat(e.target.value);
      row.caloriesSource = 'manual';
      rowEl.querySelector('.ps-knote').textContent = '';
    });
    rowEl.querySelector('.ps-kunit').addEventListener('change', (e) => { row.caloriesUnit = e.target.value; });
  });
}

async function openPhotoScan() {
  PhotoScan.photos = [];
  PhotoScan.rows = [];
  if (!getAiKey()) {
    openModal(`
      <div class="modal-title-row"><h2>📸 Scan photo</h2><button class="close-btn" id="modal-close">×</button></div>
      <div class="empty-state"><div class="glyph">📸</div><h3>Add your API key first</h3>
        <p>Photo scanning uses your Anthropic account, like AI meal suggestions. Add your key in Settings → AI suggestions.</p></div>
      <button type="button" class="btn-primary" id="ps-to-settings">Go to Settings</button>
    `);
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('ps-to-settings').addEventListener('click', () => { closeModal(); navigateTo('settings'); });
    return;
  }

  openModal(`
    <div class="modal-title-row">
      <h2>📸 Scan photo</h2>
      <button class="close-btn" id="modal-close">×</button>
    </div>
    <div class="segmented" id="ps-location" style="margin-bottom:10px;">
      ${['pantry', 'fridge', 'freezer'].map((loc) => `<button type="button" data-val="${loc}" class="${loc === PhotoScan.location ? 'selected' : ''}">${LOCATION_LABELS[loc]}</button>`).join('')}
    </div>
    <div class="modal-scroll-area st-body" id="ps-body"></div>
    <div class="modal-action-bar">
      <button type="button" class="btn-primary" id="ps-action" disabled>Add a photo first</button>
    </div>

function closePhotoScan() {
  if ((PhotoScan.rows.some((r) => r.selected) || PhotoScan.photos.length) && !confirm('Close without saving?')) return;
  PhotoScan.photos = [];
  PhotoScan.rows = [];
  closeModal();
}

// Items already in the kitchen at this location get updated (calories, and amount if it had none) instead of duplicated
async function markExistingRows() {
  const items = await dbGetAll('inventoryItems');
  PhotoScan.rows.forEach((row) => {
    const words = matchWords(row.name);
    const match = items.find((i) => i.location === PhotoScan.location && matchWords(i.name) === words);
    row.existingId = match ? match.id : null;
  });
}

async function readPhotos() {
  const btn = document.getElementById('ps-action');
  btn.disabled = true;
  btn.textContent = 'Reading photos… (up to a minute)';
  const outcome = await requestPhotoScan(PhotoScan.photos, PhotoScan.location);
  if (!document.getElementById('ps-body')) return; // closed while waiting
  if (outcome.error || !outcome.items.length) {
    renderPhotoScanBody();
    document.getElementById('ps-error').textContent = outcome.error || 'No food items were recognised. Try a closer, brighter photo.';
    return;
  }
  PhotoScan.rows = outcome.items.map((it) => ({
    name: it.name,
    category: it.category,
    quantity: it.quantity || null,
    unit: it.unit,
    states: it.states && it.states.length ? it.states : (PhotoScan.location === 'freezer' ? ['Frozen'] : ['Raw']),
    isStaple: !!it.isStaple,
    caloriesPer100: it.caloriesSource === 'unknown' ? null : (it.caloriesPer100 || null),
    caloriesUnit: it.caloriesUnit,
    caloriesSource: it.caloriesSource === 'unknown' ? null : it.caloriesSource,
    ...(it.caloriesSource === 'unknown' ? {} : macrosFrom(it)),
    confidence: it.confidence,
    selected: true
  }));
  await markExistingRows();
  renderPhotoScanBody();
  document.getElementById('ps-body').scrollTop = 0;
}

async function savePhotoScan() {
  const rows = PhotoScan.rows.filter((r) => r.selected && r.name.trim());
  const btn = document.getElementById('ps-action');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  const now = new Date().toISOString();
  let added = 0;
  let updated = 0;
  try {
    for (const row of rows) {
      const calories = row.caloriesPer100
        ? { caloriesPer100: row.caloriesPer100, caloriesUnit: row.caloriesUnit === 'ml' ? 'ml' : 'g', caloriesSource: row.caloriesSource || 'manual', ...macrosFrom(row) }
        : {};
      if (row.existingId) {
        const item = await dbGet('inventoryItems', row.existingId);
        if (!item) continue;
        Object.assign(item, calories, { updatedAt: now });
        if ((item.quantity === null || item.quantity === undefined || item.quantity === 0) && row.quantity) {
          item.quantity = row.quantity;
          item.unit = row.unit;
        }
        await dbPut('inventoryItems', item);
        await logHistory(item.id, 'adjusted', null, item.location, item.location, 'Updated from photo scan');
        updated++;
      } else {
        const suggestion = await getSuggestedUseBy(row.name, row.states);
        const newId = await dbPut('inventoryItems', {
          name: row.name.trim(),
          quantity: row.quantity || null,
          unit: row.unit,
          portionCount: null,
          portionSize: null,
          location: PhotoScan.location,
          subLocation: null,
          states: row.states,
          category: row.category,
          isStaple: row.isStaple,
          purchaseDate: null,
          expiryDate: suggestion ? localDateString(addDays(new Date(), suggestion.suggestedDaysMax)) : null,
          useByOverrideDays: null,
          cost: null,
          notes: '',
          freezerFriendlyRating: null,
          linkedPurchaseEventId: null,
          caloriesPer100: null,
          caloriesUnit: null,
          caloriesSource: null,
          ...calories,
          createdAt: now,
          updatedAt: now
        });
        await logHistory(newId, 'created', row.quantity || null, null, PhotoScan.location, 'Added from photo scan');
        added++;
      }
    }
    PhotoScan.photos = [];
    PhotoScan.rows = [];
    closeModal();
    const summary = [added ? `added ${added}` : '', updated ? `updated ${updated}` : ''].filter(Boolean).join(', ');
    showToast(summary ? summary[0].toUpperCase() + summary.slice(1) : 'Nothing saved');
    renderRoute();
  } catch (err) {
    updatePhotoScanButton();
    alert('Couldn\'t save: ' + (err && err.message ? err.message : 'unknown storage error'));
  }
}

/* ============================================================
   BARCODE SCAN
   Camera barcode reading (BarcodeDetector, built into Chrome on Android)
   or a typed number, looked up in Open Food Facts for the product name,
   brand, pack size and calories. The person confirms before saving.
   ============================================================ */
const OFF_PRODUCT_URL = 'https://world.openfoodfacts.org/api/v2/product/';
const OFF_FIELDS = 'code,serving_quantity,product_name,product_name_en,brands,quantity,product_quantity,product_quantity_unit,nutriments,nutrition_data_per,categories_tags,image_front_small_url';
const BARCODE_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e'];

// Open Food Facts category tags → app category (first match wins)
const OFF_CATEGORY_RULES = [
  [/sauces|condiments|ketchup|mayonnaise|dressings|vinegars|oils/, 'Sauces & Condiments'],
  [/spices|herbs|seasonings|salts|curry-powders/, 'Spices & Seasonings'],
  [/canned|tinned/, 'Canned & Jarred'],
  [/frozen-ready-meals|ready-meals|prepared-meals/, 'Ready Meals'],
  [/dairies|milks|cheeses|yogurts|creams|butters/, 'Dairy & Refrigerated'],
  [/meats|poultry|fishes|seafood|eggs|tofu/, 'Protein'],
  [/rices|pastas|noodles|flours|cereals|breads|grains|legumes|lentils/, 'Carbs & Grains'],
  [/snacks|chocolates|biscuits|confectioneries|crisps|chips|sweets/, 'Snacks & Treats'],
  [/fruits/, 'Fruit'],
  [/vegetables/, 'Vegetables']
];

function offCategory(tags) {
  const joined = (tags || []).join(' ');
  const rule = OFF_CATEGORY_RULES.find(([re]) => re.test(joined));
  return rule ? rule[1] : 'Other';
}

// Turn an Open Food Facts product into the fields the confirm screen edits
function offToScanRow(code, p) {
  const brand = (p.brands || '').split(',')[0].trim();
  const baseName = (p.product_name_en || p.product_name || '').trim();
  const name = brand && baseName && !baseName.toLowerCase().includes(brand.toLowerCase()) ? `${brand} ${baseName}` : (baseName || brand);
  const category = offCategory(p.categories_tags);

  let sizeQty = Number(p.product_quantity) || null;
  let sizeUnit = (p.product_quantity_unit || '').toLowerCase();
  if (!sizeQty && p.quantity) {
    const m = String(p.quantity).match(/([\d.,]+)\s*(kg|g|ml|l)\b/i);
    if (m) { sizeQty = parseFloat(m[1].replace(',', '.')); sizeUnit = m[2].toLowerCase(); }
  }
  const isVolume = sizeUnit === 'ml' || sizeUnit === 'l' || (p.nutrition_data_per || '').includes('ml');
  const n = p.nutriments || {};
  const kcal = n['energy-kcal_100g'] ?? n['energy-kcal_100ml'] ?? (n.energy_100g ? n.energy_100g / 4.184 : null);

  // Cans, jars and bottles are easier to count; everything else starts at its pack size
  const countUnit = category === 'Canned & Jarred' ? 'can' : (category === 'Sauces & Condiments' && isVolume ? 'bottle' : null);
  let quantity = 1;
  let unit = countUnit || 'each';
  if (!countUnit && sizeQty) {
    quantity = sizeQty;
    unit = sizeUnit === 'l' ? 'L' : (sizeUnit === 'kg' ? 'kg' : (sizeUnit === 'ml' ? 'ml' : 'g'));
  }

  return {
    barcode: code,
    name,
    category,
    quantity,
    unit,
    packSize: p.quantity || (sizeQty ? `${sizeQty} ${sizeUnit}` : ''),
    caloriesPer100: kcal ? Math.round(kcal) : null,
    caloriesUnit: isVolume ? 'ml' : 'g',
    caloriesSource: kcal ? 'database' : null,
    servingSize: Number(p.serving_quantity) > 0 ? Math.round(Number(p.serving_quantity)) : null,
    proteinPer100: macroOrNull(n.proteins_100g),
    carbsPer100: macroOrNull(n.carbohydrates_100g),
    fatPer100: macroOrNull(n.fat_100g),
    image: p.image_front_small_url || '',
    found: true
  };
}

async function lookupBarcode(code) {
  const res = await fetch(`${OFF_PRODUCT_URL}${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`Open Food Facts returned ${res.status}`);
  const data = await res.json();
  if (data.status !== 1 || !data.product) return null;
  return offToScanRow(code, data.product);
}

const BarcodeScan = { location: 'pantry', stream: null, timer: null, row: null, busy: false };

function stopBarcodeCamera() {
  if (BarcodeScan.timer) { clearInterval(BarcodeScan.timer); BarcodeScan.timer = null; }
  if (BarcodeScan.stream) { BarcodeScan.stream.getTracks().forEach((t) => t.stop()); BarcodeScan.stream = null; }
}

async function startBarcodeCamera() {
  const video = document.getElementById('bc-video');
  const status = document.getElementById('bc-status');
  if (!video) return;
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices?.getUserMedia) {
    status.textContent = 'This browser can\'t read barcodes with the camera. Type the number under the barcode instead.';
    video.parentElement.style.display = 'none';
    return;
  }
  try {
    const supported = await window.BarcodeDetector.getSupportedFormats();
    const formats = BARCODE_FORMATS.filter((f) => supported.includes(f));
    const detector = new window.BarcodeDetector({ formats: formats.length ? formats : BARCODE_FORMATS });
    BarcodeScan.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    video.srcObject = BarcodeScan.stream;
    await video.play();
    status.textContent = 'Point the camera at a barcode.';
    BarcodeScan.timer = setInterval(async () => {
      if (BarcodeScan.busy || video.readyState < 2) return;
      try {
        const codes = await detector.detect(video);
        if (codes.length && codes[0].rawValue) handleBarcode(codes[0].rawValue);
      } catch (err) { /* a frame that can't be read; keep trying */ }
    }, 300);
  } catch (err) {
    stopBarcodeCamera();
    video.parentElement.style.display = 'none';
    status.textContent = err && err.name === 'NotAllowedError'
      ? 'Camera access was blocked. Allow the camera for this site in Chrome settings, or type the number instead.'
      : 'Couldn\'t start the camera. Type the number under the barcode instead.';
  }
}

async function handleBarcode(rawCode) {
  const code = String(rawCode).replace(/\D/g, '');
  if (code.length < 8 || BarcodeScan.busy) return;
  BarcodeScan.busy = true;
  stopBarcodeCamera();
  if (navigator.vibrate) navigator.vibrate(60);
  const status = document.getElementById('bc-status');
  if (status) status.textContent = `Looking up ${code}…`;

  let row = null;
  try {
    row = await lookupBarcode(code);
  } catch (err) {
    if (status) status.textContent = navigator.onLine ? 'Couldn\'t reach Open Food Facts. Try again in a moment.' : 'You\'re offline. Barcode lookup needs an internet connection.';
    BarcodeScan.busy = false;
    startBarcodeCamera();
    return;
  }
  if (!document.getElementById('bc-body')) return; // closed while looking up
  BarcodeScan.row = row || {
    barcode: code, name: '', category: 'Other', quantity: 1, unit: 'each', packSize: '',
    caloriesPer100: null, caloriesUnit: 'g', caloriesSource: null, image: '', found: false
  };
  if (BarcodeScan.mode === 'diary') await renderDiaryBarcodeConfirm();
  else await renderBarcodeConfirm();
}

async function findExistingForBarcode(row) {
  const items = await dbGetAll('inventoryItems');
  const here = items.filter((i) => i.location === BarcodeScan.location);
  return here.find((i) => i.barcode && i.barcode === row.barcode)
    || (row.name ? here.find((i) => matchWords(i.name) === matchWords(row.name)) : null)
    || null;
}

  const cats = CATEGORIES.map((c) => `<option value="${c}" ${row.category === c ? 'selected' : ''}>${c}</option>`).join('');

  document.getElementById('bc-body').innerHTML = `
    <div class="bc-product">
      ${row.image ? `<img src="${escapeHtml(row.image)}" alt="">` : '<div class="bc-noimg">▦</div>'}
      <div>
        <div class="bc-code">Barcode ${escapeHtml(row.barcode)}</div>
        ${row.found ? `<div class="tag kcal-ok">Found in Open Food Facts</div>` : '<div class="tag kcal-over">Not in the online database: fill it in below</div>'}
        ${row.packSize ? `<div class="recipe-muted" style="margin:4px 0 0;">Pack: ${escapeHtml(row.packSize)}</div>` : ''}
        ${row.proteinPer100 || row.carbsPer100 || row.fatPer100 ? `<div class="recipe-muted" style="margin:2px 0 0;">Per 100${row.caloriesUnit === 'ml' ? ' ml' : ' g'}: protein ${row.proteinPer100 ?? '–'} g · carbs ${row.carbsPer100 ?? '–'} g · fat ${row.fatPer100 ?? '–'} g</div>` : ''}
      </div>
    </div>
    <div class="field"><label>Name</label><input type="text" id="bc-name" value="${escapeHtml(row.name)}" placeholder="e.g. Mutti Crushed Tomatoes"></div>
    <div class="field">
      <label>Amount</label>
      <div class="ps-fields" style="margin:0;">
        <input type="number" id="bc-qty" min="0" step="any" inputmode="decimal" value="${row.quantity ?? ''}">
        <select id="bc-unit" class="ps-unit">${units}</select>
        <select id="bc-cat" class="ps-cat">${cats}</select>
      </div>
    </div>
    <div class="field">
      <label>Calories <span style="text-transform:none;font-weight:500;" id="bc-kcal-src">${row.caloriesSource ? `(${CALORIE_SOURCE_LABELS[row.caloriesSource]})` : '(optional)'}</span></label>
      <div class="ps-fields" style="margin:0;">
        <input type="number" id="bc-kcal" min="0" step="any" inputmode="decimal" placeholder="kcal" value="${row.caloriesPer100 ?? ''}">
        <select id="bc-kunit"><option value="g" ${row.caloriesUnit !== 'ml' ? 'selected' : ''}>per 100 g</option><option value="ml" ${row.caloriesUnit === 'ml' ? 'selected' : ''}>per 100 ml</option></select>
        ${!row.caloriesPer100 && getAiKey() ? '<button type="button" class="btn-secondary" id="bc-estimate" style="margin-top:0;width:auto;">✨ Estimate</button>' : ''}
      </div>
    </div>
    ${existing ? `<p class="recipe-muted">Already in your ${LOCATION_LABELS[BarcodeScan.location].toLowerCase()}: ${escapeHtml(existing.name)} (${escapeHtml(formatItemQuantity(existing))}). ${canAddUp ? 'Saving adds this amount to it.' : 'Saving updates its details.'}</p>` : ''}
  `;

  const kcal = document.getElementById('bc-kcal');
  kcal.addEventListener('input', () => { row.caloriesSource = 'manual'; document.getElementById('bc-kcal-src').textContent = '(entered)'; });
  const est = document.getElementById('bc-estimate');
  if (est) est.addEventListener('click', async () => {
    const name = document.getElementById('bc-name').value.trim();
    if (!name) { showToast('Enter the name first'); return; }
    est.disabled = true; est.textContent = 'Estimating…';
    const result = await estimateItemCalories(name, document.getElementById('bc-cat').value);
    est.disabled = false; est.textContent = '✨ Estimate';
    if (result.error) { showToast(result.error); return; }
    kcal.value = Math.round(result.caloriesPer100);
    document.getElementById('bc-kunit').value = result.caloriesUnit === 'ml' ? 'ml' : 'g';
    Object.assign(row, macrosFrom(result));
    row.caloriesSource = 'estimated';
    document.getElementById('bc-kcal-src').textContent = '(estimated)';
  });

  const action = document.getElementById('bc-action');
  action.textContent = existing && canAddUp ? 'Add to existing' : 'Save to kitchen';
  action.disabled = false;
  document.getElementById('bc-again').style.display = 'block';
}

async function saveBarcodeItem() {
  const row = BarcodeScan.row;
  const name = document.getElementById('bc-name').value.trim();
  if (!name) { showToast('Enter a name first'); document.getElementById('bc-name').focus(); return; }
  const quantity = parseFloat(document.getElementById('bc-qty').value) || null;
  const unit = document.getElementById('bc-unit').value;
  const category = document.getElementById('bc-cat').value;
  const kcalValue = parseFloat(document.getElementById('bc-kcal').value) || null;
  const calories = kcalValue
    ? { caloriesPer100: kcalValue, caloriesUnit: document.getElementById('bc-kunit').value, caloriesSource: row.caloriesSource || 'manual', ...macrosFrom(row) }
    : {};
  const now = new Date().toISOString();

  try {
    const existing = BarcodeScan.existingId ? await dbGet('inventoryItems', BarcodeScan.existingId) : null;
    if (existing) {
      const addsUp = existing.quantity && quantity && existing.unit === unit;
      if (addsUp) existing.quantity = Math.round((existing.quantity + quantity) * 100) / 100;
      else if (!existing.quantity && quantity) { existing.quantity = quantity; existing.unit = unit; }
      Object.assign(existing, calories, { barcode: row.barcode, updatedAt: now });
      await dbPut('inventoryItems', existing);
      await logHistory(existing.id, 'adjusted', addsUp ? quantity : null, existing.location, existing.location, addsUp ? `Scanned barcode: +${quantity} ${unit}` : 'Updated from barcode scan');
      showToast(addsUp ? `${existing.name}: now ${formatItemQuantity(existing)}` : 'Item updated');
    } else {
      const states = BarcodeScan.location === 'freezer' ? ['Frozen'] : (BarcodeScan.location === 'fridge' ? ['Fresh'] : ['Raw']);
      const newId = await dbPut('inventoryItems', {
        name,
        quantity,
        unit,
        portionCount: null,
        portionSize: null,
        location: BarcodeScan.location,
        subLocation: null,
        states,
        category,
        isStaple: ['Spices & Seasonings', 'Sauces & Condiments'].includes(category),
        purchaseDate: localDateString(new Date()),
        expiryDate: null,
        useByOverrideDays: null,
        cost: null,
        notes: row.packSize ? `Pack: ${row.packSize}` : '',
        freezerFriendlyRating: null,
        linkedPurchaseEventId: null,
        barcode: row.barcode,
        caloriesPer100: null,
        caloriesUnit: null,
        caloriesSource: null,
        ...calories,
        createdAt: now,
        updatedAt: now
      });
      await logHistory(newId, 'created', quantity, null, BarcodeScan.location, 'Added by barcode scan');
      showToast(`Added ${name}`);
    }
    renderRoute();
    scanNextBarcode();
  } catch (err) {
    alert('Couldn\'t save: ' + (err && err.message ? err.message : 'unknown storage error'));
  }
}

/* ============================================================
   MEAL PLANNER
   One mealPlans record per planned meal:
   { date: 'YYYY-MM-DD', meal: 'breakfast'|'lunch'|'dinner',
     type: 'recipe'|'kitchen'|'leftover'|'out',
     recipeId?, itemId?, title, kcal?, servings?, leftoverOf?, createdAt }
   Weeks start on Monday.
   ============================================================ */
const PLAN_MEALS = ['breakfast', 'lunch', 'dinner'];
const PLAN_MEAL_LABELS = { breakfast: 'Breakfast', lunch: 'Lunch', dinner: 'Dinner' };
const DEFAULT_PLAN_SETTINGS = { key: 'mealPlanSettings', householdSize: 2, planBreakfast: false };

async function getPlanSettings() {
  return { ...DEFAULT_PLAN_SETTINGS, ...((await dbGet('settings', 'mealPlanSettings')) || {}) };
}

function plannedMeals(settings) {
  return settings.planBreakfast ? PLAN_MEALS : ['lunch', 'dinner'];
}

function parseLocalDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function startOfWeek(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const offset = (d.getDay() + 6) % 7; // Monday = 0
  d.setDate(d.getDate() - offset);
  return d;
}

function weekDates(weekStart) {
  return Array.from({ length: 7 }, (_, i) => localDateString(addDays(weekStart, i)));
}

function formatDayLabel(dateStr) {
  const d = parseLocalDate(dateStr);
  const today = localDateString(new Date());
  const tomorrow = localDateString(addDays(new Date(), 1));
  const label = d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
  return dateStr === today ? `Today · ${label}` : dateStr === tomorrow ? `Tomorrow · ${label}` : label;
}

async function getPlanEntries(dates) {
  const all = await dbGetAll('mealPlans');
  const wanted = new Set(dates);
  return all.filter((e) => wanted.has(e.date));
}

function entryKcal(entry, recipesById) {
  if (entry.kcal) return entry.kcal;
  const r = entry.recipeId ? recipesById.get(entry.recipeId) : null;
  return r && r.caloriesPerServing ? r.caloriesPerServing : null;
}

async function addPlanEntry(entry) {
  return dbPut('mealPlans', { ...entry, createdAt: new Date().toISOString() });
}

// Removing a cooked meal also removes the leftovers planned from it
async function removePlanEntry(id) {
  const all = await dbGetAll('mealPlans');
  for (const e of all.filter((x) => x.leftoverOf === id)) await dbDelete('mealPlans', e.id);
  await dbDelete('mealPlans', id);
}

// The next slot after this one, used for leftovers: dinner → next day's lunch, lunch → same day's dinner
function nextSlot(date, meal) {
  if (meal === 'lunch') return { date, meal: 'dinner' };
  if (meal === 'dinner') return { date: localDateString(addDays(parseLocalDate(date), 1)), meal: 'lunch' };
  return { date, meal: 'lunch' };
}

/* ---- Planner screen ---- */
async function renderPlannerScreen() {
  if (!AppState.planWeekStart) AppState.planWeekStart = localDateString(startOfWeek(new Date()));
  const weekStart = parseLocalDate(AppState.planWeekStart);
  const dates = weekDates(weekStart);
  const [entries, recipes, goals, settings, items] = await Promise.all([
    getPlanEntries(dates), dbGetAll('recipes'), getHealthGoals(), getPlanSettings(), dbGetAll('inventoryItems')
  ]);
  const recipesById = new Map(recipes.map((r) => [r.id, r]));
  const index = buildInventoryIndex(items);
  const meals = plannedMeals(settings);
  const today = localDateString(new Date());
  const isThisWeek = AppState.planWeekStart === localDateString(startOfWeek(new Date()));
  const weekLabel = `${parseLocalDate(dates[0]).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })} – ${parseLocalDate(dates[6]).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })}`;
  const plannedCount = entries.length;

  const slotHtml = (date, meal) => {
    const entry = entries.find((e) => e.date === date && e.meal === meal);
    const past = date < today;
    if (!entry) {
      return `<button type="button" class="plan-slot empty" data-date="${date}" data-meal="${meal}" ${past ? 'disabled' : ''}>
        <span class="plan-meal">${PLAN_MEAL_LABELS[meal]}</span><span class="plan-add">${past ? '—' : '+ Add'}</span></button>`;
    }
    const kcal = entryKcal(entry, recipesById);
    const recipe = entry.recipeId ? recipesById.get(entry.recipeId) : null;
    const sc = recipe && index.length && entry.type === 'recipe' ? scoreRecipe(recipe, index) : null;
    const icon = entry.type === 'leftover' ? '🍱 ' : entry.type === 'kitchen' ? '🧊 ' : entry.type === 'out' ? '🍽️ ' : '';
    return `<button type="button" class="plan-slot filled type-${entry.type}" data-entry-id="${entry.id}">
      <span class="plan-meal">${PLAN_MEAL_LABELS[meal]}</span>
      <span class="plan-title">${icon}${escapeHtml(entry.title)}</span>
      <span class="plan-tags">
        ${entry.cooked ? '<span class="tag kcal-ok">✓ Cooked</span>' : ''}
        ${kcal ? calorieBadgeHtml(kcal, goals) : ''}
        ${sc && !entry.cooked && sc.expiring.length ? `<span class="tag kcal-over">Uses ${escapeHtml(sc.expiring[0].name)}</span>` : ''}
        ${sc && !entry.cooked && sc.missing.length ? `<span class="tag">Need ${sc.missing.length}</span>` : ''}
      </span>
    </button>`;
  };

  const daysHtml = dates.map((date) => {
    const dayEntries = entries.filter((e) => e.date === date);
    const total = dayEntries.reduce((sum, e) => sum + (entryKcal(e, recipesById) || 0), 0);
    return `
      <div class="plan-day ${date === today ? 'today' : ''} ${date < today ? 'past' : ''}">
        <div class="plan-day-head">
          <span>${formatDayLabel(date)}</span>
          ${total ? `<span class="plan-total">~${total} kcal</span>` : ''}
        </div>
        ${meals.map((m) => slotHtml(date, m)).join('')}
      </div>`;
  }).join('');

  return `
    <div class="plan-week-nav">
      <button type="button" class="loc-tab" id="plan-prev" aria-label="Previous week">‹</button>
      <div class="plan-week-label">${weekLabel}${isThisWeek ? '' : ' <button type="button" class="link-btn" id="plan-today">This week</button>'}</div>
      <button type="button" class="loc-tab" id="plan-next" aria-label="Next week">›</button>
    </div>
    <div class="recipe-online-row" style="margin-bottom:6px;">
      <button type="button" class="stocktake-btn" id="plan-fill">
        <span class="st-btn-title">🪄 Fill my week</span>
        <span class="st-btn-desc">Uses food going off first</span>
      </button>
      <button type="button" class="stocktake-btn alt" id="plan-clear" ${plannedCount ? '' : 'disabled'}>
        <span class="st-btn-title">🧹 Clear week</span>
        <span class="st-btn-desc">${plannedCount} planned</span>
      </button>
    </div>
    <label class="plan-ai-toggle"><input type="checkbox" id="plan-quick" ${AppState.planQuickWeeknights ? 'checked' : ''}> ⏱️ Quick weeknights <span class="recipe-muted">(30 min or less, Mon–Fri)</span></label>
    <label class="plan-ai-toggle"><input type="checkbox" id="plan-ai" ${AppState.planUseAi ? 'checked' : ''}> ✨ Include new ideas from Claude <span class="recipe-muted">(uses your API key)</span></label>
    ${plannedCount === 0 ? '<p class="recipe-muted" style="margin:8px 0 0;">Nothing planned yet. Tap <strong>+ Add</strong> on any meal, or let <strong>Fill my week</strong> do it.</p>' : ''}
    ${daysHtml}
  `;
}

function attachPlannerListeners() {
  const shift = (days) => {
    AppState.planWeekStart = localDateString(addDays(parseLocalDate(AppState.planWeekStart), days));
    renderRoute();
  };
  document.getElementById('plan-prev').addEventListener('click', () => shift(-7));
  document.getElementById('plan-next').addEventListener('click', () => shift(7));

  document.getElementById('plan-ai').addEventListener('change', (e) => { AppState.planUseAi = e.target.checked; });
  document.getElementById('plan-quick').addEventListener('change', (e) => { AppState.planQuickWeeknights = e.target.checked; });
  document.getElementById('plan-fill').addEventListener('click', fillMyWeek);
  document.getElementById('plan-clear').addEventListener('click', clearPlanWeek);
  document.querySelectorAll('.plan-slot.empty').forEach((btn) => {
    btn.addEventListener('click', () => openSlotPicker(btn.dataset.date, btn.dataset.meal));
  });
  document.querySelectorAll('.plan-slot.filled').forEach((btn) => {
    btn.addEventListener('click', () => openPlanEntry(parseInt(btn.dataset.entryId, 10)));

async function clearPlanWeek() {
  if (!confirm('Clear every meal planned for this week?')) return;
  const entries = await getPlanEntries(weekDates(parseLocalDate(AppState.planWeekStart)));
  for (const e of entries) await dbDelete('mealPlans', e.id);
  showToast('Week cleared');
  renderRoute();
}

/* ---- Choosing what goes in a slot ---- */
async function openSlotPicker(date, meal) {
  const [recipes, items, goals, settings] = await Promise.all([dbGetAll('recipes'), dbGetAll('inventoryItems'), getHealthGoals(), getPlanSettings()]);
  const index = buildInventoryIndex(items);
  const mealType = PLAN_MEAL_LABELS[meal];
  const ranked = recipes
    .map((r) => ({ r, sc: index.length ? scoreRecipe(r, index) : null }))
    .sort((a, b) => {
      const fits = (x) => ((x.r.mealTypes || []).includes(mealType) ? 1 : 0);
      const rank = (x) => (x.sc ? x.sc.pct + (x.sc.expiring.length ? 30 : 0) : 0) + (x.r.isFavourite ? 10 : 0);
      return fits(b) - fits(a) || rank(b) - rank(a) || a.r.name.localeCompare(b.r.name);
    });
  // Already-made food: leftovers, cooked or prepared portions, ready meals
  const ready = items.filter((i) => i.location === 'leftovers' || i.category === 'Ready Meals'
    || (i.states || []).some((s) => s === 'Cooked' || s === 'Leftover'));

  const recipeRow = ({ r, sc }) => `
    <button type="button" class="pick-row" data-recipe-id="${r.id}" data-name="${escapeHtml(r.name.toLowerCase())}">
      <span class="pick-name">${r.isFavourite ? '★ ' : ''}${escapeHtml(r.name)}</span>
      <span class="pick-tags">
        ${sc ? `<span class="tag match-pct ${sc.pct >= 80 ? 'high' : ''}">${sc.pct}%</span>` : ''}
        ${calorieBadgeHtml(r.caloriesPerServing, goals)}
        ${sc && sc.expiring.length ? `<span class="tag kcal-over">Uses ${escapeHtml(sc.expiring[0].name)}</span>` : ''}
        ${(r.mealTypes || []).includes(mealType) ? '' : `<span class="tag">not usually ${mealType.toLowerCase()}</span>`}
      </span>
    </button>`;

  openModal(`
    <div class="modal-title-row">
      <h2>${mealType} · ${formatDayLabel(date)}</h2>
      <button class="close-btn" id="modal-close">×</button>
    </div>
    <div class="modal-scroll-area">
      ${ready.length ? `<div class="st-group-title">Already made</div>
        ${ready.map((i) => `<button type="button" class="pick-row" data-item-id="${i.id}">
          <span class="pick-name">🧊 ${escapeHtml(i.name)}</span>
          <span class="pick-tags"><span class="tag">${LOCATION_LABELS[i.location]}</span><span class="tag">${escapeHtml(formatItemQuantity(i))}</span></span>
        </button>`).join('')}` : ''}
      <div class="st-group-title">Your recipes</div>
      <div class="field recipe-search" style="margin-bottom:8px;"><input type="search" id="pick-search" placeholder="Search recipes"></div>
      <div id="pick-recipes">${ranked.length ? ranked.map(recipeRow).join('') : '<p class="recipe-muted">No recipes yet. Add some on the Recipes tab.</p>'}</div>
      <div class="st-group-title">Other</div>
      <button type="button" class="pick-row" id="pick-out"><span class="pick-name">🍽️ Eating out / skip</span></button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('pick-search').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('#pick-recipes .pick-row').forEach((row) => { row.style.display = !q || row.dataset.name.includes(q) ? '' : 'none'; });
  });
  document.querySelectorAll('.pick-row[data-recipe-id]').forEach((btn) => btn.addEventListener('click', async () => {
    const recipe = recipes.find((r) => r.id === parseInt(btn.dataset.recipeId, 10));
    await planRecipe(recipe, date, meal, settings);
  }));
  document.querySelectorAll('.pick-row[data-item-id]').forEach((btn) => btn.addEventListener('click', async () => {
    const item = items.find((i) => i.id === parseInt(btn.dataset.itemId, 10));
    await addPlanEntry({ date, meal, type: 'kitchen', itemId: item.id, title: item.name, kcal: null });
    closeModal();
    showToast(`Planned ${item.name}`);
    renderRoute();
  }));
  document.getElementById('pick-out').addEventListener('click', async () => {
    await addPlanEntry({ date, meal, type: 'out', title: 'Eating out / skip' });
    closeModal();
    renderRoute();
  });
}

// Plan a recipe; if it makes more portions than the household eats, offer the rest as the next meal
async function planRecipe(recipe, date, meal, settings, { askLeftovers = true } = {}) {
  const household = settings.householdSize || 2;
  const id = await addPlanEntry({ date, meal, type: 'recipe', recipeId: recipe.id, title: recipe.name, kcal: recipe.caloriesPerServing || null, servings: household });
  let leftoverNote = '';
  const spare = (recipe.servings || 0) - household;
  if (askLeftovers && spare >= household && recipe.leftoverFriendly !== false) {
    const next = nextSlot(date, meal);
    const nextTaken = (await getPlanEntries([next.date])).some((e) => e.meal === next.meal);
    if (!nextTaken && confirm(`${recipe.name} serves ${recipe.servings}. Plan the ${spare} leftover portions for ${PLAN_MEAL_LABELS[next.meal].toLowerCase()} on ${formatDayLabel(next.date)}?`)) {
      await addPlanEntry({ date: next.date, meal: next.meal, type: 'leftover', recipeId: recipe.id, title: `Leftover ${recipe.name}`, kcal: recipe.caloriesPerServing || null, leftoverOf: id });
      leftoverNote = ' + leftovers';
    }
  }
  closeModal();
  showToast(`Planned ${recipe.name}${leftoverNote}`);
  renderRoute();
  return id;
}

async function openPlanEntry(id) {
  const entry = await dbGet('mealPlans', id);

  openModal(`

    ${entry.type === 'recipe' && entry.recipeId ? `<button type="button" class="btn-primary" id="pe-cooked">${entry.cooked ? '✓ Cooked (cook it again?)' : '🍳 I cooked this'}</button>` : ''}
    ${entry.recipeId ? '<button type="button" class="btn-secondary" id="pe-view">View recipe</button>' : ''}
    <button type="button" class="btn-secondary" id="pe-swap">Swap for something else</button>

}

/* ---- Add to plan from a recipe page ---- */
async function openAddRecipeToPlan(recipe) {

  const start = new Date();
  const dates = Array.from({ length: 10 }, (_, i) => localDateString(addDays(start, i)));

        <div class="plan-pick-day"><span>${formatDayLabel(d)}</span>

          }).join('')}</span>

    </div>

/* ---- Fill my week ----
   Goes through the empty slots from today onwards, earliest first, and picks
   the best recipe for each: food closest to its use-by first, then best match,
   inside the calorie target, a mix of cuisines, no repeats. Dinners that make
   enough spare portions fill the next lunch with leftovers. */
async function fillMyWeek() {
  const btn = document.getElementById('plan-fill');
  const settings = await getPlanSettings();
  const meals = plannedMeals(settings);
  const today = localDateString(new Date());
  const dates = weekDates(parseLocalDate(AppState.planWeekStart)).filter((d) => d >= today);
  if (!dates.length) { showToast('This week is over. Go to this week or next.'); return; }

  if (AppState.planUseAi) {
    if (!getAiKey()) { showToast('Add your API key in Settings to include new ideas'); return; }
    btn.disabled = true;
    btn.querySelector('.st-btn-title').textContent = '✨ Getting new ideas…';
    const outcome = await requestAiSuggestions('Dinner', 'These are for a weekly meal plan; make them different from each other.', AppState.planQuickWeeknights ? QUICK_RECIPE_MINUTES : 0);
    if (outcome.error) { showToast(outcome.error); }
    else {
      const existing = new Set((await dbGetAll('recipes')).map((r) => r.name.toLowerCase()));
      for (const m of outcome.meals) if (!existing.has(m.name.toLowerCase())) await dbPut('recipes', aiMealToRecipe(m));
    }
  }

  const [recipes, items, goals, existingEntries] = await Promise.all([
    dbGetAll('recipes'), dbGetAll('inventoryItems'), getHealthGoals(), getPlanEntries(dates)
  ]);
  if (!recipes.length) { showToast('Add some recipes first'); renderRoute(); return; }
  const index = buildInventoryIndex(items);
  const usedRecipeIds = new Set(existingEntries.filter((e) => e.recipeId).map((e) => e.recipeId));
  const usedUpItems = new Set();
  const taken = new Set(existingEntries.map((e) => `${e.date}|${e.meal}`));
  let lastCuisine = null;
  let added = 0;

  const scoreFor = (recipe, mealType, date) => {
    if (!(recipe.mealTypes || []).includes(mealType) && !(mealType !== 'Breakfast' && !(recipe.mealTypes || []).length)) return -Infinity;
    const weekday = parseLocalDate(date).getDay() % 6 !== 0;
    const mins = recipeTotalMinutes(recipe);
    if (AppState.planQuickWeeknights && weekday && mins > QUICK_RECIPE_MINUTES) return -Infinity;
    let score = 0;
    // Follow the eating style: a strong nudge, not a hard rule, so a week still fills up
    if (goals.eatingStyle && goals.eatingStyle !== 'balanced') score += recipeSuitsStyle(recipe, goals.eatingStyle) ? 25 : -25;
    if (index.length) {
      const sc = scoreRecipe(recipe, index);
      score += sc.pct;
      const freshExpiring = sc.expiring.filter((e) => !usedUpItems.has(e.name));
      score += freshExpiring.reduce((s, e) => s + Math.max(10, 40 - e.daysLeft * 10), 0);
    }
    const k = recipe.caloriesPerServing;
    if (k && k >= goals.caloriesMin && k <= goals.caloriesMax) score += 15;
    else if (k && k > goals.caloriesMax) score -= 10;
    if (goals.preferredCuisines.includes(recipe.cuisine)) score += 5;
    if (recipe.cuisine === lastCuisine) score -= 15;
    if (recipe.isFavourite) score += 10;
    score += ((recipe.userRating || 0) + (recipe.partnerRating || 0)) * 2;
    return score;
  };

  for (const date of dates) {
    for (const meal of meals) {
      if (taken.has(`${date}|${meal}`)) continue;
      const mealType = PLAN_MEAL_LABELS[meal];
      const best = recipes
        .filter((r) => !usedRecipeIds.has(r.id))
        .map((r) => ({ r, s: scoreFor(r, mealType, date) }))
        .filter((x) => x.s > -Infinity)
        .sort((a, b) => b.s - a.s)[0];
      if (!best) continue;
      const recipe = best.r;
      const id = await addPlanEntry({ date, meal, type: 'recipe', recipeId: recipe.id, title: recipe.name, kcal: recipe.caloriesPerServing || null, servings: settings.householdSize });
      taken.add(`${date}|${meal}`);
      usedRecipeIds.add(recipe.id);
      lastCuisine = recipe.cuisine;
      added++;
      if (index.length) scoreRecipe(recipe, index).expiring.forEach((e) => usedUpItems.add(e.name));

      const spare = (recipe.servings || 0) - settings.householdSize;
      const next = nextSlot(date, meal);
      if (meal === 'dinner' && spare >= settings.householdSize && recipe.leftoverFriendly !== false
        && dates.includes(next.date) && meals.includes(next.meal) && !taken.has(`${next.date}|${next.meal}`)) {
        await addPlanEntry({ date: next.date, meal: next.meal, type: 'leftover', recipeId: recipe.id, title: `Leftover ${recipe.name}`, kcal: recipe.caloriesPerServing || null, leftoverOf: id });
        taken.add(`${next.date}|${next.meal}`);
        added++;
      }
    }
  }
  showToast(added ? `Planned ${added} meal${added === 1 ? '' : 's'}` : 'Nothing to fill: the week is already planned');
  renderRoute();
}

// Removes the built-in recipes (except ones the person has edited) and stops them coming back
async function removeStarterRecipes() {
  const recipes = await dbGetAll('recipes');
  let removed = 0;
  for (const r of recipes.filter((x) => x.source === 'built-in' && !x.userModified)) { await dbDelete('recipes', r.id); removed++; }
  const meta = (await dbGet('settings', 'recipeSeed')) || { key: 'recipeSeed', version: 0, deletedSeedIds: [] };
  await dbPut('settings', { ...meta, key: 'recipeSeed', builtInsOff: true });
  return removed;
}

}

   like new. Keeps built-in reference data and the API key (stored separately).

  if (!confirm('Start fresh?\n\nThis deletes everything: your kitchen and its history, meal plans, food diary, shopping list, all recipes (including the 30 starter recipes), ratings, favourites and settings.\n\nYou can add the starter recipes back from Settings. Your API key stays.')) return;

  for (const store of ['inventoryItems', 'inventoryHistory', 'mealPlans', 'foodLog', 'shoppingList', 'batchCookEvents', 'purchaseEvents', 'recipes', 'quickAddTemplates', 'settings']) {
    await dbClearAndBulkPut(store, []);
  }

  AppState.recipeFilters = { search: '', cuisine: 'all', favourites: false, time: 0, highProtein: false, lowCarb: false, keto: false, lowFat: false, freezer: false };

/* ============================================================
   FOOD DIARY
   foodLog records: { date, meal: 'breakfast'|'lunch'|'dinner'|'snacks',
     name, amount?, amountUnit?, kcal, protein?, carbs?, fat?,
     source: 'quick'|'kitchen'|'recipe'|'barcode'|'photo'|'plan',
     recipeId?, itemId?, planEntryId?, barcode?, createdAt }
   Nutrient values are totals for what was eaten (null when unknown).
   ============================================================ */
const LOG_MEALS = ['breakfast', 'lunch', 'dinner', 'snacks'];
const LOG_MEAL_LABELS = { breakfast: 'Breakfast', lunch: 'Lunch', dinner: 'Dinner', snacks: 'Snacks' };
const MACROS = [
  { key: 'protein', label: 'Protein', goal: 'dailyProtein', cls: 'm-protein' },
  { key: 'carbs', label: 'Carbs', goal: 'dailyCarbs', cls: 'm-carbs' },
  { key: 'fat', label: 'Fat', goal: 'dailyFat', cls: 'm-fat' }
];

function defaultLogMeal() {
  const h = new Date().getHours();
  return h < 11 ? 'breakfast' : h < 15 ? 'lunch' : h >= 17 && h < 22 ? 'dinner' : 'snacks';
}

function round1(n) { return Math.round(n * 10) / 10; }
function numOrNull(v) { const n = parseFloat(v); return Number.isFinite(n) && n >= 0 ? n : null; }

async function getLogEntries(date) {
  return dbGetAll('foodLog', 'date', date);
}

async function addLogEntry(entry) {
  return dbPut('foodLog', {
    kcal: 0, protein: null, carbs: null, fat: null, amount: null, amountUnit: null,
    ...entry,
    kcal: Math.round(entry.kcal || 0),
    protein: entry.protein == null ? null : round1(entry.protein),
    carbs: entry.carbs == null ? null : round1(entry.carbs),
    fat: entry.fat == null ? null : round1(entry.fat),
    createdAt: new Date().toISOString()
  });
}

function dayTotals(entries) {
  return entries.reduce((t, e) => ({
    kcal: t.kcal + (e.kcal || 0),
    protein: t.protein + (e.protein || 0),
    carbs: t.carbs + (e.carbs || 0),
    fat: t.fat + (e.fat || 0)
  }), { kcal: 0, protein: 0, carbs: 0, fat: 0 });
}

/* ---- Today: ring + macro meters + meals ---- */
function calorieRingSvg(eaten, goal) {
  const r = 52;
  const c = 2 * Math.PI * r;
  const frac = goal ? Math.min(eaten / goal, 1) : 0;
  return `
    <svg class="kcal-ring" viewBox="0 0 132 132" role="img" aria-label="${eaten} of ${goal} kcal eaten">
      <circle cx="66" cy="66" r="${r}" fill="none" class="ring-track" stroke-width="12"/>
      ${frac > 0 ? `<circle cx="66" cy="66" r="${r}" fill="none" class="ring-fill ${eaten > goal ? 'over' : ''}" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${(c * frac).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 66 66)"/>` : ''}
      <text x="66" y="64" text-anchor="middle" class="ring-num">${eaten.toLocaleString('en-AU')}</text>
      <text x="66" y="84" text-anchor="middle" class="ring-sub">of ${goal.toLocaleString('en-AU')} kcal</text>
    </svg>`;
}

function macroMeterHtml(m, eaten, goal) {
  const pct = goal ? Math.min(eaten / goal, 1) * 100 : 0;
  const over = goal && eaten > goal;
  return `
    <div class="macro-meter">
      <div class="macro-head"><span class="macro-name"><span class="macro-key ${m.cls}"></span>${m.label}</span>
        <span class="macro-val">${Math.round(eaten)} / ${goal} g${over ? ` · ${Math.round(eaten - goal)} over` : ''}</span></div>
      <div class="macro-track ${m.cls}"><div class="macro-fill ${m.cls}" style="width:${pct.toFixed(1)}%"></div></div>
    </div>`;
}

// Recipe servings logged before carbs and fat were worked out only have calories and protein:
// fill the gaps from the recipe (per serving × servings) and save them
async function fillMissingRecipeMacros(entries) {
  const gaps = entries.filter((e) => e.recipeId && e.amountUnit === 'serving' && e.amount && (e.carbs == null || e.fat == null || e.protein == null));
  for (const e of gaps) {
    const recipe = await dbGet('recipes', e.recipeId);
    if (!recipe) continue;
    const m = recipeMacros(recipe);
    if (e.protein == null && m.protein != null) e.protein = round1(m.protein * e.amount);
    if (e.carbs == null && m.carbs != null) e.carbs = round1(m.carbs * e.amount);
    if (e.fat == null && m.fat != null) e.fat = round1(m.fat * e.amount);
    await dbPut('foodLog', e);
  }
}

async function renderTodayDiaryHtml() {
  const date = AppState.diaryDate || localDateString(new Date());
  const today = localDateString(new Date());
  const [entries, goals, plans] = await Promise.all([getLogEntries(date), getHealthGoals(), getPlanEntries([date])]);
  await fillMissingRecipeMacros(entries);
  const t = dayTotals(entries);
  const left = goals.dailyCalories - Math.round(t.kcal);
  const loggedPlanIds = new Set(entries.filter((e) => e.planEntryId).map((e) => e.planEntryId));

  const mealCard = (meal) => {
    const list = entries.filter((e) => e.meal === meal);
    const planned = plans.filter((p) => p.meal === meal && !loggedPlanIds.has(p.id));
    const mt = dayTotals(list);
    return `
      <div class="diary-meal">
        <div class="diary-meal-head">
          <span>${LOG_MEAL_LABELS[meal]}${mt.kcal ? ` <span class="diary-meal-kcal">${Math.round(mt.kcal)} kcal · P ${Math.round(mt.protein)} · C ${Math.round(mt.carbs)} · F ${Math.round(mt.fat)} g</span>` : ''}</span>
          <button type="button" class="link-btn diary-add" data-meal="${meal}">+ Add</button>
        </div>
        ${list.map((e) => `
          <button type="button" class="diary-entry" data-log-id="${e.id}">
            <span class="de-main">
              <span class="de-name">${escapeHtml(e.name)}${e.amount ? `<span class="de-amt"> · ${escapeHtml(formatLogAmount(e))}</span>` : ''}</span>
              ${macroLineHtml(e)}
            </span>
            <span class="de-num">${Math.round(e.kcal || 0)} kcal</span>
          </button>`).join('')}
        ${planned.map((p) => `
          <div class="diary-planned">
            <span class="de-name">📅 ${escapeHtml(p.title)}</span>
            <button type="button" class="state-chip diary-ate" data-plan-id="${p.id}">✓ Ate this</button>
          </div>`).join('')}
      </div>`;
  };

  return `
    <div class="diary-nav">
      <button type="button" class="loc-tab" id="diary-prev" aria-label="Previous day">‹</button>
      <div class="plan-week-label">${date === today ? 'Today' : formatDayLabel(date)}${date !== today ? ' <button type="button" class="link-btn" id="diary-today">Today</button>' : ''}</div>
      <button type="button" class="loc-tab" id="diary-next" aria-label="Next day" ${date >= today ? 'disabled' : ''}>›</button>
    </div>
    <div class="diary-summary">
      <div class="ring-wrap">
        ${calorieRingSvg(Math.round(t.kcal), goals.dailyCalories)}
        <div class="ring-left ${left < 0 ? 'over' : ''}">${left >= 0 ? `${left.toLocaleString('en-AU')} kcal left` : `${Math.abs(left).toLocaleString('en-AU')} kcal over`}</div>
      </div>
      <div class="macro-list">${MACROS.map((m) => macroMeterHtml(m, t[m.key], goals[m.goal])).join('')}</div>
    </div>
    ${LOG_MEALS.map(mealCard).join('')}
  `;
}

function formatLogAmount(e) {
  if (!e.amount) return '';
  if (e.amountUnit === 'serving') return `${e.amount} serving${e.amount === 1 ? '' : 's'}`;
  return formatItemQuantity({ quantity: e.amount, unit: e.amountUnit });
}

function openLogKitchenItem(date, meal, item) {
  if (item.recipeId && item.portionCount) return openLogLeftover(date, meal, item);
  const per100 = item.caloriesPer100;
  const eatenUnit = item.caloriesUnit === 'ml' ? 'ml' : 'g';
  const hasQty = item.quantity != null && item.quantity > 0;
  const weighable = ['g', 'kg', 'ml', 'L'].includes(item.unit);
  openModal(`
    <div class="modal-title-row"><h2>${escapeHtml(item.name)}</h2><button class="close-btn" id="modal-close">×</button></div>
    ${mealSelectHtml(meal)}
    <div class="field" style="margin-top:12px;">
      <label>How much did you have?</label>
      <div class="ps-fields" style="margin:0;">
        <input type="number" id="lki-amount" min="0" step="any" inputmode="decimal" value="100">
        <select id="lki-unit" class="ps-unit"><option value="g" ${eatenUnit === 'g' ? 'selected' : ''}>g</option><option value="ml" ${eatenUnit === 'ml' ? 'selected' : ''}>ml</option><option value="serving">serving(s)</option></select>
      </div>
    </div>
    <p class="recipe-muted" id="lki-hint" style="margin:0 0 8px;">${per100 ? `${itemCaloriesText(item)}: worked out from the amount.` : 'No calories saved for this item: enter them below, or add them to the item later.'}</p>
    ${nutrientFieldsHtml('lki', {})}
    <label class="plan-ai-toggle" style="margin-top:4px;"><input type="checkbox" id="lki-takeout" checked>
      ${hasQty ? `Take out of my kitchen: <input type="number" id="lki-use" class="lki-use" min="0" step="any" inputmode="decimal" value="${weighable ? '' : 1}"> ${escapeHtml(item.unit === 'each' ? '' : item.unit)} (has ${escapeHtml(formatItemQuantity(item))})`
               : 'I used it all up (remove from my kitchen)'}
    </label>
    <button type="button" class="btn-primary" id="lki-save">Log it</button>
  `);
  if (!hasQty) document.getElementById('lki-takeout').checked = false;
  document.getElementById('modal-close').addEventListener('click', closeModal);
  attachMealSelect();
  const recalc = () => {
    const amount = numOrNull(document.getElementById('lki-amount').value) || 0;
    const unit = document.getElementById('lki-unit').value;
    if (per100 && unit !== 'serving') {
      const f = amount / 100;
      setNutrientFields('lki', {
        kcal: per100 * f,
        protein: item.proteinPer100 != null ? item.proteinPer100 * f : null,
        carbs: item.carbsPer100 != null ? item.carbsPer100 * f : null,
        fat: item.fatPer100 != null ? item.fatPer100 * f : null
      });
    }
    const use = document.getElementById('lki-use');
    if (use && weighable && unit !== 'serving' && !use.dataset.touched) {
      use.value = ['kg', 'L'].includes(item.unit) ? round1(amount / 100) / 10 : amount;
    }
  };
  document.getElementById('lki-amount').addEventListener('input', recalc);
  document.getElementById('lki-unit').addEventListener('change', recalc);
  const useEl = document.getElementById('lki-use');
  if (useEl) useEl.addEventListener('input', () => { useEl.dataset.touched = '1'; });
  recalc();

  document.getElementById('lki-save').addEventListener('click', async () => {
    const n = readNutrientFields('lki');
    const amount = numOrNull(document.getElementById('lki-amount').value);
    const unit = document.getElementById('lki-unit').value;
    await addLogEntry({ date, meal: selectedMeal(meal), name: item.name, amount, amountUnit: unit, ...n, source: 'kitchen', itemId: item.id });
    if (document.getElementById('lki-takeout').checked) {
      const fresh = await dbGet('inventoryItems', item.id);
      if (fresh) {
        if (hasQty) {
          const use = numOrNull(document.getElementById('lki-use').value) || 0;
          const remaining = Math.round((fresh.quantity - use) * 1000) / 1000;
          if (remaining <= 0) {
            await dbDelete('inventoryItems', fresh.id);
            await logHistory(fresh.id, 'used', use, fresh.location, null, 'Eaten (food diary): used up');
          } else {
            fresh.quantity = remaining;
            fresh.updatedAt = new Date().toISOString();
            await dbPut('inventoryItems', fresh);
            await logHistory(fresh.id, 'used', use, fresh.location, fresh.location, 'Eaten (food diary)');
          }
        } else {
          await dbDelete('inventoryItems', fresh.id);
          await logHistory(fresh.id, 'used', null, fresh.location, null, 'Eaten (food diary): used up');
        }
      }
    }
    finishLog(item.name);
  });
}

/* ---- ✓ Ate this (from the meal plan) ---- */
async function ateThis(planId) {
  const p = await dbGet('mealPlans', planId);
  if (!p) return;
  const meal = p.meal;
  if (p.type === 'leftover' && p.recipeId) {
    const portions = (await dbGetAll('inventoryItems')).filter((i) => i.recipeId === p.recipeId && i.portionCount > 0)
      .sort((a, b) => (a.location === 'leftovers' ? 0 : 1) - (b.location === 'leftovers' ? 0 : 1));
    if (portions.length) return openLogLeftover(p.date, meal, portions[0], p.id);
  }
  if (p.type === 'recipe' && p.recipeId && !p.cooked) {
    const recipe = await dbGet('recipes', p.recipeId);
    if (recipe) return openCookedThis(recipe, { planEntryId: p.id, date: p.date, meal });
  }
  if (p.recipeId) return openLogRecipe(p.date, meal, p.recipeId, p.id);
  if (p.type === 'kitchen' && p.itemId) return openLogFromKitchen(p.date, meal, p.itemId);
  return openQuickAdd(p.date, meal, { name: p.title, source: 'plan', planEntryId: p.id });
}

/* ---- ✨ Estimate macros from a description (Quick add) ---- */
function foodEstimateSchema() {
  return {
    type: 'object', additionalProperties: false,
    required: ['name', 'portion', 'kcal', 'protein', 'carbs', 'fat', 'assumptions'],
    properties: {
      name: { type: 'string' }, portion: { type: 'string' },
      kcal: { type: 'number' }, protein: { type: 'number' }, carbs: { type: 'number' }, fat: { type: 'number' },
      assumptions: { type: 'string' }
    }
  };
}

async function estimateFoodMacros(description) {
  let Anthropic = null;
  try {
    const loaded = await getAnthropicClient();
    Anthropic = loaded.Anthropic;
    const response = await loaded.client.beta.messages.create({
      model: AI_MODEL,
      max_tokens: 2000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: { effort: 'low', format: { type: 'json_schema', schema: foodEstimateSchema() } },
      messages: [{ role: 'user', content: `Estimate the nutrition for what someone in Australia ate or drank: "${description}".
Use the amount they give (convert oz, cups and sizes such as small/regular/large to metric). If no amount is given, assume one typical serve.
Return kcal, protein, carbs and fat in grams for the whole amount. name is a short tidy name, portion is the amount in metric (e.g. "355 ml"), assumptions is one short sentence on what you assumed.` }]
    });
    if (response.stop_reason === 'refusal') return { error: 'Claude couldn\'t estimate this one. Enter the numbers yourself.' };
    return JSON.parse(response.content.filter((b) => b.type === 'text').map((b) => b.text).join(''));
  } catch (err) {
    if (err instanceof SyntaxError) return { error: 'Claude\'s reply couldn\'t be read. Please try again.' };
    return { error: describeAiError(err, Anthropic) };
  }
}

/* ---- 🏷️ Packaged food & drinks: read the label from a photo ----
   For ready meals, frozen meals, drinks, protein shakes and protein powder.
   Barcode scanning is quicker when the product is in Open Food Facts; this
   covers everything else, and reads serving sizes like "1 scoop (30 g)". */
const LabelScan = { photos: [], result: null };
const LABEL_KINDS = ['ready meal', 'frozen meal', 'drink', 'protein shake', 'protein powder', 'snack', 'other'];

function labelSchema() {
  const nums = {
    type: 'object', additionalProperties: false, required: ['kcal', 'protein', 'carbs', 'fat'],
    properties: { kcal: { type: 'number' }, protein: { type: 'number' }, carbs: { type: 'number' }, fat: { type: 'number' } }
  };
  return {
    type: 'object', additionalProperties: false,
    required: ['found', 'name', 'kind', 'servingDescription', 'servingAmount', 'servingUnit', 'perServing', 'per100', 'fromLabel'],
    properties: {
      found: { type: 'boolean' },
      name: { type: 'string' },
      kind: { type: 'string', enum: LABEL_KINDS },
      servingDescription: { type: 'string' },
      servingAmount: { type: 'number' },
      servingUnit: { type: 'string', enum: ['g', 'ml'] },
      perServing: nums,
      per100: nums,
      fromLabel: { type: 'boolean' }
    }
  };
}

function openLabelScan(date, meal) {
  if (!getAiKey()) { showToast('Add your API key in Settings → AI suggestions to read labels'); return; }
  LabelScan.photos = [];
  LabelScan.result = null;
  openModal(`
    <div class="modal-title-row"><h2>🏷️ Packaged food or drink</h2><button class="close-btn" id="modal-close">×</button></div>
    ${mealSelectHtml(meal)}
    <div class="modal-scroll-area" id="ls-body" style="margin-top:12px;">
      <p class="st-intro">For ready meals, frozen meals, drinks, protein shakes and protein powder. Take a photo of the front, and one of the nutrition panel if you can. Claude reads the label and the serving size.</p>
      <div class="ps-thumbs" id="ls-thumbs"></div>
      <p class="ai-error" id="ls-error"></p>
    </div>
    <div class="modal-action-bar"><button type="button" class="btn-primary" id="ls-action" disabled>Take a photo first</button></div>
  `);
  document.getElementById('modal-sheet').classList.add('tall');
  document.getElementById('modal-close').addEventListener('click', closeModal);
  attachMealSelect();
  const drawThumbs = () => {
    document.getElementById('ls-thumbs').innerHTML = LabelScan.photos.map((p) => `<div class="ps-thumb"><img src="${p.preview}" alt="Label photo"></div>`).join('')
      + (LabelScan.photos.length < 3 ? `<label class="ps-add">📷<span>${LabelScan.photos.length ? 'Add the nutrition panel' : 'Take photo'}</span><input type="file" id="ls-file" accept="image/*" capture="environment" hidden></label>` : '');
    const input = document.getElementById('ls-file');
    if (input) input.addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      try { LabelScan.photos.push(await photoToBase64Jpeg(f)); } catch (err) { showToast(err.message); return; }
      drawThumbs();
      const btn = document.getElementById('ls-action');
      btn.disabled = false;
      btn.textContent = 'Read the label';
    });
  };
  drawThumbs();
  document.getElementById('ls-action').addEventListener('click', () => (LabelScan.result ? saveLabelScan(date, meal) : readLabel(date, meal)));
}

async function readLabel(date, meal) {
  const btn = document.getElementById('ls-action');
  btn.disabled = true;
  btn.textContent = 'Reading the label…';
  let Anthropic = null;
  let error = null;
  try {
    const loaded = await getAnthropicClient();
    Anthropic = loaded.Anthropic;
    const response = await loaded.client.beta.messages.create({
      model: AI_MODEL,
      max_tokens: 4000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: { effort: 'medium', format: { type: 'json_schema', schema: labelSchema() } },
      messages: [{ role: 'user', content: [
        ...LabelScan.photos.map((p) => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: p.data } })),
        { type: 'text', text: `These photos show one packaged food or drink (front of pack and/or nutrition information panel), probably Australian.
Set found to false if there is no food or drink product in the photos.
name: brand and product, short. servingDescription: the serving size as printed, e.g. "1 scoop (30 g)", "1 bottle (500 ml)", "1 meal (350 g)". servingAmount and servingUnit: that serving in g or ml.
perServing and per100: kcal, protein, carbs (total carbohydrate) and fat in grams. Australian panels give energy in kJ: divide by 4.184 for kcal.
For protein powder, the serving is the powder alone (made with water) unless the label says otherwise.
If there is no readable nutrition panel, estimate typical values for this product, set fromLabel to false, and fill per100 from your estimate.` }
      ] }]
    });
    if (response.stop_reason === 'refusal') error = 'Claude couldn\'t read this photo. Try another, or use Quick add.';
    else {
      const r = JSON.parse(response.content.filter((b) => b.type === 'text').map((b) => b.text).join(''));
      if (!r.found) error = 'No food or drink label was recognised. Try a closer, sharper photo of the label.';
      else LabelScan.result = r;
    }
  } catch (err) {
    error = err instanceof SyntaxError ? 'Claude\'s reply couldn\'t be read. Please try again.' : describeAiError(err, Anthropic);
  }
  if (!document.getElementById('ls-body')) return;
  if (error) {
    document.getElementById('ls-error').textContent = error;
    btn.disabled = false;
    btn.textContent = 'Try again';
    return;
  }
  renderLabelConfirm();
}

function renderLabelConfirm() {
  const r = LabelScan.result;
  const kitchenLoc = /frozen/.test(r.kind) ? 'freezer' : /ready meal|drink|shake/.test(r.kind) ? 'fridge' : 'pantry';
  document.getElementById('ls-body').innerHTML = `

    </div>
    <div class="field"><label>Name</label><input type="text" id="ls-name" value="${escapeHtml(r.name)}"></div>
    <div class="field"><label>How many serves? <span style="text-transform:none;font-weight:500;">(1 serve = ${escapeHtml(r.servingDescription)})</span></label>

  `;

  document.getElementById('ls-serves').addEventListener('input', recalc);
  recalc();
  const btn = document.getElementById('ls-action');

      isStaple: false, purchaseDate: null, expiryDate: null, useByOverrideDays: null, cost: null,

    });

/* ---- Photo of my plate (Claude) ---- */
const PlatePhoto = { photo: null, rows: [] };

function plateSchema() {
  return {
    type: 'object', additionalProperties: false, required: ['items'],
    properties: {
      items: {
        type: 'array',
        items: {
          type: 'object', additionalProperties: false,
          required: ['name', 'portion', 'kcal', 'protein', 'carbs', 'fat'],
          properties: { name: { type: 'string' }, portion: { type: 'string' }, kcal: { type: 'number' }, protein: { type: 'number' }, carbs: { type: 'number' }, fat: { type: 'number' } }
        }
      }
    }
  };
}

function openPlatePhoto(date, meal) {
