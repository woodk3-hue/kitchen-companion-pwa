<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kitchen Companion</title>
  <meta name="theme-color" content="#1F2620">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --color-bg: #FAF7F0;
  --color-ink: #1F2620;
  --color-ink-soft: #4A524C;
  --color-paper: #FFFFFF;
  --color-line: #E4DFD3;

  --color-accent: #C97A3D;       /* primary action / pantry */
  --color-accent-dark: #A8602C;
  --color-fridge: #5B7A6B;       /* sage */
  --color-freezer: #7C8CA8;      /* steel-blue */
  --color-leftovers: #9A8C5E;    /* muted gold */
  --color-warn: #A8472E;         /* rust — expiry/discard */
  --color-warn-bg: #F6E4DE;

  --font-display: 'Avenir Next', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  --radius-card: 14px;
  --radius-sm: 8px;
  --nav-height: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--color-bg);
  color: var(--color-ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

body {
  padding-bottom: calc(var(--nav-height) + var(--safe-bottom));
  min-height: 100vh;
}

h1, h2, h3 {
  font-family: var(--font-display);
  margin: 0;
  letter-spacing: -0.01em;
}

.eyebrow {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-ink-soft);
}

/* ============================================================
   HEADER
   ============================================================ */
.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--color-bg);
  padding: 18px 18px 12px;
  border-bottom: 1px solid var(--color-line);
}
.app-header h1 { font-size: 22px; font-weight: 800; }
.app-header .subtitle { font-size: 13px; color: var(--color-ink-soft); margin-top: 2px; }

/* ============================================================
   MAIN CONTENT
   ============================================================ */
#app-content {
  padding: 16px;
  max-width: 640px;
  margin: 0 auto;
}

.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--color-ink-soft);
}
.empty-state .glyph { font-size: 40px; margin-bottom: 10px; opacity: 0.6; }
.empty-state h3 { font-size: 16px; margin-bottom: 6px; color: var(--color-ink); }
.empty-state p { font-size: 14px; line-height: 1.4; margin: 0; }

.phase-placeholder {
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-card);
  padding: 32px 20px;
  text-align: center;
  margin-top: 24px;
}
.phase-placeholder .eyebrow { display: block; margin-bottom: 8px; }
.phase-placeholder p { color: var(--color-ink-soft); font-size: 14px; line-height: 1.5; margin: 8px 0 0; }

/* ============================================================
   HOME DASHBOARD
   ============================================================ */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--color-paper);
  border-radius: var(--radius-card);
  padding: 14px 16px;
  border: 1px solid var(--color-line);
}
.stat-card .count { font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1; }
.stat-card .label { font-size: 12px; color: var(--color-ink-soft); margin-top: 4px; }
.stat-card.loc-pantry { border-left: 4px solid var(--color-accent); }
.stat-card.loc-fridge { border-left: 4px solid var(--color-fridge); }
.stat-card.loc-freezer { border-left: 4px solid var(--color-freezer); }
.stat-card.loc-leftovers { border-left: 4px solid var(--color-leftovers); }

.section-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 24px 0 10px;
}
.section-heading h2 { font-size: 15px; font-weight: 800; }
.section-heading .count-badge {
  font-size: 12px;
  color: var(--color-ink-soft);
}

.expiry-list { display: flex; flex-direction: column; gap: 8px; }
.expiry-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
}
.expiry-row.urgent { background: var(--color-warn-bg); border-color: #E3C3B7; }
.expiry-row .name { flex: 1; font-size: 14px; font-weight: 600; }
.expiry-row .when { font-size: 12px; color: var(--color-warn); font-weight: 700; }
.expiry-row.urgent .when { color: var(--color-warn); }

/* ============================================================
   INVENTORY LIST (Kitchen screen)
   ============================================================ */
.location-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 16px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.location-tabs::-webkit-scrollbar { display: none; }
.loc-tab {
  flex: 0 0 auto;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  border: 1px solid var(--color-line);
  background: var(--color-paper);
  color: var(--color-ink-soft);
  cursor: pointer;
  white-space: nowrap;
}
.loc-tab.active {
  background: var(--color-ink);
  border-color: var(--color-ink);
  color: var(--color-bg);
}

.item-card {
  display: flex;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-card);
  margin-bottom: 10px;
  overflow: hidden;
  cursor: pointer;
}
.item-card .edge {
  width: 5px;
  flex-shrink: 0;
}
.item-card.loc-pantry .edge { background: var(--color-accent); }
.item-card.loc-fridge .edge { background: var(--color-fridge); }
.item-card.loc-freezer .edge { background: var(--color-freezer); }
.item-card.loc-leftovers .edge { background: var(--color-leftovers); }

.item-card .body { flex: 1; padding: 12px 14px; }
.item-card .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.item-card .name { font-size: 15px; font-weight: 700; }
.item-card .qty { font-size: 13px; color: var(--color-ink-soft); font-weight: 600; white-space: nowrap; }
.item-card .meta-row {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.tag {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 2px 8px;
  border-radius: 20px;
  background: var(--color-bg);
  color: var(--color-ink-soft);
  border: 1px solid var(--color-line);
}
.tag.state-frozen { color: var(--color-freezer); }
.tag.state-defrosting { color: var(--color-warn); }
.tag.state-leftover, .tag.state-cooked { color: var(--color-leftovers); }
.tag.state-opened { color: var(--color-warn); }
.tag.state-prepared { color: var(--color-fridge); }
.tag.staple-badge { background: var(--color-accent); color: white; border-color: var(--color-accent); }
.item-card .expiry-flag { font-size: 11px; font-weight: 700; color: var(--color-warn); margin-top: 4px; }
.use-by-suggestion {
  font-size: 12px;
  color: var(--color-ink-soft);
  background: var(--color-bg);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  margin-top: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.use-by-suggestion .apply-btn {
  font-size: 11px;
  font-weight: 700;
  color: var(--color-accent);
  background: none;
  border: none;
  cursor: pointer;
  white-space: nowrap;
}
.state-chip-grid { display: flex; gap: 6px; flex-wrap: wrap; }
.state-chip {
  padding: 8px 12px;
  border-radius: 20px;
  border: 1px solid var(--color-line);
  background: var(--color-paper);
  color: var(--color-ink-soft);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.state-chip.selected {
  background: var(--color-ink);
  border-color: var(--color-ink);
  color: var(--color-bg);
}
.staple-toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 14px;
}
.staple-toggle-row .label-group { display: flex; flex-direction: column; }
.staple-toggle-row .label { font-size: 14px; font-weight: 700; }
.staple-toggle-row .desc { font-size: 12px; color: var(--color-ink-soft); margin-top: 2px; }
.toggle-switch {
  position: relative;
  width: 44px;
  height: 26px;
  border-radius: 13px;
  background: var(--color-line);
  border: none;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s ease;
}
.toggle-switch.on { background: var(--color-accent); }
.toggle-switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: white;
  transition: transform 0.15s ease;
}
.toggle-switch.on::after { transform: translateX(18px); }

.quick-add-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 16px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.quick-add-row::-webkit-scrollbar { display: none; }
.quick-add-chip {
  flex: 0 0 auto;
  padding: 9px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  border: 1px dashed var(--color-line);
  background: var(--color-paper);
  color: var(--color-ink);
  cursor: pointer;
  white-space: nowrap;
}
.quick-add-chip:active { background: var(--color-bg); }

/* ============================================================
   FAB
   ============================================================ */
.fab {
  position: fixed;
  right: 18px;
  bottom: calc(var(--nav-height) + var(--safe-bottom) + 18px);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--color-accent);
  color: white;
  border: none;
  font-size: 28px;
  line-height: 1;
  box-shadow: 0 6px 16px rgba(31,38,32,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 15;
}
.fab:active { transform: scale(0.94); }

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(var(--nav-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--color-paper);
  border-top: 1px solid var(--color-line);
  display: flex;
  z-index: 20;
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--color-ink-soft);
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  padding: 6px 0;
}
.nav-btn .icon { font-size: 20px; line-height: 1; }
.nav-btn.active { color: var(--color-accent); }

/* ============================================================
   MODAL / FORM
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(31,38,32,0.45);
  z-index: 30;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }

.modal-sheet {
  background: var(--color-bg);
  width: 100%;
  max-height: 85vh;
  overflow: hidden;
  border-radius: 20px 20px 0 0;
  padding: 18px 18px 0;
  transform: translateY(16px);
  transition: transform 0.2s ease;
  display: flex;
  flex-direction: column;
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }

#item-form { display: flex; flex-direction: column; min-height: 0; flex: 1; }

.modal-scroll-area {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 12px;
  min-height: 0;
}

.modal-action-bar {
  flex-shrink: 0;
  padding: 10px 0 calc(16px + var(--safe-bottom));
  background: var(--color-bg);
  border-top: 1px solid var(--color-line);
}

.more-fields { margin-top: 4px; }
.more-fields summary {
  font-size: 13px;
  font-weight: 700;
  color: var(--color-accent);
  cursor: pointer;
  padding: 10px 0;
  list-style: none;
}
.more-fields summary::-webkit-details-marker { display: none; }
.more-fields summary::before { content: "+ "; }
.more-fields[open] summary::before { content: "− "; }
.more-fields-inner { padding-top: 6px; }

.modal-handle {
  width: 36px;
  height: 4px;
  background: var(--color-line);
  border-radius: 4px;
  margin: 0 auto 14px;
}

.modal-title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.modal-title-row h2 { font-size: 18px; }
.close-btn {
  background: none;
  border: none;
  font-size: 22px;
  color: var(--color-ink-soft);
  cursor: pointer;
  padding: 4px 8px;
}

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-ink-soft);
  margin-bottom: 6px;
}
.field input[type="text"],
.field input[type="number"],
.field input[type="date"],
.field select,
.field textarea {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: var(--font-body);
  background: var(--color-paper);
  color: var(--color-ink);
}
.field textarea { resize: vertical; min-height: 60px; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }

.segmented {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.segmented button {
  flex: 1 1 auto;
  min-width: 70px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-line);
  background: var(--color-paper);
  color: var(--color-ink-soft);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.segmented button.selected {
  background: var(--color-ink);
  border-color: var(--color-ink);
  color: var(--color-bg);
}

.btn-primary {
  width: 100%;
  padding: 14px;
  background: var(--color-accent);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 6px;
}
.btn-primary:active { background: var(--color-accent-dark); }

.btn-secondary {
  width: 100%;
  padding: 12px;
  background: none;
  color: var(--color-ink-soft);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}

.btn-danger {
  width: 100%;
  padding: 12px;
  background: none;
  color: var(--color-warn);
  border: 1px solid #E3C3B7;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}

/* History trail */
.history-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.history-row {
  font-size: 13px;
  padding: 8px 10px;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
}
.history-row .h-action { font-weight: 700; }
.history-row .h-date { font-size: 11px; color: var(--color-ink-soft); margin-top: 2px; }

/* Settings */
.settings-row {
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.settings-row .label { font-size: 14px; font-weight: 700; }
.settings-row .desc { font-size: 12px; color: var(--color-ink-soft); margin-top: 2px; }
.settings-row .chev { color: var(--color-ink-soft); }

.toast {
  position: fixed;
  bottom: calc(var(--nav-height) + var(--safe-bottom) + 18px);
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--color-ink);
  color: var(--color-bg);
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ============================================================
   STOCKTAKE
   ============================================================ */
.stocktake-btn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 12px;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-left: 4px solid var(--color-accent);
  border-radius: var(--radius-sm);
  text-align: left;
  cursor: pointer;
  font-family: inherit;
  color: var(--color-ink);
}
.stocktake-btn .st-btn-title { font-size: 15px; font-weight: 800; }
.stocktake-btn .st-btn-desc { font-size: 12px; color: var(--color-ink-soft); margin-top: 2px; }
.modal-sheet.tall { height: 92vh; max-height: 92vh; }
.st-intro { font-size: 13px; color: var(--color-ink-soft); margin: 0 0 10px; }
.st-body { flex: 1; }
.st-add { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.st-add input, .st-add select {
  flex: 1 1 140px;
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: var(--font-body);
  background: var(--color-paper);
  color: var(--color-ink);
}
.st-add .btn-secondary { flex: 0 0 auto; width: auto; margin-top: 0; padding: 10px 14px; }
.st-group-title {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-ink-soft);
  margin: 16px 0 6px;
}
.st-row {
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
}
.st-row.ticked { border-color: var(--color-accent); }
.st-tick {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 12px;
  background: none;
  border: none;
  text-align: left;
  font-family: inherit;
  font-size: 15px;
  color: var(--color-ink);
  cursor: pointer;
}
.st-box {
  flex: 0 0 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid var(--color-line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  color: white;
}
.st-row.ticked .st-box { background: var(--color-accent); border-color: var(--color-accent); }
.st-row.have .st-box { background: var(--color-line); border-color: var(--color-line); color: var(--color-ink-soft); }
.st-row.have .st-name { color: var(--color-ink-soft); }
.st-name { flex: 1; font-weight: 600; }
.st-have { font-size: 11px; font-weight: 700; color: var(--color-ink-soft); text-transform: uppercase; }
.st-qty { display: flex; gap: 8px; padding: 0 12px 11px 44px; }
.st-qty input, .st-qty select {
  padding: 8px 10px;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: var(--font-body);
  background: var(--color-bg);
  color: var(--color-ink);
}
.st-qty input { flex: 1; min-width: 0; }
.st-qty select { flex: 0 0 90px; }
</style>
 </head>
 <body>
  <header class="app-header">
   <h1 id="header-title">Kitchen Companion</h1>
   <div class="subtitle" id="header-subtitle">Know what you've got</div>
  </header>
  <main id="app-content"></main>
  <button class="fab" id="fab-btn" style="display:none;" aria-label="Add item">+</button>
  <nav class="bottom-nav">
   <button class="nav-btn" data-route="home"><span class="icon">⌂</span>Home</button>
   <button class="nav-btn" data-route="planner"><span class="icon">📅</span>Planner</button>

/* ============================================================
   DATABASE
   ============================================================ */
const DB_NAME = 'KitchenCompanionDB';
const DB_VERSION = 2;
let db = null;

// Controlled category list (PROJECT_VISION.md)
const CATEGORIES = [
  'Protein', 'Vegetables', 'Fruit', 'Carbs & Grains', 'Canned & Jarred',
  'Dairy & Refrigerated', 'Sauces & Condiments', 'Spices & Seasonings',
  'Snacks & Treats', 'Ready Meals', 'Other'
];

// Controlled, combinable state vocabulary (PROJECT_VISION.md)
const STATES_V2 = ['Fresh', 'Frozen', 'Defrosting', 'Raw', 'Cooked', 'Leftover', 'Opened', 'Prepared'];

// Maps old single-value `state` strings (schema v1) to new `states` arrays (schema v2)
const STATE_MIGRATION_MAP = {
  'raw': ['Raw'],
  'frozen': ['Frozen', 'Raw'],
  'defrosting': ['Defrosting', 'Raw'],
  'fresh': ['Fresh'],
  'cooked': ['Cooked'],
  'leftover': ['Leftover', 'Cooked'],
  'prepared-component': ['Prepared'],
  'ready-meal': ['Frozen']
};

// Maps old free-text category guesses (schema v1 seed data) to the new controlled list
const CATEGORY_MIGRATION_MAP = {
  'meat': 'Protein',
  'grain': 'Carbs & Grains',
  'produce': 'Vegetables',
  'homemade-meal': 'Ready Meals'
};

function migrateStateV1toV2(oldState) {
  return STATE_MIGRATION_MAP[oldState] || (oldState ? [oldState] : ['Fresh']);
}

function migrateCategoryV1toV2(oldCategory) {
  if (!oldCategory) return 'Other';
  if (CATEGORIES.includes(oldCategory)) return oldCategory;
  const mapped = CATEGORY_MIGRATION_MAP[oldCategory.toLowerCase().trim()];
  return mapped || 'Other';
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = (event) => {
      const _db = event.target.result;
      const tx = event.target.transaction;
      const oldVersion = event.oldVersion;

      let itemsStore;
      if (!_db.objectStoreNames.contains('inventoryItems')) {
        itemsStore = _db.createObjectStore('inventoryItems', { keyPath: 'id', autoIncrement: true });
        itemsStore.createIndex('location', 'location', { unique: false });
        itemsStore.createIndex('expiryDate', 'expiryDate', { unique: false });
        itemsStore.createIndex('category', 'category', { unique: false });
      } else {
        itemsStore = tx.objectStore('inventoryItems');
      }

      // v1 -> v2: states became a multi-value array, category became a controlled list
      if (oldVersion < 2) {
        if (itemsStore.indexNames.contains('state')) {
          itemsStore.deleteIndex('state');
        }
        if (!itemsStore.indexNames.contains('states')) {
          itemsStore.createIndex('states', 'states', { unique: false, multiEntry: true });
        }
        if (!itemsStore.indexNames.contains('isStaple')) {
          itemsStore.createIndex('isStaple', 'isStaple', { unique: false });
        }

        // Migrate every existing record from old shape to new shape
        itemsStore.openCursor().onsuccess = (cursorEvent) => {
          const cursor = cursorEvent.target.result;
          if (!cursor) return;
          const record = cursor.value;
          let changed = false;

          if (record.state !== undefined && record.states === undefined) {
            record.states = migrateStateV1toV2(record.state);
            delete record.state;
            changed = true;
          }
          if (record.category !== undefined && !CATEGORIES.includes(record.category)) {
            record.category = migrateCategoryV1toV2(record.category);
            changed = true;
          }
          if (record.isStaple === undefined) {
            record.isStaple = false;
            changed = true;
          }
          if (record.useByOverrideDays === undefined) {
            record.useByOverrideDays = null;
            changed = true;
          }

          if (changed) cursor.update(record);
          cursor.continue();
        };
      }

      if (!_db.objectStoreNames.contains('inventoryHistory')) {
        const store = _db.createObjectStore('inventoryHistory', { keyPath: 'id', autoIncrement: true });
        store.createIndex('inventoryItemId', 'inventoryItemId', { unique: false });
        store.createIndex('date', 'date', { unique: false });
      }

      if (!_db.objectStoreNames.contains('freezerRatingsReference')) {
        _db.createObjectStore('freezerRatingsReference', { keyPath: 'ingredientName' });
      }

      if (!_db.objectStoreNames.contains('useByReference')) {
        _db.createObjectStore('useByReference', { keyPath: 'lookupKey' });
      }

      if (!_db.objectStoreNames.contains('quickAddTemplates')) {
        const store = _db.createObjectStore('quickAddTemplates', { keyPath: 'id', autoIncrement: true });
        store.createIndex('usageCount', 'usageCount', { unique: false });
      }

      if (!_db.objectStoreNames.contains('recipes')) {
        const store = _db.createObjectStore('recipes', { keyPath: 'id', autoIncrement: true });
        store.createIndex('cuisine', 'cuisine', { unique: false });
        store.createIndex('mealType', 'mealType', { unique: false });
      }

      if (!_db.objectStoreNames.contains('mealPlans')) {
        _db.createObjectStore('mealPlans', { keyPath: 'id', autoIncrement: true });
      }

      if (!_db.objectStoreNames.contains('batchCookEvents')) {
        _db.createObjectStore('batchCookEvents', { keyPath: 'id', autoIncrement: true });
      }

      if (!_db.objectStoreNames.contains('purchaseEvents')) {
        _db.createObjectStore('purchaseEvents', { keyPath: 'id', autoIncrement: true });
      }

      if (!_db.objectStoreNames.contains('settings')) {
        _db.createObjectStore('settings', { keyPath: 'key' });
      }
    };

    request.onsuccess = (event) => {
      db = event.target.result;
      resolve(db);
    };

    request.onerror = (event) => reject(event.target.error);
  });
}

function dbGetAll(storeName, indexName, query) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const source = indexName ? store.index(indexName) : store;
    const request = query !== undefined ? source.getAll(query) : source.getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function dbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    if (!db) { reject(new Error('Database is not open')); return; }
    try {
      const tx = db.transaction(storeName, 'readonly');
      tx.onerror = () => reject(tx.error || new Error('Transaction failed'));
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      const request = tx.objectStore(storeName).get(key);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    } catch (err) { reject(err); }
  });
}

function dbPut(storeName, value) {
  return new Promise((resolve, reject) => {
    if (!db) { reject(new Error('Database is not open')); return; }
    try {
      const tx = db.transaction(storeName, 'readwrite');
      tx.onerror = () => reject(tx.error || new Error('Transaction failed'));
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      const request = tx.objectStore(storeName).put(value);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    } catch (err) { reject(err); }
  });
}

function dbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    if (!db) { reject(new Error('Database is not open')); return; }
    try {
      const tx = db.transaction(storeName, 'readwrite');
      tx.onerror = () => reject(tx.error || new Error('Transaction failed'));
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      const request = tx.objectStore(storeName).delete(key);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    } catch (err) { reject(err); }
  });
}

function dbClearAndBulkPut(storeName, items) {
  return new Promise((resolve, reject) => {
    if (!db) { reject(new Error('Database is not open')); return; }
    try {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      store.clear();
      items.forEach((item) => store.put(item));
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
    } catch (err) { reject(err); }
  });
}

async function seedIfEmpty() {
  const existingRatings = await dbGetAll('freezerRatingsReference');
  if (existingRatings.length === 0) {
    for (const r of FREEZER_RATINGS_SEED) await dbPut('freezerRatingsReference', r);
  }
  const existingTemplates = await dbGetAll('quickAddTemplates');
  if (existingTemplates.length === 0) {
    for (const t of QUICK_ADD_SEED) await dbPut('quickAddTemplates', t);
  }
  const existingUseBy = await dbGetAll('useByReference');
  if (existingUseBy.length === 0) {
    for (const u of USE_BY_REFERENCE_SEED) await dbPut('useByReference', u);
  }
  const existingSettings = await dbGet('settings', 'profiles');
  if (!existingSettings) {
    await dbPut('settings', {
      key: 'profiles',
      userProfile: { name: '', spicePreference: '', favouriteCuisines: [], dislikedFoods: [] },
      partnerProfile: { name: '', spicePreference: '', favouriteCuisines: [], dislikedFoods: [] }
    });
  }
}

// Looks up a suggested use-by window for an ingredient + its current states.
// Tries state-specific keys first (e.g. "chicken|defrosting"), then falls back to the plain name.
async function getSuggestedUseBy(ingredientName, states) {
  const nameKey = ingredientName.toLowerCase().trim();
  const selectedStates = (states || []).map((s) => s.toLowerCase());

  // Try exact compound keys first (fast path for single-state entries, e.g. "yoghurt|opened")
  for (const s of selectedStates) {
    const compound = await dbGet('useByReference', `${nameKey}|${s}`);
    if (compound) return compound;
  }

  // Fall back to scanning all entries for this ingredient name and matching by applicableStates,
  // so a single seed entry covering multiple states (e.g. Chicken: ['Fresh','Raw']) is found
  // regardless of which one of those states the user actually selected.
  const allEntries = await dbGetAll('useByReference');
  const nameMatches = allEntries.filter((e) => e.lookupKey === nameKey || e.lookupKey.split('|')[0] === nameKey);
  for (const entry of nameMatches) {
    const entryStates = (entry.applicableStates || []).map((s) => s.toLowerCase());
    if (selectedStates.some((s) => entryStates.includes(s))) return entry;
  }

  // Last resort: plain name with no state qualifier at all
  return await dbGet('useByReference', nameKey);
}

  const route = window.location.hash.replace('#', '') || 'home';
  AppState.route = ROUTES.includes(route) ? route : 'home';

}

async function renderRoute() {
  document.querySelectorAll('.nav-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.route === AppState.route);
  });

  const fab = document.getElementById('fab-btn');
  fab.style.display = AppState.route === 'kitchen' ? 'flex' : 'none';

  const titleMap = {
    home: ['Kitchen Companion', "Know what you've got"],
    planner: ['Meal Planner', 'Coming in Phase 2'],
    recipes: ['Recipes', 'Coming in Phase 2'],
    kitchen: ['Kitchen', 'Pantry · Fridge · Freezer · Leftovers'],
    shopping: ['Shopping', 'Coming in Phase 3'],
    settings: ['Settings', 'App data & preferences']
  };
  const [title, subtitle] = titleMap[AppState.route];
  document.getElementById('header-title').textContent = title;
  document.getElementById('header-subtitle').textContent = subtitle;

  const content = document.getElementById('app-content');

  switch (AppState.route) {
    case 'home': content.innerHTML = await renderHomeScreen(); break;
    case 'kitchen': content.innerHTML = await renderKitchenScreen(); attachKitchenListeners(); break;
    case 'settings': content.innerHTML = await renderSettingsScreen(); attachSettingsListeners(); break;
    case 'planner': content.innerHTML = renderPlaceholder('Meal Planner', 'Weekly breakfast, lunch and dinner planning — built around what\'s already in your kitchen, expiry dates, and your protein targets.'); break;
    case 'recipes': content.innerHTML = renderPlaceholder('Recipes', 'A curated library of Indian, Anglo-Indian and Australian/Western recipes, with ingredient match scoring against your inventory.'); break;
    case 'shopping': content.innerHTML = renderPlaceholder('Shopping', 'Budget tracking, purchase events, and shopping lists built from your meal plan.'); break;

// Units for kitchen items: metric weights/volumes plus counts for packaged goods
const ITEM_UNITS = ['g', 'kg', 'ml', 'L', 'each', 'can', 'jar', 'bottle', 'pack'];
const COUNT_UNIT_PLURALS = { can: 'cans', jar: 'jars', bottle: 'bottles', pack: 'packs' };

// Item names can be typed by the user, so escape them before they go into innerHTML.
function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// YYYY-MM-DD in local time (toISOString() would shift dates by the UTC offset)
function localDateString(date) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

// "2 cans", "1kg", "6" (each), or "In stock" when no amount was recorded
function formatItemQuantity(item) {
  if (item.portionCount) return `${item.portionCount} × ${item.portionSize || ''}`.trim();
  if (item.quantity === null || item.quantity === undefined || item.quantity === 0) return 'In stock';
  const q = Number.isInteger(item.quantity) ? item.quantity : Math.round(item.quantity * 100) / 100;
  if (!item.unit || item.unit === 'each') return String(q);
  if (COUNT_UNIT_PLURALS[item.unit]) return `${q} ${q === 1 ? item.unit : COUNT_UNIT_PLURALS[item.unit]}`;
  return `${q}${item.unit}`;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(dateStr);
  target.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}

function formatExpiry(dateStr) {
  const d = daysUntil(dateStr);
  if (d === null) return '';
  if (d < 0) return `Expired ${Math.abs(d)}d ago`;
  if (d === 0) return 'Expires today';
  if (d === 1) return 'Expires tomorrow';
  return `Expires in ${d}d`;
}

const LOCATION_LABELS = { pantry: 'Pantry', fridge: 'Fridge', freezer: 'Freezer', leftovers: 'Leftovers' };
// STATES_V2 and CATEGORIES are defined earlier (DATABASE section) since the migration logic needs them too.
const STATE_LABELS = {
  Fresh: 'Fresh', Frozen: 'Frozen', Defrosting: 'Defrosting', Raw: 'Raw',
  Cooked: 'Cooked', Leftover: 'Leftover', Opened: 'Opened', Prepared: 'Prepared'
};

function stateCssClass(state) {
  return 'state-' + state.toLowerCase();
}

/* ============================================================
   HOME DASHBOARD
   ============================================================ */
async function renderHomeScreen() {
  const items = await dbGetAll('inventoryItems');

  const counts = { pantry: 0, fridge: 0, freezer: 0, leftovers: 0 };
  items.forEach((item) => { if (counts[item.location] !== undefined) counts[item.location]++; });

  const expiringSoon = items
    .filter((item) => item.expiryDate && daysUntil(item.expiryDate) <= 3)
    .sort((a, b) => daysUntil(a.expiryDate) - daysUntil(b.expiryDate))
    .slice(0, 6);

  const statCardsHtml = Object.keys(counts).map((loc) => `
    <div class="stat-card loc-${loc}">
      <div class="count">${counts[loc]}</div>
      <div class="label">${LOCATION_LABELS[loc]}</div>
    </div>
  `).join('');

  let expiryHtml;
  if (expiringSoon.length === 0) {
    expiryHtml = `
      <div class="empty-state">
        <div class="glyph">✓</div>
        <h3>Nothing expiring soon</h3>
        <p>Items with an expiry date within 3 days will show up here.</p>
      </div>
    `;
  } else {
    expiryHtml = `<div class="expiry-list">` + expiringSoon.map((item) => {
      const d = daysUntil(item.expiryDate);
      const urgent = d <= 1;
      return `
        <div class="expiry-row ${urgent ? 'urgent' : ''}">
          <span class="name">${escapeHtml(item.name)}</span>
          <span class="when">${formatExpiry(item.expiryDate)}</span>
        </div>
      `;
    }).join('') + `</div>`;
  }

  const totalItems = items.length;

  return `
    <div class="stat-grid">${statCardsHtml}</div>
    ${totalItems === 0 ? `
      <div class="empty-state">
        <div class="glyph">🧺</div>
        <h3>Your kitchen is empty — for now</h3>
        <p>Head to the Kitchen tab and tap <strong>Stocktake</strong> to tick off what you have.</p>
      </div>
    ` : `
      <div class="section-heading">
        <h2>Expiring soon</h2>
        <span class="count-badge">${expiringSoon.length} item${expiringSoon.length === 1 ? '' : 's'}</span>
      </div>
      ${expiryHtml}
    `}
  `;
}

/* ============================================================
   KITCHEN INVENTORY SCREEN
   ============================================================ */
async function renderKitchenScreen() {
  const items = await dbGetAll('inventoryItems');
  AppState.inventory = items;

  const filtered = AppState.activeLocationFilter === 'all'
    ? items
    : items.filter((i) => i.location === AppState.activeLocationFilter);

  const tabsHtml = `
    <div class="location-tabs">
      ${['all', 'pantry', 'fridge', 'freezer', 'leftovers'].map((loc) => `
        <button class="loc-tab ${AppState.activeLocationFilter === loc ? 'active' : ''}" data-loc="${loc}">
          ${loc === 'all' ? 'All' : LOCATION_LABELS[loc]}
        </button>
      `).join('')}
    </div>
  `;

  const stocktakeHtml = `
    <button type="button" class="stocktake-btn" id="stocktake-btn">
      <span class="st-btn-title">📋 Stocktake</span>
      <span class="st-btn-desc">Tick off what's in your pantry, fridge and freezer</span>
    </button>
  `;

  const templates = await dbGetAll('quickAddTemplates');
  const sortedTemplates = templates.sort((a, b) => (b.usageCount || 0) - (a.usageCount || 0));
  const quickAddHtml = sortedTemplates.length === 0 ? '' : `
    <div class="quick-add-row">
      ${sortedTemplates.map((t) => `<button type="button" class="quick-add-chip" data-template-id="${t.id}">+ ${t.name}</button>`).join('')}
    </div>
  `;

  if (filtered.length === 0) {
    return tabsHtml + stocktakeHtml + quickAddHtml + `
      <div class="empty-state">
        <div class="glyph">🧺</div>
        <h3>No items here yet</h3>
        <p>Tap the + button to add something to your ${AppState.activeLocationFilter === 'all' ? 'kitchen' : LOCATION_LABELS[AppState.activeLocationFilter].toLowerCase()}.</p>
      </div>
    `;
  }

  const sorted = [...filtered].sort((a, b) => {
    const ea = a.expiryDate ? new Date(a.expiryDate).getTime() : Infinity;
    const eb = b.expiryDate ? new Date(b.expiryDate).getTime() : Infinity;
    if (ea !== eb) return ea - eb;
    return a.name.localeCompare(b.name);
  });

  const itemsHtml = sorted.map((item) => {
    const qtyLabel = formatItemQuantity(item);

    const expiryFlag = item.expiryDate
      ? `<div class="expiry-flag">${formatExpiry(item.expiryDate)}</div>`
      : '';

    const states = item.states && item.states.length ? item.states : ['Fresh'];
    const stateTagsHtml = states.map((s) => `<span class="tag ${stateCssClass(s)}">${STATE_LABELS[s] || s}</span>`).join('');
    const stapleBadge = item.isStaple ? `<span class="tag staple-badge">Staple</span>` : '';

    return `
      <div class="item-card loc-${item.location}" data-id="${item.id}">
        <div class="edge"></div>
        <div class="body">
          <div class="top-row">
            <span class="name">${escapeHtml(item.name)}</span>
            <span class="qty">${escapeHtml(qtyLabel)}</span>
          </div>
          <div class="meta-row">
            ${stateTagsHtml}
            ${item.category ? `<span class="tag">${item.category}</span>` : ''}
            ${stapleBadge}
          </div>
          ${expiryFlag}
        </div>
      </div>
    `;
  }).join('');

  return tabsHtml + stocktakeHtml + quickAddHtml + itemsHtml;
}

function attachKitchenListeners() {
  document.getElementById('stocktake-btn').addEventListener('click', openStocktake);

  document.querySelectorAll('.loc-tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      AppState.activeLocationFilter = tab.dataset.loc;
      renderRoute();
    });
  });

  document.querySelectorAll('.item-card').forEach((card) => {
    card.addEventListener('click', () => {
      const id = parseInt(card.dataset.id, 10);
      openItemDetail(id);
    });
  });

  document.querySelectorAll('.quick-add-chip').forEach((chip) => {
    chip.addEventListener('click', async () => {
      const templateId = parseInt(chip.dataset.templateId, 10);
      const template = await dbGet('quickAddTemplates', templateId);
      if (!template) return;

      // Track usage so frequently-used templates float to the front over time
      template.usageCount = (template.usageCount || 0) + 1;
      await dbPut('quickAddTemplates', template);

      openItemForm(null, {
        name: template.name,
        category: template.category,
        unit: template.defaultUnit,
        location: template.defaultLocation,
        states: template.defaultStates,
        portionSize: template.defaultPortionSize,
        isStaple: template.isStaple,
        quantity: '',
        portionCount: '',
        purchaseDate: '',
        expiryDate: '',
        cost: '',
        notes: ''
      });
    });
  });
}

/* ---- Item Add/Edit Form ---- */
function openItemForm(item, prefill) {

  const isEdit = !!item;
  const seed = item || prefill || null;
  const initialStates = seed && seed.states && seed.states.length ? seed.states : ['Raw'];

  const html = `
    <div class="modal-title-row">
      <h2>${isEdit ? 'Edit item' : 'Add item'}</h2>
      <button class="close-btn" id="modal-close">×</button>
    </div>
    <form id="item-form">
      <div class="modal-scroll-area">
        <div class="field">
          <label>Name</label>
          <input type="text" id="f-name" value="${seed ? seed.name : ''}" placeholder="e.g. Chicken breast, or a custom ingredient like Kokum" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Quantity</label>
            <input type="number" id="f-quantity" value="${seed && seed.quantity ? seed.quantity : ''}" min="0" step="any" placeholder="Optional">
          </div>
          <div class="field">
            <label>Unit</label>
            <select id="f-unit">
              ${ITEM_UNITS.map((u) => `<option value="${u}" ${seed && seed.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="field">
          <label>Category</label>
          <select id="f-category">
            ${CATEGORIES.map((c) => `<option value="${c}" ${initialCategory === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>

        <div class="field">
          <label>Location</label>
          <div class="segmented" id="f-location">
            ${['pantry', 'fridge', 'freezer', 'leftovers'].map((loc) => `
              <button type="button" data-val="${loc}" class="${seed && seed.location === loc ? 'selected' : (!seed && loc === 'pantry' ? 'selected' : '')}">${LOCATION_LABELS[loc]}</button>
            `).join('')}
          </div>
        </div>

        <div class="field">
          <label>State <span style="text-transform:none;font-weight:500;">(select all that apply)</span></label>
          <div class="state-chip-grid" id="f-states">
            ${STATES_V2.map((s) => `
              <button type="button" data-val="${s}" class="state-chip ${initialStates.includes(s) ? 'selected' : ''}">${STATE_LABELS[s]}</button>
            `).join('')}
          </div>
        </div>

        <div class="staple-toggle-row">
          <div class="label-group">
            <span class="label">Pantry staple</span>
            <span class="desc">Assume this is normally on hand for meal planning</span>
          </div>
          <button type="button" id="f-staple-toggle" class="toggle-switch ${initialStaple ? 'on' : ''}" data-on="${initialStaple ? 'true' : 'false'}"></button>
        </div>

        <div class="field" id="use-by-suggestion-field" style="display:none;">
          <label>Suggested use-by</label>
          <div class="use-by-suggestion" id="use-by-suggestion-box"></div>
        </div>

        <details class="more-fields" ${isEdit ? 'open' : ''}>
          <summary>More details (optional)</summary>
          <div class="more-fields-inner">
            <div class="field-row">
              <div class="field">
                <label>Portions</label>
                <input type="number" id="f-portionCount" value="${seed && seed.portionCount ? seed.portionCount : ''}" min="0" placeholder="e.g. 8">
              </div>
              <div class="field">
                <label>Portion size</label>
                <input type="text" id="f-portionSize" value="${seed && seed.portionSize ? seed.portionSize : ''}" placeholder="e.g. 350g each">
              </div>
            </div>

            <div class="field-row">
              <div class="field">
                <label>Purchase date</label>
                <input type="date" id="f-purchaseDate" value="${seed && seed.purchaseDate ? seed.purchaseDate : ''}">
              </div>
              <div class="field">
                <label>Expiry date <span style="text-transform:none;font-weight:500;">(overrides suggestion)</span></label>
                <input type="date" id="f-expiryDate" value="${seed && seed.expiryDate ? seed.expiryDate : ''}">

  document.querySelectorAll('#f-location button').forEach((btn) => {

      btn.parentElement.querySelectorAll('button').forEach((b) => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });

  // State is multi-select: toggle individual chips rather than single-select
  document.querySelectorAll('#f-states button').forEach((btn) => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('selected');
      refreshUseBySuggestion();
    });
  });

  document.getElementById('f-staple-toggle').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    const isOn = btn.dataset.on === 'true';
    btn.dataset.on = isOn ? 'false' : 'true';
    btn.classList.toggle('on', !isOn);
  });

  document.getElementById('f-name').addEventListener('input', debounce(refreshUseBySuggestion, 400));
  document.getElementById('f-expiryDate').addEventListener('change', () => {
    // If user manually sets an expiry date, treat it as an override of the suggestion
    refreshUseBySuggestion();
  });

  document.getElementById('modal-close').addEventListener('click', closeModal);

  document.getElementById('item-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    await saveItemFromForm(item);
  });

    document.getElementById('delete-item-btn').addEventListener('click', async () => {
      await deleteItem(item.id, item.name);
    });
  }

  // Run once on open so editing an item with an existing name shows its suggestion immediately
  refreshUseBySuggestion();
}

function debounce(fn, delay) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
}

async function refreshUseBySuggestion() {
  const nameInput = document.getElementById('f-name');
  const box = document.getElementById('use-by-suggestion-box');
  const field = document.getElementById('use-by-suggestion-field');
  const expiryInput = document.getElementById('f-expiryDate');
  if (!nameInput || !box || !field) return;

  const name = nameInput.value.trim();
  if (!name) { field.style.display = 'none'; return; }

  const selectedStates = Array.from(document.querySelectorAll('#f-states button.selected')).map((b) => b.dataset.val);
  const suggestion = await getSuggestedUseBy(name, selectedStates);

  if (!suggestion) { field.style.display = 'none'; return; }

  const rangeLabel = suggestion.suggestedDaysMin === suggestion.suggestedDaysMax
    ? `${suggestion.suggestedDaysMin} day${suggestion.suggestedDaysMin === 1 ? '' : 's'}`
    : `${suggestion.suggestedDaysMin}-${suggestion.suggestedDaysMax} days`;

  field.style.display = 'block';
  box.innerHTML = `
    <span>${rangeLabel} from today${suggestion.notes ? ' — ' + suggestion.notes : ''}</span>
    <button type="button" class="apply-btn" id="apply-use-by-btn">Use this</button>
  `;

  document.getElementById('apply-use-by-btn').addEventListener('click', () => {
    expiryInput.value = localDateString(addDays(new Date(), suggestion.suggestedDaysMax));
  });
}

async function saveItemFromForm(existingItem) {
  const getSelectedLocation = () => {
    const el = document.querySelector('#f-location button.selected');
    return el ? el.dataset.val : null;
  };
  const getSelectedStates = () => Array.from(document.querySelectorAll('#f-states button.selected')).map((b) => b.dataset.val);

  const name = document.getElementById('f-name').value.trim();
  if (!name) return;

  const now = new Date().toISOString();
  const portionCount = document.getElementById('f-portionCount').value;
  const portionSize = document.getElementById('f-portionSize').value.trim();
  const isStaple = document.getElementById('f-staple-toggle').dataset.on === 'true';
  const selectedStates = getSelectedStates();
  const expiryDate = document.getElementById('f-expiryDate').value || null;

  const itemData = {
    name,
    quantity: parseFloat(document.getElementById('f-quantity').value) || null,
    unit: document.getElementById('f-unit').value,
    portionCount: portionCount ? parseInt(portionCount, 10) : null,
    portionSize: portionSize || null,
    location: getSelectedLocation() || 'pantry',
    subLocation: null,
    states: selectedStates.length ? selectedStates : ['Fresh'],
    category: document.getElementById('f-category').value,
    isStaple,
    purchaseDate: document.getElementById('f-purchaseDate').value || null,
    expiryDate,
    useByOverrideDays: null,
    cost: document.getElementById('f-cost').value ? parseFloat(document.getElementById('f-cost').value) : null,
    notes: document.getElementById('f-notes').value.trim(),
    freezerFriendlyRating: null,
    linkedPurchaseEventId: null,
    updatedAt: now
  };

  const submitBtn = document.querySelector('.modal-action-bar button[type="submit"]');

  try {
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Saving…'; }

    if (existingItem) {
      itemData.id = existingItem.id;
      itemData.createdAt = existingItem.createdAt;
      await dbPut('inventoryItems', itemData);
      await logHistory(existingItem.id, 'adjusted', null, existingItem.location, itemData.location, 'Item details edited');
      showToast('Item updated');
    } else {
      itemData.createdAt = now;
      const newId = await dbPut('inventoryItems', itemData);
      await logHistory(newId, 'created', itemData.quantity, null, itemData.location, 'Item added to kitchen');
      showToast('Item added');
    }

    closeModal();
    renderRoute();
  } catch (err) {
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = existingItem ? 'Save changes' : 'Add to kitchen'; }
    alert('Couldn\'t save this item: ' + (err && err.message ? err.message : 'unknown storage error') + '\n\nYour local storage may be full or restricted by this browser.');
  }
}

async function deleteItem(id, name) {
  await dbDelete('inventoryItems', id);
  await logHistory(id, 'discarded', null, null, null, `Removed: ${name}`);
  closeModal();
  showToast('Item removed');
  renderRoute();
}

        <div class="history-row">
          <div class="h-action">${formatHistoryAction(h)}</div>
          <div class="h-date">${new Date(h.date).toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</div>
        </div>
      `).join('') + `</div>`;

  const html = `
    <div class="modal-title-row">
      <h2>${escapeHtml(item.name)}</h2>
      <button class="close-btn" id="modal-close">×</button>
    </div>
    <div class="field-row" style="margin-bottom:10px;flex-wrap:wrap;gap:6px;">

}

function formatHistoryAction(h) {
  const actionVerbs = {
    created: 'Added to kitchen',
    moved: `Moved ${h.fromLocation ? LOCATION_LABELS[h.fromLocation] || h.fromLocation : '?'} → ${h.toLocation ? LOCATION_LABELS[h.toLocation] || h.toLocation : '?'}`,
    used: `Used${h.quantityChanged ? ' ' + h.quantityChanged : ''}`,
    portioned: 'Created freezer portions',
    discarded: 'Discarded',
    adjusted: 'Edited'
  };
  let label = actionVerbs[h.action] || h.action;
  if (h.notes) label += ` — ${h.notes}`;
  return label;
}

async function logHistory(inventoryItemId, action, quantityChanged, fromLocation, toLocation, notes) {

    inventoryItemId,
    action,
    quantityChanged,
    fromLocation,
    toLocation,
    date: new Date().toISOString(),
    notes: notes || ''
  });
}

// Build a stocktake group: every item shares the group's category, unit, states and staple flag.
// An entry can override its unit or its category after a '|', e.g. 'Crushed tomatoes|can' or 'Nuts|Snacks & Treats'.
function stocktakeGroup(title, category, unit, states, isStaple, names) {
  return {
    title,
    items: names.map((entry) => {
      const [name, override] = entry.split('|');
      const isCategory = CATEGORIES.includes(override);
      return {
        name,
        category: isCategory ? override : category,
        unit: override && !isCategory ? override : unit,
        states,
        isStaple
      };
    })
  };
}

// Stocktake selections live here while the sheet is open, so switching
// Pantry/Fridge/Freezer keeps what's already been ticked.
const Stocktake = { location: 'pantry', selected: {}, custom: { pantry: [], fridge: [], freezer: [] }, existing: new Set() };

function stocktakeKey(location, name) {
  return `${location}|${name.toLowerCase()}`;
}

function stocktakeSelectedCount() {
  return Object.keys(Stocktake.selected).length;
}

function stocktakeRowHtml(location, item) {
  const key = stocktakeKey(location, item.name);
  const have = Stocktake.existing.has(key);
  const sel = Stocktake.selected[key];
  const units = ITEM_UNITS.map((u) => `<option value="${u}" ${(sel ? sel.unit : item.unit) === u ? 'selected' : ''}>${u}</option>`).join('');
  return `
    <div class="st-row ${sel ? 'ticked' : ''} ${have ? 'have' : ''}" data-key="${escapeHtml(key)}">
      <button type="button" class="st-tick" ${have ? 'disabled' : ''}>
        <span class="st-box">${sel || have ? '✓' : ''}</span>
        <span class="st-name">${escapeHtml(item.name)}</span>
        ${have ? '<span class="st-have">In kitchen</span>' : ''}
      </button>
      ${sel ? `
        <div class="st-qty">
          <input type="number" class="st-amount" min="0" step="any" inputmode="decimal" placeholder="Amount" value="${sel.quantity ?? ''}">
          <select class="st-unit">${units}</select>
        </div>` : ''}
    </div>
  `;
}

function renderStocktakeBody() {
  const loc = Stocktake.location;
  const groups = [...STOCKTAKE_LIST[loc]];
  if (Stocktake.custom[loc].length) groups.unshift({ title: 'Your items', items: Stocktake.custom[loc] });

  return `
    <div class="st-add">
      <input type="text" id="st-custom-name" placeholder="Add your own, e.g. Kokum">
      <select id="st-custom-category">
        ${CATEGORIES.map((c) => `<option value="${c}" ${c === 'Other' ? 'selected' : ''}>${c}</option>`).join('')}
      </select>
      <button type="button" class="btn-secondary" id="st-custom-add">+ Add</button>
    </div>
    ${groups.map((g) => `
      <div class="st-group-title">${escapeHtml(g.title)}</div>
      ${g.items.map((item) => stocktakeRowHtml(loc, item)).join('')}
    `).join('')}
  `;
}

function findStocktakeItem(location, key) {
  const all = [...Stocktake.custom[location], ...STOCKTAKE_LIST[location].flatMap((g) => g.items)];
  return all.find((i) => stocktakeKey(location, i.name) === key);
}

function refreshStocktakeSheet() {
  document.getElementById('st-body').innerHTML = renderStocktakeBody();
  document.querySelectorAll('#st-location button').forEach((b) => b.classList.toggle('selected', b.dataset.val === Stocktake.location));
  const count = stocktakeSelectedCount();
  const saveBtn = document.getElementById('st-save');
  saveBtn.textContent = count ? `Add ${count} item${count === 1 ? '' : 's'} to kitchen` : 'Tick items to add';
  saveBtn.disabled = count === 0;
  attachStocktakeBodyListeners();
}

function attachStocktakeBodyListeners() {
  document.querySelectorAll('.st-row').forEach((row) => {
    const key = row.dataset.key;
    row.querySelector('.st-tick').addEventListener('click', () => {
      if (Stocktake.selected[key]) {
        delete Stocktake.selected[key];
      } else {
        const item = findStocktakeItem(Stocktake.location, key);
        if (!item) return;
        Stocktake.selected[key] = { ...item, location: Stocktake.location, quantity: null };
      }
      const scroll = document.getElementById('st-body').scrollTop;
      refreshStocktakeSheet();
      document.getElementById('st-body').scrollTop = scroll;
    });
    const amount = row.querySelector('.st-amount');
    if (amount) {
      amount.addEventListener('input', () => {
        Stocktake.selected[key].quantity = amount.value === '' ? null : parseFloat(amount.value);
      });
      row.querySelector('.st-unit').addEventListener('change', (e) => {
        Stocktake.selected[key].unit = e.target.value;
      });
    }
  });

  document.getElementById('st-custom-add').addEventListener('click', () => {
    const input = document.getElementById('st-custom-name');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    const loc = Stocktake.location;
    const key = stocktakeKey(loc, name);
    if (!findStocktakeItem(loc, key)) {
      const category = document.getElementById('st-custom-category').value;
      const states = loc === 'freezer' ? ['Frozen'] : loc === 'fridge' ? ['Fresh'] : ['Raw'];
      Stocktake.custom[loc].push({ name, category, unit: loc === 'pantry' ? 'g' : 'each', states, isStaple: false });
    }
    if (!Stocktake.existing.has(key) && !Stocktake.selected[key]) {
      Stocktake.selected[key] = { ...findStocktakeItem(loc, key), location: loc, quantity: null };
    }
    refreshStocktakeSheet();
    document.getElementById('st-body').scrollTop = 0;
  });
}

async function openStocktake() {
  const items = await dbGetAll('inventoryItems');
  Stocktake.existing = new Set(items.map((i) => stocktakeKey(i.location, i.name)));
  Stocktake.selected = {};
  Stocktake.custom = { pantry: [], fridge: [], freezer: [] };
  if (!STOCKTAKE_LIST[Stocktake.location]) Stocktake.location = 'pantry';

  openModal(`
    <div class="modal-title-row">
      <h2>Stocktake</h2>
      <button class="close-btn" id="modal-close">×</button>
    </div>
    <p class="st-intro">Tick what you have. Amounts are optional, and you can add them later.</p>
    <div class="segmented" id="st-location" style="margin-bottom:10px;">
      ${['pantry', 'fridge', 'freezer'].map((loc) => `<button type="button" data-val="${loc}">${LOCATION_LABELS[loc]}</button>`).join('')}
    </div>
    <div class="modal-scroll-area st-body" id="st-body"></div>
    <div class="modal-action-bar">
      <button type="button" class="btn-primary" id="st-save" disabled>Tick items to add</button>
    </div>
  `);
  document.getElementById('modal-sheet').classList.add('tall');

  document.getElementById('modal-close').addEventListener('click', closeStocktake);
  document.querySelectorAll('#st-location button').forEach((btn) => {
    btn.addEventListener('click', () => {
      Stocktake.location = btn.dataset.val;
      refreshStocktakeSheet();
      document.getElementById('st-body').scrollTop = 0;
    });
  });
  document.getElementById('st-save').addEventListener('click', saveStocktake);
  refreshStocktakeSheet();
}

function closeStocktake() {
  if (stocktakeSelectedCount() && !confirm('Close without adding the ticked items?')) return;
  Stocktake.selected = {};
  closeModal();
}

async function saveStocktake() {
  const picks = Object.values(Stocktake.selected);
  if (!picks.length) return;
  const saveBtn = document.getElementById('st-save');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Adding…';

  try {
    const now = new Date().toISOString();
    for (const pick of picks) {
      // Fresh food gets a suggested use-by date (the longer end of the range); the user can change it later
      const suggestion = await getSuggestedUseBy(pick.name, pick.states);
      const quantity = Number.isFinite(pick.quantity) ? pick.quantity : null;
      const itemData = {
        name: pick.name,
        quantity,
        unit: pick.unit,
        portionCount: null,
        portionSize: null,
        location: pick.location,
        subLocation: null,
        states: pick.states,
        category: pick.category,
        isStaple: !!pick.isStaple,
        purchaseDate: null,
        expiryDate: suggestion ? localDateString(addDays(new Date(), suggestion.suggestedDaysMax)) : null,
        useByOverrideDays: null,
        cost: null,
        notes: '',
        freezerFriendlyRating: null,
        linkedPurchaseEventId: null,
        createdAt: now,
        updatedAt: now
      };
      const newId = await dbPut('inventoryItems', itemData);
      await logHistory(newId, 'created', quantity, null, pick.location, 'Added in stocktake');
    }
    Stocktake.selected = {};
    closeModal();
    showToast(`Added ${picks.length} item${picks.length === 1 ? '' : 's'}`);
    renderRoute();
  } catch (err) {
    saveBtn.disabled = false;
    saveBtn.textContent = `Add ${picks.length} items to kitchen`;
    alert('Couldn\'t save the stocktake: ' + (err && err.message ? err.message : 'unknown storage error'));
  }
}

  });
  document.getElementById('import-file-input').addEventListener('change', handleImportFile);
}

async function exportKitchenData() {
  const storeNames = ['inventoryItems', 'inventoryHistory', 'freezerRatingsReference', 'useByReference', 'quickAddTemplates', 'recipes', 'mealPlans', 'batchCookEvents', 'purchaseEvents', 'settings'];
  const backup = { exportedAt: new Date().toISOString(), version: DB_VERSION, data: {} };

  for (const storeName of storeNames) {
    backup.data[storeName] = await dbGetAll(storeName);
  }

  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `kitchen_backup_${dateStamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}

async function handleImportFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  try {
    const text = await file.text();
    const backup = JSON.parse(text);
    if (!backup.data) throw new Error('Invalid backup file');

    const confirmed = confirm('Importing will replace all current kitchen data with the backup. Continue?');
    if (!confirmed) { e.target.value = ''; return; }

    for (const storeName of Object.keys(backup.data)) {
      if (db.objectStoreNames.contains(storeName)) {
        await dbClearAndBulkPut(storeName, backup.data[storeName]);
      }
    }
    showToast('Kitchen data restored');
    renderRoute();
  } catch (err) {
    alert('Could not read this backup file. Make sure it was exported from Kitchen Companion.');
  } finally {
    e.target.value = '';
  }
}

function registerServiceWorker() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {
      // Offline caching unavailable (e.g. file:// protocol) — app still works online.
    });
  }
}

   ============================================================ */
document.querySelectorAll('.nav-btn').forEach((btn) => {
  btn.addEventListener('click', () => navigateTo(btn.dataset.route));
});

window.addEventListener('hashchange', handleHashChange);

(async function init() {
  try {
    if (!window.indexedDB) {
      showFatalError('This browser doesn\'t support local storage (IndexedDB), so Kitchen Companion can\'t save data here. Try opening this file in Safari or Chrome instead of the app you\'re currently using — or better, host it online and open that link.');
      return;
    }
    await openDatabase();
    await seedIfEmpty();
    registerServiceWorker();
    handleHashChange();
  } catch (err) {
    showFatalError('Kitchen Companion couldn\'t start because local storage failed to open. This usually happens when opening the file directly from a Files app. Try opening it in Safari or Chrome, or host it online (e.g. GitHub Pages) and open that link instead.<br><br><span style="opacity:0.7;font-size:11px;">' + (err && err.message ? err.message : String(err)) + '</span>');
  }
})();

function showFatalError(message) {
  document.getElementById('app-content').innerHTML = `
    <div class="empty-state" style="text-align:left;">
      <div class="glyph" style="text-align:center;">⚠</div>
      <h3 style="text-align:center;">Couldn't load your kitchen</h3>
      <p>${message}</p>
    </div>
  `;
  document.getElementById('fab-btn').style.display = 'none';
}
