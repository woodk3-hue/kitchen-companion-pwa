// Without an API key: each "amount + food" part of the description, from typical values
function estimatePlateOffline(text) {
  const parts = text.split(/\n|,|;|\band\b|\bwith\b/i).map((t) => t.trim()).filter(Boolean);
  const rows = [];
  const skipped = [];
  for (const part of parts) {
    const ing = parseIngredientLine(part, [], new Map());
    const calc = ing && ing.quantity ? nutritionFromIngredients([ing], 1) : null;
    if (calc && calc.counted.length) {
      const n = calc.perServing;
      rows.push({ name: ing.name.charAt(0).toUpperCase() + ing.name.slice(1), portion: formatIngredientQuantity(ing), kcal: n.kcal, protein: n.protein, carbs: n.carbs, fat: n.fat, selected: true });
    } else skipped.push(part);
  }
  return { rows, skipped };
}

async function readPlate() {
  const btn = document.getElementById('pp-action');
  const description = (document.getElementById('pp-text') || { value: '' }).value.trim();
  btn.disabled = true;
  btn.textContent = PlatePhoto.photo ? 'Looking at your plate…' : 'Working it out…';
  let Anthropic = null;
  let error = null;
  if (!getAiKey()) {
    const { rows, skipped } = estimatePlateOffline(description);
    PlatePhoto.rows = rows;
    if (!rows.length) error = 'Give an amount for each food, e.g. "150 g chicken curry, 120 g cooked rice".';
    else if (skipped.length) PlatePhoto.note = `Not counted (no amount, or a food the app doesn't know): ${skipped.join(', ')}. Add them with Quick add.`;
  } else try {
    const loaded = await getAnthropicClient();
    Anthropic = loaded.Anthropic;
    const response = await loaded.client.beta.messages.create({
      model: AI_MODEL,
      max_tokens: 8000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: { effort: 'medium', format: { type: 'json_schema', schema: plateSchema() } },
      messages: [{ role: 'user', content: [
        ...(PlatePhoto.photo ? [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: PlatePhoto.photo.data } }] : []),
        { type: 'text', text: PlatePhoto.photo
          ? `This is one person's serving of a meal. List each food on the plate with an estimated portion (e.g. "1 cup cooked rice", "150 g chicken curry") and its kcal, protein, carbs and fat in grams for that portion. If there is no food in the photo, return an empty list.${description ? `\nThey describe it as: ${description}` : ''}`
          : `Someone in Australia describes one person's serving of a meal they ate: "${description}".\nList each food with an estimated portion in metric (e.g. "1 cup cooked rice (160 g)", "150 g chicken curry"), using the amounts they give or a typical serve if they don't, and its kcal, protein, carbs and fat in grams for that portion. If it isn't food, return an empty list.` }
      ] }]
    });
    if (response.stop_reason === 'refusal') error = 'Claude couldn\'t read this photo. Try another, or use Quick add.';
    else {
      const parsed = JSON.parse(response.content.filter((b) => b.type === 'text').map((b) => b.text).join(''));
      PlatePhoto.rows = (parsed.items || []).map((it) => ({ ...it, selected: true }));
      if (!PlatePhoto.rows.length) error = PlatePhoto.photo ? 'No food was recognised. Try a closer photo from above, or describe it.' : 'No food was recognised in the description. Try naming each food.';
    }
  } catch (err) {
    error = err instanceof SyntaxError ? 'Claude\'s reply couldn\'t be read. Please try again.' : describeAiError(err, Anthropic);
  }
  if (!document.getElementById('pp-body')) return;
  if (error) {
    document.getElementById('pp-error').textContent = error;
    btn.disabled = false;
    btn.textContent = 'Try again';
    return;
  }
  document.getElementById('pp-body').innerHTML = `
    ${PlatePhoto.photo ? `<div class="ps-thumbs" style="margin-bottom:10px;"><div class="ps-thumb"><img src="${PlatePhoto.photo.preview}" alt="Your plate"></div></div>` : `<p class="recipe-muted" style="margin-top:0;">“${escapeHtml(description)}”</p>`}
    <p class="st-intro">${getAiKey() ? 'Estimated by Claude' : 'From typical values'}. Untick anything wrong and adjust the numbers.</p>
    ${PlatePhoto.note ? `<p class="recipe-muted">${escapeHtml(PlatePhoto.note)}</p>` : ''}
    ${PlatePhoto.rows.map((r, i) => `
      <div class="st-row ps-row ticked" data-i="${i}">
        <div class="ps-top"><button type="button" class="st-box ps-tick">✓</button><input type="text" class="ps-name" value="${escapeHtml(r.name)}"></div>
        <div class="ps-tags"><span class="tag">${escapeHtml(r.portion)}</span></div>
        <div class="ps-fields pp-nums">
          <label>kcal<input type="number" class="pp-kcal" value="${Math.round(r.kcal)}"></label>
          <label>P g<input type="number" class="pp-protein" value="${round1(r.protein)}"></label>
          <label>C g<input type="number" class="pp-carbs" value="${round1(r.carbs)}"></label>
          <label>F g<input type="number" class="pp-fat" value="${round1(r.fat)}"></label>
        </div>
      </div>`).join('')}
  `;
  document.querySelectorAll('#pp-body .ps-row').forEach((el) => {
    const row = PlatePhoto.rows[parseInt(el.dataset.i, 10)];
    el.querySelector('.ps-tick').addEventListener('click', () => {
      row.selected = !row.selected;
      el.classList.toggle('ticked', row.selected);
      el.querySelector('.ps-tick').textContent = row.selected ? '✓' : '';
    });
    el.querySelector('.ps-name').addEventListener('input', (e) => { row.name = e.target.value; });
    ['kcal', 'protein', 'carbs', 'fat'].forEach((k) => el.querySelector(`.pp-${k}`).addEventListener('input', (e) => { row[k] = numOrNull(e.target.value) || 0; }));
  });
  btn.disabled = false;
  btn.textContent = 'Log ticked items';
}

async function savePlate(date, meal) {
  const rows = PlatePhoto.rows.filter((r) => r.selected && r.name.trim());
  if (!rows.length) { showToast('Tick at least one item'); return; }
  const m = selectedMeal(meal);
  for (const r of rows) {
    await addLogEntry({ date, meal: m, name: `${r.name.trim()} (${r.portion})`, kcal: r.kcal, protein: r.protein, carbs: r.carbs, fat: r.fat, source: 'photo' });
  }
  finishLog(rows.length === 1 ? rows[0].name : `${rows.length} items`);
}

/* ============================================================
   I COOKED THIS
   Say how many portions you made, how many were eaten, and how many
   went into the fridge or freezer. Ingredients come out of the kitchen,
   your portion goes in the food diary, and the rest become leftover
   portions that can be planned or logged later.
   ============================================================ */
const LEFTOVER_FRIDGE_DAYS = 3;
const LEFTOVER_FREEZER_DAYS = 90;

// How much of a kitchen item a recipe ingredient uses, in the item's own unit (null when it can't tell)
function ingredientUseInItemUnit(ing, item, scale) {
  if (!ing.quantity || item.quantity == null) return null;
  const qty = ing.quantity * scale;
  const direct = convertQty(qty, ing.unit || 'each', item.unit || 'each');
  if (direct != null) return Math.round(direct * 1000) / 1000;
  // Spoons or "each" of something kept by weight, e.g. 3 tbsp from a 170 g packet of curry powder
  if (['g', 'kg'].includes(item.unit)) {
    const food = { ...(findFood([ing.name, ...(ing.matchTerms || [])].join(' | ')) || {}), ...(ing.nutrition && ing.nutrition.tbsp ? { tsp: ing.nutrition.tsp, tbsp: ing.nutrition.tbsp } : {}) };
    const grams = gramsOf(qty, ing.unit || 'each', food);
    if (grams != null) return Math.round((item.unit === 'kg' ? grams / 1000 : grams) * 1000) / 1000;
  }
  if (ing.unit === 'can' && item.unit === 'can') return qty;
  return null;
}

async function openCookedThis(recipe, { planEntryId = null, date = null, meal = null, serves = null, myPortions = 1 } = {}) {
  const [settings, items, profiles] = await Promise.all([getPlanSettings(), dbGetAll('inventoryItems'), dbGet('settings', 'profiles')]);
  const logDate = date || localDateString(new Date());
  const logMeal = meal || defaultLogMeal();
  const made = serves || recipe.servings || 4;
  const partnerName = (profiles && profiles.partnerProfile && profiles.partnerProfile.name) || 'Partner';
  // Starting point: 1 for me, 1 for my partner if I cook for two or more, anyone else, the rest in the fridge
  const household = settings.householdSize || 2;
  const start = { me: Math.min(myPortions, made) };
  start.partner = household >= 2 && made - start.me >= 1 ? 1 : 0;
  start.others = Math.max(0, Math.min(household - 2, made - start.me - start.partner));
  start.fridge = made - start.me - start.partner - start.others;
  start.freezer = 0;
  const index = buildInventoryIndex(items);
  const scaleFor = (portions) => (recipe.servings ? portions / recipe.servings : 1);
  const uses = (recipe.ingredients || [])
    .filter((ing) => !ing.optional && !ing.assumedStaple)
    .map((ing) => ({ ing, hit: findInventoryMatch(ing, index) }))
    .filter((u) => u.hit)
    .map((u) => ({ ing: u.ing, item: u.hit.item }));
  const macros = recipeMacros(recipe);

  const numField = (id, label, value, hint) => `
    <div class="field cook-num"><label>${label}</label>
      <div class="stepper"><button type="button" class="step-btn" data-for="${id}" data-d="-1" aria-label="One less">−</button><input type="number" id="${id}" min="0" step="1" inputmode="numeric" value="${value}"><button type="button" class="step-btn" data-for="${id}" data-d="1" aria-label="One more">+</button></div>
      ${hint ? `<span class="cook-hint">${hint}</span>` : ''}</div>`;
  const destRow = (key, icon, label, hint, value) => `
    <div class="cook-dest dest-${key}">
      <span class="cd-icon">${icon}</span>
      <span class="cd-label"><strong>${label}</strong><span class="cook-hint">${hint}</span></span>
      <div class="stepper"><button type="button" class="step-btn" data-for="ck-${key}" data-d="-1" aria-label="One less for ${label}">−</button><input type="number" id="ck-${key}" min="0" step="1" inputmode="numeric" value="${value}"><button type="button" class="step-btn" data-for="ck-${key}" data-d="1" aria-label="One more for ${label}">+</button></div>
    </div>`;

  openModal(`
    <div class="modal-title-row"><h2>🍳 I cooked this</h2><button class="close-btn" id="modal-close">×</button></div>
    <div class="modal-scroll-area">
      <p class="recipe-muted" style="margin-top:0;">${escapeHtml(recipe.name)}</p>
      <div class="cook-made">${numField('ck-made', 'Portions cooked (the whole pot)', made)}</div>
      <div class="st-group-title">Where does each portion go?</div>
      <div class="portion-dots" id="ck-dots" aria-hidden="true"></div>
      <div class="cook-dests">
        ${destRow('me', '🙋', 'Me', 'goes in my food diary', start.me)}
        <div class="cook-me-extra" id="ck-me-extra">
          ${mealSelectHtml(logMeal)}
          <p class="recipe-muted" id="ck-mine-kcal" style="margin:6px 0 0;"></p>
        </div>
        ${destRow('partner', '💑', escapeHtml(partnerName), 'eaten now', start.partner)}
        ${destRow('others', '👥', 'Others', 'family or guests', start.others)}
        ${destRow('fridge', '🧊', 'Fridge', `eat within ${LEFTOVER_FRIDGE_DAYS} days`, start.fridge)}
        ${destRow('freezer', '❄️', 'Freezer', 'keeps about 3 months', start.freezer)}
      </div>
      <p class="cook-check" id="ck-check"></p>

      <div class="st-group-title">Take out of my kitchen</div>
      ${uses.length ? uses.map((u, i) => {
        const has = u.item.quantity != null && u.item.quantity > 0;
        return `
        <div class="cook-use" data-i="${i}">
          <label class="plan-ai-toggle" style="margin:0;"><input type="checkbox" class="ck-use-on" ${has ? 'checked' : ''}>
            <span><strong>${escapeHtml(u.item.name)}</strong> <span class="recipe-muted">(${escapeHtml(formatItemQuantity(u.item))}${u.ing.quantity ? `; recipe: ${escapeHtml(formatIngredientQuantity(u.ing))}` : ''})</span></span>
          </label>
          ${has ? `<div class="cook-use-amt">Use <input type="number" class="ck-use-qty lki-use" min="0" step="any" inputmode="decimal" placeholder="?"> ${escapeHtml(u.item.unit === 'each' ? '' : u.item.unit)}</div>`
                : '<div class="cook-use-amt recipe-muted">Ticked = used it all up</div>'}
        </div>`;
      }).join('') : '<p class="recipe-muted">Nothing from this recipe matched your kitchen.</p>'}
    </div>
    <div class="modal-action-bar"><button type="button" class="btn-primary" id="ck-save">Save</button></div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  attachMealSelect();

  const val = (id) => Math.max(0, parseFloat(document.getElementById(id).value) || 0);
  const fillUses = () => {
    const scale = scaleFor(val('ck-made'));
    document.querySelectorAll('.cook-use').forEach((el) => {
      const u = uses[parseInt(el.dataset.i, 10)];
      const input = el.querySelector('.ck-use-qty');
      if (!input || input.dataset.touched) return;
      const amt = ingredientUseInItemUnit(u.ing, u.item, scale);
      input.value = amt == null ? '' : Math.min(amt, u.item.quantity);
    });
  };
  const DESTS = ['me', 'partner', 'others', 'fridge', 'freezer'];
  const placed = () => DESTS.reduce((t, k) => t + val(`ck-${k}`), 0);
  const check = () => {
    const made = val('ck-made');
    const total = placed();
    const el = document.getElementById('ck-check');
    el.className = 'cook-check' + (total === made ? ' ok' : ' warn');
    const parts = [['me', 'me'], ['partner', partnerName], ['others', 'others'], ['fridge', 'fridge'], ['freezer', 'freezer']]
      .filter(([k]) => val(`ck-${k}`)).map(([k, l]) => `${val(`ck-${k}`)} ${l}`);
    el.textContent = total === made
      ? `✓ All ${made} placed: ${parts.join(' · ')}`
      : total < made ? `${made - total} portion${made - total === 1 ? '' : 's'} still to place` : `${total - made} more than you made`;
    // One dot per portion, coloured by where it goes
    const dots = [];
    DESTS.forEach((k) => { for (let i = 0; i < Math.floor(val(`ck-${k}`)); i++) dots.push(`<span class="pdot pd-${k}"></span>`); });
    for (let i = dots.length; i < made; i++) dots.push('<span class="pdot pd-none"></span>');
    document.getElementById('ck-dots').innerHTML = dots.join('');
    const mine = val('ck-me');
    document.getElementById('ck-me-extra').style.display = mine > 0 ? '' : 'none';
    document.getElementById('ck-mine-kcal').textContent = macros.kcal
      ? `${mine} portion${mine === 1 ? '' : 's'} for ${formatDayLabel(logDate).replace(/ · .*/, '').toLowerCase()} ≈ ${Math.round(macros.kcal * mine)} kcal${macros.protein != null ? ` · ${Math.round(macros.protein * mine)} g protein` : ''}`
      : 'This recipe has no calories yet; you can edit the diary entry after.';
  };
  const bump = (id, d) => {
    const input = document.getElementById(id);
    const next = Math.max(0, (parseFloat(input.value) || 0) + d);
    // When every portion is already placed, adding one somewhere moves it from the fridge
    // (or the freezer, then others); only if there's nowhere to take it from were more made
    if (id !== 'ck-made' && d > 0 && placed() >= val('ck-made')) {
      const donor = ['fridge', 'freezer', 'others'].map((k) => `ck-${k}`).find((k) => k !== id && val(k) > 0);
      if (donor) document.getElementById(donor).value = val(donor) - 1;
      else document.getElementById('ck-made').value = val('ck-made') + d;
    }
    // Making fewer takes them back off the fridge, then the freezer
    if (id === 'ck-made' && d < 0 && placed() > next) {
      for (const k of ['fridge', 'freezer', 'others', 'partner', 'me']) {
        const el = document.getElementById(`ck-${k}`);
        if (val(`ck-${k}`) > 0) { el.value = val(`ck-${k}`) - 1; break; }
      }
    }
    if (id === 'ck-made' && d > 0) document.getElementById('ck-fridge').value = val('ck-fridge') + d;
    input.value = next;
    if (id === 'ck-made') fillUses();
    check();
  };
  document.querySelectorAll('.step-btn').forEach((b) => b.addEventListener('click', () => bump(b.dataset.for, parseInt(b.dataset.d, 10))));
  ['ck-made', ...DESTS.map((k) => `ck-${k}`)].forEach((id) => document.getElementById(id).addEventListener('input', () => {
    if (id === 'ck-made') fillUses();
    check();
  }));
  document.querySelectorAll('.ck-use-qty').forEach((i) => i.addEventListener('input', () => { i.dataset.touched = '1'; }));
  fillUses();
  check();

  document.getElementById('ck-save').addEventListener('click', async (ev) => {
    const btn = ev.currentTarget;
    btn.disabled = true;
    const now = new Date().toISOString();
    const today = localDateString(new Date());
    const fridge = val('ck-fridge');
    const freezer = val('ck-freezer');
    if (placed() > val('ck-made') && !confirm(`That's ${placed()} portions but you made ${val('ck-made')}. Save anyway?`)) { btn.disabled = false; return; }
    const note = `Cooked ${recipe.name}`;

    // 1. Ingredients out of the kitchen
    for (const el of document.querySelectorAll('.cook-use')) {
      if (!el.querySelector('.ck-use-on').checked) continue;
      const u = uses[parseInt(el.dataset.i, 10)];
      const fresh = await dbGet('inventoryItems', u.item.id);
      if (!fresh) continue;
      const qtyInput = el.querySelector('.ck-use-qty');
      if (qtyInput) {
        const use = numOrNull(qtyInput.value);
        if (!use) continue;
        const remaining = Math.round((fresh.quantity - use) * 1000) / 1000;
        if (remaining <= 0) {
          await dbDelete('inventoryItems', fresh.id);
          await logHistory(fresh.id, 'used', use, fresh.location, null, `${note}: used up`);
        } else {
          fresh.quantity = remaining;
          fresh.updatedAt = now;
          await dbPut('inventoryItems', fresh);
          await logHistory(fresh.id, 'used', use, fresh.location, fresh.location, note);
        }
      } else {
        await dbDelete('inventoryItems', fresh.id);
        await logHistory(fresh.id, 'used', null, fresh.location, null, `${note}: used up`);
      }
    }

    // 2. My portion in the food diary
    const mine = val('ck-me');
    if (mine > 0) {
      await addLogEntry({
        date: logDate, meal: selectedMeal(logMeal), name: recipe.name, amount: mine, amountUnit: 'serving',
        kcal: (macros.kcal || 0) * mine,
        protein: macros.protein != null ? macros.protein * mine : null,
        carbs: macros.carbs != null ? macros.carbs * mine : null,
        fat: macros.fat != null ? macros.fat * mine : null,
        source: 'cooked', recipeId: recipe.id, planEntryId
      });
    }

    // 3. Leftover portions
    const leftover = async (count, location, states, days) => {
      if (!count) return;
      const id = await dbPut('inventoryItems', {
        name: recipe.name, quantity: null, unit: 'each', portionCount: count, portionSize: null,
        location, subLocation: null, states, category: 'Ready Meals', isStaple: false,

    setNutrientFields('lo', {

    });

/* ============================================================
   SHOPPING LIST
   One list: what the meal plan needs that isn't in the kitchen, things
   marked running low, and anything typed in. Ticked items go into the
   kitchen in one go.
   Entry: { id, name, quantity, unit, category, checked, source ('plan'|'low'|'manual'),
            note, itemId?, createdAt }
   ============================================================ */
// Units that convert into each other; anything else only adds up with the same unit
const UNIT_BASE = { g: ['g', 1], kg: ['g', 1000], ml: ['ml', 1], L: ['ml', 1000] };

function convertQty(qty, from, to) {
  if (qty == null) return null;
  if ((from || 'each') === (to || 'each')) return qty;
  const a = UNIT_BASE[from];
  const b = UNIT_BASE[to];
  if (a && b && a[0] === b[0]) return (qty * a[1]) / b[1];
  return null;
}

function shoppingQtyText(e) {
  return e.quantity ? formatIngredientQuantity({ quantity: e.quantity, unit: e.unit || '' }) : '';
}

// Adds to the list, merging with an unticked entry of the same name
async function addToShoppingList(entry) {
  const all = await dbGetAll('shoppingList');
  const same = all.find((e) => !e.checked && e.name.toLowerCase() === entry.name.toLowerCase());
  if (same) {
    const add = convertQty(entry.quantity, entry.unit, same.unit);
    if (same.quantity != null && add != null) same.quantity = Math.round((same.quantity + add) * 100) / 100;
    else if (same.quantity == null && entry.quantity != null) { same.quantity = entry.quantity; same.unit = entry.unit; }
    if (entry.note && !(same.note || '').includes(entry.note)) same.note = [same.note, entry.note].filter(Boolean).join(', ');
    if (entry.itemId) same.itemId = entry.itemId;
    return dbPut('shoppingList', same);
  }
  return dbPut('shoppingList', {
    quantity: null, unit: '', category: 'Other', note: '', itemId: null, source: 'manual',
    ...entry, checked: false, createdAt: new Date().toISOString()
  });
}

async function markRunningLow(item) {
  const fresh = await dbGet('inventoryItems', item.id);
  if (!fresh) return;
  if (!fresh.runningLow) {
    fresh.runningLow = true;
    fresh.updatedAt = new Date().toISOString();
    await dbPut('inventoryItems', fresh);
  }
  const onList = (await dbGetAll('shoppingList')).some((e) => !e.checked && (e.itemId === fresh.id || e.name.toLowerCase() === fresh.name.toLowerCase()));
  if (!onList) await addToShoppingList({ name: fresh.name, category: fresh.category || 'Other', source: 'low', note: 'running low', itemId: fresh.id });
  showToast(`${fresh.name} is on your shopping list`);
}

// Where something bought probably goes, and the state it starts in
function guessKitchenPlace(name, category) {
  const n = name.toLowerCase();
  if (/frozen|ice cream/.test(n) || category === 'Ready Meals') return { location: 'freezer', states: ['Frozen'] };
  if (['Protein', 'Vegetables', 'Dairy & Refrigerated'].includes(category) || /milk|yoghurt|yogurt|cheese|butter|cream|egg/.test(n)) {
    return { location: 'fridge', states: category === 'Protein' ? ['Fresh', 'Raw'] : ['Fresh'] };
  }
  if (category === 'Fruit') return { location: 'fridge', states: ['Fresh'] };
  return { location: 'pantry', states: ['Raw'] };
}

/* ---- What the meal plan needs ---- */
async function shoppingNeedsFromPlan() {
  const today = localDateString(new Date());
  const dates = Array.from({ length: 7 }, (_, i) => localDateString(addDays(parseLocalDate(today), i)));
  const [entries, recipes, items, list] = await Promise.all([getPlanEntries(dates), dbGetAll('recipes'), dbGetAll('inventoryItems'), dbGetAll('shoppingList')]);
  const recipesById = new Map(recipes.map((r) => [r.id, r]));
  const index = buildInventoryIndex(items);
  const onList = new Set(list.filter((e) => !e.checked).map((e) => e.name.toLowerCase()));
  const needs = new Map();
  // Each planned recipe is cooked once; leftovers come from the same cook
  for (const e of entries.filter((x) => x.type === 'recipe' && x.recipeId && !x.cooked)) {
    const recipe = recipesById.get(e.recipeId);
    if (!recipe) continue;
    for (const ing of recipe.ingredients || []) {
      if (ing.optional || ing.assumedStaple || findInventoryMatch(ing, index)) continue;
      const key = ing.name.toLowerCase();
      const qty = ing.quantity || null;
      const unit = qty ? ing.unit : '';
      const cur = needs.get(key);
      if (!cur) {
        needs.set(key, { name: ing.name, quantity: qty, unit, category: ing.category || 'Other', recipes: [recipe.name], onList: onList.has(key) });
      } else {
        const add = convertQty(qty, unit, cur.unit);
        if (cur.quantity != null && add != null) cur.quantity = Math.round((cur.quantity + add) * 100) / 100;
        else if (qty != null) cur.quantity = null; // different units: leave the amount to the shopper
        if (!cur.recipes.includes(recipe.name)) cur.recipes.push(recipe.name);
      }
    }
  }
  return [...needs.values()].sort((a, b) => CATEGORIES.indexOf(a.category) - CATEGORIES.indexOf(b.category) || a.name.localeCompare(b.name));
}

  document.getElementById('modal-close').addEventListener('click', closeModal);
  const picked = new Set(needs.map((n, i) => (n.onList ? null : i)).filter((i) => i !== null));
  const addBtn = document.getElementById('sp-add');
  const refresh = () => { if (addBtn) { addBtn.textContent = picked.size ? `Add ${picked.size} to shopping list` : 'Tick items to add'; addBtn.disabled = !picked.size; } };
  document.querySelectorAll('#sp-list .st-row').forEach((row) => {

    });

    for (const i of picked) {
      const n = needs[i];
      await addToShoppingList({ name: n.name, quantity: n.quantity, unit: n.unit, category: n.category, source: 'plan', note: `for ${n.recipes.join(', ')}` });
    }
    closeModal();
    showToast(`Added ${picked.size} item${picked.size === 1 ? '' : 's'}`);
    renderRoute();
  });
}

function attachShoppingListeners() {
  document.getElementById('shop-from-plan').addEventListener('click', openAddFromPlan);
  document.getElementById('shop-share').addEventListener('click', shareShoppingList);
  const input = document.getElementById('shop-new');
  const add = async () => {
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    AppState.recipes = AppState.recipes && AppState.recipes.length ? AppState.recipes : await dbGetAll('recipes');
    const ing = parseIngredientLine(text, [], buildKnownIngredientLookup(null));
    if (!ing) return;
    await addToShoppingList({ name: ing.name.charAt(0).toUpperCase() + ing.name.slice(1), quantity: ing.quantity, unit: ing.unit, category: ing.category, source: 'manual' });
    await renderRoute();
    const again = document.getElementById('shop-new');
    if (again) again.focus();
  };
  document.getElementById('shop-new-add').addEventListener('click', add);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
  document.querySelectorAll('.shop-low').forEach((b) => b.addEventListener('click', async () => {
    const item = await dbGet('inventoryItems', parseInt(b.dataset.itemId, 10));
    if (item) await markRunningLow(item);
    renderRoute();
  }));
  document.querySelectorAll('.shop-row').forEach((row) => {
    const id = parseInt(row.dataset.id, 10);
    row.querySelector('.shop-tick').addEventListener('click', async () => {
      const e = await dbGet('shoppingList', id);
      if (!e) return;
      e.checked = !e.checked;
      await dbPut('shoppingList', e);
      renderRoute();
    });
    row.querySelector('.shop-del').addEventListener('click', async () => {
      await dbDelete('shoppingList', id);
      renderRoute();
    });
  });
  const toKitchen = document.getElementById('shop-to-kitchen');
  if (toKitchen) toKitchen.addEventListener('click', openShoppingToKitchen);
  const clearTicked = document.getElementById('shop-clear-ticked');
  if (clearTicked) clearTicked.addEventListener('click', async () => {
    for (const e of (await dbGetAll('shoppingList')).filter((x) => x.checked)) await dbDelete('shoppingList', e.id);
    renderRoute();
  });
  const clearAll = document.getElementById('shop-clear-all');
  if (clearAll) clearAll.addEventListener('click', async () => {
    if (!confirm('Clear the whole shopping list?')) return;
    await dbClearAndBulkPut('shoppingList', []);
    renderRoute();
  });
}

async function shareShoppingList() {
  const list = (await dbGetAll('shoppingList')).filter((e) => !e.checked);
  if (!list.length) { showToast('Nothing left to buy'); return; }
  const text = CATEGORIES.map((c) => {
    const rows = list.filter((e) => (CATEGORIES.includes(e.category) ? e.category : 'Other') === c);
    return rows.length ? `${c}\n${rows.map((e) => `• ${e.name}${e.quantity ? ` (${shoppingQtyText(e)})` : ''}`).join('\n')}` : '';
  }).filter(Boolean).join('\n\n');
  const full = `Shopping list\n\n${text}`;
  try {
    if (navigator.share) { await navigator.share({ title: 'Shopping list', text: full }); return; }
  } catch (err) {
    if (err && err.name === 'AbortError') return;
  }
  try {
    await navigator.clipboard.writeText(full);
    showToast('List copied: paste it into a message');
  } catch (err) {
    alert(full);
  }
}

/* ---- Ticked items into the kitchen ---- */
async function openShoppingToKitchen() {
  const [list, items] = await Promise.all([dbGetAll('shoppingList'), dbGetAll('inventoryItems')]);
  const ticked = list.filter((e) => e.checked);
  if (!ticked.length) return;
  const rows = ticked.map((e) => {
    const existing = (e.itemId && items.find((i) => i.id === e.itemId)) || items.find((i) => i.name.toLowerCase() === e.name.toLowerCase());
    const place = existing ? { location: existing.location, states: existing.states } : guessKitchenPlace(e.name, e.category);
    const unit = existing && existing.unit ? existing.unit : ITEM_UNITS.includes(e.unit) ? e.unit : 'each';
    const qty = existing ? convertQty(e.quantity, e.unit, existing.unit) : (ITEM_UNITS.includes(e.unit) ? e.quantity : null);
    return { entry: e, existing, location: place.location, states: place.states, unit, quantity: qty };
  });
  openModal(`
    <div class="modal-title-row"><h2>🧺 Into my kitchen</h2><button class="close-btn" id="modal-close">×</button></div>
    <p class="recipe-muted" style="margin-top:0;">Check where each thing goes and how much you bought. Amounts are optional.</p>
    <div class="modal-scroll-area" id="sk-list">
      ${rows.map((r, i) => `
        <div class="sk-row" data-i="${i}">
          <div class="sk-name">${escapeHtml(r.entry.name)}${r.existing ? `<span class="sk-adds">adds to the ${escapeHtml(formatItemQuantity(r.existing))} you have</span>` : ''}</div>
          <div class="sk-fields">
            <input type="number" class="sk-qty" min="0" step="any" inputmode="decimal" placeholder="Amount" value="${r.quantity ?? ''}">
            <select class="sk-unit">${ITEM_UNITS.map((u) => `<option value="${u}" ${u === r.unit ? 'selected' : ''}>${u}</option>`).join('')}</select>
            <select class="sk-loc">${['pantry', 'fridge', 'freezer'].map((l) => `<option value="${l}" ${l === r.location ? 'selected' : ''}>${LOCATION_LABELS[l]}</option>`).join('')}</select>
          </div>
        </div>`).join('')}
    </div>
    <div class="modal-action-bar"><button type="button" class="btn-primary" id="sk-save">Put ${rows.length} item${rows.length === 1 ? '' : 's'} in my kitchen</button></div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('sk-save').addEventListener('click', async (ev) => {
    ev.currentTarget.disabled = true;
    const now = new Date().toISOString();
    for (const el of document.querySelectorAll('#sk-list .sk-row')) {
      const r = rows[parseInt(el.dataset.i, 10)];
      const qty = numOrNull(el.querySelector('.sk-qty').value);
      const unit = el.querySelector('.sk-unit').value;
      const location = el.querySelector('.sk-loc').value;
      const fresh = r.existing ? await dbGet('inventoryItems', r.existing.id) : null;
      if (fresh && fresh.location === location) {
        const add = convertQty(qty, unit, fresh.unit);
        if (fresh.quantity != null && add != null) fresh.quantity = Math.round((fresh.quantity + add) * 1000) / 1000;
        fresh.runningLow = false;
        fresh.purchaseDate = localDateString(new Date());
        fresh.updatedAt = now;
        await dbPut('inventoryItems', fresh);
        await logHistory(fresh.id, 'bought', qty ? `${qty}${unit === 'each' ? '' : ' ' + unit}` : null, location, location, 'From the shopping list');
      } else {
        if (fresh && fresh.runningLow) { fresh.runningLow = false; await dbPut('inventoryItems', fresh); }
        const states = location === r.location ? r.states : location === 'freezer' ? ['Frozen'] : location === 'fridge' ? ['Fresh'] : ['Raw'];
        const suggestion = await getSuggestedUseBy(r.entry.name, states);
        const newId = await dbPut('inventoryItems', {
          name: r.entry.name, quantity: qty, unit, portionCount: null, portionSize: null, location, subLocation: null,
          states, category: r.entry.category || 'Other', isStaple: false, purchaseDate: localDateString(new Date()),
          expiryDate: suggestion ? localDateString(addDays(new Date(), suggestion.suggestedDaysMax)) : null,
          useByOverrideDays: null, cost: null, notes: '', freezerFriendlyRating: null, linkedPurchaseEventId: null,
          runningLow: false, ...typicalItemFields(r.entry.name), createdAt: now, updatedAt: now
        });
        await logHistory(newId, 'created', qty, null, location, 'Bought (shopping list)');
      }
      await dbDelete('shoppingList', r.entry.id);
    }
    closeModal();
    showToast(`Put ${rows.length} item${rows.length === 1 ? '' : 's'} in your kitchen`);
    renderRoute();
  });
}

    renderRoute();
  });

/* ---- Appearance: automatic (follows the phone), light or dark ----
   Saved on this phone only (like the API key), so it applies before the app has loaded its data. */
const THEME_STORAGE = 'pantryfit.theme';
const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

function getThemePref() {
  try { return localStorage.getItem(THEME_STORAGE) || 'auto'; } catch (err) { return 'auto'; }
}

function applyTheme() {
  const pref = getThemePref();
  const dark = pref === 'dark' || (pref === 'auto' && !!darkQuery && darkQuery.matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#121417' : '#F5F4F1');
}

function setThemePref(pref) {
  try {
    if (pref === 'auto') localStorage.removeItem(THEME_STORAGE);
    else localStorage.setItem(THEME_STORAGE, pref);
  } catch (err) { /* private browsing: still switch for this visit */ }
  applyTheme();
}

if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener('change', applyTheme);
applyTheme();

/* ---- Import recipes (additive) ----
   Accepts a recipe file ({ recipes: [...] } or a plain array) or a full backup file.
   Only adds recipes: anything with the same name or built-in id as an existing recipe is skipped. */
async function handleImportRecipesFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  try {
    const parsed = JSON.parse(await file.text());
    const incoming = Array.isArray(parsed) ? parsed
      : Array.isArray(parsed.recipes) ? parsed.recipes
      : (parsed.data && Array.isArray(parsed.data.recipes)) ? parsed.data.recipes
      : null;
    if (!incoming) throw new Error('No recipes found');

    const existing = await dbGetAll('recipes');
    const names = new Set(existing.map((r) => r.name.toLowerCase()));
    const seedIds = new Set(existing.filter((r) => r.seedId).map((r) => r.seedId));
    const now = new Date().toISOString();

    const toAdd = [];
    let skipped = 0;
    for (const raw of incoming) {
      const fields = normalizeRecipe(raw || {});
      const key = fields.name.toLowerCase();
      if (!fields.name || names.has(key) || (raw.seedId && seedIds.has(raw.seedId))) { skipped++; continue; }
      names.add(key);
      toAdd.push({
        ...fields,
        sourceName: typeof raw.sourceName === 'string' ? raw.sourceName : '',
        seedId: null,
        source: 'user',
        userModified: false,
        userRating: toNumberOrNull(raw.userRating),
        partnerRating: toNumberOrNull(raw.partnerRating),
        isFavourite: !!raw.isFavourite,
        createdAt: now,
        updatedAt: now
      });
    }

    if (toAdd.length === 0) {
      alert(skipped ? `All ${skipped} recipes in this file are already in your app.` : 'No recipes found in this file.');
      return;
    }
    const skippedNote = skipped ? ` (${skipped} already in your app will be skipped)` : '';
    if (!confirm(`Add ${toAdd.length} recipe${toAdd.length === 1 ? '' : 's'} from this file${skippedNote}?`)) return;

    for (const r of toAdd) await dbPut('recipes', r);
    showToast(`Added ${toAdd.length} recipe${toAdd.length === 1 ? '' : 's'}`);
  } catch (err) {
    alert('Could not read recipes from this file. Make sure it\'s a PantryFit recipe file.');
  } finally {
    e.target.value = '';
  }
}

async function exportKitchenData() {
  const storeNames = ['inventoryItems', 'inventoryHistory', 'freezerRatingsReference', 'useByReference', 'quickAddTemplates', 'recipes', 'mealPlans', 'foodLog', 'shoppingList', 'batchCookEvents', 'purchaseEvents', 'settings'];
  const backup = { exportedAt: new Date().toISOString(), version: DB_VERSION, data: {} };

  for (const storeName of storeNames) {
    backup.data[storeName] = await dbGetAll(storeName);
  }

  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStamp = localDateString(new Date());
  a.href = url;
  a.download = `pantryfit_backup_${dateStamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}

async function handleImportFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  try {
    const text = await file.text();
    const backup = JSON.parse(text);
    if (!backup.data) throw new Error('Invalid backup file');

    const confirmed = confirm('Importing will replace all current kitchen data with the backup. Continue?');
    if (!confirmed) { e.target.value = ''; return; }

    for (const storeName of Object.keys(backup.data)) {
      if (db.objectStoreNames.contains(storeName)) {
        await dbClearAndBulkPut(storeName, backup.data[storeName]);
      }
    }
    showToast('Kitchen data restored');
    renderRoute();
  } catch (err) {
    alert('Could not read this backup file. Make sure it was exported from PantryFit.');
  } finally {
    e.target.value = '';
  }
}

/* ============================================================
   INSTALL AS AN APP
   Chrome fires beforeinstallprompt when the app can be installed; we keep
   it so an "Install app" button can show the real install dialog.
   ============================================================ */
let deferredInstallPrompt = null;

function isInstalledApp() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (AppState.route === 'home' || AppState.route === 'settings') renderRoute();
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  showToast('Installed. Open PantryFit from your home screen.');
  if (AppState.route === 'home' || AppState.route === 'settings') renderRoute();
});

async function promptInstall() {
  if (!deferredInstallPrompt) {
    alert('To install: tap Chrome\'s ⋮ menu (top right), then "Add to home screen" or "Install app", then "Install".');
    return;
  }
  deferredInstallPrompt.prompt();
  const choice = await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  if (choice && choice.outcome === 'dismissed') showToast('No problem. You can install it later from Settings.');
  renderRoute();
}

function installCardHtml(place) {
  if (isInstalledApp()) {
    return place === 'settings'
      ? '<div class="settings-row"><div><div class="label">📲 Installed as an app</div><div class="desc">You\'re using the home-screen app</div></div><span class="chev">✓</span></div>'
      : '';
  }
  return `
    <button type="button" class="install-card" id="install-btn-${place}">
      <span class="install-title">📲 Install PantryFit</span>
      <span class="install-desc">${deferredInstallPrompt ? 'Add it to your home screen as an app. Works offline.' : 'Add it to your home screen: tap here for how.'}</span>
    </button>`;
}

function attachInstallListener(place) {
  const btn = document.getElementById(`install-btn-${place}`);
  if (btn) btn.addEventListener('click', promptInstall);
}

// Home-screen shortcuts (long-press the app icon) open with ?action=…
function runLaunchAction() {
  const params = new URLSearchParams(window.location.search);
  const action = params.get('action');
  if (!action) return;
  history.replaceState(null, '', window.location.pathname + window.location.hash);
  if (action === 'barcode') { navigateTo('kitchen'); openBarcodeScan(); }
  else if (action === 'stocktake') { navigateTo('kitchen'); openStocktake(); }
  else if (action === 'suggest') { navigateTo('recipes'); openAiSuggest(); }
}

  try {
    if (!window.indexedDB) {
      showFatalError('This browser doesn\'t support local storage (IndexedDB), so PantryFit can\'t save data here. Try opening this file in Safari or Chrome instead of the app you\'re currently using — or better, host it online and open that link.');
      return;
    }
    await openDatabase();
    await seedIfEmpty();
    registerServiceWorker();
    handleHashChange();
    runLaunchAction();
    // First-run setup: let the user pick their goals, cuisines and starter recipes.
    // On an existing install (recipes already in the book), skip the wizard and keep syncing.
    // Tests can skip the wizard with localStorage['pantryfit.skipSetup'] = '1'.
    const existingRecipes = (await dbGetAll('recipes')).length;
    const skipSetup = (() => { try { return localStorage.getItem('pantryfit.skipSetup') === '1'; } catch (_) { return false; } })();
    if (await needsSetup() && !skipSetup) {
      if (existingRecipes === 0) {
        // Fresh install: hold back the automatic seed so the wizard controls it
        await dbPut('settings', { key: 'recipeSeed', version: 0, deletedSeedIds: [], builtInsOff: true });
      } else {
        // Existing user before this update: setup is implicitly done
        await dbPut('settings', { key: 'setupComplete', at: new Date().toISOString() });
      }
      if (existingRecipes === 0) openSetupWizard({ firstRun: true });
    } else if (skipSetup && await needsSetup()) {
      await dbPut('settings', { key: 'setupComplete', at: new Date().toISOString() });
    }
    // Built-in recipes load in the background so a slow network never delays opening the app
    syncRecipeSeed()
      .then((changed) => { if (changed && AppState.route === 'recipes') renderRoute(); })
      .catch(() => {});
  } catch (err) {
    showFatalError('PantryFit couldn\'t start because local storage failed to open. This usually happens when opening the file directly from a Files app. Try opening it in Safari or Chrome, or host it online (e.g. GitHub Pages) and open that link instead.<br><br><span style="opacity:0.7;font-size:11px;">' + (err && err.message ? err.message : String(err)) + '</span>');
  }
})();

function showFatalError(message) {
  document.getElementById('app-content').innerHTML = `
    <div class="empty-state" style="text-align:left;">
      <div class="glyph" style="text-align:center;">⚠</div>
      <h3 style="text-align:center;">Couldn't load your kitchen</h3>
      <p>${message}</p>
    </div>
  `;
  document.getElementById('fab-btn').style.display = 'none';
}

</script>
