async function renderKitchenScreen() {
  const items = await dbGetAll('inventoryItems');
  AppState.inventory = items;

  const filtered = AppState.activeLocationFilter === 'all'
    ? items
    : items.filter((i) => i.location === AppState.activeLocationFilter);

  const tabsHtml = `
    <div class="location-tabs">
      ${['all', 'pantry', 'fridge', 'freezer', 'leftovers'].map((loc) => `
        <button class="loc-tab ${AppState.activeLocationFilter === loc ? 'active' : ''}" data-loc="${loc}">
          ${loc === 'all' ? 'All' : LOCATION_LABELS[loc]}
        </button>
      `).join('')}
    </div>
  `;

  const templates = await dbGetAll('quickAddTemplates');
  const sortedTemplates = templates.sort((a, b) => (b.usageCount || 0) - (a.usageCount || 0));
  const quickAddHtml = sortedTemplates.length === 0 ? '' : `
    <div class="quick-add-row">
      ${sortedTemplates.map((t) => `<button type="button" class="quick-add-chip" data-template-id="${t.id}">+ ${t.name}</button>`).join('')}
    </div>
  `;

  if (filtered.length === 0) {
    return tabsHtml + (items.length ? kitchenSuggestButtonHtml('kitchen-suggest-btn') : '') + quickAddHtml + `
      <div class="empty-state">
        <div class="glyph">🧺</div>
        <h3>No items here yet</h3>
        <p>Tap the + button to add something to your ${AppState.activeLocationFilter === 'all' ? 'kitchen' : LOCATION_LABELS[AppState.activeLocationFilter].toLowerCase()}.</p>
      </div>
    `;
  }

  const sorted = [...filtered].sort((a, b) => {
    const ea = a.expiryDate ? new Date(a.expiryDate).getTime() : Infinity;
    const eb = b.expiryDate ? new Date(b.expiryDate).getTime() : Infinity;
    if (ea !== eb) return ea - eb;
    return a.name.localeCompare(b.name);
  });

  const itemsHtml = sorted.map((item) => {
    const qtyLabel = formatItemQuantity(item);

    const expiryFlag = item.expiryDate
      ? `<div class="expiry-flag">${formatExpiry(item.expiryDate)}</div>`
      : '';

    const states = item.states && item.states.length ? item.states : ['Fresh'];
    const stateTagsHtml = states.map((s) => `<span class="tag ${stateCssClass(s)}">${STATE_LABELS[s] || s}</span>`).join('');
    const stapleBadge = item.isStaple ? `<span class="tag staple-badge">Staple</span>` : '';

    return `
      <div class="item-card loc-${item.location}" data-id="${item.id}">
        <div class="edge"></div>
        <div class="body">
          <div class="top-row">
            <span class="name">${escapeHtml(item.name)}</span>
            <span class="qty">${escapeHtml(qtyLabel)}</span>
          </div>
          <div class="meta-row">
            ${stateTagsHtml}
            ${item.category ? `<span class="tag">${item.category}</span>` : ''}
            ${stapleBadge}
            ${item.runningLow ? '<span class="tag kcal-over">Running low</span>' : ''}
            ${item.caloriesPer100 ? `<span class="tag kcal-tag">${itemCaloriesText(item)}</span>` : ''}
          </div>
          ${expiryFlag}
        </div>
      </div>
    `;
  }).join('');

  return tabsHtml + kitchenSuggestButtonHtml('kitchen-suggest-btn') + quickAddHtml + itemsHtml;
}

function attachKitchenListeners() {

    card.addEventListener('click', () => {

      openItemDetail(id);

  });

  document.querySelectorAll('.quick-add-chip').forEach((chip) => {
    chip.addEventListener('click', async () => {
      const templateId = parseInt(chip.dataset.templateId, 10);
      const template = await dbGet('quickAddTemplates', templateId);
      if (!template) return;

      // Track usage so frequently-used templates float to the front over time
      template.usageCount = (template.usageCount || 0) + 1;
      await dbPut('quickAddTemplates', template);

      openItemForm(null, {
        name: template.name,
        category: template.category,
        unit: template.defaultUnit,
        location: template.defaultLocation,
        states: template.defaultStates,
        portionSize: template.defaultPortionSize,
        isStaple: template.isStaple,
        quantity: '',
        portionCount: '',
        purchaseDate: '',
        expiryDate: '',
        cost: '',
        notes: ''
      });
    });
  });
}

    const isOn = btn.dataset.on === 'true';
    btn.dataset.on = isOn ? 'false' : 'true';
    btn.classList.toggle('on', !isOn);
  });

  document.getElementById('f-name').addEventListener('input', debounce(refreshUseBySuggestion, 400));
  document.getElementById('f-expiryDate').addEventListener('change', () => {
    // If user manually sets an expiry date, treat it as an override of the suggestion
    refreshUseBySuggestion();
  });

  document.getElementById('modal-close').addEventListener('click', closeModal);

  // Calories: typing marks them as entered by hand; the Estimate button asks Claude from the item's name
  const kcalInput = document.getElementById('f-kcal');
  kcalInput.dataset.source = (seed && seed.caloriesSource) || '';
  // Typical values follow the name until calories are typed, estimated or read from a label
  const fillTypical = () => {
    if (kcalInput.value && kcalInput.dataset.source !== 'typical') return;
    const t = typicalNutritionFor(document.getElementById('f-name').value.trim());
    if (!t) {
      if (kcalInput.dataset.source === 'typical') {
        ['f-kcal', 'f-protein', 'f-carbs', 'f-fat'].forEach((id) => { document.getElementById(id).value = ''; });
        kcalInput.dataset.source = '';
        document.getElementById('f-kcal-source').textContent = '(optional)';
      }
      return;
    }
    kcalInput.value = t.caloriesPer100;
    document.getElementById('f-kcal-unit').value = t.caloriesUnit;
    document.getElementById('f-protein').value = t.proteinPer100;
    document.getElementById('f-carbs').value = t.carbsPer100;
    document.getElementById('f-fat').value = t.fatPer100;
    kcalInput.dataset.source = 'typical';
    document.getElementById('f-kcal-source').textContent = '(typical values: change if your pack says different)';
  };
  document.getElementById('f-name').addEventListener('input', debounce(fillTypical, 300));
  if (!item) fillTypical();
  kcalInput.addEventListener('input', () => {
    kcalInput.dataset.source = 'manual';
    document.getElementById('f-kcal-source').textContent = '(entered)';
  });
  document.getElementById('f-kcal-estimate').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    const name = document.getElementById('f-name').value.trim();
    if (!name) { showToast('Enter the item name first'); return; }
    if (!getAiKey()) { showToast('Add your API key in Settings → AI suggestions'); return; }
    btn.disabled = true;
    btn.textContent = 'Estimating…';
    const result = await estimateItemCalories(name, document.getElementById('f-category').value);
    btn.disabled = false;
    btn.textContent = '✨ Estimate';
    if (result.error) { showToast(result.error); return; }
    kcalInput.value = Math.round(result.caloriesPer100);
    kcalInput.dataset.source = 'estimated';
    document.getElementById('f-kcal-unit').value = result.caloriesUnit === 'ml' ? 'ml' : 'g';
    const m = macrosFrom(result);
    document.getElementById('f-protein').value = m.proteinPer100 ?? '';
    document.getElementById('f-carbs').value = m.carbsPer100 ?? '';
    document.getElementById('f-fat').value = m.fatPer100 ?? '';
    document.getElementById('f-kcal-source').textContent = '(estimated)';
  });

  document.getElementById('item-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    await saveItemFromForm(item);
  });

  if (isEdit) {
    document.getElementById('delete-item-btn').addEventListener('click', async () => {
      await deleteItem(item.id, item.name);
    });
  }

  // Run once on open so editing an item with an existing name shows its suggestion immediately
  refreshUseBySuggestion();
}

function debounce(fn, delay) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
}

async function refreshUseBySuggestion() {
  const nameInput = document.getElementById('f-name');
  const box = document.getElementById('use-by-suggestion-box');
  const field = document.getElementById('use-by-suggestion-field');
  const expiryInput = document.getElementById('f-expiryDate');
  if (!nameInput || !box || !field) return;

  const name = nameInput.value.trim();
  if (!name) { field.style.display = 'none'; return; }

  const selectedStates = Array.from(document.querySelectorAll('#f-states button.selected')).map((b) => b.dataset.val);
  const suggestion = await getSuggestedUseBy(name, selectedStates);

  if (!suggestion) { field.style.display = 'none'; return; }

  const rangeLabel = suggestion.suggestedDaysMin === suggestion.suggestedDaysMax
    ? `${suggestion.suggestedDaysMin} day${suggestion.suggestedDaysMin === 1 ? '' : 's'}`
    : `${suggestion.suggestedDaysMin}-${suggestion.suggestedDaysMax} days`;

  field.style.display = 'block';
  box.innerHTML = `
    <span>${rangeLabel} from today${suggestion.notes ? ' — ' + suggestion.notes : ''}</span>
    <button type="button" class="apply-btn" id="apply-use-by-btn">Use this</button>
  `;

  document.getElementById('apply-use-by-btn').addEventListener('click', () => {
    expiryInput.value = localDateString(addDays(new Date(), suggestion.suggestedDaysMax));
  });
}

async function saveItemFromForm(existingItem) {
  const getSelectedLocation = () => {
    const el = document.querySelector('#f-location button.selected');
    return el ? el.dataset.val : null;
  };
  const getSelectedStates = () => Array.from(document.querySelectorAll('#f-states button.selected')).map((b) => b.dataset.val);

  const name = document.getElementById('f-name').value.trim();
  if (!name) return;

  const now = new Date().toISOString();
  const portionCount = document.getElementById('f-portionCount').value;
  const portionSize = document.getElementById('f-portionSize').value.trim();
  const isStaple = document.getElementById('f-staple-toggle').dataset.on === 'true';
  const selectedStates = getSelectedStates();
  const expiryDate = document.getElementById('f-expiryDate').value || null;

  const itemData = {
    name,
    quantity: parseFloat(document.getElementById('f-quantity').value) || null,
    unit: document.getElementById('f-unit').value,
    portionCount: portionCount ? parseInt(portionCount, 10) : null,
    portionSize: portionSize || null,
    location: getSelectedLocation() || 'pantry',
    subLocation: null,
    states: selectedStates.length ? selectedStates : ['Fresh'],
    category: document.getElementById('f-category').value,
    isStaple,
    purchaseDate: document.getElementById('f-purchaseDate').value || null,
    expiryDate,
    useByOverrideDays: null,
    cost: document.getElementById('f-cost').value ? parseFloat(document.getElementById('f-cost').value) : null,
    barcode: existingItem && existingItem.barcode ? existingItem.barcode : null,
    caloriesPer100: parseFloat(document.getElementById('f-kcal').value) || null,
    caloriesUnit: document.getElementById('f-kcal').value ? document.getElementById('f-kcal-unit').value : null,
    caloriesSource: document.getElementById('f-kcal').value ? (document.getElementById('f-kcal').dataset.source || 'manual') : null,
    ...macrosFrom({ proteinPer100: document.getElementById('f-protein').value, carbsPer100: document.getElementById('f-carbs').value, fatPer100: document.getElementById('f-fat').value }),
    notes: document.getElementById('f-notes').value.trim(),
    freezerFriendlyRating: null,
    linkedPurchaseEventId: null,
    runningLow: existingItem ? !!existingItem.runningLow : false,
    recipeId: existingItem ? existingItem.recipeId || null : null,
    updatedAt: now
  };

  const submitBtn = document.querySelector('.modal-action-bar button[type="submit"]');

  try {
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Saving…'; }

    if (existingItem) {
      itemData.id = existingItem.id;
      itemData.createdAt = existingItem.createdAt;
      await dbPut('inventoryItems', itemData);
      await logHistory(existingItem.id, 'adjusted', null, existingItem.location, itemData.location, 'Item details edited');
      showToast('Item updated');
    } else {
      itemData.createdAt = now;
      const newId = await dbPut('inventoryItems', itemData);
      await logHistory(newId, 'created', itemData.quantity, null, itemData.location, 'Item added to kitchen');
      showToast('Item added');
    }

    closeModal();
    renderRoute();
  } catch (err) {
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = existingItem ? 'Save changes' : 'Add to kitchen'; }
    alert('Couldn\'t save this item: ' + (err && err.message ? err.message : 'unknown storage error') + '\n\nYour local storage may be full or restricted by this browser.');
  }
}

async function deleteItem(id, name) {
  await dbDelete('inventoryItems', id);
  await logHistory(id, 'discarded', null, null, null, `Removed: ${name}`);
  closeModal();
  showToast('Item removed');
  renderRoute();
}

function formatHistoryAction(h) {
  const actionVerbs = {
    created: 'Added to kitchen',
    moved: `Moved ${h.fromLocation ? LOCATION_LABELS[h.fromLocation] || h.fromLocation : '?'} → ${h.toLocation ? LOCATION_LABELS[h.toLocation] || h.toLocation : '?'}`,
    used: `Used${h.quantityChanged ? ' ' + h.quantityChanged : ''}`,
    portioned: 'Created freezer portions',
    discarded: 'Discarded',
    bought: `Bought${h.quantityChanged ? ' ' + h.quantityChanged : ''}`,
    cooked: 'Cooked',
    adjusted: 'Edited'
  };
  let label = actionVerbs[h.action] || h.action;
  if (h.notes) label += ` — ${h.notes}`;
  return label;
}

  });
}

// Build a stocktake group: every item shares the group's category, unit, states and staple flag.
// An entry can override its unit or its category after a '|', e.g. 'Crushed tomatoes|can' or 'Nuts|Snacks & Treats'.
function stocktakeGroup(title, category, unit, states, isStaple, names) {
  return {
    title,
    items: names.map((entry) => {
      const [name, override] = entry.split('|');
      const isCategory = CATEGORIES.includes(override);
      return {
        name,
        category: isCategory ? override : category,
        unit: override && !isCategory ? override : unit,
        states,
        isStaple
      };
    })
  };
}

// Stocktake selections live here while the sheet is open, so switching
// Pantry/Fridge/Freezer keeps what's already been ticked.
const Stocktake = { location: 'pantry', selected: {}, custom: { pantry: [], fridge: [], freezer: [] }, existing: new Set() };

function stocktakeKey(location, name) {
  return `${location}|${name.toLowerCase()}`;
}

function stocktakeSelectedCount() {
  return Object.keys(Stocktake.selected).length;
}

function stocktakeRowHtml(location, item) {
  const key = stocktakeKey(location, item.name);
  const have = Stocktake.existing.has(key);
  const sel = Stocktake.selected[key];
  const units = ITEM_UNITS.map((u) => `<option value="${u}" ${(sel ? sel.unit : item.unit) === u ? 'selected' : ''}>${u}</option>`).join('');
  return `
    <div class="st-row ${sel ? 'ticked' : ''} ${have ? 'have' : ''}" data-key="${escapeHtml(key)}">
      <button type="button" class="st-tick" ${have ? 'disabled' : ''}>
        <span class="st-box">${sel || have ? '✓' : ''}</span>
        <span class="st-name">${escapeHtml(item.name)}</span>
        ${have ? '<span class="st-have">In kitchen</span>' : ''}
      </button>
      ${sel ? `
        <div class="st-qty">
          <input type="number" class="st-amount" min="0" step="any" inputmode="decimal" placeholder="Amount" value="${sel.quantity ?? ''}">
          <select class="st-unit">${units}</select>
        </div>` : ''}
    </div>
  `;
}

function renderStocktakeBody() {
  const loc = Stocktake.location;
  const groups = [...STOCKTAKE_LIST[loc]];
  if (Stocktake.custom[loc].length) groups.unshift({ title: 'Your items', items: Stocktake.custom[loc] });

  return `
    <div class="st-add">
      <input type="text" id="st-custom-name" placeholder="Add your own, e.g. Kokum">
      <select id="st-custom-category">
        ${CATEGORIES.map((c) => `<option value="${c}" ${c === 'Other' ? 'selected' : ''}>${c}</option>`).join('')}
      </select>
      <button type="button" class="btn-secondary" id="st-custom-add">+ Add</button>
    </div>
    ${groups.map((g) => `
      <div class="st-group-title">${escapeHtml(g.title)}</div>
      ${g.items.map((item) => stocktakeRowHtml(loc, item)).join('')}
    `).join('')}
  `;
}

function findStocktakeItem(location, key) {
  const all = [...Stocktake.custom[location], ...STOCKTAKE_LIST[location].flatMap((g) => g.items)];
  return all.find((i) => stocktakeKey(location, i.name) === key);
}

function refreshStocktakeSheet() {
  document.getElementById('st-body').innerHTML = renderStocktakeBody();
  document.querySelectorAll('#st-location button').forEach((b) => b.classList.toggle('selected', b.dataset.val === Stocktake.location));
  const count = stocktakeSelectedCount();
  const saveBtn = document.getElementById('st-save');
  saveBtn.textContent = count ? `Add ${count} item${count === 1 ? '' : 's'} to kitchen` : 'Tick items to add';
  saveBtn.disabled = count === 0;
  attachStocktakeBodyListeners();
}

function attachStocktakeBodyListeners() {
  document.querySelectorAll('.st-row').forEach((row) => {
    const key = row.dataset.key;
    row.querySelector('.st-tick').addEventListener('click', () => {
      if (Stocktake.selected[key]) {
        delete Stocktake.selected[key];
      } else {
        const item = findStocktakeItem(Stocktake.location, key);
        if (!item) return;
        Stocktake.selected[key] = { ...item, location: Stocktake.location, quantity: null };
      }
      const scroll = document.getElementById('st-body').scrollTop;
      refreshStocktakeSheet();
      document.getElementById('st-body').scrollTop = scroll;
    });
    const amount = row.querySelector('.st-amount');
    if (amount) {
      amount.addEventListener('input', () => {
        Stocktake.selected[key].quantity = amount.value === '' ? null : parseFloat(amount.value);
      });
      row.querySelector('.st-unit').addEventListener('change', (e) => {
        Stocktake.selected[key].unit = e.target.value;
      });
    }
  });

  document.getElementById('st-custom-add').addEventListener('click', () => {
    const input = document.getElementById('st-custom-name');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    const loc = Stocktake.location;
    const key = stocktakeKey(loc, name);
    if (!findStocktakeItem(loc, key)) {
      const category = document.getElementById('st-custom-category').value;
      const states = loc === 'freezer' ? ['Frozen'] : loc === 'fridge' ? ['Fresh'] : ['Raw'];
      Stocktake.custom[loc].push({ name, category, unit: loc === 'pantry' ? 'g' : 'each', states, isStaple: false });
    }
    if (!Stocktake.existing.has(key) && !Stocktake.selected[key]) {
      Stocktake.selected[key] = { ...findStocktakeItem(loc, key), location: loc, quantity: null };
    }
    refreshStocktakeSheet();
    document.getElementById('st-body').scrollTop = 0;
  });
}

  const items = await dbGetAll('inventoryItems');
  Stocktake.existing = new Set(items.map((i) => stocktakeKey(i.location, i.name)));
  Stocktake.selected = {};
  Stocktake.custom = { pantry: [], fridge: [], freezer: [] };
  if (!STOCKTAKE_LIST[Stocktake.location]) Stocktake.location = 'pantry';

  openModal(`
    <div class="modal-title-row">
      <h2>Stocktake</h2>
      <button class="close-btn" id="modal-close">×</button>
    </div>
    <p class="st-intro">Tick what you have. Amounts are optional, and you can add them later.</p>
    <div class="segmented" id="st-location" style="margin-bottom:10px;">
      ${['pantry', 'fridge', 'freezer'].map((loc) => `<button type="button" data-val="${loc}">${LOCATION_LABELS[loc]}</button>`).join('')}
    </div>
    <div class="modal-scroll-area st-body" id="st-body"></div>
    <div class="modal-action-bar">
      <button type="button" class="btn-primary" id="st-save" disabled>Tick items to add</button>
    </div>
  `);
  document.getElementById('modal-sheet').classList.add('tall');

  document.getElementById('modal-close').addEventListener('click', closeStocktake);
  document.querySelectorAll('#st-location button').forEach((btn) => {
    btn.addEventListener('click', () => {
      Stocktake.location = btn.dataset.val;
      refreshStocktakeSheet();
      document.getElementById('st-body').scrollTop = 0;
    });
  });
  document.getElementById('st-save').addEventListener('click', saveStocktake);
  refreshStocktakeSheet();
}

function closeStocktake() {
  if (stocktakeSelectedCount() && !confirm('Close without adding the ticked items?')) return;
  Stocktake.selected = {};
  closeModal();
}

async function saveStocktake() {
  const picks = Object.values(Stocktake.selected);
  if (!picks.length) return;
  const saveBtn = document.getElementById('st-save');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Adding…';

  try {
    const now = new Date().toISOString();
    for (const pick of picks) {
      // Fresh food gets a suggested use-by date (the longer end of the range); the user can change it later
      const suggestion = await getSuggestedUseBy(pick.name, pick.states);
      const quantity = Number.isFinite(pick.quantity) ? pick.quantity : null;
      const itemData = {
        name: pick.name,
        quantity,
        unit: pick.unit,
        portionCount: null,
        portionSize: null,
        location: pick.location,
        subLocation: null,
        states: pick.states,
        category: pick.category,
        isStaple: !!pick.isStaple,
        purchaseDate: null,
        expiryDate: suggestion ? localDateString(addDays(new Date(), suggestion.suggestedDaysMax)) : null,
        useByOverrideDays: null,
        cost: null,
        notes: '',
        freezerFriendlyRating: null,
        linkedPurchaseEventId: null,
        ...typicalItemFields(pick.name),
        createdAt: now,
        updatedAt: now
      };
      const newId = await dbPut('inventoryItems', itemData);
      await logHistory(newId, 'created', quantity, null, pick.location, 'Added in stocktake');
    }
    Stocktake.selected = {};
    closeModal();
    showToast(`Added ${picks.length} item${picks.length === 1 ? '' : 's'}`);
    renderRoute();
  } catch (err) {
    saveBtn.disabled = false;
    saveBtn.textContent = `Add ${picks.length} items to kitchen`;
    alert('Couldn\'t save the stocktake: ' + (err && err.message ? err.message : 'unknown storage error'));
  }
}

/* ============================================================
   RECIPES
   ============================================================ */
const RECIPE_SEED_URL = './recipes-seed.json';
// Cuisines grouped by region. Order within each region is the order shown in pickers.
const CUISINE_GROUPS = [
  { region: 'South Asian', key: 'south-asian', cuisines: ['Indian', 'Anglo-Indian', 'Indo-Chinese', 'Sri Lankan', 'Pakistani', 'Bangladeshi', 'Nepalese'] },
  { region: 'East Asian', key: 'east-asian', cuisines: ['Chinese', 'Japanese', 'Korean', 'Taiwanese'] },
  { region: 'Southeast Asian', key: 'southeast-asian', cuisines: ['Thai', 'Vietnamese', 'Malaysian', 'Singaporean', 'Indonesian', 'Filipino'] },
  { region: 'Middle Eastern & African', key: 'mideast-africa', cuisines: ['Lebanese', 'Turkish', 'Persian', 'Middle Eastern', 'North African', 'Ethiopian', 'East African', 'West African', 'South African'] },
  { region: 'European', key: 'european', cuisines: ['Italian', 'Greek', 'French', 'Spanish', 'Portuguese', 'British', 'Irish', 'German', 'Eastern European', 'Mediterranean'] },
  { region: 'Americas', key: 'americas', cuisines: ['American', 'Mexican', 'Caribbean', 'Latin American', 'Canadian'] },
  { region: 'Oceania', key: 'oceania', cuisines: ['Australian', 'Pacific Islander'] },
  { region: 'Other', key: 'other', cuisines: ['Western', 'Fusion', 'Other'] }
];
const RECIPE_CUISINES = CUISINE_GROUPS.flatMap((g) => g.cuisines);
const CUISINE_REGION_KEY = Object.fromEntries(CUISINE_GROUPS.flatMap((g) => g.cuisines.map((c) => [c, g.key])));

// Basics like rice or oats don't belong to a cuisine: they're saved with an empty cuisine
const NO_CUISINE_LABEL = 'Basics';

function cuisineOptionsHtml(selected) {
  return `<option value="" ${selected === '' ? 'selected' : ''}>None (basics like rice, oats, toast)</option>` + CUISINE_GROUPS.map((g) => `<optgroup label="${g.region}">${g.cuisines.map((c) => `<option value="${c}" ${selected === c ? 'selected' : ''}>${c}</option>`).join('')}</optgroup>`).join('');
}
const MEAL_TYPES = ['Breakfast', 'Lunch', 'Dinner', 'Snack'];
const DIFFICULTIES = ['Easy', 'Medium', 'Hard'];
const LEVELS = ['Low', 'Medium', 'High'];
const PRIMARY_PROTEINS = ['Chicken', 'Fish', 'Beef', 'Lamb', 'Pork', 'Eggs', 'Legumes', 'None'];
const QUICK_RECIPE_MINUTES = 30;

// Units the ingredient parser recognises; plurals and long forms map to the stored unit.
const RECIPE_UNIT_ALIASES = {
  g: 'g', gram: 'g', grams: 'g', kg: 'kg', ml: 'ml', l: 'L', litre: 'L', litres: 'L',
  tsp: 'tsp', tsps: 'tsp', teaspoon: 'tsp', teaspoons: 'tsp',
  tbsp: 'tbsp', tbsps: 'tbsp', tablespoon: 'tbsp', tablespoons: 'tbsp',
  cup: 'cup', cups: 'cup', clove: 'clove', cloves: 'clove', bunch: 'bunch', bunches: 'bunch',
  sprig: 'sprig', sprigs: 'sprig', pinch: 'pinch', pinches: 'pinch', can: 'can', cans: 'can', each: 'each'
};
const RECIPE_UNIT_PLURALS = { cup: 'cups', clove: 'cloves', bunch: 'bunches', sprig: 'sprigs', pinch: 'pinches', can: 'cans' };

function toNumberOrNull(value) {
  if (value === '' || value === null || value === undefined) return null;
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function normalizeRecipeIngredient(ing) {
  const name = String(ing.name || '').trim();
  const terms = Array.isArray(ing.matchTerms) && ing.matchTerms.length ? ing.matchTerms : [name];
  return {
    name,
    quantity: toNumberOrNull(ing.quantity),
    unit: ing.unit || '',
    category: CATEGORIES.includes(ing.category) ? ing.category : 'Other',
    matchTerms: terms.map((t) => String(t).toLowerCase().trim()).filter(Boolean),
    optional: !!ing.optional,
    assumedStaple: !!ing.assumedStaple,
    prepNote: ing.prepNote || '',
    // Values per 100 g read from the packet (barcode or label), used before typical values
    nutrition: ing.nutrition && ing.nutrition.kcal != null ? {
      kcal: ing.nutrition.kcal, p: ing.nutrition.p ?? null, c: ing.nutrition.c ?? null, f: ing.nutrition.f ?? null, from: ing.nutrition.from || '',
      tsp: ing.nutrition.tsp || null, tbsp: ing.nutrition.tbsp || null // grams in a spoonful of this packet
    } : null
  };
}

// Fills defaults so seed recipes, user recipes and restored backups all have the same shape.
function normalizeRecipe(r) {
  const pick = (value, allowed, fallback) => (allowed.includes(value) ? value : fallback);
  return {
    name: String(r.name || '').trim(),
    cuisine: r.cuisine === '' ? '' : pick(r.cuisine, RECIPE_CUISINES, 'Western'),
    mealTypes: (Array.isArray(r.mealTypes) ? r.mealTypes : []).filter((m) => MEAL_TYPES.includes(m)),
    servings: toNumberOrNull(r.servings),
    prepMinutes: toNumberOrNull(r.prepMinutes),
    cookMinutes: toNumberOrNull(r.cookMinutes),
    difficulty: pick(r.difficulty, DIFFICULTIES, 'Easy'),
    caloriesPerServing: toNumberOrNull(r.caloriesPerServing),
    proteinGramsPerServing: toNumberOrNull(r.proteinGramsPerServing),
    carbsGramsPerServing: toNumberOrNull(r.carbsGramsPerServing),
    fatGramsPerServing: toNumberOrNull(r.fatGramsPerServing),
    proteinLevel: pick(r.proteinLevel, LEVELS, 'Medium'),
    fatLevel: pick(r.fatLevel, LEVELS, 'Medium'),
    primaryProtein: pick(r.primaryProtein, PRIMARY_PROTEINS, 'None'),
    freezerFriendly: !!r.freezerFriendly,
    leftoverFriendly: !!r.leftoverFriendly,
    ingredients: (Array.isArray(r.ingredients) ? r.ingredients : []).map(normalizeRecipeIngredient).filter((i) => i.name),
    method: (Array.isArray(r.method) ? r.method : []).map((s) => String(s).trim()).filter(Boolean),
    notes: r.notes || ''
  };
}

function recipeTotalMinutes(r) {
  return (r.prepMinutes || 0) + (r.cookMinutes || 0);
}

/* ---- Built-in recipe seed ----
   recipes-seed.json carries a version number. When it goes up, new built-in recipes are added
   and untouched ones are refreshed. Recipes the user has edited or deleted are left alone. */
async function syncRecipeSeed() {
  let seed;
  try {
    const res = await fetch(RECIPE_SEED_URL);
    if (!res.ok) return false;
    seed = await res.json();
  } catch (err) {
    return false; // e.g. opened from file:// — the app still works without built-in recipes
  }
  if (!seed || !Array.isArray(seed.recipes) || !seed.version) return false;

  const meta = (await dbGet('settings', 'recipeSeed')) || { key: 'recipeSeed', version: 0, deletedSeedIds: [] };
  if (meta.builtInsOff) return false;
  if (meta.version >= seed.version) return false;

  const existing = await dbGetAll('recipes');
  const bySeedId = new Map(existing.filter((r) => r.seedId).map((r) => [r.seedId, r]));
  const deleted = meta.deletedSeedIds || [];
  const now = new Date().toISOString();

  for (const s of seed.recipes) {
    if (!s.seedId || deleted.includes(s.seedId)) continue;
    const current = bySeedId.get(s.seedId);
    if (current && current.userModified) continue;
    const record = {
      ...normalizeRecipe(s),
      seedId: s.seedId,
      source: 'built-in',
      userModified: false,
      userRating: current ? current.userRating : null,
      partnerRating: current ? current.partnerRating : null,
      isFavourite: current ? !!current.isFavourite : false,
      createdAt: current ? current.createdAt : now,
      updatedAt: now
    };
    if (current) record.id = current.id;
    await dbPut('recipes', record);
  }

  await dbPut('settings', { ...meta, version: seed.version, deletedSeedIds: deleted });
  return true;
}

/* ---- Recipes list screen ---- */
function recipeMatchesFilters(r, f) {
  if (f.cuisine === 'none' ? r.cuisine : f.cuisine !== 'all' && r.cuisine !== f.cuisine) return false;
  if (f.favourites && !r.isFavourite) return false;
  if (f.time && !(recipeTotalMinutes(r) > 0 && recipeTotalMinutes(r) <= f.time)) return false;
  if (f.highProtein || f.lowCarb || f.keto || f.lowFat) {
    const d = recipeDiet(r);
    if ((f.highProtein && !d.highProtein) || (f.lowCarb && !d.lowCarb) || (f.keto && !d.keto) || (f.lowFat && !d.lowFat)) return false;
  }
  if (f.freezer && !r.freezerFriendly) return false;
  const q = f.search.trim().toLowerCase();
  if (q) {
    const haystack = [r.name, r.cuisine, r.primaryProtein, ...(r.ingredients || []).map((i) => i.name)].join(' ').toLowerCase();
    if (!haystack.includes(q)) return false;
  }
  return true;
}

function renderRecipeList() {
  const f = AppState.recipeFilters;
  const index = AppState.inventoryIndex || [];
  const scores = new Map((AppState.recipes || []).map((r) => [r.id, index.length ? scoreRecipe(r, index) : null]));
  // With food in the kitchen: best match, with a boost for recipes that use something about to go off.
  // With an empty kitchen: favourites first, then A–Z.
  const rank = (r) => {
    const sc = scores.get(r.id);
    return sc ? sc.pct + (sc.expiring.length ? 30 : 0) : (r.isFavourite ? 1 : 0);
  };
  const recipes = (AppState.recipes || [])
    .filter((r) => recipeMatchesFilters(r, f))
    .sort((a, b) => rank(b) - rank(a) || a.name.localeCompare(b.name));

  if (recipes.length === 0) {
    const none = (AppState.recipes || []).length === 0;
    return `
      <div class="empty-state">
        <div class="glyph">📖</div>
        <h3>${none ? 'No recipes yet' : 'No recipes match'}</h3>
        <p>${none ? 'Get ideas with <strong>✨ Suggest meals</strong> or <strong>🔎 Search online</strong> above, tap <strong>+</strong> to add your own, or add the 30 starter recipes in Settings.' : 'Try clearing a filter or the search.'}</p>
      </div>
    `;
  }

  return recipes.map((r) => {
    const sc = scores.get(r.id);
    const total = recipeTotalMinutes(r);
    const cuisineClass = 'region-' + (CUISINE_REGION_KEY[r.cuisine] || 'other');
    return `
      <div class="item-card recipe-card ${cuisineClass}" data-recipe-id="${r.id}">
        <div class="edge"></div>
        <div class="body">
          <div class="top-row">
            <span class="name">${r.isFavourite ? '<span class="fav-star">★</span> ' : ''}${escapeHtml(r.name)}</span>
            <span class="qty">${total ? `${total <= 15 ? '⚡ ' : ''}${total} min` : ''}</span>
          </div>
          <div class="meta-row">
            ${sc ? `<span class="tag match-pct ${sc.pct >= 80 ? 'high' : ''}">${sc.pct}% match</span>` : ''}
            ${r.cuisine ? `<span class="tag">${escapeHtml(r.cuisine)}</span>` : ''}
            ${calorieBadgeHtml(r.caloriesPerServing, AppState.healthGoals)}
            ${dietTagsHtml(r)}
            ${r.freezerFriendly ? '<span class="tag state-frozen">Freezes well</span>' : ''}
          </div>
          ${macroLineHtml(recipeMacros(r))}
          ${sc && sc.expiring.length ? `<div class="match-line uses">Uses ${sc.expiring.map((e) => `${escapeHtml(e.name)} (${formatDaysLeft(e.daysLeft)})`).join(', ')}</div>` : ''}
          ${sc && sc.missing.length && sc.pct > 0 ? `<div class="match-line">Need: ${escapeHtml(sc.missing.slice(0, 4).join(', '))}${sc.missing.length > 4 ? ` +${sc.missing.length - 4} more` : ''}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

/* ---- Recipe detail ---- */
function formatIngredientQuantity(ing) {
  if (ing.quantity === null) return '';
  const qty = Number.isInteger(ing.quantity) ? String(ing.quantity) : String(Math.round(ing.quantity * 100) / 100);
  if (!ing.unit || ing.unit === 'each') return qty;
  const unit = ing.quantity > 1 && RECIPE_UNIT_PLURALS[ing.unit] ? RECIPE_UNIT_PLURALS[ing.unit] : ing.unit;
  return `${qty} ${unit}`;
}

/* ---- Spoons & cups, or grams ----
   Recipe pages can show amounts as written (tsp, tbsp, cups, cloves) or as weights in grams
   (millilitres for liquids), using the built-in typical weights. Saved on this phone. */
const MEASURE_STORAGE = 'pantryfit.measure';
function getMeasurePref() {
  try { return localStorage.getItem(MEASURE_STORAGE) === 'grams' ? 'grams' : 'spoons'; } catch (err) { return 'spoons'; }
}
function setMeasurePref(v) {
  try { localStorage.setItem(MEASURE_STORAGE, v); } catch (err) { /* private browsing: just for this visit */ }
}
const LIQUID_RE = /\b(milk|stock|broth|water|juice|cream|oil|sauce|vinegar|coconut milk|wine|yoghurt|yogurt)\b/i;

// An ingredient amount in grams (or ml for liquids), when it's a measure the app can weigh
function metricAmount(ing) {
  if (ing.quantity == null || ['g', 'kg', 'ml', 'L', ''].includes(ing.unit || '')) return null;
  const food = { ...(findFood([ing.name, ...(ing.matchTerms || [])].join(' | ')) || {}), ...(ing.nutrition && ing.nutrition.tbsp ? { tsp: ing.nutrition.tsp, tbsp: ing.nutrition.tbsp } : {}) };
  const grams = gramsOf(ing.quantity, ing.unit || 'each', food);
  if (grams == null) return null;
  const n = grams >= 100 ? Math.round(grams / 5) * 5 : grams >= 10 ? Math.round(grams) : Math.round(grams * 10) / 10;
  return { quantity: n, unit: LIQUID_RE.test(ing.name) ? 'ml' : 'g' };
}

function gramsHint(ing) {
  const m = metricAmount(ing);
  return m ? ` <span class="mw-g">≈ ${m.quantity} ${m.unit}</span>` : '';
}

function amountText(ing) {
  const written = formatIngredientQuantity(ing);
  if (getMeasurePref() !== 'grams') return written;
  const m = metricAmount(ing);
  return m ? `${m.quantity} ${m.unit}` : written;
}

function starRowHtml(field, value) {
  return [1, 2, 3, 4, 5].map((n) => `
    <button type="button" class="star-btn ${value && n <= value ? 'on' : ''}" data-field="${field}" data-value="${n}" aria-label="${n} star${n === 1 ? '' : 's'}">★</button>
  `).join('');
}

async function openRecipeDetail(id) {
  const recipe = await dbGet('recipes', id);
  if (!recipe) return;

  const profiles = await dbGet('settings', 'profiles');
  const partnerName = profiles && profiles.partnerProfile && profiles.partnerProfile.name ? profiles.partnerProfile.name : 'Partner';

  const stat = (label, value) => (value ? `<div class="recipe-stat"><span class="v">${escapeHtml(value)}</span><span class="l">${label}</span></div>` : '');

  const [goals, kitchenItems] = await Promise.all([getHealthGoals(), dbGetAll('inventoryItems')]);
  const index = buildInventoryIndex(kitchenItems);
  // Serves can be changed on this page: ingredient amounts scale with it (the recipe itself isn't changed)
  const baseServes = recipe.servings || null;
  let serves = baseServes;
  const scaled = (ing) => (baseServes && ing.quantity != null ? { ...ing, quantity: ing.quantity * serves / baseServes } : ing);
  // Lower-case names of what's in the kitchen, used to suggest swaps
  const kitchenNames = kitchenItems.map((i) => (i.name || '').toLowerCase());
  const ingredientsListHtml = () => recipe.ingredients.length === 0
    ? '<p class="recipe-muted">No ingredients listed.</p>'
    : `<ul class="ingredient-list">${recipe.ingredients.map((ing, i) => {
      const inKitchen = index.length && findInventoryMatch(ing, index);
      const swapTo = !inKitchen && !ing.assumedStaple && !ing.optional ? suggestSwapFor(ing, kitchenNames) : null;
      return `
        <li>
          <span class="ing-qty">${escapeHtml(amountText(scaled(ing)))}</span>
          <span class="ing-name">${escapeHtml(ing.name)}${ing.prepNote ? `<span class="ing-note">, ${escapeHtml(ing.prepNote)}</span>` : ''}
            ${inKitchen ? '<span class="ing-have">✓ in kitchen</span>' : ''}
            ${swapTo ? `<button type="button" class="ing-swap-chip" data-i="${i}" data-to="${escapeHtml(swapTo)}">💡 Use ${escapeHtml(swapTo)}</button>` : ''}
            ${ing.optional ? '<span class="ing-flag">optional</span>' : ''}
            ${ing.assumedStaple ? '<span class="ing-flag">staple</span>' : ''}
          </span>
        </li>`;
    }).join('')}</ul>`;

  const methodHtml = recipe.method.length === 0
    ? '<p class="recipe-muted">No method added.</p>'
    : `<ol class="method-list">${recipe.method.map((s) => `<li>${escapeHtml(s)}</li>`).join('')}</ol>`;

  const macros = recipeMacros(recipe);
  const macroTile = (cls, label, v, unit) => `<div class="mt ${cls}"><span class="mt-v">${v == null ? '–' : Math.round(v)}<small>${unit}</small></span><span class="mt-l">${label}</span></div>`;
  const macroPanelHtml = `
    <div class="macro-tiles">

async function deleteRecipe(recipe) {
  const builtInNote = recipe.source === 'built-in' ? ' It won\'t be added back by future updates.' : '';
  if (!confirm(`Delete "${recipe.name}"?${builtInNote}`)) return;
  await dbDelete('recipes', recipe.id);
  if (recipe.seedId) {
    const meta = (await dbGet('settings', 'recipeSeed')) || { key: 'recipeSeed', version: 0, deletedSeedIds: [] };
    const deleted = meta.deletedSeedIds || [];
    if (!deleted.includes(recipe.seedId)) deleted.push(recipe.seedId);
    await dbPut('settings', { ...meta, deletedSeedIds: deleted });
  }
  closeModal();
  showToast('Recipe deleted');
  renderRoute();
}

/* ---- Recipe add/edit form ----
   Ingredients are typed one per line, e.g. "500 g chicken thigh, diced (optional)".
   Match words, category and staple flag are filled in automatically: kept from the same ingredient
   if it was already on this recipe, otherwise borrowed from any other recipe using that ingredient. */
function ingredientToLine(ing) {
  const qty = formatIngredientQuantity(ing);
  return [qty, ing.name].filter(Boolean).join(' ')
    + (ing.prepNote ? `, ${ing.prepNote}` : '')
    + (ing.optional ? ' (optional)' : '');
}

function parseQuantity(text) {
  const unicode = { '½': 0.5, '¼': 0.25, '¾': 0.75, '⅓': 1 / 3, '⅔': 2 / 3 };
  if (unicode[text] !== undefined) return unicode[text];
  const mixed = text.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if (mixed) return Number(mixed[1]) + Number(mixed[2]) / Number(mixed[3]);
  const frac = text.match(/^(\d+)\/(\d+)$/);
  if (frac) return Number(frac[1]) / Number(frac[2]);
  return Number(text.replace(',', '.'));
}

function buildKnownIngredientLookup(excludeRecipeId) {
  const lookup = new Map();
  (AppState.recipes || []).forEach((r) => {
    if (r.id === excludeRecipeId) return;
    (r.ingredients || []).forEach((ing) => {
      const key = ing.name.toLowerCase();
      if (!lookup.has(key)) lookup.set(key, ing);
    });
  });
  return lookup;
}

function parseIngredientLine(line, previousIngredients, knownLookup) {
  let text = line.trim();
  if (!text) return null;

  let optional = false;
  if (/\(optional\)\s*$/i.test(text)) {
    optional = true;
    text = text.replace(/\(optional\)\s*$/i, '').trim();
  }

  // "Jasmine rice 240 grams" or "Jasmine rice - 240g": move the amount to the front
  if (!/^[\d½¼¾⅓⅔]/.test(text)) {
    const tail = text.match(/^(.*?[A-Za-z)])[\s,:\-–]+(\d+(?:[.,]\d+)?)\s*([A-Za-z]+)?\.?$/);
    if (tail && (!tail[3] || RECIPE_UNIT_ALIASES[tail[3].toLowerCase()])) text = `${tail[2]} ${tail[3] || ''} ${tail[1]}`.replace(/\s+/g, ' ').trim();
  }

  let quantity = null;
  let unit = '';
  const qtyMatch = text.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔])\s*(.*)$/);
  if (qtyMatch) {
    const parsed = parseQuantity(qtyMatch[1]);
    if (Number.isFinite(parsed)) {
      quantity = parsed;
      text = qtyMatch[2];
      const unitMatch = text.match(/^([A-Za-z]+)\.?\s+(.+)$/);
      if (unitMatch && RECIPE_UNIT_ALIASES[unitMatch[1].toLowerCase()]) {
        unit = RECIPE_UNIT_ALIASES[unitMatch[1].toLowerCase()];
        text = unitMatch[2];
      }
    }
  }

  let prepNote = '';
  const comma = text.indexOf(',');
  if (comma > 0) {
    prepNote = text.slice(comma + 1).trim();
    text = text.slice(0, comma).trim();
  }
  const name = text.trim();
  if (!name) return null;

  const key = name.toLowerCase();
  // Also try the singular form so "2 onions" picks up what's known about "Onion"
  const singular = key.replace(/(?:es|s)$/, '');
  const known = previousIngredients.find((p) => p.name.toLowerCase() === key)
    || knownLookup.get(key) || knownLookup.get(singular) || knownLookup.get(key.replace(/s$/, ''));
  return normalizeRecipeIngredient({
    name, quantity, unit, prepNote, optional,
    nutrition: known ? known.nutrition : null,
    category: known ? known.category : 'Other',
    matchTerms: known ? known.matchTerms : [key],
    assumedStaple: known ? known.assumedStaple : false
  });
}

// Nutrition per serve from what's typed in the recipe form right now
// The ingredient lines typed in the recipe form. A line that's only an amount ("240 grams") is that
// amount of the recipe itself; with no ingredients at all, an amount written in the notes is used the same way.
function recipeFormIngredientLines() {
  const recipeName = document.getElementById('r-name').value.trim();
  const amountOnly = /^\s*(\d+(?:[.,]\d+)?)\s*([A-Za-z]+)?\.?\s*$/;
  let lines = document.getElementById('r-ingredients').value.split('\n').filter((l) => l.trim());
  if (!lines.length && recipeName) {
    const inNotes = (document.getElementById('r-notes').value || '').match(/(\d+(?:[.,]\d+)?)\s*(g|gram|grams|kg|ml|l|litre|litres|cups?)\b/i);
    if (inNotes) lines = [`${inNotes[1]} ${inNotes[2]}`];
  }
  return lines.map((l) => (amountOnly.test(l) && recipeName ? `${l.trim()} ${recipeName}` : l));
}

async function calcRecipeFormNutrition(existing) {
  const previousIngredients = existing ? existing.ingredients : [];
  const knownLookup = buildKnownIngredientLookup(existing ? existing.id : null);
  const ingredients = recipeFormIngredientLines()
    .map((line) => parseIngredientLine(line, previousIngredients, knownLookup))
    .filter(Boolean);
  const servings = parseFloat(document.getElementById('r-servings').value) || 1;
  return nutritionFromIngredients(ingredients, servings, await dbGetAll('inventoryItems'));
}

async function saveRecipeFromForm(existing) {
  const name = document.getElementById('r-name').value.trim();
  if (!name) return;

  // Nothing typed for nutrition: work it out from the ingredients
  const nutritionIds = ['r-calories', 'r-proteinGrams', 'r-carbsGrams', 'r-fatGrams'];
  if (nutritionIds.every((id) => document.getElementById(id).value === '')) {
    const calc = await calcRecipeFormNutrition(existing);
    if (calc.counted.length) {
      const p = calc.perServing;
      [p.kcal, p.protein, p.carbs, p.fat].forEach((v, i) => { document.getElementById(nutritionIds[i]).value = v; });
    }
  }

  const selectedVal = (id) => {
    const el = document.querySelector(`#${id} button.selected`);
    return el ? el.dataset.val : null;
  };
  const previousIngredients = existing ? existing.ingredients : [];
  const knownLookup = buildKnownIngredientLookup(existing ? existing.id : null);
  const ingredients = recipeFormIngredientLines()
    .map((line) => parseIngredientLine(line, previousIngredients, knownLookup))
    .filter(Boolean);

  const fields = normalizeRecipe({
    name,
    cuisine: document.getElementById('r-cuisine').value,
    mealTypes: Array.from(document.querySelectorAll('#r-mealTypes button.selected')).map((b) => b.dataset.val),
    servings: document.getElementById('r-servings').value,
    prepMinutes: document.getElementById('r-prep').value,
    cookMinutes: document.getElementById('r-cook').value,
    difficulty: selectedVal('r-difficulty'),
    caloriesPerServing: document.getElementById('r-calories').value,
    proteinGramsPerServing: document.getElementById('r-proteinGrams').value,
    carbsGramsPerServing: document.getElementById('r-carbsGrams').value,
    fatGramsPerServing: document.getElementById('r-fatGrams').value,
    proteinLevel: selectedVal('r-proteinLevel'),
    fatLevel: selectedVal('r-fatLevel'),
    primaryProtein: document.getElementById('r-primaryProtein').value,
    freezerFriendly: document.getElementById('r-freezer').dataset.on === 'true',
    leftoverFriendly: document.getElementById('r-leftover').dataset.on === 'true',
    ingredients,
    method: document.getElementById('r-method').value.split('\n'),
    notes: document.getElementById('r-notes').value.trim()
  });

  const now = new Date().toISOString();
  const record = existing
    ? { ...existing, ...fields, userModified: existing.source === 'built-in' ? true : !!existing.userModified, updatedAt: now }
    : { ...fields, seedId: null, source: 'user', userModified: false, userRating: null, partnerRating: null, isFavourite: false, createdAt: now, updatedAt: now };

  try {
    const id = await dbPut('recipes', record);
    showToast(existing ? 'Recipe updated' : 'Recipe added');
    renderRoute();
    openRecipeDetail(existing ? existing.id : id);
  } catch (err) {
    alert('Couldn\'t save this recipe: ' + (err && err.message ? err.message : 'unknown storage error'));
  }
}

/* ============================================================
   RECIPE FROM PHOTO
   Screenshots, cookbook pages or handwritten recipes from the gallery
   (or the camera). Claude reads them into the Add recipe form to check.
   ============================================================ */
const RecipePhoto = { photos: [] };

function recipePhotoSchema() {
  const str = { type: 'string' };
  return {
    type: 'object', additionalProperties: false,
    required: ['found', 'name', 'cuisine', 'mealTypes', 'servings', 'prepMinutes', 'cookMinutes', 'caloriesPerServing', 'ingredients', 'method', 'notes'],
    properties: {
      found: { type: 'boolean' },
      name: str,
      cuisine: { type: 'string', enum: ['', ...RECIPE_CUISINES] },
      mealTypes: { type: 'array', items: { type: 'string', enum: MEAL_TYPES } },
      servings: { type: 'integer' },
      prepMinutes: { type: 'integer' },
      cookMinutes: { type: 'integer' },
      caloriesPerServing: { type: 'integer' },
      ingredients: {
        type: 'array',
        items: {
          type: 'object', additionalProperties: false,
          required: ['name', 'quantity', 'unit', 'prepNote', 'optional'],
          properties: {
            name: str,
            quantity: { type: 'number' },
            unit: { type: 'string', enum: ['g', 'kg', 'ml', 'L', 'tsp', 'tbsp', 'cup', 'each', 'clove', 'bunch', 'sprig', 'pinch', 'can', ''] },
            prepNote: str,
            optional: { type: 'boolean' }
          }
        }
      },
      method: { type: 'array', items: str },
      notes: str
    }
  };
}

function openRecipePhoto() {
  if (!getAiKey()) { showToast('Reading recipes from photos uses Claude: add your API key in Settings → AI suggestions'); return; }
  RecipePhoto.photos = [];
  openModal(`
    <div class="modal-title-row"><h2>📸 Recipe from a photo</h2><button class="close-btn" id="modal-close">×</button></div>
    <div class="modal-scroll-area" id="rp-body">
      <p class="st-intro">Pick screenshots or photos of a recipe: a website or post, a cookbook page or a handwritten card. Add each page if it runs over more than one. Claude reads it into a recipe for you to check before saving.</p>
      <div class="ps-thumbs" id="rp-thumbs"></div>
      <p class="ai-error" id="rp-error"></p>
    </div>
    <div class="modal-action-bar"><button type="button" class="btn-primary" id="rp-go" disabled>Add a photo first</button></div>
  `);
  document.getElementById('modal-sheet').classList.add('tall');
  document.getElementById('modal-close').addEventListener('click', closeModal);
  const draw = () => {
    document.getElementById('rp-thumbs').innerHTML = RecipePhoto.photos.map((p, i) => `<div class="ps-thumb"><img src="${p.preview}" alt="Page ${i + 1}"><button type="button" class="ps-remove" data-i="${i}" aria-label="Remove page ${i + 1}">×</button></div>`).join('')
      + (RecipePhoto.photos.length < 4 ? `<label class="ps-add">🖼️<span>${RecipePhoto.photos.length ? 'Add a page' : 'Choose photos'}</span><input type="file" id="rp-file" accept="image/*" multiple hidden></label>` : '');
    document.querySelectorAll('#rp-thumbs .ps-remove').forEach((b) => b.addEventListener('click', () => { RecipePhoto.photos.splice(parseInt(b.dataset.i, 10), 1); draw(); }));
    const input = document.getElementById('rp-file');
    if (input) input.addEventListener('change', async (e) => {
      for (const f of Array.from(e.target.files || []).slice(0, 4 - RecipePhoto.photos.length)) {
        try { RecipePhoto.photos.push(await photoToBase64Jpeg(f)); } catch (err) { showToast(err.message); }
      }
      draw();
    });
    const go = document.getElementById('rp-go');
    go.disabled = !RecipePhoto.photos.length;
    go.textContent = RecipePhoto.photos.length ? `Read the recipe (${RecipePhoto.photos.length} photo${RecipePhoto.photos.length === 1 ? '' : 's'})` : 'Add a photo first';
  };
  draw();
  document.getElementById('rp-go').addEventListener('click', readRecipePhoto);
}

async function readRecipePhoto() {
  const btn = document.getElementById('rp-go');
  btn.disabled = true;
  btn.textContent = 'Reading the recipe…';
  let Anthropic = null;
  let error = null;
  let r = null;
  try {
    const loaded = await getAnthropicClient();
    Anthropic = loaded.Anthropic;
    const response = await loaded.client.beta.messages.create({
      model: AI_MODEL,
      max_tokens: 8000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: { effort: 'medium', format: { type: 'json_schema', schema: recipePhotoSchema() } },
      messages: [{ role: 'user', content: [
        ...RecipePhoto.photos.map((p) => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: p.data } })),
        { type: 'text', text: `These photos show one recipe (a screenshot, a cookbook page or a handwritten card), possibly over several pages in order. Read it exactly as written; don't invent steps or ingredients.
Set found to false if there is no recipe in the photos.
Convert imperial amounts to metric (oz to g, lb to g or kg, fl oz to ml). Fractions become decimals. "To taste" or no amount: quantity 0 and an empty unit.
prepNote holds words like "chopped" or "to serve". Mark ingredients that are optional or "to serve if you like" as optional.
servings: the number it serves (4 if not stated). Times in minutes, 0 if not stated. caloriesPerServing only if the recipe states it, otherwise 0.
cuisine: the closest from the list, or "" for basics that aren't a cuisine (plain rice, porridge). method: one step per item, in order. notes: any tips or the source, briefly.` }
      ] }]
    });
    if (response.stop_reason === 'refusal') error = 'Claude couldn\'t read these photos. Try clearer ones.';
    else {
      r = JSON.parse(response.content.filter((b) => b.type === 'text').map((b) => b.text).join(''));
      if (!r.found || !r.ingredients.length) error = 'No recipe was found in these photos. Try a sharper, closer photo of the ingredients and method.';
    }
  } catch (err) {
    error = err instanceof SyntaxError ? 'Claude\'s reply couldn\'t be read. Please try again.' : describeAiError(err, Anthropic);
  }
  if (!document.getElementById('rp-body')) return;
  if (error) {
    document.getElementById('rp-error').textContent = error;
    btn.disabled = false;
    btn.textContent = 'Try again';
    return;
  }
  // Ingredient names give the category and match words other recipes already use
  AppState.recipes = AppState.recipes && AppState.recipes.length ? AppState.recipes : await dbGetAll('recipes');
  const known = buildKnownIngredientLookup(null);
  const ingredients = r.ingredients.map((i) => {
    const k = known.get(i.name.toLowerCase());
    return { ...i, quantity: i.quantity || null, category: k ? k.category : 'Other', matchTerms: k ? k.matchTerms : [i.name.toLowerCase()], assumedStaple: k ? k.assumedStaple : /^(salt|pepper|oil|water)$/i.test(i.name) };
  });
  openRecipeForm(null, {
    name: r.name, cuisine: r.cuisine, mealTypes: r.mealTypes.length ? r.mealTypes : ['Dinner'], servings: r.servings || 4,
    prepMinutes: r.prepMinutes || null, cookMinutes: r.cookMinutes || null, caloriesPerServing: r.caloriesPerServing || null,
    difficulty: 'Easy', proteinLevel: 'Medium', fatLevel: 'Medium', ingredients, method: r.method, notes: r.notes
  });
  showToast('Check the recipe, then tap Add recipe');
}

/* ============================================================
   MAKE IT MY WAY
   Swap, remove or add ingredients on a recipe (e.g. chicken on the bone
   for breast, a homemade spice mix for a packet mix) and see the
   calories and macros change, then save it as your own version.
   ============================================================ */
// Lighter swaps the app suggests, by what an ingredient is called
const SWAP_IDEAS = [
  { match: /chicken (drumsticks?|thighs?|marylands?|wings?)|whole chicken|on the bone|bone in/i, to: 'chicken breast', why: 'leaner, no bone' },
  { match: /\b(beef|lamb|pork) mince\b|^mince$/i, to: 'lean beef mince', why: 'less fat' },
  { match: /\blamb\b|pork (shoulder|belly)/i, to: 'chicken breast', why: 'much leaner' },
  { match: /thickened cream|^cream$|pouring cream|cooking cream/i, to: 'light cooking cream', why: 'about half the fat' },
  { match: /cream|sour cream/i, to: 'greek yoghurt', why: 'more protein, less fat' },
  { match: /coconut (milk|cream)/i, to: 'light coconut milk', why: 'less than half the fat', skip: /light|lite/i },
  { match: /\b(ghee|butter)\b/i, to: 'olive oil', why: 'less saturated fat', half: true },
  { match: /\boil\b/i, to: null, why: 'use half the oil', half: true },
  { match: /\b(basmati|jasmine|white|brown)? ?rice\b/i, to: 'cauliflower rice', why: 'far fewer carbs', skip: /cauliflower/i },
  { match: /spaghetti|penne|fettuccine|pasta|noodles/i, to: 'zucchini noodles', why: 'far fewer carbs', skip: /zucchini/i },
  { match: /potato/i, to: 'cauliflower', why: 'fewer carbs', skip: /sweet/i },
  { match: /\b(cheese|cheddar|tasty)\b/i, to: 'reduced fat cheese', why: 'less fat', skip: /reduced|light/i },
  { match: /\b(sugar|honey|jaggery)\b/i, to: null, why: 'leave it out', remove: true }
];
const SPICE_WORDS = /turmeric|cumin|coriander (seeds|powder)|ground coriander|garam masala|curry powder|chilli powder|paprika|cardamom|cloves|cinnamon|fenugreek|mustard seeds|fennel|asafoetida|star anise|spices/i;

function swapIdeasFor(ing) {
  return SWAP_IDEAS.filter((s) => s.match.test(ing.name) && !(s.skip && s.skip.test(ing.name)));
}

function ingredientLine(ing) {
  return [formatIngredientQuantity(ing), ing.name].filter(Boolean).join(' ') + (ing.prepNote ? `, ${ing.prepNote}` : '');
}

// Kept between sheets so scanning a packet can come back to the changes made so far
const MyWay = { recipe: null, rows: [], added: [] };

// Heavy ingredients the trimmer may reduce, with a floor that keeps the flavour.
// Checked in order: the first one that drops below its current amount runs first (biggest wins).
const CALORIE_TRIM = [
  { match: /\b(ghee|butter|lard)\b/i, unit: 'tbsp', floor: 1, hint: 'Just enough for the tadka' },
  { match: /^(oil|olive oil|vegetable oil|canola oil|sunflower oil|rice bran oil|grapeseed oil|peanut oil|avocado oil|coconut oil|sesame oil|gingelly oil|mustard oil)$/i, unit: 'tbsp', floor: 1, hint: 'Still enough to cook with' },
  { match: /\bcream\b/i, unit: 'ml', floor: 60, hint: 'A smaller finish of cream' },
  { match: /^coconut milk$|^coconut cream$/i, unit: 'ml', floor: 150, hint: 'Lighter, still coconutty', swapTo: 'light coconut milk' },
  { match: /^cheese$|cheddar|tasty cheese|parmesan|mozzarella/i, unit: 'g', floor: 30, hint: 'Enough to taste' },
  { match: /^(sugar|brown sugar|honey|jaggery|maple syrup)$/i, unit: null, floor: 0, hint: 'Leave the sugar out' }
];

// If the recipe is over its calorie budget, step heavy ingredients down to their floor
// one at a time until it fits (or there's nothing left to trim). Returns the trim steps taken.
function trimForCalories(rows, added, baseKcal, nowKcal, servings, targetKcal) {
  const steps = [];
  if (!nowKcal || !targetKcal || nowKcal <= targetKcal) return steps;
  for (let i = 0; i < 20; i++) {
    const current = rows.filter((r) => !r.removed);
    let best = null;
    for (const row of current) {
      const ing = row.cur;
      const rule = CALORIE_TRIM.find((t) => t.match.test((ing.name || '').trim()));
      if (!rule) continue;
      // Current amount in the unit the floor is in
      const asUnit = (unit) => {
        if (unit === 'tbsp') {
          if (ing.unit === 'tbsp') return ing.quantity;
          if (ing.unit === 'tsp') return ing.quantity / 3;
          const grams = metricAmount(ing);
          return grams ? grams.quantity / UNIT_GRAMS.tbsp : (ing.unit === 'g' ? ing.quantity / UNIT_GRAMS.tbsp : null);
        }
        if (unit === 'ml') return ing.unit === 'ml' ? ing.quantity : ing.unit === 'L' ? ing.quantity * 1000 : null;
        return ing.unit === 'g' ? ing.quantity : ing.unit === 'kg' ? ing.quantity * 1000 : null;
      };
      const current = asUnit(rule.unit);
      const floorGrams = rule.unit === 'tbsp' ? rule.floor * UNIT_GRAMS.tbsp : rule.unit === 'ml' ? rule.floor : rule.floor;
      const currentGrams = rule.unit === 'tbsp' && current != null ? current * UNIT_GRAMS.tbsp : current;
      if (rule.floor === 0) {
        if (!row.removed) best = best && best.saving > 50 ? best : { row, remove: true, saving: 50, rule };
      } else if (currentGrams && currentGrams > floorGrams + 1) {
        // How many calories per gram, from the ingredient's own values if any, otherwise typical
        const food = (ing.nutrition && ing.nutrition.kcal) ? { kcal: ing.nutrition.kcal } : (findFood(ing.name) || {});
        const saving = ((currentGrams - floorGrams) * (food.kcal || 0)) / servings;
        if (saving > 5 && (!best || saving > best.saving)) best = { row, remove: false, floorGrams, saving, rule };
      }
    }
    if (!best) break;
    if (best.remove) { best.row.removed = true; steps.push({ name: best.row.cur.name, action: 'removed', why: best.rule.hint }); continue; }
    const ing = best.row.cur;
    const unit = best.rule.unit || 'tbsp';
    const newQty = best.rule.unit === 'tbsp' ? best.rule.floor : (best.rule.unit === 'ml' ? best.rule.floor : best.rule.floor);
    best.row.cur = normalizeRecipeIngredient({ ...ing, name: best.rule.swapTo || ing.name, quantity: newQty, unit, matchTerms: [(best.rule.swapTo || ing.name).toLowerCase()] });
    steps.push({ name: ing.name, action: 'trimmed', to: `${newQty} ${unit}${best.rule.swapTo ? ` ${best.rule.swapTo}` : ''}`, why: best.rule.hint });
    nowKcal -= best.saving;
    if (nowKcal <= targetKcal) break;
  }
  return steps;
}

async function openMakeItMyWay(recipe, resume = false) {
  const [kitchenItems, goals] = await Promise.all([dbGetAll('inventoryItems'), getHealthGoals()]);
  const serves = recipe.servings || 1;
  const base = recipeMacros(recipe);
  const carryOn = resume && MyWay.recipe && MyWay.recipe.id === recipe.id;
  const rows = carryOn ? MyWay.rows : recipe.ingredients.map((ing) => ({ orig: ing, cur: ing, removed: false, open: false }));
  const added = carryOn ? MyWay.added : [];
  Object.assign(MyWay, { recipe, rows, added });
  const known = buildKnownIngredientLookup(recipe.id);

  // Per-serving macros after the changes. The recipe's own figures are the base; each one is scaled
  // by how much the whole recipe changes using typical values (so a recipe whose own numbers differ
  // from the typical values still moves in proportion and never drops below what's left in it)
  const totals = (list) => nutritionFromIngredients(list, 1, kitchenItems);
  const after = () => {
    const before = totals(rows.map((r) => r.orig));
    const now = totals([...rows.filter((r) => !r.removed).map((r) => r.cur), ...added]);
    const changed = rows.filter((r) => r.removed || r.cur !== r.orig);
    const uncounted = [...new Set([...totals(changed.map((r) => r.orig)).missing, ...totals([...changed.filter((r) => !r.removed).map((r) => r.cur), ...added]).missing])];
    if (!base.kcal) {
      const n = now.perServing;
      return { m: { kcal: n.kcal / serves, protein: n.protein / serves, carbs: n.carbs / serves, fat: n.fat / serves }, uncounted: now.missing };
    }
    const scaled = (k, b) => {
      const was = before.perServing[k];
      const is = now.perServing[k];
      if (b == null) return is / serves;
      return was > 0 ? b * (is / was) : b + is / serves;
    };
    return {
      m: { kcal: scaled('kcal', base.kcal), protein: scaled('protein', base.protein), carbs: scaled('carbs', base.carbs), fat: scaled('fat', base.fat) },
      uncounted
    };
  };
  const spiceRows = () => rows.filter((r) => !r.removed && SPICE_WORDS.test(r.cur.name));
  const changes = () => rows.filter((r) => r.removed || r.cur !== r.orig).length + added.length;

  openModal(`
    <div class="modal-title-row"><h2>🔁 Make it my way</h2><button class="close-btn" id="modal-close">×</button></div>
    <p class="recipe-muted" style="margin-top:0;">${escapeHtml(recipe.name)}: swap, remove or add ingredients. Calories and macros per serve update as you go.</p>
    <div class="myway-macros" id="mw-macros"></div>
    <div class="modal-scroll-area" id="mw-body"></div>
    <div class="modal-action-bar">
      <button type="button" class="btn-primary" id="mw-save-new" disabled>Save as my version</button>
      <button type="button" class="btn-secondary" id="mw-save" disabled>Update this recipe</button>
    </div>
  `);
  document.getElementById('modal-sheet').classList.add('tall');
  document.getElementById('modal-close').addEventListener('click', closeModal);

  const drawMacros = () => {
    const { m, uncounted } = after();
    const cell = (cls, label, b, a, unit) => {
      const diff = b != null && a != null ? Math.round(a) - Math.round(b) : 0;
      return `<div class="mt ${cls}"><span class="mt-v">${a == null ? '–' : Math.round(a)}<small>${unit}</small></span><span class="mt-l">${label}${diff ? ` <b class="${diff < 0 ? 'down' : 'up'}">${diff > 0 ? '+' : ''}${diff}</b>` : ''}</span></div>`;
    };
    document.getElementById('mw-macros').innerHTML = `
      <div class="macro-tiles">
        ${cell('mt-kcal', 'kcal', base.kcal, m.kcal, '')}
        ${cell('mt-protein', 'Protein', base.protein, m.protein, 'g')}
        ${cell('mt-carbs', 'Carbs', base.carbs, m.carbs, 'g')}
        ${cell('mt-fat', 'Fat', base.fat, m.fat, 'g')}
      </div>
      ${uncounted.length ? `<p class="recipe-muted" style="margin:6px 0 0;">Not counted (no typical values): ${escapeHtml(uncounted.join(', '))}</p>` : ''}`;
    const n = changes();
    document.getElementById('mw-save-new').disabled = !n;
    document.getElementById('mw-save').disabled = !n;
  };

  const draw = () => {
    const spices = spiceRows();
    document.getElementById('mw-body').innerHTML = `
      ${(() => {
        const m = after().m;
        const over = base.kcal && goals.caloriesMax && m.kcal > goals.caloriesMax ? Math.round(m.kcal - goals.caloriesMax) : 0;
        return over ? `<div class="cook-box mw-tip"><span>🎯 ${Math.round(m.kcal)} kcal per serve, ${over} over your ${goals.caloriesMax} target.</span><button type="button" class="btn-secondary" id="mw-trim">Match my calories</button></div>` : '';
      })()}
      ${spices.length >= 3 ? `<div class="cook-box mw-tip"><span>🧂 ${spices.length} separate spices. Use a packet mix instead?</span><button type="button" class="btn-secondary" id="mw-spice">Swap for a packet mix</button></div>` : ''}
      ${rows.map((r, i) => {
        const ideas = swapIdeasFor(r.orig);
        return `
        <div class="mw-row ${r.removed ? 'removed' : ''} ${r.cur !== r.orig ? 'swapped' : ''}" data-i="${i}">
          <div class="mw-line">
            <span class="mw-name">${escapeHtml(ingredientLine(r.cur))}${gramsHint(r.cur)}${r.cur !== r.orig && !r.removed ? `<span class="mw-was">was ${escapeHtml(ingredientLine(r.orig))}</span>` : ''}${r.orig.optional ? ' <span class="ing-flag">optional</span>' : ''}</span>
            ${r.removed
              ? '<button type="button" class="link-btn mw-undo">Undo</button>'
              : `<button type="button" class="link-btn mw-swap">${r.cur !== r.orig ? 'Change' : 'Swap'}</button><button type="button" class="mw-del" aria-label="Remove ${escapeHtml(r.cur.name)}">×</button>`}
          </div>
          ${!r.removed && !r.open && r.cur === r.orig && ideas.length ? `<div class="mw-ideas">${ideas.map((s, k) => `<button type="button" class="state-chip mw-idea" data-k="${k}">💡 ${escapeHtml(s.to ? `${s.half ? 'half the amount of ' : ''}${s.to}` : s.why)}${s.to ? ` <span class="mw-why">${escapeHtml(s.why)}</span>` : ''}</button>`).join('')}</div>` : ''}
          ${r.open ? `<div class="st-add mw-edit"><input type="text" class="mw-input" value="${escapeHtml(ingredientLine(r.cur))}" placeholder="e.g. 800 g chicken breast"><button type="button" class="btn-secondary mw-apply">Done</button></div>` : ''}
        </div>`;
      }).join('')}
      ${added.map((ing, i) => `
        <div class="mw-row swapped added" data-a="${i}">
          <div class="mw-line"><span class="mw-name">＋ ${escapeHtml(ingredientLine(ing))}${gramsHint(ing)}${ing.nutrition ? `<span class="mw-was">${ing.nutrition.from === 'label' ? 'from the label' : 'from the barcode'}: ${Math.round(ing.nutrition.kcal)} kcal per 100 g</span>` : ''}</span><button type="button" class="mw-del mw-del-added" aria-label="Remove ${escapeHtml(ing.name)}">×</button></div>
        </div>`).join('')}
      <div class="st-add" style="margin-top:12px;">
        <input type="text" id="mw-new" placeholder="Add an ingredient, e.g. 1 packet curry spice mix">
        <button type="button" class="btn-secondary" id="mw-add">+ Add</button>
      </div>
      <div class="mw-packet">
        <span class="recipe-muted">Using a packet (curry mix, sauce, stock)? Get its real values:</span>
        <div class="field-row" style="gap:8px;">
          <button type="button" class="btn-secondary" id="mw-scan">▦ Scan a packet</button>
          <button type="button" class="btn-secondary" id="mw-label">🏷️ Label photo</button>
        </div>
      </div>`;
    attach();
    drawMacros();
  };

  const parse = (text, prev) => parseIngredientLine(text, prev ? [prev] : [], known);
  const attach = () => {
    document.querySelectorAll('#mw-body .mw-row[data-i]').forEach((el) => {
      const r = rows[parseInt(el.dataset.i, 10)];
      const q = (sel) => el.querySelector(sel);
      if (q('.mw-undo')) q('.mw-undo').addEventListener('click', () => { r.removed = false; draw(); });
      if (q('.mw-del')) q('.mw-del').addEventListener('click', () => { r.removed = true; r.open = false; draw(); });
      if (q('.mw-swap')) q('.mw-swap').addEventListener('click', () => { r.open = !r.open; draw(); });
      el.querySelectorAll('.mw-idea').forEach((b) => b.addEventListener('click', () => {
        const idea = swapIdeasFor(r.orig)[parseInt(b.dataset.k, 10)];
        if (idea.remove) { r.removed = true; draw(); return; }
        const qty = r.orig.quantity != null && idea.half ? Math.round(r.orig.quantity * 50) / 100 : r.orig.quantity;
        const name = idea.to || r.orig.name;
        r.cur = { ...normalizeRecipeIngredient({ ...r.orig, name, quantity: qty, matchTerms: idea.to ? [idea.to] : r.orig.matchTerms }), prepNote: r.orig.prepNote };
        draw();
      }));
      if (q('.mw-apply')) {
        const apply = () => {
          const parsed = parse(q('.mw-input').value, r.orig);
          if (parsed) { r.cur = parsed.name.toLowerCase() === r.orig.name.toLowerCase() && parsed.quantity === r.orig.quantity && parsed.unit === r.orig.unit ? r.orig : parsed; }
          r.open = false;
          draw();
        };
        q('.mw-apply').addEventListener('click', apply);
        q('.mw-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') apply(); });
        q('.mw-input').focus();
      }
    });
    document.querySelectorAll('#mw-body .mw-del-added').forEach((b) => b.addEventListener('click', () => {
      added.splice(parseInt(b.closest('[data-a]').dataset.a, 10), 1);
      draw();
    }));
    const addNew = () => {
      const parsed = parse(document.getElementById('mw-new').value);
      if (!parsed) return;
      added.push(parsed);
      draw();
    };
    document.getElementById('mw-add').addEventListener('click', addNew);
    document.getElementById('mw-new').addEventListener('keydown', (e) => { if (e.key === 'Enter') addNew(); });
    document.getElementById('mw-scan').addEventListener('click', openPacketBarcode);
    document.getElementById('mw-label').addEventListener('click', openPacketLabel);
    const trim = document.getElementById('mw-trim');
    if (trim) trim.addEventListener('click', () => {
      const m = after().m;
      const target = goals.caloriesMax || m.kcal;
      const steps = trimForCalories(rows, added, base.kcal, m.kcal, serves, target);
      draw();
      if (!steps.length) { showToast('Nothing obvious to trim: try removing or swapping ingredients.'); return; }
      showToast(`${steps.map((s) => s.action === 'removed' ? `removed ${s.name}` : `${s.name} → ${s.to}`).join(', ')}`);
    });
    const spice = document.getElementById('mw-spice');
    if (spice) spice.addEventListener('click', () => {
      spiceRows().forEach((r) => { r.removed = true; });
      added.push(parse(`1 each packet ${recipe.cuisine === 'Indian' || recipe.cuisine === 'Anglo-Indian' ? 'curry' : ''} spice mix`.replace(/\s+/g, ' ')));
      draw();
    });
  };

  const save = async (asNew) => {
    const { m } = after();
    const ingredients = [...rows.filter((r) => !r.removed).map((r) => r.cur), ...added];
    const fields = {
      ingredients,
      caloriesPerServing: Math.round(m.kcal) || null,
      proteinGramsPerServing: Math.round(m.protein),
      carbsGramsPerServing: Math.round(m.carbs),
      fatGramsPerServing: Math.round(m.fat),
      proteinLevel: m.protein >= 25 ? 'High' : m.protein >= 12 ? 'Medium' : 'Low',
      fatLevel: m.fat > 20 ? 'High' : m.fat > 12 ? 'Medium' : 'Low',
      updatedAt: new Date().toISOString()
    };
    let id = recipe.id;
    if (asNew) {
      const { id: _old, seedId, ...rest } = recipe;
      id = await dbPut('recipes', { ...rest, ...fields, name: `${recipe.name} (my way)`, seedId: null, source: 'user', userModified: false, userRating: null, partnerRating: null, isFavourite: false, createdAt: fields.updatedAt });
    } else {
      await dbPut('recipes', { ...recipe, ...fields, userModified: recipe.source === 'built-in' ? true : !!recipe.userModified });
    }
    showToast(asNew ? `Saved as "${recipe.name} (my way)"` : 'Recipe updated');
    renderRoute();
    openRecipeDetail(id);
  };
  document.getElementById('mw-save-new').addEventListener('click', () => save(true));
  document.getElementById('mw-save').addEventListener('click', () => save(false));
  draw();
}

/* ---- A packet's real values for Make it my way (curry mix, sauce, stock) ---- */
const Packet = { row: null, photos: [] };

// Puts the packet in the recipe with its own values, in place of a generic "packet mix" if there is one
// What kind of packet it is decides how much a spoonful weighs ("Butter Chicken Spice Mix" is a mix, not the dish)
function packetKind(name) {
  const n = name.toLowerCase();
  const kind = /paste/.test(n) ? 'curry paste' : /sauce/.test(n) ? 'soy sauce' : /stock|broth/.test(n) ? 'stock'
    : /powder|masala|spice|seasoning|mix/.test(n) ? 'spice mix' : null;
  return (kind && findFood(kind)) || findFood(name) || {};
}

async function addPacketToMyWay(name, quantity, unit, per100, from, pantry) {
  const kind = packetKind(name);
  const ing = normalizeRecipeIngredient({
    name, quantity, unit, category: 'Spices & Seasonings', matchTerms: [name.toLowerCase()],
    nutrition: { kcal: per100.kcal, p: per100.p, c: per100.c, f: per100.f, from, tsp: kind.tsp || UNIT_GRAMS.tsp, tbsp: kind.tbsp || UNIT_GRAMS.tbsp }
  });
  // The packet itself goes in the pantry; what the recipe uses comes out of it when it's cooked
  let pantryNote = '';
  if (pantry) {
    const items = await dbGetAll('inventoryItems');
    const existing = items.find((i) => (pantry.barcode && i.barcode === pantry.barcode) || matchWords(i.name) === matchWords(name));
    const now = new Date().toISOString();
    if (existing) {
      if (existing.quantity != null && pantry.grams && existing.unit === 'g') existing.quantity = Math.round((existing.quantity + pantry.grams) * 10) / 10;
      Object.assign(existing, { caloriesPer100: per100.kcal, caloriesUnit: 'g', caloriesSource: from === 'label' ? 'label' : 'database', ...macrosFrom({ proteinPer100: per100.p, carbsPer100: per100.c, fatPer100: per100.f }), updatedAt: now });
      await dbPut('inventoryItems', existing);
      await logHistory(existing.id, 'bought', pantry.grams || null, existing.location, existing.location, 'Packet scanned for a recipe');
    } else {
      const id = await dbPut('inventoryItems', {
        name, quantity: pantry.grams || null, unit: 'g', portionCount: null, portionSize: null, location: 'pantry', subLocation: null,
        states: ['Raw'], category: 'Spices & Seasonings', isStaple: false, purchaseDate: localDateString(new Date()), expiryDate: null,
        useByOverrideDays: null, cost: null, notes: '', freezerFriendlyRating: null, linkedPurchaseEventId: null, barcode: pantry.barcode || null,
        caloriesPer100: per100.kcal, caloriesUnit: 'g', caloriesSource: from === 'label' ? 'label' : 'database',
        ...macrosFrom({ proteinPer100: per100.p, carbsPer100: per100.c, fatPer100: per100.f }), runningLow: false, createdAt: now, updatedAt: now
      });
      await logHistory(id, 'created', pantry.grams || null, null, 'pantry', 'Packet scanned for a recipe');
    }
    pantryNote = ' and the packet to your pantry';
  }
  const generic = MyWay.added.findIndex((a) => !a.nutrition && /mix|packet|paste|sauce|stock/i.test(a.name));
  if (generic >= 0) MyWay.added[generic] = ing; else MyWay.added.push(ing);
  stopBarcodeCamera();
  openMakeItMyWay(MyWay.recipe, true);
  showToast(`Added ${formatIngredientQuantity(ing)} ${name}${pantryNote}`);
}
