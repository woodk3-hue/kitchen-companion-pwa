// Units for kitchen items: metric weights/volumes plus counts for packaged goods
const ITEM_UNITS = ['g', 'kg', 'ml', 'L', 'each', 'can', 'jar', 'bottle', 'pack'];
const COUNT_UNIT_PLURALS = { can: 'cans', jar: 'jars', bottle: 'bottles', pack: 'packs' };

// Item names can be typed by the user, so escape them before they go into innerHTML.
function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// YYYY-MM-DD in local time (toISOString() would shift dates by the UTC offset)
function localDateString(date) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

// "2 cans", "1kg", "6" (each), or "In stock" when no amount was recorded
function formatItemQuantity(item) {
  if (item.portionCount && !item.portionSize) return `${item.portionCount} portion${item.portionCount === 1 ? '' : 's'}`;
  if (item.portionCount) return `${item.portionCount} × ${item.portionSize}`;
  if (item.quantity === null || item.quantity === undefined || item.quantity === 0) return 'In stock';
  const q = Number.isInteger(item.quantity) ? item.quantity : Math.round(item.quantity * 100) / 100;
  if (!item.unit || item.unit === 'each') return String(q);
  if (COUNT_UNIT_PLURALS[item.unit]) return `${q} ${q === 1 ? item.unit : COUNT_UNIT_PLURALS[item.unit]}`;
  return `${q}${item.unit}`;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(dateStr);
  target.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}

function formatExpiry(dateStr) {
  const d = daysUntil(dateStr);
  if (d === null) return '';
  if (d < 0) return `Expired ${Math.abs(d)}d ago`;
  if (d === 0) return 'Expires today';
  if (d === 1) return 'Expires tomorrow';
  return `Expires in ${d}d`;
}

const LOCATION_LABELS = { pantry: 'Pantry', fridge: 'Fridge', freezer: 'Freezer', leftovers: 'Leftovers' };
// STATES_V2 and CATEGORIES are defined earlier (DATABASE section) since the migration logic needs them too.
const STATE_LABELS = {
  Fresh: 'Fresh', Frozen: 'Frozen', Defrosting: 'Defrosting', Raw: 'Raw',
  Cooked: 'Cooked', Leftover: 'Leftover', Opened: 'Opened', Prepared: 'Prepared'
};

function stateCssClass(state) {
  return 'state-' + state.toLowerCase();
}

/* ============================================================
   HOME DASHBOARD
   ============================================================ */
async function renderHomeScreen() {
  const items = await dbGetAll('inventoryItems');

  const counts = { pantry: 0, fridge: 0, freezer: 0, leftovers: 0 };
  items.forEach((item) => { if (counts[item.location] !== undefined) counts[item.location]++; });

  const expiringSoon = items
    .filter((item) => item.expiryDate && daysUntil(item.expiryDate) <= 3)
    .sort((a, b) => daysUntil(a.expiryDate) - daysUntil(b.expiryDate))
    .slice(0, 6);

  const statCardsHtml = Object.keys(counts).map((loc) => `
    <div class="stat-card loc-${loc}">
      <div class="count">${counts[loc]}</div>
      <div class="label">${LOCATION_LABELS[loc]}</div>
    </div>
  `).join('');

  let expiryHtml;
  if (expiringSoon.length === 0) {
    expiryHtml = `
      <div class="empty-state">
        <div class="glyph">✓</div>
        <h3>Nothing expiring soon</h3>
        <p>Items with an expiry date within 3 days will show up here.</p>
      </div>
    `;
  } else {
    expiryHtml = `<div class="expiry-list">` + expiringSoon.map((item) => {
      const d = daysUntil(item.expiryDate);
      const urgent = d <= 1;
      return `
        <div class="expiry-row ${urgent ? 'urgent' : ''}">
          <span class="name">${escapeHtml(item.name)}</span>
          <span class="when">${formatExpiry(item.expiryDate)}</span>
        </div>
      `;
    }).join('') + `</div>`;
  }

  const totalItems = items.length;
  const diaryHtml = await renderTodayDiaryHtml();

  return `
    ${installCardHtml('home')}
    ${diaryHtml}
    <div class="section-heading" style="margin-top:20px;"><h2>Your kitchen</h2></div>
    ${totalItems ? kitchenSuggestButtonHtml('home-suggest-btn') : ''}
    <div class="stat-grid">${statCardsHtml}</div>
    ${totalItems === 0 ? `
      <div class="empty-state">
        <div class="glyph">🧺</div>
        <h3>Your kitchen is empty — for now</h3>
        <p>Head to the Kitchen tab and tap <strong>Stocktake</strong> to tick off what you have.</p>
      </div>
    ` : `
      <div class="section-heading">
        <h2>Expiring soon</h2>
        <span class="count-badge">${expiringSoon.length} item${expiringSoon.length === 1 ? '' : 's'}</span>
      </div>
      ${expiryHtml}
    `}
  `;
}

/* ============================================================
   KITCHEN INVENTORY SCREEN
   ============================================================ */
async function renderKitchenScreen() {
  const items = await dbGetAll('inventoryItems');
  AppState.inventory = items;

  const filtered = AppState.activeLocationFilter === 'all'
    ? items
    : items.filter((i) => i.location === AppState.activeLocationFilter);

  const tabsHtml = `
    <div class="location-tabs">
      ${['all', 'pantry', 'fridge', 'freezer', 'leftovers'].map((loc) => `
        <button class="loc-tab ${AppState.activeLocationFilter === loc ? 'active' : ''}" data-loc="${loc}">
          ${loc === 'all' ? 'All' : LOCATION_LABELS[loc]}
        </button>
      `).join('')}
    </div>
  `;

  const stocktakeHtml = `
    <div class="recipe-online-row">
      <button type="button" class="stocktake-btn" id="stocktake-btn">
        <span class="st-btn-title">📋 Stocktake</span>
        <span class="st-btn-desc">Tick off a list</span>
      </button>
      <button type="button" class="stocktake-btn alt" id="photo-scan-btn">
        <span class="st-btn-title">📸 Photo</span>
        <span class="st-btn-desc">Reads labels</span>
      </button>
      <button type="button" class="stocktake-btn alt2" id="barcode-scan-btn">
        <span class="st-btn-title">▦ Barcode</span>
        <span class="st-btn-desc">Look it up</span>
      </button>
    </div>
  `;

  const templates = await dbGetAll('quickAddTemplates');
  const sortedTemplates = templates.sort((a, b) => (b.usageCount || 0) - (a.usageCount || 0));
  const quickAddHtml = sortedTemplates.length === 0 ? '' : `
    <div class="quick-add-row">
      ${sortedTemplates.map((t) => `<button type="button" class="quick-add-chip" data-template-id="${t.id}">+ ${t.name}</button>`).join('')}
    </div>
  `;

  if (filtered.length === 0) {
    return tabsHtml + stocktakeHtml + (items.length ? kitchenSuggestButtonHtml('kitchen-suggest-btn') : '') + quickAddHtml + `
      <div class="empty-state">
        <div class="glyph">🧺</div>
        <h3>No items here yet</h3>
        <p>Tap the + button to add something to your ${AppState.activeLocationFilter === 'all' ? 'kitchen' : LOCATION_LABELS[AppState.activeLocationFilter].toLowerCase()}.</p>
      </div>
    `;
  }

  const sorted = [...filtered].sort((a, b) => {
    const ea = a.expiryDate ? new Date(a.expiryDate).getTime() : Infinity;
    const eb = b.expiryDate ? new Date(b.expiryDate).getTime() : Infinity;
    if (ea !== eb) return ea - eb;
    return a.name.localeCompare(b.name);
  });

  const itemsHtml = sorted.map((item) => {
    const qtyLabel = formatItemQuantity(item);

    const expiryFlag = item.expiryDate
      ? `<div class="expiry-flag">${formatExpiry(item.expiryDate)}</div>`
      : '';

    const states = item.states && item.states.length ? item.states : ['Fresh'];
    const stateTagsHtml = states.map((s) => `<span class="tag ${stateCssClass(s)}">${STATE_LABELS[s] || s}</span>`).join('');
    const stapleBadge = item.isStaple ? `<span class="tag staple-badge">Staple</span>` : '';

    return `
      <div class="item-card loc-${item.location}" data-id="${item.id}">
        <div class="edge"></div>
        <div class="body">
          <div class="top-row">
            <span class="name">${escapeHtml(item.name)}</span>
            <span class="qty">${escapeHtml(qtyLabel)}</span>
          </div>
          <div class="meta-row">
            ${stateTagsHtml}
            ${item.category ? `<span class="tag">${item.category}</span>` : ''}
            ${stapleBadge}
            ${item.runningLow ? '<span class="tag kcal-over">Running low</span>' : ''}
            ${item.caloriesPer100 ? `<span class="tag kcal-tag">${itemCaloriesText(item)}</span>` : ''}
          </div>
          ${expiryFlag}
        </div>
      </div>
    `;
  }).join('');

  return tabsHtml + stocktakeHtml + kitchenSuggestButtonHtml('kitchen-suggest-btn') + quickAddHtml + itemsHtml;
}

function attachKitchenListeners() {
  document.getElementById('stocktake-btn').addEventListener('click', openStocktake);
  document.getElementById('photo-scan-btn').addEventListener('click', openPhotoScan);
  document.getElementById('barcode-scan-btn').addEventListener('click', openBarcodeScan);
  const suggestBtn = document.getElementById('kitchen-suggest-btn');
  if (suggestBtn) suggestBtn.addEventListener('click', openKitchenSuggestions);

  document.querySelectorAll('.loc-tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      AppState.activeLocationFilter = tab.dataset.loc;
      renderRoute();
    });
  });

  document.querySelectorAll('.item-card').forEach((card) => {
    card.addEventListener('click', () => {
      const id = parseInt(card.dataset.id, 10);
      openItemDetail(id);
    });
  });

  document.querySelectorAll('.quick-add-chip').forEach((chip) => {
    chip.addEventListener('click', async () => {
      const templateId = parseInt(chip.dataset.templateId, 10);
      const template = await dbGet('quickAddTemplates', templateId);
      if (!template) return;

      // Track usage so frequently-used templates float to the front over time
      template.usageCount = (template.usageCount || 0) + 1;
      await dbPut('quickAddTemplates', template);

      openItemForm(null, {
        name: template.name,
        category: template.category,
        unit: template.defaultUnit,
        location: template.defaultLocation,
        states: template.defaultStates,
        portionSize: template.defaultPortionSize,
        isStaple: template.isStaple,
        quantity: '',
        portionCount: '',
        purchaseDate: '',
        expiryDate: '',
        cost: '',
        notes: ''
      });
    });
  });
}

document.getElementById('fab-btn').addEventListener('click', () => {
  if (AppState.route === 'recipes') openRecipeForm(null);
  else openItemForm(null);
});

/* ---- Item Add/Edit Form ---- */
function openItemForm(item, prefill) {
  AppState.editingItemId = item ? item.id : null;
  const isEdit = !!item;
  const seed = item || prefill || null;
  const initialStates = seed && seed.states && seed.states.length ? seed.states : ['Raw'];
  const initialCategory = (seed && CATEGORIES.includes(seed.category)) ? seed.category : 'Other';
  const initialStaple = seed ? !!seed.isStaple : false;

  const html = `
    <div class="modal-title-row">
      <h2>${isEdit ? 'Edit item' : 'Add item'}</h2>
      <button class="close-btn" id="modal-close">×</button>
    </div>
    <form id="item-form">
      <div class="modal-scroll-area">
        <div class="field">
          <label>Name</label>
          <input type="text" id="f-name" value="${seed ? seed.name : ''}" placeholder="e.g. Chicken breast, or a custom ingredient like Kokum" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Quantity</label>
            <input type="number" id="f-quantity" value="${seed && seed.quantity ? seed.quantity : ''}" min="0" step="any" placeholder="Optional">
          </div>
          <div class="field">
            <label>Unit</label>
            <select id="f-unit">
              ${ITEM_UNITS.map((u) => `<option value="${u}" ${seed && seed.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="field">
          <label>Category</label>
          <select id="f-category">
            ${CATEGORIES.map((c) => `<option value="${c}" ${initialCategory === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>

        <div class="field">
          <label>Location</label>
          <div class="segmented" id="f-location">
            ${['pantry', 'fridge', 'freezer', 'leftovers'].map((loc) => `
              <button type="button" data-val="${loc}" class="${seed && seed.location === loc ? 'selected' : (!seed && loc === 'pantry' ? 'selected' : '')}">${LOCATION_LABELS[loc]}</button>
            `).join('')}
          </div>
        </div>

        <div class="field">
          <label>State <span style="text-transform:none;font-weight:500;">(select all that apply)</span></label>
          <div class="state-chip-grid" id="f-states">
            ${STATES_V2.map((s) => `
              <button type="button" data-val="${s}" class="state-chip ${initialStates.includes(s) ? 'selected' : ''}">${STATE_LABELS[s]}</button>
            `).join('')}
          </div>
        </div>

        <div class="staple-toggle-row">
          <div class="label-group">
            <span class="label">Pantry staple</span>
            <span class="desc">Assume this is normally on hand for meal planning</span>
          </div>
          <button type="button" id="f-staple-toggle" class="toggle-switch ${initialStaple ? 'on' : ''}" data-on="${initialStaple ? 'true' : 'false'}"></button>
        </div>

        <div class="field" id="use-by-suggestion-field" style="display:none;">
          <label>Suggested use-by</label>
          <div class="use-by-suggestion" id="use-by-suggestion-box"></div>
        </div>

        <details class="more-fields" ${isEdit ? 'open' : ''}>
          <summary>More details (optional)</summary>
          <div class="more-fields-inner">
            <div class="field-row">
              <div class="field">
                <label>Portions</label>
                <input type="number" id="f-portionCount" value="${seed && seed.portionCount ? seed.portionCount : ''}" min="0" placeholder="e.g. 8">
              </div>
              <div class="field">
                <label>Portion size</label>
                <input type="text" id="f-portionSize" value="${seed && seed.portionSize ? seed.portionSize : ''}" placeholder="e.g. 350g each">
              </div>
            </div>

            <div class="field-row">
              <div class="field">
                <label>Purchase date</label>
                <input type="date" id="f-purchaseDate" value="${seed && seed.purchaseDate ? seed.purchaseDate : ''}">
              </div>
              <div class="field">
                <label>Expiry date <span style="text-transform:none;font-weight:500;">(overrides suggestion)</span></label>
                <input type="date" id="f-expiryDate" value="${seed && seed.expiryDate ? seed.expiryDate : ''}">
              </div>
            </div>

            <div class="field">
              <label>Calories <span style="text-transform:none;font-weight:500;" id="f-kcal-source">${seed && seed.caloriesPer100 && seed.caloriesSource ? '(' + (CALORIE_SOURCE_LABELS[seed.caloriesSource] || 'entered') + ')' : '(optional)'}</span></label>
              <div class="ps-fields" style="padding:0;">
                <input type="number" id="f-kcal" min="0" step="any" inputmode="decimal" placeholder="kcal" value="${seed && seed.caloriesPer100 ? seed.caloriesPer100 : ''}">
                <select id="f-kcal-unit">
                  <option value="g" ${!seed || seed.caloriesUnit !== 'ml' ? 'selected' : ''}>per 100 g</option>
                  <option value="ml" ${seed && seed.caloriesUnit === 'ml' ? 'selected' : ''}>per 100 ml</option>
                </select>
                <button type="button" class="btn-secondary" id="f-kcal-estimate" style="margin-top:0;width:auto;">✨ Estimate</button>
              </div>
              <div class="ps-fields macro-fields" style="padding:0;">
                <input type="number" id="f-protein" min="0" step="any" inputmode="decimal" placeholder="Protein g" value="${seed && seed.proteinPer100 ? seed.proteinPer100 : ''}">
                <input type="number" id="f-carbs" min="0" step="any" inputmode="decimal" placeholder="Carbs g" value="${seed && seed.carbsPer100 ? seed.carbsPer100 : ''}">
                <input type="number" id="f-fat" min="0" step="any" inputmode="decimal" placeholder="Fat g" value="${seed && seed.fatPer100 ? seed.fatPer100 : ''}">
              </div>
            </div>

            <div class="field">
              <label>Cost</label>
              <input type="number" id="f-cost" value="${seed && seed.cost ? seed.cost : ''}" min="0" step="0.01" placeholder="$">
            </div>

            <div class="field">
              <label>Notes</label>
              <textarea id="f-notes" placeholder="Anything else worth noting">${seed ? seed.notes || '' : ''}</textarea>
            </div>
          </div>
        </details>
      </div>

      <div class="modal-action-bar">
        <button type="submit" class="btn-primary">${isEdit ? 'Save changes' : 'Add to kitchen'}</button>
        ${isEdit ? `<button type="button" class="btn-danger" id="delete-item-btn">Remove item</button>` : ''}
      </div>
    </form>
  `;

  openModal(html);

  document.querySelectorAll('#f-location button').forEach((btn) => {
    btn.addEventListener('click', () => {
      btn.parentElement.querySelectorAll('button').forEach((b) => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });

  // State is multi-select: toggle individual chips rather than single-select
  document.querySelectorAll('#f-states button').forEach((btn) => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('selected');
      refreshUseBySuggestion();
    });
  });

  document.getElementById('f-staple-toggle').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    const isOn = btn.dataset.on === 'true';
    btn.dataset.on = isOn ? 'false' : 'true';
    btn.classList.toggle('on', !isOn);
  });

  document.getElementById('f-name').addEventListener('input', debounce(refreshUseBySuggestion, 400));
  document.getElementById('f-expiryDate').addEventListener('change', () => {
    // If user manually sets an expiry date, treat it as an override of the suggestion
    refreshUseBySuggestion();
  });

  document.getElementById('modal-close').addEventListener('click', closeModal);

  // Calories: typing marks them as entered by hand; the Estimate button asks Claude from the item's name
  const kcalInput = document.getElementById('f-kcal');
  kcalInput.dataset.source = (seed && seed.caloriesSource) || '';
  kcalInput.addEventListener('input', () => {
    kcalInput.dataset.source = 'manual';
    document.getElementById('f-kcal-source').textContent = '(entered)';
  });
  document.getElementById('f-kcal-estimate').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    const name = document.getElementById('f-name').value.trim();
    if (!name) { showToast('Enter the item name first'); return; }
    if (!getAiKey()) { showToast('Add your API key in Settings → AI suggestions'); return; }
    btn.disabled = true;
    btn.textContent = 'Estimating…';
    const result = await estimateItemCalories(name, document.getElementById('f-category').value);
    btn.disabled = false;
    btn.textContent = '✨ Estimate';
    if (result.error) { showToast(result.error); return; }
    kcalInput.value = Math.round(result.caloriesPer100);
    kcalInput.dataset.source = 'estimated';
    document.getElementById('f-kcal-unit').value = result.caloriesUnit === 'ml' ? 'ml' : 'g';
    const m = macrosFrom(result);
    document.getElementById('f-protein').value = m.proteinPer100 ?? '';
    document.getElementById('f-carbs').value = m.carbsPer100 ?? '';
    document.getElementById('f-fat').value = m.fatPer100 ?? '';
    document.getElementById('f-kcal-source').textContent = '(estimated)';
  });

  document.getElementById('item-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    await saveItemFromForm(item);
  });

  if (isEdit) {
    document.getElementById('delete-item-btn').addEventListener('click', async () => {
      await deleteItem(item.id, item.name);
    });
  }

  // Run once on open so editing an item with an existing name shows its suggestion immediately
  refreshUseBySuggestion();
}

function debounce(fn, delay) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
}

async function refreshUseBySuggestion() {
  const nameInput = document.getElementById('f-name');
  const box = document.getElementById('use-by-suggestion-box');
  const field = document.getElementById('use-by-suggestion-field');
  const expiryInput = document.getElementById('f-expiryDate');
  if (!nameInput || !box || !field) return;

  const name = nameInput.value.trim();
  if (!name) { field.style.display = 'none'; return; }

  const selectedStates = Array.from(document.querySelectorAll('#f-states button.selected')).map((b) => b.dataset.val);
  const suggestion = await getSuggestedUseBy(name, selectedStates);

  if (!suggestion) { field.style.display = 'none'; return; }

  const rangeLabel = suggestion.suggestedDaysMin === suggestion.suggestedDaysMax
    ? `${suggestion.suggestedDaysMin} day${suggestion.suggestedDaysMin === 1 ? '' : 's'}`
    : `${suggestion.suggestedDaysMin}-${suggestion.suggestedDaysMax} days`;

  field.style.display = 'block';
  box.innerHTML = `
    <span>${rangeLabel} from today${suggestion.notes ? ' — ' + suggestion.notes : ''}</span>
    <button type="button" class="apply-btn" id="apply-use-by-btn">Use this</button>
  `;

  document.getElementById('apply-use-by-btn').addEventListener('click', () => {
    expiryInput.value = localDateString(addDays(new Date(), suggestion.suggestedDaysMax));
  });
}

async function saveItemFromForm(existingItem) {
  const getSelectedLocation = () => {
    const el = document.querySelector('#f-location button.selected');
    return el ? el.dataset.val : null;
  };
  const getSelectedStates = () => Array.from(document.querySelectorAll('#f-states button.selected')).map((b) => b.dataset.val);

  const name = document.getElementById('f-name').value.trim();
  if (!name) return;

  const now = new Date().toISOString();
  const portionCount = document.getElementById('f-portionCount').value;
  const portionSize = document.getElementById('f-portionSize').value.trim();
  const isStaple = document.getElementById('f-staple-toggle').dataset.on === 'true';
  const selectedStates = getSelectedStates();
  const expiryDate = document.getElementById('f-expiryDate').value || null;

  const itemData = {
    name,
    quantity: parseFloat(document.getElementById('f-quantity').value) || null,
    unit: document.getElementById('f-unit').value,
    portionCount: portionCount ? parseInt(portionCount, 10) : null,
    portionSize: portionSize || null,
    location: getSelectedLocation() || 'pantry',
    subLocation: null,
    states: selectedStates.length ? selectedStates : ['Fresh'],
    category: document.getElementById('f-category').value,
    isStaple,
    purchaseDate: document.getElementById('f-purchaseDate').value || null,
    expiryDate,
    useByOverrideDays: null,
    cost: document.getElementById('f-cost').value ? parseFloat(document.getElementById('f-cost').value) : null,
    barcode: existingItem && existingItem.barcode ? existingItem.barcode : null,
    caloriesPer100: parseFloat(document.getElementById('f-kcal').value) || null,
    caloriesUnit: document.getElementById('f-kcal').value ? document.getElementById('f-kcal-unit').value : null,
    caloriesSource: document.getElementById('f-kcal').value ? (document.getElementById('f-kcal').dataset.source || 'manual') : null,
    ...macrosFrom({ proteinPer100: document.getElementById('f-protein').value, carbsPer100: document.getElementById('f-carbs').value, fatPer100: document.getElementById('f-fat').value }),
    notes: document.getElementById('f-notes').value.trim(),
    freezerFriendlyRating: null,
    linkedPurchaseEventId: null,
    runningLow: existingItem ? !!existingItem.runningLow : false,
    recipeId: existingItem ? existingItem.recipeId || null : null,
    updatedAt: now
  };

  const submitBtn = document.querySelector('.modal-action-bar button[type="submit"]');

  try {
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Saving…'; }

    if (existingItem) {
      itemData.id = existingItem.id;
      itemData.createdAt = existingItem.createdAt;
      await dbPut('inventoryItems', itemData);
      await logHistory(existingItem.id, 'adjusted', null, existingItem.location, itemData.location, 'Item details edited');
      showToast('Item updated');
    } else {
      itemData.createdAt = now;
      const newId = await dbPut('inventoryItems', itemData);
      await logHistory(newId, 'created', itemData.quantity, null, itemData.location, 'Item added to kitchen');
      showToast('Item added');
    }

    closeModal();
    renderRoute();
  } catch (err) {
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = existingItem ? 'Save changes' : 'Add to kitchen'; }
    alert('Couldn\'t save this item: ' + (err && err.message ? err.message : 'unknown storage error') + '\n\nYour local storage may be full or restricted by this browser.');
  }
}

async function deleteItem(id, name) {
  await dbDelete('inventoryItems', id);
  await logHistory(id, 'discarded', null, null, null, `Removed: ${name}`);
  closeModal();
  showToast('Item removed');
  renderRoute();
}

/* ---- Item Detail (with history trail) ---- */

  const item = await dbGet('inventoryItems', id);
  if (!item) return;

  const history = await dbGetAll('inventoryHistory', 'inventoryItemId', id);
  const sortedHistory = history.sort((a, b) => new Date(b.date) - new Date(a.date));

  const qtyLabel = formatItemQuantity(item);

  const historyHtml = sortedHistory.length === 0
    ? `<p style="font-size:13px;color:var(--color-ink-soft);">No history yet.</p>`
    : `<div class="history-list">` + sortedHistory.map((h) => `
        <div class="history-row">
          <div class="h-action">${formatHistoryAction(h)}</div>
          <div class="h-date">${new Date(h.date).toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</div>
        </div>
      `).join('') + `</div>`;

  const html = `
    <div class="modal-title-row">
      <h2>${escapeHtml(item.name)}</h2>
      <button class="close-btn" id="modal-close">×</button>
    </div>
    <div class="field-row" style="margin-bottom:10px;flex-wrap:wrap;gap:6px;">
      <span class="tag">${LOCATION_LABELS[item.location]}</span>

      ${item.category ? `<span class="tag">${item.category}</span>` : ''}

// Build a stocktake group: every item shares the group's category, unit, states and staple flag.
// An entry can override its unit or its category after a '|', e.g. 'Crushed tomatoes|can' or 'Nuts|Snacks & Treats'.
function stocktakeGroup(title, category, unit, states, isStaple, names) {
  return {
    title,
    items: names.map((entry) => {
      const [name, override] = entry.split('|');
      const isCategory = CATEGORIES.includes(override);
      return {
        name,
        category: isCategory ? override : category,
        unit: override && !isCategory ? override : unit,
        states,
        isStaple
      };
    })
  };
}

function findStocktakeItem(location, key) {
  const all = [...Stocktake.custom[location], ...STOCKTAKE_LIST[location].flatMap((g) => g.items)];
  return all.find((i) => stocktakeKey(location, i.name) === key);
}

function refreshStocktakeSheet() {
  document.getElementById('st-body').innerHTML = renderStocktakeBody();
  document.querySelectorAll('#st-location button').forEach((b) => b.classList.toggle('selected', b.dataset.val === Stocktake.location));
  const count = stocktakeSelectedCount();
  const saveBtn = document.getElementById('st-save');
  saveBtn.textContent = count ? `Add ${count} item${count === 1 ? '' : 's'} to kitchen` : 'Tick items to add';
  saveBtn.disabled = count === 0;
  attachStocktakeBodyListeners();
}

function attachStocktakeBodyListeners() {
  document.querySelectorAll('.st-row').forEach((row) => {
    const key = row.dataset.key;
    row.querySelector('.st-tick').addEventListener('click', () => {
      if (Stocktake.selected[key]) {
        delete Stocktake.selected[key];
      } else {
        const item = findStocktakeItem(Stocktake.location, key);
        if (!item) return;
        Stocktake.selected[key] = { ...item, location: Stocktake.location, quantity: null };
      }
      const scroll = document.getElementById('st-body').scrollTop;
      refreshStocktakeSheet();
      document.getElementById('st-body').scrollTop = scroll;
    });
    const amount = row.querySelector('.st-amount');
    if (amount) {
      amount.addEventListener('input', () => {
        Stocktake.selected[key].quantity = amount.value === '' ? null : parseFloat(amount.value);
      });
      row.querySelector('.st-unit').addEventListener('change', (e) => {
        Stocktake.selected[key].unit = e.target.value;
      });
    }
  });

  document.getElementById('st-custom-add').addEventListener('click', () => {
    const input = document.getElementById('st-custom-name');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    const loc = Stocktake.location;
    const key = stocktakeKey(loc, name);
    if (!findStocktakeItem(loc, key)) {
      const category = document.getElementById('st-custom-category').value;
      const states = loc === 'freezer' ? ['Frozen'] : loc === 'fridge' ? ['Fresh'] : ['Raw'];
      Stocktake.custom[loc].push({ name, category, unit: loc === 'pantry' ? 'g' : 'each', states, isStaple: false });
    }
    if (!Stocktake.existing.has(key) && !Stocktake.selected[key]) {
      Stocktake.selected[key] = { ...findStocktakeItem(loc, key), location: loc, quantity: null };
    }
    refreshStocktakeSheet();
    document.getElementById('st-body').scrollTop = 0;
  });
}

async function saveStocktake() {
  const picks = Object.values(Stocktake.selected);
  if (!picks.length) return;
  const saveBtn = document.getElementById('st-save');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Adding…';

  try {
    const now = new Date().toISOString();
    for (const pick of picks) {
      // Fresh food gets a suggested use-by date (the longer end of the range); the user can change it later
      const suggestion = await getSuggestedUseBy(pick.name, pick.states);
      const quantity = Number.isFinite(pick.quantity) ? pick.quantity : null;
      const itemData = {
        name: pick.name,
        quantity,
        unit: pick.unit,
        portionCount: null,
        portionSize: null,
        location: pick.location,
        subLocation: null,
        states: pick.states,
        category: pick.category,
        isStaple: !!pick.isStaple,
        purchaseDate: null,
        expiryDate: suggestion ? localDateString(addDays(new Date(), suggestion.suggestedDaysMax)) : null,
        useByOverrideDays: null,
        cost: null,
        notes: '',
        freezerFriendlyRating: null,
        linkedPurchaseEventId: null,
        createdAt: now,
        updatedAt: now
      };
      const newId = await dbPut('inventoryItems', itemData);
      await logHistory(newId, 'created', quantity, null, pick.location, 'Added in stocktake');
    }
    Stocktake.selected = {};
    closeModal();
    showToast(`Added ${picks.length} item${picks.length === 1 ? '' : 's'}`);
    renderRoute();
  } catch (err) {
    saveBtn.disabled = false;
    saveBtn.textContent = `Add ${picks.length} items to kitchen`;
    alert('Couldn\'t save the stocktake: ' + (err && err.message ? err.message : 'unknown storage error'));
  }
}

const RECIPE_SEED_URL = './recipes-seed.json';
// Cuisines grouped by region. Order within each region is the order shown in pickers.

  { region: 'South Asian', key: 'south-asian', cuisines: ['Indian', 'Anglo-Indian', 'Indo-Chinese', 'Sri Lankan', 'Pakistani', 'Bangladeshi', 'Nepalese'] },
  { region: 'East Asian', key: 'east-asian', cuisines: ['Chinese', 'Japanese', 'Korean', 'Taiwanese'] },
  { region: 'Southeast Asian', key: 'southeast-asian', cuisines: ['Thai', 'Vietnamese', 'Malaysian', 'Singaporean', 'Indonesian', 'Filipino'] },
  { region: 'Middle Eastern & African', key: 'mideast-africa', cuisines: ['Lebanese', 'Turkish', 'Persian', 'Middle Eastern', 'North African', 'Ethiopian', 'East African', 'West African', 'South African'] },
  { region: 'European', key: 'european', cuisines: ['Italian', 'Greek', 'French', 'Spanish', 'Portuguese', 'British', 'Irish', 'German', 'Eastern European', 'Mediterranean'] },
  { region: 'Americas', key: 'americas', cuisines: ['American', 'Mexican', 'Caribbean', 'Latin American', 'Canadian'] },
  { region: 'Oceania', key: 'oceania', cuisines: ['Australian', 'Pacific Islander'] },
  { region: 'Other', key: 'other', cuisines: ['Western', 'Fusion'] }
];
const RECIPE_CUISINES = CUISINE_GROUPS.flatMap((g) => g.cuisines);
const CUISINE_REGION_KEY = Object.fromEntries(CUISINE_GROUPS.flatMap((g) => g.cuisines.map((c) => [c, g.key])));

function cuisineOptionsHtml(selected) {
  return CUISINE_GROUPS.map((g) => `<optgroup label="${g.region}">${g.cuisines.map((c) => `<option value="${c}" ${selected === c ? 'selected' : ''}>${c}</option>`).join('')}</optgroup>`).join('');
}
const MEAL_TYPES = ['Breakfast', 'Lunch', 'Dinner', 'Snack'];
const DIFFICULTIES = ['Easy', 'Medium', 'Hard'];
const LEVELS = ['Low', 'Medium', 'High'];
const PRIMARY_PROTEINS = ['Chicken', 'Fish', 'Beef', 'Lamb', 'Pork', 'Eggs', 'Legumes', 'None'];
const QUICK_RECIPE_MINUTES = 30;

// Units the ingredient parser recognises; plurals and long forms map to the stored unit.
const RECIPE_UNIT_ALIASES = {
  g: 'g', gram: 'g', grams: 'g', kg: 'kg', ml: 'ml', l: 'L', litre: 'L', litres: 'L',
  tsp: 'tsp', tsps: 'tsp', teaspoon: 'tsp', teaspoons: 'tsp',
  tbsp: 'tbsp', tbsps: 'tbsp', tablespoon: 'tbsp', tablespoons: 'tbsp',
  cup: 'cup', cups: 'cup', clove: 'clove', cloves: 'clove', bunch: 'bunch', bunches: 'bunch',
  sprig: 'sprig', sprigs: 'sprig', pinch: 'pinch', pinches: 'pinch', can: 'can', cans: 'can', each: 'each'
};
const RECIPE_UNIT_PLURALS = { cup: 'cups', clove: 'cloves', bunch: 'bunches', sprig: 'sprigs', pinch: 'pinches', can: 'cans' };

function toNumberOrNull(value) {
  if (value === '' || value === null || value === undefined) return null;
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function normalizeRecipeIngredient(ing) {
  const name = String(ing.name || '').trim();
  const terms = Array.isArray(ing.matchTerms) && ing.matchTerms.length ? ing.matchTerms : [name];
  return {
    name,
    quantity: toNumberOrNull(ing.quantity),
    unit: ing.unit || '',
    category: CATEGORIES.includes(ing.category) ? ing.category : 'Other',
    matchTerms: terms.map((t) => String(t).toLowerCase().trim()).filter(Boolean),
    optional: !!ing.optional,
    assumedStaple: !!ing.assumedStaple,
    prepNote: ing.prepNote || ''
  };
}

// Fills defaults so seed recipes, user recipes and restored backups all have the same shape.
function normalizeRecipe(r) {
  const pick = (value, allowed, fallback) => (allowed.includes(value) ? value : fallback);
  return {
    name: String(r.name || '').trim(),
    cuisine: pick(r.cuisine, RECIPE_CUISINES, 'Western'),
    mealTypes: (Array.isArray(r.mealTypes) ? r.mealTypes : []).filter((m) => MEAL_TYPES.includes(m)),
    servings: toNumberOrNull(r.servings),
    prepMinutes: toNumberOrNull(r.prepMinutes),
    cookMinutes: toNumberOrNull(r.cookMinutes),
    difficulty: pick(r.difficulty, DIFFICULTIES, 'Easy'),
    caloriesPerServing: toNumberOrNull(r.caloriesPerServing),
    proteinGramsPerServing: toNumberOrNull(r.proteinGramsPerServing),
    carbsGramsPerServing: toNumberOrNull(r.carbsGramsPerServing),
    fatGramsPerServing: toNumberOrNull(r.fatGramsPerServing),
    proteinLevel: pick(r.proteinLevel, LEVELS, 'Medium'),
    fatLevel: pick(r.fatLevel, LEVELS, 'Medium'),
    primaryProtein: pick(r.primaryProtein, PRIMARY_PROTEINS, 'None'),
    freezerFriendly: !!r.freezerFriendly,
    leftoverFriendly: !!r.leftoverFriendly,
    ingredients: (Array.isArray(r.ingredients) ? r.ingredients : []).map(normalizeRecipeIngredient).filter((i) => i.name),
    method: (Array.isArray(r.method) ? r.method : []).map((s) => String(s).trim()).filter(Boolean),
    notes: r.notes || ''
  };
}

function recipeTotalMinutes(r) {
  return (r.prepMinutes || 0) + (r.cookMinutes || 0);
}

/* ---- Built-in recipe seed ----
   recipes-seed.json carries a version number. When it goes up, new built-in recipes are added
   and untouched ones are refreshed. Recipes the user has edited or deleted are left alone. */
async function syncRecipeSeed() {
  let seed;
  try {
    const res = await fetch(RECIPE_SEED_URL);
    if (!res.ok) return false;
    seed = await res.json();
  } catch (err) {
    return false; // e.g. opened from file:// — the app still works without built-in recipes
  }
  if (!seed || !Array.isArray(seed.recipes) || !seed.version) return false;

  const meta = (await dbGet('settings', 'recipeSeed')) || { key: 'recipeSeed', version: 0, deletedSeedIds: [] };
  if (meta.builtInsOff) return false;
  if (meta.version >= seed.version) return false;

  const existing = await dbGetAll('recipes');
  const bySeedId = new Map(existing.filter((r) => r.seedId).map((r) => [r.seedId, r]));
  const deleted = meta.deletedSeedIds || [];
  const now = new Date().toISOString();

  for (const s of seed.recipes) {
    if (!s.seedId || deleted.includes(s.seedId)) continue;
    const current = bySeedId.get(s.seedId);
    if (current && current.userModified) continue;
    const record = {
      ...normalizeRecipe(s),
      seedId: s.seedId,
      source: 'built-in',
      userModified: false,
      userRating: current ? current.userRating : null,
      partnerRating: current ? current.partnerRating : null,
      isFavourite: current ? !!current.isFavourite : false,
      createdAt: current ? current.createdAt : now,
      updatedAt: now
    };
    if (current) record.id = current.id;
    await dbPut('recipes', record);
  }

  await dbPut('settings', { ...meta, version: seed.version, deletedSeedIds: deleted });
  return true;
}

/* ---- Recipes list screen ---- */
function recipeMatchesFilters(r, f) {
  if (f.cuisine !== 'all' && r.cuisine !== f.cuisine) return false;
  if (f.favourites && !r.isFavourite) return false;
  if (f.time && !(recipeTotalMinutes(r) > 0 && recipeTotalMinutes(r) <= f.time)) return false;
  if (f.highProtein || f.lowCarb || f.keto || f.lowFat) {
    const d = recipeDiet(r);
    if ((f.highProtein && !d.highProtein) || (f.lowCarb && !d.lowCarb) || (f.keto && !d.keto) || (f.lowFat && !d.lowFat)) return false;
  }
  if (f.freezer && !r.freezerFriendly) return false;
  const q = f.search.trim().toLowerCase();
  if (q) {
    const haystack = [r.name, r.cuisine, r.primaryProtein, ...(r.ingredients || []).map((i) => i.name)].join(' ').toLowerCase();
    if (!haystack.includes(q)) return false;
  }
  return true;
}

function renderRecipeList() {
  const f = AppState.recipeFilters;
  const index = AppState.inventoryIndex || [];
  const scores = new Map((AppState.recipes || []).map((r) => [r.id, index.length ? scoreRecipe(r, index) : null]));
  // With food in the kitchen: best match, with a boost for recipes that use something about to go off.
  // With an empty kitchen: favourites first, then A–Z.
  const rank = (r) => {
    const sc = scores.get(r.id);
    return sc ? sc.pct + (sc.expiring.length ? 30 : 0) : (r.isFavourite ? 1 : 0);
  };
  const recipes = (AppState.recipes || [])
    .filter((r) => recipeMatchesFilters(r, f))
    .sort((a, b) => rank(b) - rank(a) || a.name.localeCompare(b.name));

  if (recipes.length === 0) {
    const none = (AppState.recipes || []).length === 0;
    return `
      <div class="empty-state">
        <div class="glyph">📖</div>

function formatIngredientQuantity(ing) {
  if (ing.quantity === null) return '';
  const qty = Number.isInteger(ing.quantity) ? String(ing.quantity) : String(Math.round(ing.quantity * 100) / 100);
  if (!ing.unit || ing.unit === 'each') return qty;
  const unit = ing.quantity > 1 && RECIPE_UNIT_PLURALS[ing.unit] ? RECIPE_UNIT_PLURALS[ing.unit] : ing.unit;
  return `${qty} ${unit}`;
}

function starRowHtml(field, value) {
  return [1, 2, 3, 4, 5].map((n) => `
    <button type="button" class="star-btn ${value && n <= value ? 'on' : ''}" data-field="${field}" data-value="${n}" aria-label="${n} star${n === 1 ? '' : 's'}">★</button>
  `).join('');
}

async function deleteRecipe(recipe) {
  const builtInNote = recipe.source === 'built-in' ? ' It won\'t be added back by future updates.' : '';
  if (!confirm(`Delete "${recipe.name}"?${builtInNote}`)) return;
  await dbDelete('recipes', recipe.id);
  if (recipe.seedId) {
    const meta = (await dbGet('settings', 'recipeSeed')) || { key: 'recipeSeed', version: 0, deletedSeedIds: [] };
    const deleted = meta.deletedSeedIds || [];
    if (!deleted.includes(recipe.seedId)) deleted.push(recipe.seedId);
    await dbPut('settings', { ...meta, deletedSeedIds: deleted });
  }
  closeModal();
  showToast('Recipe deleted');
  renderRoute();
}

/* ---- Recipe add/edit form ----
   Ingredients are typed one per line, e.g. "500 g chicken thigh, diced (optional)".
   Match words, category and staple flag are filled in automatically: kept from the same ingredient
   if it was already on this recipe, otherwise borrowed from any other recipe using that ingredient. */
function ingredientToLine(ing) {
  const qty = formatIngredientQuantity(ing);
  return [qty, ing.name].filter(Boolean).join(' ')
    + (ing.prepNote ? `, ${ing.prepNote}` : '')
    + (ing.optional ? ' (optional)' : '');
}

function parseQuantity(text) {
  const unicode = { '½': 0.5, '¼': 0.25, '¾': 0.75, '⅓': 1 / 3, '⅔': 2 / 3 };
  if (unicode[text] !== undefined) return unicode[text];
  const mixed = text.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if (mixed) return Number(mixed[1]) + Number(mixed[2]) / Number(mixed[3]);
  const frac = text.match(/^(\d+)\/(\d+)$/);
  if (frac) return Number(frac[1]) / Number(frac[2]);
  return Number(text.replace(',', '.'));
}

function buildKnownIngredientLookup(excludeRecipeId) {
  const lookup = new Map();
  (AppState.recipes || []).forEach((r) => {
    if (r.id === excludeRecipeId) return;
    (r.ingredients || []).forEach((ing) => {
      const key = ing.name.toLowerCase();
      if (!lookup.has(key)) lookup.set(key, ing);
    });
  });
  return lookup;
}

function parseIngredientLine(line, previousIngredients, knownLookup) {
  let text = line.trim();
  if (!text) return null;

  let optional = false;
  if (/\(optional\)\s*$/i.test(text)) {
    optional = true;
    text = text.replace(/\(optional\)\s*$/i, '').trim();
  }

  let quantity = null;
  let unit = '';
  const qtyMatch = text.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔])\s*(.*)$/);
  if (qtyMatch) {
    const parsed = parseQuantity(qtyMatch[1]);
    if (Number.isFinite(parsed)) {
      quantity = parsed;
      text = qtyMatch[2];
      const unitMatch = text.match(/^([A-Za-z]+)\.?\s+(.+)$/);
      if (unitMatch && RECIPE_UNIT_ALIASES[unitMatch[1].toLowerCase()]) {
        unit = RECIPE_UNIT_ALIASES[unitMatch[1].toLowerCase()];
        text = unitMatch[2];
      }
    }
  }

  let prepNote = '';
  const comma = text.indexOf(',');
  if (comma > 0) {
    prepNote = text.slice(comma + 1).trim();
    text = text.slice(0, comma).trim();
  }
  const name = text.trim();
  if (!name) return null;

  const key = name.toLowerCase();
  // Also try the singular form so "2 onions" picks up what's known about "Onion"
  const singular = key.replace(/(?:es|s)$/, '');
  const known = previousIngredients.find((p) => p.name.toLowerCase() === key)
    || knownLookup.get(key) || knownLookup.get(singular) || knownLookup.get(key.replace(/s$/, ''));
  return normalizeRecipeIngredient({
    name, quantity, unit, prepNote, optional,
    category: known ? known.category : 'Other',
    matchTerms: known ? known.matchTerms : [key],
    assumedStaple: known ? known.assumedStaple : false
  });
}

  document.querySelectorAll('#r-freezer, #r-leftover').forEach((btn) => {
    btn.addEventListener('click', () => {
      const isOn = btn.dataset.on === 'true';
      btn.dataset.on = isOn ? 'false' : 'true';
      btn.classList.toggle('on', !isOn);
    });
  });

  document.getElementById('recipe-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    await saveRecipeFromForm(recipe);
  });
}

async function saveRecipeFromForm(existing) {
  const name = document.getElementById('r-name').value.trim();
  if (!name) return;

  const selectedVal = (id) => {
    const el = document.querySelector(`#${id} button.selected`);
    return el ? el.dataset.val : null;
  };
  const previousIngredients = existing ? existing.ingredients : [];
  const knownLookup = buildKnownIngredientLookup(existing ? existing.id : null);
  const ingredients = document.getElementById('r-ingredients').value.split('\n')
    .map((line) => parseIngredientLine(line, previousIngredients, knownLookup))
    .filter(Boolean);

  const fields = normalizeRecipe({
    name,
    cuisine: document.getElementById('r-cuisine').value,
    mealTypes: Array.from(document.querySelectorAll('#r-mealTypes button.selected')).map((b) => b.dataset.val),
    servings: document.getElementById('r-servings').value,
    prepMinutes: document.getElementById('r-prep').value,
    cookMinutes: document.getElementById('r-cook').value,
    difficulty: selectedVal('r-difficulty'),
    caloriesPerServing: document.getElementById('r-calories').value,
    proteinGramsPerServing: document.getElementById('r-proteinGrams').value,
    carbsGramsPerServing: document.getElementById('r-carbsGrams').value,
    fatGramsPerServing: document.getElementById('r-fatGrams').value,
    proteinLevel: selectedVal('r-proteinLevel'),
    fatLevel: selectedVal('r-fatLevel'),
    primaryProtein: document.getElementById('r-primaryProtein').value,
    freezerFriendly: document.getElementById('r-freezer').dataset.on === 'true',
    leftoverFriendly: document.getElementById('r-leftover').dataset.on === 'true',
    ingredients,
    method: document.getElementById('r-method').value.split('\n'),
    notes: document.getElementById('r-notes').value.trim()
  });

  const now = new Date().toISOString();
  const record = existing
    ? { ...existing, ...fields, userModified: existing.source === 'built-in' ? true : !!existing.userModified, updatedAt: now }
    : { ...fields, seedId: null, source: 'user', userModified: false, userRating: null, partnerRating: null, isFavourite: false, createdAt: now, updatedAt: now };

  try {
    const id = await dbPut('recipes', record);
    showToast(existing ? 'Recipe updated' : 'Recipe added');
    renderRoute();
    openRecipeDetail(existing ? existing.id : id);
  } catch (err) {
    alert('Couldn\'t save this recipe: ' + (err && err.message ? err.message : 'unknown storage error'));
  }
}

/* ============================================================
   HEALTH GOALS
   Calories per meal and preferred cuisines. Used to flag recipes
   inside or over the target and to steer AI meal suggestions.
   ============================================================ */
/* ---- Eating styles ----
   Each style is a split of daily calories between protein, carbs and fat. Choosing one
   in Settings fills in the daily macro targets; recipes get Low carb / Keto / Low fat tags. */
const EATING_STYLES = {
  'balanced': { label: 'Balanced', split: [20, 50, 30], desc: 'A bit of everything.', ai: 'Keep meals balanced: a good protein, plenty of vegetables, a moderate serve of carbs, not too much fat.' },
  'high-protein': { label: 'High protein', split: [25, 44, 31], desc: 'Protein first, fat kept lower.', ai: 'Prioritise protein (chicken, fish, lean beef, pork, eggs, legumes, in that order) and keep fat lower where possible.' },
  'low-carb': { label: 'Low carb', split: [30, 20, 50], desc: 'Around 20 g carbs a meal: skip or swap the rice, bread and potatoes.', ai: 'Keep carbs low: under about 20 g per serving. No rice, pasta, bread or potatoes as part of the dish; suggest swaps like cauliflower rice or salad.' },
  'keto': { label: 'Keto', split: [25, 6, 69], desc: 'Very low carb (about 25 g a day), higher fat.', ai: 'Make meals keto: under about 10 g carbs per serving, no grains, sugar, potatoes, legumes or starchy vegetables, with fat from meat, fish, eggs, cheese, cream, butter, oil and avocado.' },
  'low-fat': { label: 'Low fat', split: [25, 55, 20], desc: 'Lean meats, little oil, cream or cheese.', ai: 'Keep fat low: under about 12 g per serving. Lean meats and fish, little oil, no cream, butter or cheese-heavy sauces.' }
};
const DEFAULT_EATING_STYLE = 'high-protein';

const DEFAULT_HEALTH_GOALS = {
  key: 'healthGoals',
  caloriesMin: 450,
  caloriesMax: 500,
  dailyCalories: 1600,
  dailyProtein: 100,
  dailyCarbs: 175,
  dailyFat: 55,
  eatingStyle: DEFAULT_EATING_STYLE,
  preferredCuisines: ['Anglo-Indian', 'Indian', 'Australian', 'Western', 'Chinese', 'Indo-Chinese', 'Korean', 'Vietnamese'],
  cuisinesVersion: 2
};

// Cuisines added in version 2 start switched on, even for goals saved before they existed
const CUISINES_ADDED_V2 = ['Chinese', 'Indo-Chinese', 'Korean', 'Vietnamese'];

async function getHealthGoals() {
  const saved = await dbGet('settings', 'healthGoals');
  const goals = { ...DEFAULT_HEALTH_GOALS, ...(saved || {}) };
  if (saved && (saved.cuisinesVersion || 1) < 2) {
    goals.preferredCuisines = [...goals.preferredCuisines, ...CUISINES_ADDED_V2.filter((c) => !goals.preferredCuisines.includes(c))];
    goals.cuisinesVersion = 2;
  }
  return goals;
}

// Protein and carbs are 4 kcal/g, fat 9 kcal/g: show whether the macro targets add up to the calorie target
function macroCheckText(goals) {
  const fromMacros = goals.dailyProtein * 4 + goals.dailyCarbs * 4 + goals.dailyFat * 9;
  const diff = fromMacros - goals.dailyCalories;
  const split = fromMacros ? `Protein ${Math.round(goals.dailyProtein * 400 / fromMacros)}% · carbs ${Math.round(goals.dailyCarbs * 400 / fromMacros)}% · fat ${Math.round(goals.dailyFat * 900 / fromMacros)}% of calories.` : '';
  return Math.abs(diff) <= 50
    ? `${split} These add up to your ${goals.dailyCalories} kcal.`
    : `${split} These macros add up to ${fromMacros} kcal, ${Math.abs(diff)} ${diff > 0 ? 'over' : 'under'} your ${goals.dailyCalories} kcal target.`;
}

// "✓ 480 kcal" inside the target, "590 kcal · over" above it, plain below it
function calorieBadgeHtml(kcal, goals) {
  if (!kcal || !goals) return '';
  if (kcal > goals.caloriesMax) return `<span class="tag kcal-over">${kcal} kcal · over</span>`;
  if (kcal >= goals.caloriesMin) return `<span class="tag kcal-ok">✓ ${kcal} kcal</span>`;
  return `<span class="tag">${kcal} kcal</span>`;
}


function eatingStyleMacros(style, dailyCalories) {
  const [p, c, f] = (EATING_STYLES[style] || EATING_STYLES[DEFAULT_EATING_STYLE]).split;
  const round5 = (n) => Math.round(n / 5) * 5;
  return {
    dailyProtein: round5(dailyCalories * p / 100 / 4),
    dailyCarbs: round5(dailyCalories * c / 100 / 4),
    dailyFat: round5(dailyCalories * f / 100 / 9)
  };
}

// Starchy ingredients that make a dish high in carbs. Small amounts that are staples (a teaspoon
// of sugar, a spoon of flour to thicken) and optional ones don't count.
const STARCH_RE = /\b(rice|pasta|spaghetti|penne|fettuccine|macaroni|noodles?|bread|breadcrumbs|naan|roti|chapatis?|parathas?|potato|potatoes|flour|lentils?|dal|chickpeas?|kidney beans|beans|oats|couscous|quinoa|tortillas?|wraps?|sugar|honey|corn|pumpkin|sweet potato|cereal|biscuits?|pastry|buns?)\b/;

function isStarchy(ing) {
  const name = ing.name.toLowerCase();
  if (/green beans|bean sprouts|beansprouts/.test(name)) return false;
  return ing.category === 'Carbs & Grains' || STARCH_RE.test(name);
}

// Per-serving nutrition, using the recipe's own figures where it has them. Carbs and fat are
// estimated from calories, protein and fat level when the recipe doesn't say (marked estimated).
function recipeMacros(recipe) {
  const kcal = recipe.caloriesPerServing || null;
  const protein = recipe.proteinGramsPerServing ?? null;
  let fat = recipe.fatGramsPerServing ?? null;
  let carbs = recipe.carbsGramsPerServing ?? null;
  const estimated = kcal != null && (fat == null || carbs == null);
  if (kcal && fat == null) {
    fat = { Low: 9, Medium: 17, High: 27 }[recipe.fatLevel] || 17;
    fat = Math.min(fat, Math.max(0, (kcal - (protein || 0) * 4) / 9));
  }
  if (kcal && carbs == null) carbs = Math.max(0, (kcal - (protein || 0) * 4 - (fat || 0) * 9) / 4);
  return { kcal, protein, carbs: carbs == null ? null : round1(carbs), fat: fat == null ? null : round1(fat), estimated };
}

// Which eating styles a recipe suits. Rice, bread or potatoes listed "to serve" can be skipped,
// so a curry served with rice still counts as low carb, with a note to skip the rice.
function recipeDiet(recipe) {
  const required = (recipe.ingredients || []).filter((i) => !i.optional && !i.assumedStaple);
  const starchy = required.filter(isStarchy);
  const sides = starchy.filter((i) => /to serve|on the side|for serving/i.test(i.prepNote || ''));
  const mainStarch = starchy.length - sides.length;
  const carbs = recipe.carbsGramsPerServing;
  const fat = recipe.fatGramsPerServing;
  // Per-serving figures are for the dish itself, without the rice or bread served with it
  const lowCarb = carbs != null ? carbs <= 20 && mainStarch === 0 : mainStarch === 0;
  const keto = carbs != null ? carbs <= 10 && mainStarch === 0 : (mainStarch === 0 && !sides.length && recipe.fatLevel !== 'Low');
  const lowFat = fat != null ? fat <= 12 : recipe.fatLevel === 'Low';
  const highProtein = recipe.proteinLevel === 'High' || (recipe.proteinGramsPerServing || 0) >= 30;
  return { lowCarb, keto, lowFat, highProtein, skip: lowCarb ? sides.map((i) => i.name) : [] };
}

function recipeSuitsStyle(recipe, style) {
  const d = recipeDiet(recipe);
  return style === 'low-carb' ? d.lowCarb : style === 'keto' ? d.keto : style === 'low-fat' ? d.lowFat : style === 'high-protein' ? d.highProtein : true;
}

function skipText(names) {
  const short = names.map((n) => n.replace(/^(basmati|jasmine|microwave)\s+/i, '').toLowerCase());
  return short.length ? ` (skip the ${short.slice(0, 2).join(' & ')})` : '';
}

// "P 34 g · C 17 g · F 24 g" with each macro in its chart colour
function macroLineHtml(m) {
  if (!m || (m.protein == null && m.carbs == null && m.fat == null)) return '';
  const part = (cls, letter, v) => (v == null ? '' : `<span class="ml ${cls}">${letter} ${Math.round(v)} g</span>`);
  return `<div class="macro-line">${[part('ml-p', 'P', m.protein), part('ml-c', 'C', m.carbs), part('ml-f', 'F', m.fat)].filter(Boolean).join('')}</div>`;
}

function dietTagsHtml(recipe, { long = false } = {}) {
  const d = recipeDiet(recipe);
  const tags = [];
  if (d.highProtein) tags.push('<span class="tag tag-protein">High protein</span>');
  if (d.keto) tags.push(`<span class="tag tag-diet">Keto${long ? skipText(d.skip) : ''}</span>`);
  else if (d.lowCarb) tags.push(`<span class="tag tag-diet">Low carb${long ? skipText(d.skip) : ''}</span>`);
  if (d.lowFat) tags.push('<span class="tag tag-diet">Low fat</span>');
  return tags.join('');
}

/* ============================================================
   RECIPE MATCHING
   How much of each recipe is already in the kitchen, and whether it
   uses food that is about to go off. Staples and optional ingredients
   don't count against the score.
   ============================================================ */
const EXPIRING_SOON_DAYS = 3;

// Lower-case, letters only, crude singular form, so "Tomatoes" matches "tomato"
function matchWords(text) {
  return String(text || '').toLowerCase().replace(/[^a-z]+/g, ' ').trim().split(' ')
    .filter(Boolean)
    .map((w) => (w.length > 3 && w.endsWith('oes') ? w.slice(0, -2)
      : w.length > 3 && w.endsWith('ies') ? w.slice(0, -2)
        : w.length > 3 && w.endsWith('s') && !w.endsWith('ss') ? w.slice(0, -1) : w))
    .join(' ');
}

// Whole-word containment either way: "chicken" matches "chicken breast", "egg" doesn't match "eggplant"
function termMatchesItem(term, itemWords) {
  if (!term || !itemWords) return false;
  return ` ${itemWords} `.includes(` ${term} `) || ` ${term} `.includes(` ${itemWords} `);
}

// Cooked portions (leftovers from "I cooked this") are meals, not ingredients
function buildInventoryIndex(items) {
  return items
    .filter((i) => !i.recipeId && (i.expiryDate == null || daysUntil(i.expiryDate) >= 0))
    .map((i) => ({ item: i, words: matchWords(i.name), daysLeft: i.expiryDate ? daysUntil(i.expiryDate) : null }));
}

function findInventoryMatch(ingredient, index) {
  const terms = (ingredient.matchTerms && ingredient.matchTerms.length ? ingredient.matchTerms : [ingredient.name]).map(matchWords);
  const hits = index.filter((entry) => terms.some((t) => termMatchesItem(t, entry.words)));
  if (!hits.length) return null;
  // Prefer the one that goes off soonest, so recipes are credited for using it up
  return hits.sort((a, b) => (a.daysLeft ?? Infinity) - (b.daysLeft ?? Infinity))[0];
}

function scoreRecipe(recipe, index) {
  const needed = (recipe.ingredients || []).filter((i) => !i.optional && !i.assumedStaple);
  const have = [];
  const missing = [];
  const expiring = [];
  needed.forEach((ing) => {
    const hit = findInventoryMatch(ing, index);
    if (hit) {
      have.push(ing.name);
      if (hit.daysLeft !== null && hit.daysLeft <= EXPIRING_SOON_DAYS && !expiring.some((e) => e.name === hit.item.name)) {
        expiring.push({ name: hit.item.name, daysLeft: hit.daysLeft });
      }
    } else {
      missing.push(ing.name);
    }
  });
  const pct = needed.length ? Math.round((have.length / needed.length) * 100) : 100;
  return { pct, have, missing, expiring };
}

function formatDaysLeft(d) {
  return d === 0 ? 'today' : d === 1 ? '1 day left' : `${d} days left`;
}

/* ============================================================
   AI MEAL SUGGESTIONS (Claude API)
   The API key is kept in this browser's localStorage only: it is never
   written to IndexedDB, so it is not included in kitchen backups.
   ============================================================ */
const AI_MODEL = 'claude-opus-5-5';
const AI_SDK_URL = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm';
const AI_KEY_STORAGE = 'kitchenCompanion.anthropicApiKey';

function getAiKey() {
  try { return localStorage.getItem(AI_KEY_STORAGE) || ''; } catch (err) { return ''; }
}
function setAiKey(key) {
  try {
    if (key) localStorage.setItem(AI_KEY_STORAGE, key);
    else localStorage.removeItem(AI_KEY_STORAGE);
    return true;
  } catch (err) { return false; }
}

let anthropicModulePromise = null;
async function getAnthropicClient() {
  const apiKey = getAiKey();
  if (!apiKey) throw new Error('NO_KEY');
  if (!anthropicModulePromise) {
    anthropicModulePromise = import(AI_SDK_URL).catch((err) => { anthropicModulePromise = null; throw err; });
  }
  const mod = await anthropicModulePromise;
  const Anthropic = mod.default || mod.Anthropic;
  // The key belongs to this phone's owner and never leaves this browser except to api.anthropic.com
  return { Anthropic, client: new Anthropic({ apiKey, dangerouslyAllowBrowser: true }) };
}

// Turns SDK errors into something a person can act on
function describeAiError(err, Anthropic) {
  if (err && err.message === 'NO_KEY') return 'Add your Anthropic API key in Settings → AI suggestions first.';
  if (!navigator.onLine) return 'You\'re offline. AI suggestions need an internet connection.';
  if (Anthropic) {
    if (err instanceof Anthropic.AuthenticationError) return 'Your API key wasn\'t accepted. Check it in Settings → AI suggestions.';
    if (err instanceof Anthropic.PermissionDeniedError) return 'This API key doesn\'t have permission to use Claude. Check your Anthropic Console.';
    if (err instanceof Anthropic.RateLimitError) return 'Too many requests just now. Wait a minute and try again.';
    if (err instanceof Anthropic.BadRequestError) return `Anthropic couldn't run this request: ${err.message}. If it mentions credit, add credit under Billing in the Anthropic Console.`;
    if (err instanceof Anthropic.APIConnectionError) return 'Couldn\'t reach Anthropic. Check your internet connection and try again.';
    if (err instanceof Anthropic.APIError) return `Anthropic returned an error (${err.status || 'unknown'}). Try again in a moment.`;
  }
  return 'Couldn\'t load the AI service. Check your internet connection and try again.';
}

// Free check: looks up the model with the key, without generating anything
async function testAiKey() {
  let Anthropic = null;
  try {
    const loaded = await getAnthropicClient();
    Anthropic = loaded.Anthropic;
    await loaded.client.models.retrieve(AI_MODEL);
    return { ok: true, message: 'Key works. AI suggestions are ready.' };
  } catch (err) {
    return { ok: false, message: describeAiError(err, Anthropic) };
  }
}

function aiSuggestionSchema() {
  const str = { type: 'string' };
  const int = { type: 'integer' };
  const ingredient = {
    type: 'object',
    additionalProperties: false,
    required: ['name', 'quantity', 'unit', 'prepNote', 'category', 'matchTerms', 'optional', 'assumedStaple', 'inKitchen'],
    properties: {
      name: str,
      quantity: { type: 'number' },
      unit: { type: 'string', enum: ['g', 'kg', 'ml', 'L', 'tsp', 'tbsp', 'cup', 'each', 'clove', 'bunch', 'sprig', 'pinch', 'can', ''] },
      prepNote: str,
      category: { type: 'string', enum: CATEGORIES },
      matchTerms: { type: 'array', items: str },
      optional: { type: 'boolean' },
      assumedStaple: { type: 'boolean' },
      inKitchen: { type: 'boolean' }
    }
  };
  const meal = {
    type: 'object',
    additionalProperties: false,
    required: ['name', 'cuisine', 'mealTypes', 'whyThisMeal', 'usesExpiring', 'servings', 'prepMinutes', 'cookMinutes',
      'difficulty', 'caloriesPerServing', 'proteinGramsPerServing', 'carbsGramsPerServing', 'fatGramsPerServing', 'fatLevel', 'primaryProtein',
      'freezerFriendly', 'leftoverFriendly', 'ingredients', 'method'],
    properties: {
      name: str,
      cuisine: { type: 'string', enum: RECIPE_CUISINES },
      mealTypes: { type: 'array', items: { type: 'string', enum: MEAL_TYPES } },
      whyThisMeal: str,
      usesExpiring: { type: 'array', items: str },
      servings: int,
      prepMinutes: int,
      cookMinutes: int,
      difficulty: { type: 'string', enum: DIFFICULTIES },
      caloriesPerServing: int,
      proteinGramsPerServing: int,
      carbsGramsPerServing: int,
      fatGramsPerServing: int,
      fatLevel: { type: 'string', enum: LEVELS },
      primaryProtein: { type: 'string', enum: PRIMARY_PROTEINS },
      freezerFriendly: { type: 'boolean' },
      leftoverFriendly: { type: 'boolean' },
      ingredients: { type: 'array', items: ingredient },
      method: { type: 'array', items: str }
    }
  };
  return {
    type: 'object',
    additionalProperties: false,
    required: ['meals'],
    properties: { meals: { type: 'array', items: meal } }
  };
}

function buildAiPrompt(items, goals, mealType, request, maxMinutes) {
  const style = EATING_STYLES[goals.eatingStyle] || EATING_STYLES[DEFAULT_EATING_STYLE];
  const kitchen = items.map((i) => ({
    name: i.name,
    location: i.location,
    amount: formatItemQuantity(i),
    states: i.states || [],
    staple: !!i.isStaple,
    daysUntilUseBy: i.expiryDate ? daysUntil(i.expiryDate) : null
  }));
  return [
    'Suggest 3 different meals I can cook, using what is in my kitchen.',
    '',
    `Meal: ${mealType}.`,
    `Calorie target: ${goals.caloriesMin}-${goals.caloriesMax} kcal per serving. Eating style: ${style.label}. ${style.ai}`,
    maxMinutes ? `Fast and easy: each meal must take ${maxMinutes} minutes or less in total (prep plus cooking), with few steps and little washing up.` : null,
    goals.preferredCuisines.length ? `Cuisines I like: ${goals.preferredCuisines.join(', ')}. Mostly suggest these.` : 'Any cuisine is fine; vary them.',
    'Use food with the fewest days until its use-by date first, and say which of those items each meal uses in usesExpiring (exact kitchen item names). Skip anything already past its use-by date (negative days).',
    'Salt, pepper, oil and dried spices count as staples; mark them assumedStaple. Prefer meals that need few or no extra purchases; set inKitchen for each ingredient that is in my kitchen list.',
    'Use metric quantities. Use quantity 0 with an empty unit for "to taste". matchTerms are lower-case names a kitchen item could be called, most specific first (e.g. "chicken thigh", "chicken").',
    'Calories, protein, carbs and fat are per serving and approximate. whyThisMeal is one short sentence.',
    request ? `Also: ${request}` : '',
    '',
    'My kitchen (JSON):',
    JSON.stringify(kitchen)
  ].filter((line) => line !== null).join('\n');
}

async function requestAiSuggestions(mealType, request, maxMinutes) {
  let Anthropic = null;
  try {
    const loaded = await getAnthropicClient();
    Anthropic = loaded.Anthropic;
    const [items, goals] = await Promise.all([dbGetAll('inventoryItems'), getHealthGoals()]);
    const response = await loaded.client.beta.messages.create({
      model: AI_MODEL,
      max_tokens: 16000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: { effort: 'medium', format: { type: 'json_schema', schema: aiSuggestionSchema() } },
      system: 'You are the meal-suggestion feature of PantryFit, a personal kitchen app for a home cook in Australia. Suggest practical, healthy home-cooked meals with clear, concise methods, in the cuisines they say they like.',
      messages: [{ role: 'user', content: buildAiPrompt(items, goals, mealType, request, maxMinutes) }]
    });
    if (response.stop_reason === 'refusal') {
      return { error: 'Claude couldn\'t suggest meals for this request. Try rewording the extra request, or leave it blank.' };
    }
    if (response.stop_reason === 'max_tokens') {
      return { error: 'The suggestions were too long to finish. Try again, maybe with a shorter extra request.' };
    }
    const text = response.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
    const parsed = JSON.parse(text);
    return { meals: Array.isArray(parsed.meals) ? parsed.meals : [] };
  } catch (err) {
    if (err instanceof SyntaxError) return { error: 'Claude\'s reply couldn\'t be read. Please try again.' };
    return { error: describeAiError(err, Anthropic) };
  }
}

function aiMealToRecipe(meal) {
  const fields = normalizeRecipe({
    ...meal,
    proteinLevel: (meal.proteinGramsPerServing || 0) >= 25 ? 'High' : (meal.proteinGramsPerServing || 0) >= 12 ? 'Medium' : 'Low',
    ingredients: (meal.ingredients || []).map((i) => ({ ...i, quantity: i.quantity ? i.quantity : null })),
    notes: meal.whyThisMeal || ''
  });
  const now = new Date().toISOString();
  return {
    ...fields,
    sourceName: 'Claude suggestion',
    seedId: null,
    source: 'ai',
    userModified: false,
    userRating: null,
    partnerRating: null,
    isFavourite: false,
    createdAt: now,
    updatedAt: now
  };
}

function aiMealCardHtml(meal, idx, goals) {

  return `
    <div class="ai-meal" data-idx="${idx}">
      <div class="ai-meal-head">
        <span class="name">${escapeHtml(meal.name)}</span>
        <span class="qty">${(meal.prepMinutes || 0) + (meal.cookMinutes || 0)} min</span>
      </div>
      <div class="meta-row">
        <span class="tag">${escapeHtml(meal.cuisine)}</span>
        ${calorieBadgeHtml(meal.caloriesPerServing, goals)}
        <span class="tag tag-protein">~${escapeHtml(meal.proteinGramsPerServing)} g protein</span>
        ${meal.carbsGramsPerServing != null ? `<span class="tag">~${escapeHtml(meal.carbsGramsPerServing)} g carbs</span>` : ''}
        ${meal.fatGramsPerServing != null ? `<span class="tag">~${escapeHtml(meal.fatGramsPerServing)} g fat</span>` : ''}

   ONLINE RECIPE SEARCH (TheMealDB, free, no account)

const MEALDB_BASE = 'https://www.themealdb.com/api/json/v1/1';
const MEALDB_AREAS = ['Indian', 'Chinese', 'Japanese', 'Thai', 'Vietnamese', 'Malaysian', 'Filipino', 'Turkish', 'Moroccan', 'Greek', 'Italian', 'French', 'Spanish', 'British', 'Mexican', 'Jamaican', 'American', 'Australian'];
// TheMealDB areas that don't share a name with an app cuisine
const MEALDB_AREA_TO_CUISINE = {
  Jamaican: 'Caribbean', Moroccan: 'North African', Egyptian: 'North African', Tunisian: 'North African', Algerian: 'North African',
  Kenyan: 'East African', Polish: 'Eastern European', Russian: 'Eastern European', Ukrainian: 'Eastern European', Croatian: 'Eastern European',
  Slovakian: 'Eastern European', Argentinian: 'Latin American', Uruguayan: 'Latin American', Venezulan: 'Latin American', Dutch: 'Western', Norwegian: 'Western'
};
const MEALDB_CATEGORY_PROTEIN = { Chicken: 'Chicken', Beef: 'Beef', Lamb: 'Lamb', Goat: 'Lamb', Pork: 'Pork', Seafood: 'Fish', Vegetarian: 'None', Vegan: 'None' };

async function mealDbFetch(path) {
  const res = await fetch(`${MEALDB_BASE}/${path}`);
  if (!res.ok) throw new Error(`TheMealDB returned ${res.status}`);
  const data = await res.json();
  return Array.isArray(data.meals) ? data.meals : [];
}

// Results from an ingredient filter and a name search, without duplicates
async function searchMealDb(query) {
  const q = query.trim();
  const [byIngredient, byName] = await Promise.all([
    mealDbFetch(`filter.php?i=${encodeURIComponent(q.toLowerCase().replace(/\s+/g, '_'))}`).catch(() => []),
    mealDbFetch(`search.php?s=${encodeURIComponent(q)}`).catch(() => [])
  ]);
  const seen = new Set();
  return [...byIngredient, ...byName].filter((m) => !seen.has(m.idMeal) && seen.add(m.idMeal));
}

// TheMealDB measures are free text ("1 tbs", "1.2 kg", "5 thinly sliced", "to taste"):
// take a leading amount and a known unit, and keep anything else as the prep note.
const MEALDB_UNIT_ALIASES = { ...RECIPE_UNIT_ALIASES, tbs: 'tbsp', tbls: 'tbsp', tblsp: 'tbsp', tsps: 'tsp', ml: 'ml', g: 'g', kg: 'kg' };
function parseMealDbMeasure(measure) {
  let text = String(measure || '').trim();
  let quantity = null;
  let unit = '';
  const qtyMatch = text.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔])\s*(.*)$/);
  if (qtyMatch) {
    const parsed = parseQuantity(qtyMatch[1]);
    if (Number.isFinite(parsed)) {
      quantity = parsed;
      text = qtyMatch[2];
      const unitMatch = text.match(/^([A-Za-z]+)\.?(?:\s+|$)(.*)$/);
      if (unitMatch && MEALDB_UNIT_ALIASES[unitMatch[1].toLowerCase()]) {
        unit = MEALDB_UNIT_ALIASES[unitMatch[1].toLowerCase()];
        text = unitMatch[2];
      }
    }
  }
  return { quantity, unit, note: text.trim() };
}

function mealDbToRecipe(meal) {
  const knownLookup = buildKnownIngredientLookup(null);
  const ingredients = [];
  for (let n = 1; n <= 20; n++) {
    const name = (meal[`strIngredient${n}`] || '').trim();
    if (!name) continue;
    const { quantity, unit, note } = parseMealDbMeasure(meal[`strMeasure${n}`]);
    const key = name.toLowerCase();
    const known = knownLookup.get(key) || knownLookup.get(key.replace(/(?:es|s)$/, ''));
    ingredients.push(normalizeRecipeIngredient({
      name,
      quantity,
      unit,
      prepNote: note,
      category: known ? known.category : 'Other',
      matchTerms: known ? known.matchTerms : [key],
      assumedStaple: known ? known.assumedStaple : false
    }));
  }
  const method = String(meal.strInstructions || '')
    .split(/\r?\n+/)
    .map((s) => s.replace(/^\s*(step\s*\d+[:.)]?|\d+[.)])\s*/i, '').trim())
    .filter((s) => s.length > 1);
  const cuisine = RECIPE_CUISINES.includes(meal.strArea) ? meal.strArea : (MEALDB_AREA_TO_CUISINE[meal.strArea] || 'Western');
  const fields = normalizeRecipe({
    name: meal.strMeal,
    cuisine,
    mealTypes: meal.strCategory === 'Breakfast' ? ['Breakfast'] : ['Lunch', 'Dinner'],
    primaryProtein: MEALDB_CATEGORY_PROTEIN[meal.strCategory] || 'None',
    ingredients,
    method,
    notes: [meal.strArea ? `${meal.strArea} ${meal.strCategory || ''}`.trim() : '', meal.strSource ? `Original: ${meal.strSource}` : '']
      .filter(Boolean).join('\n')
  });
  const now = new Date().toISOString();
  return {
    ...fields,
    sourceName: 'TheMealDB',
    seedId: null,
    source: 'online',
    userModified: false,
    userRating: null,
    partnerRating: null,
    isFavourite: false,
    createdAt: now,
    updatedAt: now
  };
}
