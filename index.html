async function readPacketLabel() {
  const btn = document.getElementById('pk-go');
  btn.disabled = true;
  btn.textContent = 'Reading the label…';
  let Anthropic = null;
  let error = null;
  try {
    const loaded = await getAnthropicClient();
    Anthropic = loaded.Anthropic;
    const schema = labelSchema();
    schema.required.push('packAmount');
    schema.properties.packAmount = { type: 'number' };
    const response = await loaded.client.beta.messages.create({
      model: AI_MODEL,
      max_tokens: 3000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: { effort: 'medium', format: { type: 'json_schema', schema } },
      messages: [{ role: 'user', content: [
        ...Packet.photos.map((p) => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: p.data } })),
        { type: 'text', text: `These photos show a food packet used as a cooking ingredient (e.g. a curry spice mix, sauce or stock), probably Australian.
Set found to false if there is no food packet. name: brand and product, short. kind: other.
per100: kcal, protein, carbs and fat per 100 g (or 100 ml). Australian panels give energy in kJ: divide by 4.184. If only per-serve values are shown, work out per 100 g from the serving size.
servingDescription, servingAmount and servingUnit: the serving size as printed. packAmount: the net weight of the whole pack in g or ml, 0 if not shown. perServing: per serve values. fromLabel: true if read from a nutrition panel, false if estimated.` }
      ] }]
    });
    if (response.stop_reason === 'refusal') error = 'Claude couldn\'t read this photo. Try another.';
    else {
      const r = JSON.parse(response.content.filter((b) => b.type === 'text').map((b) => b.text).join(''));
      if (!r.found || !r.per100 || !r.per100.kcal) error = 'No nutrition label was found. Try a closer, sharper photo of the panel.';
      else Packet.label = r;
    }
  } catch (err) {
    error = err instanceof SyntaxError ? 'Claude\'s reply couldn\'t be read. Please try again.' : describeAiError(err, Anthropic);
  }
  if (!document.getElementById('pk-body')) return;
  if (error) {
    document.getElementById('pk-error').textContent = error;
    btn.disabled = false;
    btn.textContent = 'Try again';
    return;
  }
  const r = Packet.label;
  const pack = r.packAmount ? Math.round(r.packAmount) : null;
  const serve = r.servingAmount ? Math.round(r.servingAmount) : null;
  document.getElementById('pk-body').innerHTML = `
    <div class="ps-thumbs" style="margin-bottom:10px;">${Packet.photos.map((p) => `<div class="ps-thumb"><img src="${p.preview}" alt=""></div>`).join('')}</div>
    ${r.fromLabel ? '<span class="tag kcal-ok">Read from the label</span>' : '<span class="tag kcal-over">No panel found: estimated</span>'}
    <div class="field" style="margin-top:10px;"><label>Name</label><input type="text" id="pk-name" value="${escapeHtml(r.name)}"></div>
    <p class="recipe-muted" style="margin:0;">Per 100 g: ${Math.round(r.per100.kcal)} kcal · protein ${round1(r.per100.protein)} g · carbs ${round1(r.per100.carbs)} g · fat ${round1(r.per100.fat)} g</p>
    ${packetAmountHtml(pack || serve || 35, pack, serve)}`;
  attachPacketAmount();
  btn.disabled = false;
  btn.textContent = 'Use it in the recipe';
}

/* ============================================================
   HEALTH GOALS
   Calories per meal and preferred cuisines. Used to flag recipes
   inside or over the target and to steer AI meal suggestions.
   ============================================================ */
/* ---- Eating styles ----
   Each style is a split of daily calories between protein, carbs and fat. Choosing one
   in Settings fills in the daily macro targets; recipes get Low carb / Keto / Low fat tags. */
const EATING_STYLES = {
  'balanced': { label: 'Balanced', split: [20, 50, 30], desc: 'A bit of everything.', ai: 'Keep meals balanced: a good protein, plenty of vegetables, a moderate serve of carbs, not too much fat.' },
  'high-protein': { label: 'High protein', split: [25, 44, 31], desc: 'Protein first, fat kept lower.', ai: 'Prioritise protein (chicken, fish, lean beef, pork, eggs, legumes, in that order) and keep fat lower where possible.' },
  'low-carb': { label: 'Low carb', split: [30, 20, 50], desc: 'Around 20 g carbs a meal: skip or swap the rice, bread and potatoes.', ai: 'Keep carbs low: under about 20 g per serving. No rice, pasta, bread or potatoes as part of the dish; suggest swaps like cauliflower rice or salad.' },
  'keto': { label: 'Keto', split: [25, 6, 69], desc: 'Very low carb (about 25 g a day), higher fat.', ai: 'Make meals keto: under about 10 g carbs per serving, no grains, sugar, potatoes, legumes or starchy vegetables, with fat from meat, fish, eggs, cheese, cream, butter, oil and avocado.' },
  'low-fat': { label: 'Low fat', split: [25, 55, 20], desc: 'Lean meats, little oil, cream or cheese.', ai: 'Keep fat low: under about 12 g per serving. Lean meats and fish, little oil, no cream, butter or cheese-heavy sauces.' }
};
const DEFAULT_EATING_STYLE = 'high-protein';

const DEFAULT_HEALTH_GOALS = {
  key: 'healthGoals',
  caloriesMin: 450,
  caloriesMax: 500,
  dailyCalories: 1600,
  dailyProtein: 100,
  dailyCarbs: 175,
  dailyFat: 55,
  eatingStyle: DEFAULT_EATING_STYLE,
  preferredCuisines: ['Anglo-Indian', 'Indian', 'Australian', 'Western', 'Chinese', 'Indo-Chinese', 'Korean', 'Vietnamese'],
  cuisinesVersion: 2
};

// Cuisines added in version 2 start switched on, even for goals saved before they existed
const CUISINES_ADDED_V2 = ['Chinese', 'Indo-Chinese', 'Korean', 'Vietnamese'];

async function getHealthGoals() {
  const saved = await dbGet('settings', 'healthGoals');
  const goals = { ...DEFAULT_HEALTH_GOALS, ...(saved || {}) };
  if (saved && (saved.cuisinesVersion || 1) < 2) {
    goals.preferredCuisines = [...goals.preferredCuisines, ...CUISINES_ADDED_V2.filter((c) => !goals.preferredCuisines.includes(c))];
    goals.cuisinesVersion = 2;
  }
  return goals;
}

// Protein and carbs are 4 kcal/g, fat 9 kcal/g: show whether the macro targets add up to the calorie target
function macroCheckText(goals) {
  const fromMacros = goals.dailyProtein * 4 + goals.dailyCarbs * 4 + goals.dailyFat * 9;
  const diff = fromMacros - goals.dailyCalories;
  const split = fromMacros ? `Protein ${Math.round(goals.dailyProtein * 400 / fromMacros)}% · carbs ${Math.round(goals.dailyCarbs * 400 / fromMacros)}% · fat ${Math.round(goals.dailyFat * 900 / fromMacros)}% of calories.` : '';
  return Math.abs(diff) <= 50
    ? `${split} These add up to your ${goals.dailyCalories} kcal.`
    : `${split} These macros add up to ${fromMacros} kcal, ${Math.abs(diff)} ${diff > 0 ? 'over' : 'under'} your ${goals.dailyCalories} kcal target.`;
}

// "✓ 480 kcal" inside the target, "590 kcal · over" above it, plain below it
function calorieBadgeHtml(kcal, goals) {
  if (!kcal || !goals) return '';
  if (kcal > goals.caloriesMax) return `<span class="tag kcal-over">${kcal} kcal · over</span>`;
  if (kcal >= goals.caloriesMin) return `<span class="tag kcal-ok">✓ ${kcal} kcal</span>`;
  return `<span class="tag">${kcal} kcal</span>`;
}


function eatingStyleMacros(style, dailyCalories) {
  const [p, c, f] = (EATING_STYLES[style] || EATING_STYLES[DEFAULT_EATING_STYLE]).split;
  const round5 = (n) => Math.round(n / 5) * 5;
  return {
    dailyProtein: round5(dailyCalories * p / 100 / 4),
    dailyCarbs: round5(dailyCalories * c / 100 / 4),
    dailyFat: round5(dailyCalories * f / 100 / 9)
  };
}

// Starchy ingredients that make a dish high in carbs. Small amounts that are staples (a teaspoon
// of sugar, a spoon of flour to thicken) and optional ones don't count.
const STARCH_RE = /\b(rice|pasta|spaghetti|penne|fettuccine|macaroni|noodles?|bread|breadcrumbs|naan|roti|chapatis?|parathas?|potato|potatoes|flour|lentils?|dal|chickpeas?|kidney beans|beans|oats|couscous|quinoa|tortillas?|wraps?|sugar|honey|corn|pumpkin|sweet potato|cereal|biscuits?|pastry|buns?)\b/;

function isStarchy(ing) {
  const name = ing.name.toLowerCase();
  if (/green beans|bean sprouts|beansprouts/.test(name)) return false;
  return ing.category === 'Carbs & Grains' || STARCH_RE.test(name);
}

// Per-serving nutrition, using the recipe's own figures where it has them. Carbs and fat are
// estimated from calories, protein and fat level when the recipe doesn't say (marked estimated).
function recipeMacros(recipe) {
  const kcal = recipe.caloriesPerServing || null;
  const protein = recipe.proteinGramsPerServing ?? null;
  let fat = recipe.fatGramsPerServing ?? null;
  let carbs = recipe.carbsGramsPerServing ?? null;
  const estimated = kcal != null && (fat == null || carbs == null);
  if (kcal && fat == null) {
    fat = { Low: 9, Medium: 17, High: 27 }[recipe.fatLevel] || 17;
    fat = Math.min(fat, Math.max(0, (kcal - (protein || 0) * 4) / 9));
  }
  if (kcal && carbs == null) carbs = Math.max(0, (kcal - (protein || 0) * 4 - (fat || 0) * 9) / 4);
  return { kcal, protein, carbs: carbs == null ? null : round1(carbs), fat: fat == null ? null : round1(fat), estimated };
}

// Which eating styles a recipe suits. Rice, bread or potatoes listed "to serve" can be skipped,
// so a curry served with rice still counts as low carb, with a note to skip the rice.
function recipeDiet(recipe) {
  const required = (recipe.ingredients || []).filter((i) => !i.optional && !i.assumedStaple);
  const starchy = required.filter(isStarchy);
  const sides = starchy.filter((i) => /to serve|on the side|for serving/i.test(i.prepNote || ''));
  const mainStarch = starchy.length - sides.length;
  const carbs = recipe.carbsGramsPerServing;
  const fat = recipe.fatGramsPerServing;
  // Per-serving figures are for the dish itself, without the rice or bread served with it
  const lowCarb = carbs != null ? carbs <= 20 && mainStarch === 0 : mainStarch === 0;
  const keto = carbs != null ? carbs <= 10 && mainStarch === 0 : (mainStarch === 0 && !sides.length && recipe.fatLevel !== 'Low');
  const lowFat = fat != null ? fat <= 12 : recipe.fatLevel === 'Low';
  const highProtein = recipe.proteinGramsPerServing != null ? recipe.proteinGramsPerServing >= 25 : recipe.proteinLevel === 'High';
  return { lowCarb, keto, lowFat, highProtein, skip: lowCarb ? sides.map((i) => i.name) : [] };
}

function recipeSuitsStyle(recipe, style) {
  const d = recipeDiet(recipe);
  return style === 'low-carb' ? d.lowCarb : style === 'keto' ? d.keto : style === 'low-fat' ? d.lowFat : style === 'high-protein' ? d.highProtein : true;
}

function skipText(names) {
  const short = names.map((n) => n.replace(/^(basmati|jasmine|microwave)\s+/i, '').toLowerCase());
  return short.length ? ` (skip the ${short.slice(0, 2).join(' & ')})` : '';
}

// "P 34 g · C 17 g · F 24 g" with each macro in its chart colour
function macroLineHtml(m) {
  if (!m || (m.protein == null && m.carbs == null && m.fat == null)) return '';
  const part = (cls, letter, v) => (v == null ? '' : `<span class="ml ${cls}">${letter} ${Math.round(v)} g</span>`);
  return `<div class="macro-line">${[part('ml-p', 'P', m.protein), part('ml-c', 'C', m.carbs), part('ml-f', 'F', m.fat)].filter(Boolean).join('')}</div>`;
}

function dietTagsHtml(recipe, { long = false } = {}) {
  const d = recipeDiet(recipe);
  const tags = [];
  if (d.highProtein) tags.push('<span class="tag tag-protein">High protein</span>');
  if (d.keto) tags.push(`<span class="tag tag-diet">Keto${long ? skipText(d.skip) : ''}</span>`);
  else if (d.lowCarb) tags.push(`<span class="tag tag-diet">Low carb${long ? skipText(d.skip) : ''}</span>`);
  if (d.lowFat) tags.push('<span class="tag tag-diet">Low fat</span>');
  return tags.join('');
}

/* ============================================================
   RECIPE MATCHING
   How much of each recipe is already in the kitchen, and whether it
   uses food that is about to go off. Staples and optional ingredients
   don't count against the score.
   ============================================================ */
const EXPIRING_SOON_DAYS = 3;

// Lower-case, letters only, crude singular form, so "Tomatoes" matches "tomato"
function matchWords(text) {
  return String(text || '').toLowerCase().replace(/[^a-z]+/g, ' ').trim().split(' ')
    .filter(Boolean)
    .map((w) => (w.length > 3 && w.endsWith('oes') ? w.slice(0, -2)
      : w.length > 3 && w.endsWith('ies') ? w.slice(0, -2)
        : w.length > 3 && w.endsWith('s') && !w.endsWith('ss') ? w.slice(0, -1) : w))
    .join(' ');
}

// Whole-word containment either way: "chicken" matches "chicken breast", "egg" doesn't match "eggplant"
function termMatchesItem(term, itemWords) {
  if (!term || !itemWords) return false;
  return ` ${itemWords} `.includes(` ${term} `) || ` ${term} `.includes(` ${itemWords} `);
}

// Cooked portions (leftovers from "I cooked this") are meals, not ingredients
function buildInventoryIndex(items) {
  return items
    .filter((i) => !i.recipeId && (i.expiryDate == null || daysUntil(i.expiryDate) >= 0))
    .map((i) => ({ item: i, words: matchWords(i.name), daysLeft: i.expiryDate ? daysUntil(i.expiryDate) : null }));
}

function findInventoryMatch(ingredient, index) {
  const terms = (ingredient.matchTerms && ingredient.matchTerms.length ? ingredient.matchTerms : [ingredient.name]).map(matchWords);
  const hits = index.filter((entry) => terms.some((t) => termMatchesItem(t, entry.words)));
  if (!hits.length) return null;
  // Prefer the one that goes off soonest, so recipes are credited for using it up
  return hits.sort((a, b) => (a.daysLeft ?? Infinity) - (b.daysLeft ?? Infinity))[0];
}

function scoreRecipe(recipe, index) {
  const needed = (recipe.ingredients || []).filter((i) => !i.optional && !i.assumedStaple);
  const have = [];
  const missing = [];
  const expiring = [];
  needed.forEach((ing) => {
    const hit = findInventoryMatch(ing, index);
    if (hit) {
      have.push(ing.name);
      if (hit.daysLeft !== null && hit.daysLeft <= EXPIRING_SOON_DAYS && !expiring.some((e) => e.name === hit.item.name)) {
        expiring.push({ name: hit.item.name, daysLeft: hit.daysLeft });
      }
    } else {
      missing.push(ing.name);
    }
  });
  const pct = needed.length ? Math.round((have.length / needed.length) * 100) : 100;
  return { pct, have, missing, expiring };
}

function formatDaysLeft(d) {
  return d === 0 ? 'today' : d === 1 ? '1 day left' : `${d} days left`;
}

/* ============================================================
   AI MEAL SUGGESTIONS (Claude API)
   The API key is kept in this browser's localStorage only: it is never
   written to IndexedDB, so it is not included in kitchen backups.
   ============================================================ */
const AI_MODEL = 'claude-opus-5-5';
const AI_SDK_URL = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm';
const AI_KEY_STORAGE = 'kitchenCompanion.anthropicApiKey';

function getAiKey() {
  try { return localStorage.getItem(AI_KEY_STORAGE) || ''; } catch (err) { return ''; }
}
function setAiKey(key) {
  try {
    if (key) localStorage.setItem(AI_KEY_STORAGE, key);
    else localStorage.removeItem(AI_KEY_STORAGE);
    return true;
  } catch (err) { return false; }
}

let anthropicModulePromise = null;
async function getAnthropicClient() {
  const apiKey = getAiKey();
  if (!apiKey) throw new Error('NO_KEY');
  if (!anthropicModulePromise) {
    anthropicModulePromise = import(AI_SDK_URL).catch((err) => { anthropicModulePromise = null; throw err; });
  }
  const mod = await anthropicModulePromise;
  const Anthropic = mod.default || mod.Anthropic;
  // The key belongs to this phone's owner and never leaves this browser except to api.anthropic.com
  return { Anthropic, client: new Anthropic({ apiKey, dangerouslyAllowBrowser: true }) };
}

// Turns SDK errors into something a person can act on
function describeAiError(err, Anthropic) {
  if (err && err.message === 'NO_KEY') return 'Add your Anthropic API key in Settings → AI suggestions first.';
  if (!navigator.onLine) return 'You\'re offline. AI suggestions need an internet connection.';
  if (Anthropic) {
    if (err instanceof Anthropic.AuthenticationError) return 'Your API key wasn\'t accepted. Check it in Settings → AI suggestions.';
    if (err instanceof Anthropic.PermissionDeniedError) return 'This API key doesn\'t have permission to use Claude. Check your Anthropic Console.';
    if (err instanceof Anthropic.RateLimitError) return 'Too many requests just now. Wait a minute and try again.';
    if (err instanceof Anthropic.BadRequestError) return `Anthropic couldn't run this request: ${err.message}. If it mentions credit, add credit under Billing in the Anthropic Console.`;
    if (err instanceof Anthropic.APIConnectionError) return 'Couldn\'t reach Anthropic. Check your internet connection and try again.';
    if (err instanceof Anthropic.APIError) return `Anthropic returned an error (${err.status || 'unknown'}). Try again in a moment.`;
  }
  return 'Couldn\'t load the AI service. Check your internet connection and try again.';
}

// Free check: looks up the model with the key, without generating anything
async function testAiKey() {
  let Anthropic = null;
  try {
    const loaded = await getAnthropicClient();
    Anthropic = loaded.Anthropic;
    await loaded.client.models.retrieve(AI_MODEL);
    return { ok: true, message: 'Key works. AI suggestions are ready.' };
  } catch (err) {
    return { ok: false, message: describeAiError(err, Anthropic) };
  }
}

function aiSuggestionSchema() {
  const str = { type: 'string' };
  const int = { type: 'integer' };
  const ingredient = {
    type: 'object',
    additionalProperties: false,
    required: ['name', 'quantity', 'unit', 'prepNote', 'category', 'matchTerms', 'optional', 'assumedStaple', 'inKitchen'],
    properties: {
      name: str,
      quantity: { type: 'number' },
      unit: { type: 'string', enum: ['g', 'kg', 'ml', 'L', 'tsp', 'tbsp', 'cup', 'each', 'clove', 'bunch', 'sprig', 'pinch', 'can', ''] },
      prepNote: str,
      category: { type: 'string', enum: CATEGORIES },
      matchTerms: { type: 'array', items: str },
      optional: { type: 'boolean' },
      assumedStaple: { type: 'boolean' },
      inKitchen: { type: 'boolean' }
    }
  };
  const meal = {
    type: 'object',
    additionalProperties: false,
    required: ['name', 'cuisine', 'mealTypes', 'whyThisMeal', 'usesExpiring', 'servings', 'prepMinutes', 'cookMinutes',
      'difficulty', 'caloriesPerServing', 'proteinGramsPerServing', 'carbsGramsPerServing', 'fatGramsPerServing', 'fatLevel', 'primaryProtein',
      'freezerFriendly', 'leftoverFriendly', 'ingredients', 'method'],
    properties: {
      name: str,
      cuisine: { type: 'string', enum: RECIPE_CUISINES },
      mealTypes: { type: 'array', items: { type: 'string', enum: MEAL_TYPES } },
      whyThisMeal: str,
      usesExpiring: { type: 'array', items: str },
      servings: int,
      prepMinutes: int,
      cookMinutes: int,
      difficulty: { type: 'string', enum: DIFFICULTIES },
      caloriesPerServing: int,
      proteinGramsPerServing: int,
      carbsGramsPerServing: int,
      fatGramsPerServing: int,
      fatLevel: { type: 'string', enum: LEVELS },
      primaryProtein: { type: 'string', enum: PRIMARY_PROTEINS },
      freezerFriendly: { type: 'boolean' },
      leftoverFriendly: { type: 'boolean' },
      ingredients: { type: 'array', items: ingredient },
      method: { type: 'array', items: str }
    }
  };
  return {
    type: 'object',
    additionalProperties: false,
    required: ['meals'],
    properties: { meals: { type: 'array', items: meal } }
  };
}

function buildAiPrompt(items, goals, mealType, request, maxMinutes) {
  const style = EATING_STYLES[goals.eatingStyle] || EATING_STYLES[DEFAULT_EATING_STYLE];
  const kitchen = items.map((i) => ({
    name: i.name,
    location: i.location,
    amount: formatItemQuantity(i),
    states: i.states || [],
    staple: !!i.isStaple,
    daysUntilUseBy: i.expiryDate ? daysUntil(i.expiryDate) : null
  }));
  return [
    'Suggest 3 different meals I can cook, using what is in my kitchen.',
    '',
    `Meal: ${mealType}.`,
    `Calorie target: ${goals.caloriesMin}-${goals.caloriesMax} kcal per serving. Eating style: ${style.label}. ${style.ai}`,
    maxMinutes ? `Fast and easy: each meal must take ${maxMinutes} minutes or less in total (prep plus cooking), with few steps and little washing up.` : null,
    goals.preferredCuisines.length ? `Cuisines I like: ${goals.preferredCuisines.join(', ')}. Mostly suggest these.` : 'Any cuisine is fine; vary them.',
    'Use food with the fewest days until its use-by date first, and say which of those items each meal uses in usesExpiring (exact kitchen item names). Skip anything already past its use-by date (negative days).',
    'Salt, pepper, oil and dried spices count as staples; mark them assumedStaple. Prefer meals that need few or no extra purchases; set inKitchen for each ingredient that is in my kitchen list.',
    'Use metric quantities. Use quantity 0 with an empty unit for "to taste". matchTerms are lower-case names a kitchen item could be called, most specific first (e.g. "chicken thigh", "chicken").',
    'Calories, protein, carbs and fat are per serving and approximate. whyThisMeal is one short sentence.',
    request ? `Also: ${request}` : '',
    '',
    'My kitchen (JSON):',
    JSON.stringify(kitchen)
  ].filter((line) => line !== null).join('\n');
}

async function requestAiSuggestions(mealType, request, maxMinutes) {
  let Anthropic = null;
  try {
    const loaded = await getAnthropicClient();
    Anthropic = loaded.Anthropic;
    const [items, goals] = await Promise.all([dbGetAll('inventoryItems'), getHealthGoals()]);
    const response = await loaded.client.beta.messages.create({
      model: AI_MODEL,
      max_tokens: 16000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: { effort: 'medium', format: { type: 'json_schema', schema: aiSuggestionSchema() } },
      system: 'You are the meal-suggestion feature of PantryFit, a personal kitchen app for a home cook in Australia. Suggest practical, healthy home-cooked meals with clear, concise methods, in the cuisines they say they like.',
      messages: [{ role: 'user', content: buildAiPrompt(items, goals, mealType, request, maxMinutes) }]
    });
    if (response.stop_reason === 'refusal') {
      return { error: 'Claude couldn\'t suggest meals for this request. Try rewording the extra request, or leave it blank.' };
    }
    if (response.stop_reason === 'max_tokens') {
      return { error: 'The suggestions were too long to finish. Try again, maybe with a shorter extra request.' };
    }
    const text = response.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
    const parsed = JSON.parse(text);
    return { meals: Array.isArray(parsed.meals) ? parsed.meals : [] };
  } catch (err) {
    if (err instanceof SyntaxError) return { error: 'Claude\'s reply couldn\'t be read. Please try again.' };
    return { error: describeAiError(err, Anthropic) };
  }
}

function aiMealToRecipe(meal) {
  const fields = normalizeRecipe({
    ...meal,
    proteinLevel: (meal.proteinGramsPerServing || 0) >= 25 ? 'High' : (meal.proteinGramsPerServing || 0) >= 12 ? 'Medium' : 'Low',
    ingredients: (meal.ingredients || []).map((i) => ({ ...i, quantity: i.quantity ? i.quantity : null })),
    notes: meal.whyThisMeal || ''
  });
  const now = new Date().toISOString();
  return {
    ...fields,
    sourceName: 'Claude suggestion',
    seedId: null,
    source: 'ai',
    userModified: false,
    userRating: null,
    partnerRating: null,
    isFavourite: false,
    createdAt: now,
    updatedAt: now
  };
}

function aiMealCardHtml(meal, idx, goals) {
  const needToBuy = (meal.ingredients || []).filter((i) => !i.inKitchen && !i.assumedStaple && !i.optional).map((i) => i.name);
  return `
    <div class="ai-meal" data-idx="${idx}">
      <div class="ai-meal-head">
        <span class="name">${escapeHtml(meal.name)}</span>
        <span class="qty">${(meal.prepMinutes || 0) + (meal.cookMinutes || 0)} min</span>
      </div>
      <div class="meta-row">
        <span class="tag">${escapeHtml(meal.cuisine)}</span>
        ${calorieBadgeHtml(meal.caloriesPerServing, goals)}
        <span class="tag tag-protein">~${escapeHtml(meal.proteinGramsPerServing)} g protein</span>
        ${meal.carbsGramsPerServing != null ? `<span class="tag">~${escapeHtml(meal.carbsGramsPerServing)} g carbs</span>` : ''}
        ${meal.fatGramsPerServing != null ? `<span class="tag">~${escapeHtml(meal.fatGramsPerServing)} g fat</span>` : ''}
      </div>
      <p class="ai-why">${escapeHtml(meal.whyThisMeal)}</p>
      ${meal.usesExpiring && meal.usesExpiring.length ? `<p class="match-line uses">Uses up: ${escapeHtml(meal.usesExpiring.join(', '))}</p>` : ''}
      <p class="match-line">${needToBuy.length ? `Need: ${escapeHtml(needToBuy.join(', '))}` : 'You have everything'}</p>
      <details class="more-fields">
        <summary>Ingredients & method</summary>
        <ul class="ingredient-list">${(meal.ingredients || []).map((ing) => `
          <li><span class="ing-qty">${escapeHtml(formatIngredientQuantity({ quantity: ing.quantity || null, unit: ing.unit }))}</span>
          <span class="ing-name">${escapeHtml(ing.name)}${ing.prepNote ? `<span class="ing-note">, ${escapeHtml(ing.prepNote)}</span>` : ''}${ing.inKitchen ? ' <span class="ing-have">✓</span>' : ''}</span></li>`).join('')}
        </ul>
        <ol class="method-list" style="margin-top:10px;">${(meal.method || []).map((s) => `<li>${escapeHtml(s)}</li>`).join('')}</ol>
      </details>
      <button type="button" class="btn-primary ai-save-btn" data-idx="${idx}">Save to my recipes</button>
    </div>
  `;
}

function openAiSuggest() {
  const hasKey = !!getAiKey();
  openModal(`
    <div class="modal-title-row">
      <h2>✨ Suggest meals</h2>
      <button class="close-btn" id="modal-close">×</button>
    </div>
    <div class="modal-scroll-area" id="ai-body">
      ${hasKey ? `

        <div class="field">
          <label>Meal</label>
          <div class="segmented" id="ai-mealType">

          </div>
        </div>

          <label>Time</label>
          <div class="segmented" id="ai-time">
            ${[['0', 'Any'], ['30', '≤ 30 min'], ['15', '⚡ 15 min']].map(([v, l]) => `<button type="button" data-val="${v}" class="${v === '0' ? 'selected' : ''}">${l}</button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>Anything in particular? <span style="text-transform:none;font-weight:500;">(optional)</span></label>

        </div>
        <button type="button" class="btn-primary" id="ai-go">Suggest 3 meals</button>
        <div id="ai-results"></div>
      ` : `
        <div class="empty-state">
          <div class="glyph">✨</div>
          <h3>Add your API key first</h3>
          <p>AI suggestions use your own Anthropic account. Add your key in Settings → AI suggestions.</p>
        </div>
        <button type="button" class="btn-primary" id="ai-to-settings">Go to Settings</button>
      `}
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  if (!hasKey) {
    document.getElementById('ai-to-settings').addEventListener('click', () => { closeModal(); navigateTo('settings'); });
    return;
  }
  document.querySelectorAll('#ai-mealType button, #ai-time button').forEach((btn) => {
    btn.addEventListener('click', () => {
      btn.parentElement.querySelectorAll('button').forEach((b) => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });
  document.getElementById('ai-go').addEventListener('click', runAiSuggest);
}

async function runAiSuggest() {
  const goBtn = document.getElementById('ai-go');
  const results = document.getElementById('ai-results');
  const mealType = document.querySelector('#ai-mealType button.selected')?.dataset.val || 'Dinner';
  const request = document.getElementById('ai-request').value.trim();
  const maxMinutes = parseInt(document.querySelector('#ai-time button.selected')?.dataset.val || '0', 10);
  goBtn.disabled = true;
  goBtn.textContent = 'Thinking…';
  results.innerHTML = '<p class="recipe-muted ai-wait">Looking through your kitchen…</p>';

  const [outcome, goals] = await Promise.all([requestAiSuggestions(mealType, request, maxMinutes), getHealthGoals()]);
  if (!document.getElementById('ai-results')) return; // sheet was closed while waiting
  goBtn.disabled = false;
  goBtn.textContent = 'Suggest 3 more';

  if (outcome.error) {
    results.innerHTML = `<p class="ai-error">${escapeHtml(outcome.error)}</p>`;
    return;
  }
  if (!outcome.meals.length) {
    results.innerHTML = '<p class="ai-error">No suggestions came back. Please try again.</p>';
    return;
  }
  results.innerHTML = outcome.meals.map((m, i) => aiMealCardHtml(m, i, goals)).join('');
  results.querySelectorAll('.ai-save-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const meal = outcome.meals[parseInt(btn.dataset.idx, 10)];
      const existing = await dbGetAll('recipes');
      if (existing.some((r) => r.name.toLowerCase() === meal.name.toLowerCase())) {
        btn.textContent = 'Already in your recipes';
        btn.disabled = true;
        return;
      }
      await dbPut('recipes', aiMealToRecipe(meal));
      btn.textContent = '✓ Saved';
      btn.disabled = true;
      showToast('Saved to your recipes');
      if (AppState.route === 'recipes') renderRoute();
    });
  });
}

  'traditional', 'recipe', 'recipes', 'the', 'with', 'and', 'a', 'an', 'of', 'my', 'mums', 'mum', 'nans', 'healthy', 'spicy', 'mild', 'classic', 'made']);
const AREA_WORDS = { indian: 'Indian', chinese: 'Chinese', thai: 'Thai', japanese: 'Japanese', italian: 'Italian', mexican: 'Mexican', greek: 'Greek',
  french: 'French', vietnamese: 'Vietnamese', malaysian: 'Malaysian', filipino: 'Filipino', turkish: 'Turkish', moroccan: 'Moroccan', spanish: 'Spanish',
  british: 'British', american: 'American', australian: 'Australian', jamaican: 'Jamaican', 'sri': 'Indian', lankan: 'Indian', keralan: 'Indian', kerala: 'Indian' };

function searchWords(query) {
  return matchWords(query).split(' ').filter(Boolean).map((w) => DISH_SPELLINGS[w] || w);
}

// Searches TheMealDB several ways (whole phrase, each main word, ingredient, cuisine) and ranks
// the results by how many of the words in the search they match
async function searchMealDb(query) {
  const words = searchWords(query);
  const area = words.map((w) => AREA_WORDS[w]).find(Boolean);
  const main = words.filter((w) => !SEARCH_FILLER.has(w) && !AREA_WORDS[w] && w.length >= 3);
  const phrase = main.join(' ') || words.join(' ');
  const requests = [
    mealDbFetch(`search.php?s=${encodeURIComponent(phrase)}`),
    ...main.slice(0, 4).map((w) => mealDbFetch(`search.php?s=${encodeURIComponent(w)}`)),
    ...main.slice(0, 2).map((w) => mealDbFetch(`filter.php?i=${encodeURIComponent(w)}`)),
    ...(area ? [mealDbFetch(`filter.php?a=${encodeURIComponent(area)}`)] : [])
  ].map((p) => p.catch(() => null));
  const lists = await Promise.all(requests);
  if (lists.every((l) => l === null)) throw new Error('TheMealDB unreachable');
  const areaIds = new Set(area ? (lists[lists.length - 1] || []).map((m) => m.idMeal) : []);
  const byId = new Map();
  lists.forEach((l) => (l || []).forEach((m) => { if (!byId.has(m.idMeal)) byId.set(m.idMeal, m); }));
  const score = (m) => {
    const name = ` ${matchWords(m.strMeal)} `;
    const hits = main.filter((w) => name.includes(` ${w} `) || name.includes(` ${w}`)).length;
    return hits * 10 + (areaIds.has(m.idMeal) || m.strArea === area ? 3 : 0);
  };
  const ranked = [...byId.values()].map((m) => ({ m, s: score(m) })).sort((a, b) => b.s - a.s || a.m.strMeal.localeCompare(b.m.strMeal));
  // With dish words to match, only keep results that match at least one of them
  const best = ranked.filter((x) => x.s >= 10);
  return (best.length ? best : ranked).map((x) => x.m);
}

// One recipe for a dish named by the person, from Claude (same shape as meal suggestions)
async function requestAiNamedRecipe(dish, options = {}) {
  const { matchMacros = false, usePantry = false } = options;
  let Anthropic = null;
  try {
    const loaded = await getAnthropicClient();
    Anthropic = loaded.Anthropic;
    const [items, goals] = await Promise.all([dbGetAll('inventoryItems'), getHealthGoals()]);
    const style = EATING_STYLES[goals.eatingStyle] || EATING_STYLES[DEFAULT_EATING_STYLE];
    const response = await loaded.client.beta.messages.create({
      model: AI_MODEL,
      max_tokens: 8000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: { effort: 'medium', format: { type: 'json_schema', schema: aiSuggestionSchema() } },
      system: 'You are the recipe feature of PantryFit, a personal kitchen app for a home cook in Australia. Write practical home-cooking recipes with clear, concise methods, true to the dish and region asked for.',
      messages: [{ role: 'user', content: [
        `Give me exactly 1 recipe for: ${dish}.`,
        'Keep it true to the style and region named (e.g. South Indian means South Indian techniques and spices). Use the dish as its name, tidied up.',
        matchMacros
          ? `Match my eating style: ${style.label.toLowerCase()} (${style.ai}) and about ${goals.caloriesMin}-${goals.caloriesMax} kcal per serving. Swap in lighter options where it still works (lean cuts, light coconut milk, less oil, Greek yoghurt for cream); if a swap would make it not that dish any more, keep the dish and say so briefly in whyThisMeal.`
          : `If it fits the dish, lean towards ${style.label.toLowerCase()} (${style.ai}) and about ${goals.caloriesMin}-${goals.caloriesMax} kcal per serving, but don't change what the dish is.`,
        usePantry
          ? 'Mostly use ingredients from my kitchen list. Where the dish needs something I don\'t have, use the closest ingredient I do have if the dish still works (e.g. gingelly oil → sesame oil, then any neutral oil I have; thai basil → regular basil). List what I\'d still need to buy as "needToBuy" items only when there is no reasonable swap. Set inKitchen for ingredients in my kitchen list.'
          : 'Use metric quantities; quantity 0 with an empty unit for "to taste". Salt, pepper, oil and dried spices are assumedStaple. Set inKitchen for ingredients in my kitchen list. matchTerms are lower-case names a kitchen item could be called.',
        'Use metric quantities; quantity 0 with an empty unit for "to taste". Salt, pepper, oil and dried spices are assumedStaple. matchTerms are lower-case names a kitchen item could be called.',
        'Calories, protein, carbs and fat are per serving and approximate. usesExpiring lists kitchen items it uses that are close to their use-by. whyThisMeal is one short sentence about the dish.',
        '', 'My kitchen (JSON):',
        JSON.stringify(items.map((i) => ({ name: i.name, daysUntilUseBy: i.expiryDate ? daysUntil(i.expiryDate) : null })))
      ].join('\n') }]
    });
    if (response.stop_reason === 'refusal') return { error: 'Claude couldn\'t write that recipe. Try describing the dish differently.' };
    const parsed = JSON.parse(response.content.filter((b) => b.type === 'text').map((b) => b.text).join(''));
    return { meal: (parsed.meals || [])[0] || null };
  } catch (err) {
    if (err instanceof SyntaxError) return { error: 'Claude\'s reply couldn\'t be read. Please try again.' };
    return { error: describeAiError(err, Anthropic) };
  }
}

// TheMealDB measures are free text ("1 tbs", "1.2 kg", "5 thinly sliced", "to taste"):
// take a leading amount and a known unit, and keep anything else as the prep note.
const MEALDB_UNIT_ALIASES = { ...RECIPE_UNIT_ALIASES, tbs: 'tbsp', tbls: 'tbsp', tblsp: 'tbsp', tsps: 'tsp', ml: 'ml', g: 'g', kg: 'kg' };
function parseMealDbMeasure(measure) {
  let text = String(measure || '').trim();
  let quantity = null;
  let unit = '';
  const qtyMatch = text.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔])\s*(.*)$/);
  if (qtyMatch) {
    const parsed = parseQuantity(qtyMatch[1]);
    if (Number.isFinite(parsed)) {
      quantity = parsed;
      text = qtyMatch[2];
      const unitMatch = text.match(/^([A-Za-z]+)\.?(?:\s+|$)(.*)$/);
      if (unitMatch && MEALDB_UNIT_ALIASES[unitMatch[1].toLowerCase()]) {
        unit = MEALDB_UNIT_ALIASES[unitMatch[1].toLowerCase()];
        text = unitMatch[2];
      }
    }
  }
  return { quantity, unit, note: text.trim() };
}

function mealDbToRecipe(meal) {
  const knownLookup = buildKnownIngredientLookup(null);
  const ingredients = [];
  for (let n = 1; n <= 20; n++) {
    const name = (meal[`strIngredient${n}`] || '').trim();
    if (!name) continue;
    const { quantity, unit, note } = parseMealDbMeasure(meal[`strMeasure${n}`]);
    const key = name.toLowerCase();
    const known = knownLookup.get(key) || knownLookup.get(key.replace(/(?:es|s)$/, ''));
    ingredients.push(normalizeRecipeIngredient({
      name,
      quantity,
      unit,
      prepNote: note,
      category: known ? known.category : 'Other',
      matchTerms: known ? known.matchTerms : [key],
      assumedStaple: known ? known.assumedStaple : false
    }));
  }
  const method = String(meal.strInstructions || '')
    .split(/\r?\n+/)
    .map((s) => s.replace(/^\s*(step\s*\d+[:.)]?|\d+[.)])\s*/i, '').trim())
    .filter((s) => s.length > 1);
  const cuisine = RECIPE_CUISINES.includes(meal.strArea) ? meal.strArea : (MEALDB_AREA_TO_CUISINE[meal.strArea] || 'Western');
  const fields = normalizeRecipe({
    name: meal.strMeal,
    cuisine,
    mealTypes: meal.strCategory === 'Breakfast' ? ['Breakfast'] : ['Lunch', 'Dinner'],
    primaryProtein: MEALDB_CATEGORY_PROTEIN[meal.strCategory] || 'None',
    ingredients,
    method,
    notes: [meal.strArea ? `${meal.strArea} ${meal.strCategory || ''}`.trim() : '', meal.strSource ? `Original: ${meal.strSource}` : '']
      .filter(Boolean).join('\n')
  });
  const now = new Date().toISOString();
  return {
    ...fields,
    sourceName: 'TheMealDB',
    seedId: null,
    source: 'online',
    userModified: false,
    userRating: null,
    partnerRating: null,
    isFavourite: false,
    createdAt: now,
    updatedAt: now
  };
}

      box.innerHTML = aiMealCardHtml(outcome.meal, 0, goals);
      box.querySelector('details').open = true;
      box.querySelector('.ai-save-btn').addEventListener('click', async (ev) => {
        const save = ev.currentTarget;
        const existing = await dbGetAll('recipes');
        if (existing.some((r) => r.name.toLowerCase() === outcome.meal.name.toLowerCase())) { save.textContent = 'Already in your recipes'; save.disabled = true; return; }
        await dbPut('recipes', aiMealToRecipe(outcome.meal));
        save.textContent = '✓ Saved';

        if (AppState.route === 'recipes') renderRoute();

    });

  document.getElementById('online-q').addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });

  }));
}

/* ============================================================
   ITEM CALORIES
   Stored per item as kcal per 100 g or 100 ml, with where the number
   came from: read off a label, estimated by AI, or typed in.
   ============================================================ */
// Protein / carbs / fat per 100 g or ml: a number, or null when unknown
function macroOrNull(value) {
  const n = Number(value);
  return Number.isFinite(n) && n > 0 ? Math.round(n * 10) / 10 : null;
}

function macrosFrom(source) {
  return { proteinPer100: macroOrNull(source.proteinPer100), carbsPer100: macroOrNull(source.carbsPer100), fatPer100: macroOrNull(source.fatPer100) };
}

// For an ingredient the kitchen doesn't have, suggest the first in-kitchen alternative from its family
function suggestSwapFor(ing, kitchenNames) {
  const name = (ing.name || '').toLowerCase().trim();
  const terms = [name, ...(ing.matchTerms || []).map((t) => t.toLowerCase())];
  const family = INGREDIENT_FAMILIES.find((f) => f.some((m) => terms.some((t) => t.includes(m))));
  if (!family) return null;
  // Something from the kitchen that's in the same family, closest first
  const pick = family.find((n) => kitchenNames.some((k) => k === n || k.includes(n) || n.includes(k)));
  if (!pick) return null;
  const kitchenMatch = kitchenNames.find((k) => k === pick || k.includes(pick) || pick.includes(k)) || pick;
  // Don't suggest swapping to the same thing
  if (terms.some((t) => t === kitchenMatch || t.includes(kitchenMatch) || kitchenMatch.includes(t))) return null;
  return kitchenMatch;
}

// The most specific food whose name appears as whole words in the text: "lean beef mince" beats "mince"
function findFood(text) {
  const words = ` ${matchWords(text)} `;
  let best = null;
  for (const entry of FOOD_NUTRITION_INDEX) {
    if (entry.words && words.includes(` ${entry.words} `) && (!best || entry.words.length > best.words.length)) best = entry;
  }
  return best ? best.food : null;
}

function gramsOf(quantity, unit, food) {
  if (quantity == null || !Number.isFinite(quantity)) return null;
  const u = unit || 'each';
  if (u === 'each') return food.each ? quantity * food.each : null;
  const per = food[u] || UNIT_GRAMS[u];
  return per ? quantity * per : null;
}

// The calorie fields for a new kitchen item, from typical values when the app knows the food
function typicalItemFields(name) {
  const t = typicalNutritionFor(name);
  return t ? { ...t, caloriesSource: 'typical' } : {};
}

// Typical per-100 g values for a kitchen item's name, or null if it isn't a food the app knows
function typicalNutritionFor(name) {
  const food = findFood(name);
  if (!food || !food.kcal) return null;
  const liquid = /\b(milk|stock|broth|juice|oil|sauce|cream|water)\b/i.test(name);
  return { caloriesPer100: food.kcal, caloriesUnit: liquid ? 'ml' : 'g', proteinPer100: food.p, carbsPer100: food.c, fatPer100: food.f };
}

/* Works out calories and macros per serving from a list of ingredients.
   A kitchen item with its own saved values (e.g. from its label) is used before the typical values.
   Returns the per-serving numbers and which ingredients were and weren't counted. */
function nutritionFromIngredients(ingredients, servings, kitchenItems = []) {
  const index = buildInventoryIndex(kitchenItems.filter((i) => i.caloriesPer100));
  const total = { kcal: 0, protein: 0, carbs: 0, fat: 0 };
  const counted = [];
  const missing = [];
  for (const ing of ingredients || []) {
    if (ing.optional) continue;
    const kitchen = index.length ? findInventoryMatch(ing, index) : null;
    const typical = findFood([ing.name, ...(ing.matchTerms || [])].join(' | '));
    // Kitchen item values win; the typical entry still supplies weights like "1 each = 150 g"
    const food = ing.nutrition
      ? { ...(typical || {}), kcal: ing.nutrition.kcal, p: ing.nutrition.p || 0, c: ing.nutrition.c || 0, f: ing.nutrition.f || 0, edible: 1, ...(ing.nutrition.tsp ? { tsp: ing.nutrition.tsp } : {}), ...(ing.nutrition.tbsp ? { tbsp: ing.nutrition.tbsp } : {}) }
      : kitchen
      ? { ...(typical || {}), kcal: kitchen.item.caloriesPer100, p: kitchen.item.proteinPer100 ?? (typical ? typical.p : 0), c: kitchen.item.carbsPer100 ?? (typical ? typical.c : 0), f: kitchen.item.fatPer100 ?? (typical ? typical.f : 0) }
      : typical;
    if (!food) { if (!ing.assumedStaple) missing.push(ing.name); continue; }
    if (ing.quantity == null) { if (food.kcal && !ing.assumedStaple && !/salt|pepper|water/i.test(ing.name)) missing.push(`${ing.name} (no amount)`); continue; }
    const grams = gramsOf(ing.quantity, ing.unit, food);
    if (grams == null) { missing.push(`${ing.name} (${ing.unit || 'each'})`); continue; }
    const k = (grams * (food.edible || 1)) / 100;
    total.kcal += food.kcal * k;
    total.protein += (food.p || 0) * k;
    total.carbs += (food.c || 0) * k;
    total.fat += (food.f || 0) * k;
    counted.push(ing.name);
  }
  const s = servings && servings > 0 ? servings : 1;
  return {
    perServing: { kcal: Math.round(total.kcal / s), protein: Math.round(total.protein / s), carbs: Math.round(total.carbs / s), fat: Math.round(total.fat / s) },
    counted,
    missing
  };
}

function itemCaloriesText(item) {
  if (!item.caloriesPer100) return '';
  return `${Math.round(item.caloriesPer100)} kcal/100${item.caloriesUnit === 'ml' ? 'ml' : 'g'}`;

// Estimate calories from the item's name alone (no photo). Returns { caloriesPer100, caloriesUnit } or { error }.
async function estimateItemCalories(name, category) {
  let Anthropic = null;
  try {
    const loaded = await getAnthropicClient();
    Anthropic = loaded.Anthropic;
    const response = await loaded.client.beta.messages.create({
      model: AI_MODEL,
      max_tokens: 2000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: {
        effort: 'low',
        format: {
          type: 'json_schema',
          schema: {
            type: 'object',
            additionalProperties: false,
            required: ['caloriesPer100', 'caloriesUnit', 'proteinPer100', 'carbsPer100', 'fatPer100'],
            properties: {
              caloriesPer100: { type: 'number' },
              caloriesUnit: { type: 'string', enum: ['g', 'ml'] },
              proteinPer100: { type: 'number' },
              carbsPer100: { type: 'number' },
              fatPer100: { type: 'number' }
            }
          }
        }
      },
      messages: [{
        role: 'user',
        content: `Typical nutrition of this food as sold in Australian supermarkets, per 100 g (or per 100 ml for liquids and sauces sold by volume): energy in kcal, and protein, carbohydrate and fat in grams. Use 0 for everything if it isn't a food or you can't tell.\nItem: ${name}\nCategory: ${category || 'unknown'}`
      }]
    });
    if (response.stop_reason === 'refusal') return { error: 'Claude couldn\'t estimate this one. Enter it from the label instead.' };
    const text = response.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
    const parsed = JSON.parse(text);
    if (!parsed.caloriesPer100) return { error: 'Claude couldn\'t tell for this item. Enter it from the label instead.' };
    return parsed;
  } catch (err) {
    if (err instanceof SyntaxError) return { error: 'Claude\'s reply couldn\'t be read. Please try again.' };
    return { error: describeAiError(err, Anthropic) };
  }
}

/* ============================================================
   PHOTO SCAN
   Photos of a shelf, fridge or a few jars go to Claude, which lists the
   items it can see (reading labels for names, sizes and calories where
   visible). Nothing is saved until the person confirms the list.
   ============================================================ */
const PHOTO_MAX_EDGE = 1568; // larger images cost more and aren't read any better
const PHOTO_MAX_COUNT = 5;

// Shrink a photo on the phone and return base64 JPEG (without the data: prefix)
function photoToBase64Jpeg(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, PHOTO_MAX_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      resolve({ data: dataUrl.split(',')[1], preview: dataUrl });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Couldn\'t read that photo')); };
    img.src = url;
  });
}

function photoScanSchema() {
  return {
    type: 'object',
    additionalProperties: false,
    required: ['items'],
    properties: {
      items: {
        type: 'array',
        items: {
          type: 'object',
          additionalProperties: false,
          required: ['name', 'category', 'quantity', 'unit', 'states', 'isStaple', 'caloriesPer100', 'caloriesUnit', 'caloriesSource', 'proteinPer100', 'carbsPer100', 'fatPer100', 'confidence'],
          properties: {
            name: { type: 'string' },
            category: { type: 'string', enum: CATEGORIES },
            quantity: { type: 'number' },
            unit: { type: 'string', enum: ITEM_UNITS },
            states: { type: 'array', items: { type: 'string', enum: STATES_V2 } },
            isStaple: { type: 'boolean' },
            caloriesPer100: { type: 'number' },
            caloriesUnit: { type: 'string', enum: ['g', 'ml'] },
            caloriesSource: { type: 'string', enum: ['label', 'estimated', 'unknown'] },
            proteinPer100: { type: 'number' },
            carbsPer100: { type: 'number' },
            fatPer100: { type: 'number' },
            confidence: { type: 'string', enum: ['high', 'medium', 'low'] }

}

    Anthropic = loaded.Anthropic;
    const instructions = [
      `These photos show food in my ${LOCATION_LABELS[location].toLowerCase()} in Brisbane, Australia. List each distinct food item you can see.`,
      '- name: what I would call it, with the brand if the label shows one, e.g. "Kikkoman Soy Sauce", "Mutti Crushed Tomatoes", "Basmati rice".',
      '- quantity and unit: how many of that item (e.g. 3 cans, 2 bottles, 1 jar), or the pack size in metric if there is just one (e.g. 1 kg, 500 g, 750 ml). Count identical items once with the total.',
      '- states: Frozen for freezer items; Opened if clearly opened; Fresh for fresh produce; otherwise Raw.',
      '- isStaple: true for salt, pepper, oils, dried spices, rice, flour, dals, soy sauce and similar basics.',
      '- caloriesPer100: energy in kcal per 100 g, or per 100 ml (caloriesUnit "ml") for liquids and sauces sold by volume. If a nutrition panel is readable, use it and set caloriesSource "label" (convert kJ to kcal by dividing by 4.184). Otherwise give a typical value and set "estimated". Use 0 with "unknown" if you can\'t tell.',
      '- proteinPer100, carbsPer100, fatPer100: grams per 100 g (or ml), from the same nutrition panel or typical values. 0 if unknown.',
      '- confidence: low if the item is partly hidden or you are guessing what it is.',
      'Skip non-food items. If the photos show nothing you can identify, return an empty list.'
    ].join('\n');
    const content = [
      ...photos.map((p) => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: p.data } })),
      { type: 'text', text: instructions }
    ];
    const response = await loaded.client.beta.messages.create({
      model: AI_MODEL,
      max_tokens: 16000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: { effort: 'medium', format: { type: 'json_schema', schema: photoScanSchema() } },
      messages: [{ role: 'user', content }]
    });
    if (response.stop_reason === 'refusal') return { error: 'Claude couldn\'t read these photos. Try different photos.' };
    if (response.stop_reason === 'max_tokens') return { error: 'Too many items to list in one go. Try fewer photos at a time.' };
    const text = response.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
    const parsed = JSON.parse(text);
    return { items: Array.isArray(parsed.items) ? parsed.items : [] };
  } catch (err) {
    if (err instanceof SyntaxError) return { error: 'Claude\'s reply couldn\'t be read. Please try again.' };
    return { error: describeAiError(err, Anthropic) };
  }
}

function renderPhotoScanBody() {
  const body = document.getElementById('ps-body');
  if (!body) return;
  const thumbs = PhotoScan.photos.map((p, i) => `
    <div class="ps-thumb"><img src="${p.preview}" alt="Photo ${i + 1}"><button type="button" class="ps-remove" data-i="${i}" aria-label="Remove photo">×</button></div>`).join('');

  if (!PhotoScan.rows.length) {
    body.innerHTML = `
      <p class="st-intro">Photograph a shelf, the fridge door, or a few jars. For calories, include the nutrition panels on the back. Up to ${PHOTO_MAX_COUNT} photos.</p>
      <div class="ps-thumbs">${thumbs}
        ${PhotoScan.photos.length < PHOTO_MAX_COUNT ? '<label class="ps-add">📷<span>Add photo</span><input type="file" id="ps-file" accept="image/*" multiple hidden></label>' : ''}
      </div>
      <p class="ai-error" id="ps-error"></p>
    `;
  } else {
    const selected = PhotoScan.rows.filter((r) => r.selected).length;
    body.innerHTML = `
      <p class="st-intro">Here's what Claude found. Untick anything wrong and fix names, amounts or calories before adding.</p>
      ${PhotoScan.rows.map(photoScanRowHtml).join('')}
      <p class="recipe-muted">${selected} of ${PhotoScan.rows.length} ticked.</p>

function updatePhotoScanButton() {
  const btn = document.getElementById('ps-action');
  if (!btn) return;
  if (!PhotoScan.rows.length) {
    btn.textContent = PhotoScan.photos.length ? `Read ${PhotoScan.photos.length} photo${PhotoScan.photos.length === 1 ? '' : 's'}` : 'Add a photo first';
    btn.disabled = !PhotoScan.photos.length;
  } else {
    const n = PhotoScan.rows.filter((r) => r.selected).length;
    btn.textContent = n ? `Save ${n} item${n === 1 ? '' : 's'}` : 'Tick items to save';
    btn.disabled = !n;
  }
}

function attachPhotoScanListeners() {
  const file = document.getElementById('ps-file');
  if (file) {
    file.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []).slice(0, PHOTO_MAX_COUNT - PhotoScan.photos.length);
      for (const f of files) {
        try { PhotoScan.photos.push(await photoToBase64Jpeg(f)); } catch (err) { showToast(err.message); }
      }
      renderPhotoScanBody();
    });
  }
  document.querySelectorAll('.ps-remove').forEach((btn) => btn.addEventListener('click', () => {
    PhotoScan.photos.splice(parseInt(btn.dataset.i, 10), 1);
    renderPhotoScanBody();
  }));

  document.querySelectorAll('.ps-row').forEach((rowEl) => {
    const row = PhotoScan.rows[parseInt(rowEl.dataset.i, 10)];
    rowEl.querySelector('.ps-tick').addEventListener('click', () => {
      row.selected = !row.selected;
      const scroll = document.getElementById('ps-body').scrollTop;
      renderPhotoScanBody();
      document.getElementById('ps-body').scrollTop = scroll;
    });
    rowEl.querySelector('.ps-name').addEventListener('input', (e) => { row.name = e.target.value; });
    rowEl.querySelector('.ps-qty').addEventListener('input', (e) => { row.quantity = e.target.value === '' ? null : parseFloat(e.target.value); });
    rowEl.querySelector('.ps-unit').addEventListener('change', (e) => { row.unit = e.target.value; });
    rowEl.querySelector('.ps-cat').addEventListener('change', (e) => { row.category = e.target.value; });
    rowEl.querySelector('.ps-kcal').addEventListener('input', (e) => {
      row.caloriesPer100 = e.target.value === '' ? null : parseFloat(e.target.value);
      row.caloriesSource = 'manual';
      rowEl.querySelector('.ps-knote').textContent = '';
    });
    rowEl.querySelector('.ps-kunit').addEventListener('change', (e) => { row.caloriesUnit = e.target.value; });
  });
}

      <button class="close-btn" id="modal-close">×</button>
    </div>
    <div class="segmented" id="ps-location" style="margin-bottom:10px;">
      ${['pantry', 'fridge', 'freezer'].map((loc) => `<button type="button" data-val="${loc}" class="${loc === PhotoScan.location ? 'selected' : ''}">${LOCATION_LABELS[loc]}</button>`).join('')}

function closePhotoScan() {
  if ((PhotoScan.rows.some((r) => r.selected) || PhotoScan.photos.length) && !confirm('Close without saving?')) return;
  PhotoScan.photos = [];
  PhotoScan.rows = [];
  closeModal();
}

// Items already in the kitchen at this location get updated (calories, and amount if it had none) instead of duplicated
async function markExistingRows() {
  const items = await dbGetAll('inventoryItems');
  PhotoScan.rows.forEach((row) => {
    const words = matchWords(row.name);
    const match = items.find((i) => i.location === PhotoScan.location && matchWords(i.name) === words);
    row.existingId = match ? match.id : null;
  });
}

async function readPhotos() {
  const btn = document.getElementById('ps-action');
  btn.disabled = true;
  btn.textContent = 'Reading photos… (up to a minute)';
  const outcome = await requestPhotoScan(PhotoScan.photos, PhotoScan.location);
  if (!document.getElementById('ps-body')) return; // closed while waiting
  if (outcome.error || !outcome.items.length) {
    renderPhotoScanBody();
    document.getElementById('ps-error').textContent = outcome.error || 'No food items were recognised. Try a closer, brighter photo.';
    return;
  }
  PhotoScan.rows = outcome.items.map((it) => ({
    name: it.name,
    category: it.category,
    quantity: it.quantity || null,
    unit: it.unit,
    states: it.states && it.states.length ? it.states : (PhotoScan.location === 'freezer' ? ['Frozen'] : ['Raw']),
    isStaple: !!it.isStaple,
    caloriesPer100: it.caloriesSource === 'unknown' ? null : (it.caloriesPer100 || null),
    caloriesUnit: it.caloriesUnit,
    caloriesSource: it.caloriesSource === 'unknown' ? null : it.caloriesSource,
    ...(it.caloriesSource === 'unknown' ? {} : macrosFrom(it)),
    confidence: it.confidence,
    selected: true
  }));
  await markExistingRows();
  renderPhotoScanBody();
  document.getElementById('ps-body').scrollTop = 0;
}

async function savePhotoScan() {
  const rows = PhotoScan.rows.filter((r) => r.selected && r.name.trim());
  const btn = document.getElementById('ps-action');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  const now = new Date().toISOString();
  let added = 0;
  let updated = 0;
  try {
    for (const row of rows) {
      const calories = row.caloriesPer100
        ? { caloriesPer100: row.caloriesPer100, caloriesUnit: row.caloriesUnit === 'ml' ? 'ml' : 'g', caloriesSource: row.caloriesSource || 'manual', ...macrosFrom(row) }
        : {};
      if (row.existingId) {
        const item = await dbGet('inventoryItems', row.existingId);
        if (!item) continue;
        Object.assign(item, calories, { updatedAt: now });
        if ((item.quantity === null || item.quantity === undefined || item.quantity === 0) && row.quantity) {
          item.quantity = row.quantity;
          item.unit = row.unit;
        }
        await dbPut('inventoryItems', item);
        await logHistory(item.id, 'adjusted', null, item.location, item.location, 'Updated from photo scan');
        updated++;
      } else {
        const suggestion = await getSuggestedUseBy(row.name, row.states);
        const newId = await dbPut('inventoryItems', {
          name: row.name.trim(),
          quantity: row.quantity || null,
          unit: row.unit,
          portionCount: null,
          portionSize: null,
          location: PhotoScan.location,
          subLocation: null,
          states: row.states,
          category: row.category,
          isStaple: row.isStaple,
          purchaseDate: null,
          expiryDate: suggestion ? localDateString(addDays(new Date(), suggestion.suggestedDaysMax)) : null,
          useByOverrideDays: null,
          cost: null,
          notes: '',
          freezerFriendlyRating: null,
          linkedPurchaseEventId: null,
          caloriesPer100: null,
          caloriesUnit: null,
          caloriesSource: null,
          ...calories,
          createdAt: now,
          updatedAt: now
        });
        await logHistory(newId, 'created', row.quantity || null, null, PhotoScan.location, 'Added from photo scan');
        added++;
      }
    }
    PhotoScan.photos = [];
    PhotoScan.rows = [];
    closeModal();
    const summary = [added ? `added ${added}` : '', updated ? `updated ${updated}` : ''].filter(Boolean).join(', ');
    showToast(summary ? summary[0].toUpperCase() + summary.slice(1) : 'Nothing saved');
    renderRoute();
  } catch (err) {
    updatePhotoScanButton();
    alert('Couldn\'t save: ' + (err && err.message ? err.message : 'unknown storage error'));
  }
}

/* ============================================================
   BARCODE SCAN
   Camera barcode reading (BarcodeDetector, built into Chrome on Android)
   or a typed number, looked up in Open Food Facts for the product name,
   brand, pack size and calories. The person confirms before saving.
   ============================================================ */
const OFF_PRODUCT_URL = 'https://world.openfoodfacts.org/api/v2/product/';
const OFF_FIELDS = 'code,serving_quantity,product_name,product_name_en,brands,quantity,product_quantity,product_quantity_unit,nutriments,nutrition_data_per,categories_tags,image_front_small_url';
const BARCODE_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e'];

// Open Food Facts category tags → app category (first match wins)
const OFF_CATEGORY_RULES = [
  [/sauces|condiments|ketchup|mayonnaise|dressings|vinegars|oils/, 'Sauces & Condiments'],
  [/spices|herbs|seasonings|salts|curry-powders/, 'Spices & Seasonings'],
  [/canned|tinned/, 'Canned & Jarred'],
  [/frozen-ready-meals|ready-meals|prepared-meals/, 'Ready Meals'],
  [/dairies|milks|cheeses|yogurts|creams|butters/, 'Dairy & Refrigerated'],
  [/meats|poultry|fishes|seafood|eggs|tofu/, 'Protein'],
  [/rices|pastas|noodles|flours|cereals|breads|grains|legumes|lentils/, 'Carbs & Grains'],
  [/snacks|chocolates|biscuits|confectioneries|crisps|chips|sweets/, 'Snacks & Treats'],
  [/fruits/, 'Fruit'],
  [/vegetables/, 'Vegetables']
];

function offCategory(tags) {
  const joined = (tags || []).join(' ');
  const rule = OFF_CATEGORY_RULES.find(([re]) => re.test(joined));
  return rule ? rule[1] : 'Other';
}

// Turn an Open Food Facts product into the fields the confirm screen edits
function offToScanRow(code, p) {
  const brand = (p.brands || '').split(',')[0].trim();
  const baseName = (p.product_name_en || p.product_name || '').trim();
  const name = brand && baseName && !baseName.toLowerCase().includes(brand.toLowerCase()) ? `${brand} ${baseName}` : (baseName || brand);
  const category = offCategory(p.categories_tags);

  let sizeQty = Number(p.product_quantity) || null;
  let sizeUnit = (p.product_quantity_unit || '').toLowerCase();
  if (!sizeQty && p.quantity) {
    const m = String(p.quantity).match(/([\d.,]+)\s*(kg|g|ml|l)\b/i);
    if (m) { sizeQty = parseFloat(m[1].replace(',', '.')); sizeUnit = m[2].toLowerCase(); }
  }
  const isVolume = sizeUnit === 'ml' || sizeUnit === 'l' || (p.nutrition_data_per || '').includes('ml');
  const n = p.nutriments || {};
  const kcal = n['energy-kcal_100g'] ?? n['energy-kcal_100ml'] ?? (n.energy_100g ? n.energy_100g / 4.184 : null);

  // Cans, jars and bottles are easier to count; everything else starts at its pack size
  const countUnit = category === 'Canned & Jarred' ? 'can' : (category === 'Sauces & Condiments' && isVolume ? 'bottle' : null);
  let quantity = 1;
  let unit = countUnit || 'each';
  if (!countUnit && sizeQty) {
    quantity = sizeQty;
    unit = sizeUnit === 'l' ? 'L' : (sizeUnit === 'kg' ? 'kg' : (sizeUnit === 'ml' ? 'ml' : 'g'));
  }

  return {
    barcode: code,
    name,
    category,
    quantity,
    unit,
    packSize: p.quantity || (sizeQty ? `${sizeQty} ${sizeUnit}` : ''),
    caloriesPer100: kcal ? Math.round(kcal) : null,
    caloriesUnit: isVolume ? 'ml' : 'g',
    caloriesSource: kcal ? 'database' : null,
    servingSize: Number(p.serving_quantity) > 0 ? Math.round(Number(p.serving_quantity)) : null,
    proteinPer100: macroOrNull(n.proteins_100g),
    carbsPer100: macroOrNull(n.carbohydrates_100g),
    fatPer100: macroOrNull(n.fat_100g),
    image: p.image_front_small_url || '',
    found: true
  };
}

async function lookupBarcode(code) {
  const res = await fetch(`${OFF_PRODUCT_URL}${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`Open Food Facts returned ${res.status}`);
  const data = await res.json();
  if (data.status !== 1 || !data.product) return null;
  return offToScanRow(code, data.product);
}

const BarcodeScan = { location: 'pantry', stream: null, timer: null, row: null, busy: false };

function stopBarcodeCamera() {
  if (BarcodeScan.timer) { clearInterval(BarcodeScan.timer); BarcodeScan.timer = null; }
  if (BarcodeScan.stream) { BarcodeScan.stream.getTracks().forEach((t) => t.stop()); BarcodeScan.stream = null; }
}

async function startBarcodeCamera() {
  const video = document.getElementById('bc-video');
  const status = document.getElementById('bc-status');
  if (!video) return;
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices?.getUserMedia) {
    status.textContent = 'This browser can\'t read barcodes with the camera. Type the number under the barcode instead.';
    video.parentElement.style.display = 'none';
    return;
  }
  try {
    const supported = await window.BarcodeDetector.getSupportedFormats();
    const formats = BARCODE_FORMATS.filter((f) => supported.includes(f));
    const detector = new window.BarcodeDetector({ formats: formats.length ? formats : BARCODE_FORMATS });
    BarcodeScan.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    video.srcObject = BarcodeScan.stream;
    await video.play();
    status.textContent = 'Point the camera at a barcode.';
    BarcodeScan.timer = setInterval(async () => {
      if (BarcodeScan.busy || video.readyState < 2) return;
      try {
        const codes = await detector.detect(video);
        if (codes.length && codes[0].rawValue) handleBarcode(codes[0].rawValue);
      } catch (err) { /* a frame that can't be read; keep trying */ }
    }, 300);
  } catch (err) {
    stopBarcodeCamera();
    video.parentElement.style.display = 'none';
    status.textContent = err && err.name === 'NotAllowedError'
      ? 'Camera access was blocked. Allow the camera for this site in Chrome settings, or type the number instead.'
      : 'Couldn\'t start the camera. Type the number under the barcode instead.';
  }
}

async function handleBarcode(rawCode) {
  const code = String(rawCode).replace(/\D/g, '');
  if (code.length < 8 || BarcodeScan.busy) return;
  BarcodeScan.busy = true;
  stopBarcodeCamera();
  if (navigator.vibrate) navigator.vibrate(60);
  const status = document.getElementById('bc-status');
  if (status) status.textContent = `Looking up ${code}…`;

  let row = null;
  try {
    row = await lookupBarcode(code);
  } catch (err) {
    if (status) status.textContent = navigator.onLine ? 'Couldn\'t reach Open Food Facts. Try again in a moment.' : 'You\'re offline. Barcode lookup needs an internet connection.';
    BarcodeScan.busy = false;
    startBarcodeCamera();
    return;
  }
  if (!document.getElementById('bc-body')) return; // closed while looking up
  BarcodeScan.row = row || {
    barcode: code, name: '', category: 'Other', quantity: 1, unit: 'each', packSize: '',
    caloriesPer100: null, caloriesUnit: 'g', caloriesSource: null, image: '', found: false
  };
  if (BarcodeScan.mode === 'diary') await renderDiaryBarcodeConfirm();
  else if (BarcodeScan.mode === 'ingredient') renderPacketConfirm();
  else await renderBarcodeConfirm();
}

async function findExistingForBarcode(row) {
  const items = await dbGetAll('inventoryItems');
  const here = items.filter((i) => i.location === BarcodeScan.location);
  return here.find((i) => i.barcode && i.barcode === row.barcode)
    || (row.name ? here.find((i) => matchWords(i.name) === matchWords(row.name)) : null)
    || null;
}

async function renderBarcodeConfirm() {
  const row = BarcodeScan.row;
  const existing = await findExistingForBarcode(row);
  BarcodeScan.existingId = existing ? existing.id : null;
  const canAddUp = existing && existing.quantity && existing.unit === row.unit;
  const units = ITEM_UNITS.map((u) => `<option value="${u}" ${row.unit === u ? 'selected' : ''}>${u}</option>`).join('');
  const cats = CATEGORIES.map((c) => `<option value="${c}" ${row.category === c ? 'selected' : ''}>${c}</option>`).join('');

  document.getElementById('bc-body').innerHTML = `
    <div class="bc-product">
      ${row.image ? `<img src="${escapeHtml(row.image)}" alt="">` : '<div class="bc-noimg">▦</div>'}
      <div>
        <div class="bc-code">Barcode ${escapeHtml(row.barcode)}</div>
        ${row.found ? `<div class="tag kcal-ok">Found in Open Food Facts</div>` : '<div class="tag kcal-over">Not in the online database: fill it in below</div>'}
        ${row.packSize ? `<div class="recipe-muted" style="margin:4px 0 0;">Pack: ${escapeHtml(row.packSize)}</div>` : ''}
        ${row.proteinPer100 || row.carbsPer100 || row.fatPer100 ? `<div class="recipe-muted" style="margin:2px 0 0;">Per 100${row.caloriesUnit === 'ml' ? ' ml' : ' g'}: protein ${row.proteinPer100 ?? '–'} g · carbs ${row.carbsPer100 ?? '–'} g · fat ${row.fatPer100 ?? '–'} g</div>` : ''}
      </div>
    </div>
    <div class="field"><label>Name</label><input type="text" id="bc-name" value="${escapeHtml(row.name)}" placeholder="e.g. Mutti Crushed Tomatoes"></div>
    <div class="field">
      <label>Amount</label>
      <div class="ps-fields" style="margin:0;">
        <input type="number" id="bc-qty" min="0" step="any" inputmode="decimal" value="${row.quantity ?? ''}">
        <select id="bc-unit" class="ps-unit">${units}</select>
        <select id="bc-cat" class="ps-cat">${cats}</select>
      </div>
    </div>
    <div class="field">
      <label>Calories <span style="text-transform:none;font-weight:500;" id="bc-kcal-src">${row.caloriesSource ? `(${CALORIE_SOURCE_LABELS[row.caloriesSource]})` : '(optional)'}</span></label>
      <div class="ps-fields" style="margin:0;">
        <input type="number" id="bc-kcal" min="0" step="any" inputmode="decimal" placeholder="kcal" value="${row.caloriesPer100 ?? ''}">
        <select id="bc-kunit"><option value="g" ${row.caloriesUnit !== 'ml' ? 'selected' : ''}>per 100 g</option><option value="ml" ${row.caloriesUnit === 'ml' ? 'selected' : ''}>per 100 ml</option></select>
        ${!row.caloriesPer100 && getAiKey() ? '<button type="button" class="btn-secondary" id="bc-estimate" style="margin-top:0;width:auto;">✨ Estimate</button>' : ''}
      </div>
    </div>
    ${existing ? `<p class="recipe-muted">Already in your ${LOCATION_LABELS[BarcodeScan.location].toLowerCase()}: ${escapeHtml(existing.name)} (${escapeHtml(formatItemQuantity(existing))}). ${canAddUp ? 'Saving adds this amount to it.' : 'Saving updates its details.'}</p>` : ''}
  `;

  const kcal = document.getElementById('bc-kcal');
  kcal.addEventListener('input', () => { row.caloriesSource = 'manual'; document.getElementById('bc-kcal-src').textContent = '(entered)'; });
  const est = document.getElementById('bc-estimate');
  if (est) est.addEventListener('click', async () => {
    const name = document.getElementById('bc-name').value.trim();
    if (!name) { showToast('Enter the name first'); return; }
    est.disabled = true; est.textContent = 'Estimating…';
    const result = await estimateItemCalories(name, document.getElementById('bc-cat').value);
    est.disabled = false; est.textContent = '✨ Estimate';
    if (result.error) { showToast(result.error); return; }
    kcal.value = Math.round(result.caloriesPer100);
    document.getElementById('bc-kunit').value = result.caloriesUnit === 'ml' ? 'ml' : 'g';
    Object.assign(row, macrosFrom(result));
    row.caloriesSource = 'estimated';
    document.getElementById('bc-kcal-src').textContent = '(estimated)';
  });

  const action = document.getElementById('bc-action');
  action.textContent = existing && canAddUp ? 'Add to existing' : 'Save to kitchen';
  action.disabled = false;
  document.getElementById('bc-again').style.display = 'block';
}

async function saveBarcodeItem() {
  const row = BarcodeScan.row;
  const name = document.getElementById('bc-name').value.trim();
  if (!name) { showToast('Enter a name first'); document.getElementById('bc-name').focus(); return; }
  const quantity = parseFloat(document.getElementById('bc-qty').value) || null;
  const unit = document.getElementById('bc-unit').value;
  const category = document.getElementById('bc-cat').value;
  const kcalValue = parseFloat(document.getElementById('bc-kcal').value) || null;
  const calories = kcalValue
    ? { caloriesPer100: kcalValue, caloriesUnit: document.getElementById('bc-kunit').value, caloriesSource: row.caloriesSource || 'manual', ...macrosFrom(row) }
    : {};
  const now = new Date().toISOString();

  try {
    const existing = BarcodeScan.existingId ? await dbGet('inventoryItems', BarcodeScan.existingId) : null;
    if (existing) {
      const addsUp = existing.quantity && quantity && existing.unit === unit;
      if (addsUp) existing.quantity = Math.round((existing.quantity + quantity) * 100) / 100;
      else if (!existing.quantity && quantity) { existing.quantity = quantity; existing.unit = unit; }
      Object.assign(existing, calories, { barcode: row.barcode, updatedAt: now });
      await dbPut('inventoryItems', existing);
      await logHistory(existing.id, 'adjusted', addsUp ? quantity : null, existing.location, existing.location, addsUp ? `Scanned barcode: +${quantity} ${unit}` : 'Updated from barcode scan');
      showToast(addsUp ? `${existing.name}: now ${formatItemQuantity(existing)}` : 'Item updated');
    } else {
      const states = BarcodeScan.location === 'freezer' ? ['Frozen'] : (BarcodeScan.location === 'fridge' ? ['Fresh'] : ['Raw']);
      const newId = await dbPut('inventoryItems', {
        name,
        quantity,
        unit,
        portionCount: null,
        portionSize: null,
        location: BarcodeScan.location,
        subLocation: null,
        states,
        category,
        isStaple: ['Spices & Seasonings', 'Sauces & Condiments'].includes(category),
        purchaseDate: localDateString(new Date()),
        expiryDate: null,
        useByOverrideDays: null,
        cost: null,
        notes: row.packSize ? `Pack: ${row.packSize}` : '',
        freezerFriendlyRating: null,
        linkedPurchaseEventId: null,
        barcode: row.barcode,
        caloriesPer100: null,
        caloriesUnit: null,
        caloriesSource: null,
        ...calories,
        createdAt: now,
        updatedAt: now
      });
      await logHistory(newId, 'created', quantity, null, BarcodeScan.location, 'Added by barcode scan');
      showToast(`Added ${name}`);
    }
    renderRoute();
    scanNextBarcode();
  } catch (err) {
    alert('Couldn\'t save: ' + (err && err.message ? err.message : 'unknown storage error'));
  }
}
