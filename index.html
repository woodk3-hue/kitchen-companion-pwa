<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PantryFit</title>
  <meta name="apple-mobile-web-app-title" content="PantryFit">
  <meta name="application-name" content="PantryFit">
  <meta name="description" content="PantryFit: kitchen and food tracker. Track your pantry, fridge and freezer, plan meals, and log calories and macros.">
  <meta name="theme-color" content="#1F2620">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="./fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Apply the saved appearance before anything draws, so dark mode doesn't flash white
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('pantryfit.theme') || 'auto'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --color-bg: #FAF7F0;
  --color-ink: #1F2620;
  --color-ink-soft: #4A524C;
  --color-paper: #FFFFFF;
  --color-line: #E4DFD3;

  --color-accent: #C97A3D;       /* primary action / pantry */
  --color-accent-dark: #A8602C;
  --color-fridge: #5B7A6B;       /* sage */
  --color-freezer: #7C8CA8;      /* steel-blue */
  --color-leftovers: #9A8C5E;    /* muted gold */
  --color-warn: #A8472E;         /* rust — expiry/discard */
  --color-warn-bg: #F6E4DE;

  --font-display: 'Avenir Next', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  --radius-card: 14px;
  --radius-sm: 8px;
  --nav-height: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--color-bg);
  color: var(--color-ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

body {
  padding-bottom: calc(var(--nav-height) + var(--safe-bottom));
  min-height: 100vh;
}

h1, h2, h3 {
  font-family: var(--font-display);
  margin: 0;
  letter-spacing: -0.01em;
}

.eyebrow {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-ink-soft);
}

/* ============================================================
   HEADER
   ============================================================ */
.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--color-bg);
  padding: 18px 18px 12px;
  border-bottom: 1px solid var(--color-line);
}
.app-header h1 { font-size: 22px; font-weight: 800; }
.app-header .subtitle { font-size: 13px; color: var(--color-ink-soft); margin-top: 2px; }

/* ============================================================
   MAIN CONTENT
   ============================================================ */
#app-content {
  padding: 16px;
  max-width: 640px;
  margin: 0 auto;
}

.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--color-ink-soft);
}
.empty-state .glyph { font-size: 40px; margin-bottom: 10px; opacity: 0.6; }
.empty-state h3 { font-size: 16px; margin-bottom: 6px; color: var(--color-ink); }
.empty-state p { font-size: 14px; line-height: 1.4; margin: 0; }

.phase-placeholder {
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-card);
  padding: 32px 20px;
  text-align: center;
  margin-top: 24px;
}
.phase-placeholder .eyebrow { display: block; margin-bottom: 8px; }
.phase-placeholder p { color: var(--color-ink-soft); font-size: 14px; line-height: 1.5; margin: 8px 0 0; }

/* ============================================================
   HOME DASHBOARD
   ============================================================ */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--color-paper);
  border-radius: var(--radius-card);
  padding: 14px 16px;
  border: 1px solid var(--color-line);
}
.stat-card .count { font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1; }
.stat-card .label { font-size: 12px; color: var(--color-ink-soft); margin-top: 4px; }
.stat-card.loc-pantry { border-left: 4px solid var(--color-accent); }
.stat-card.loc-fridge { border-left: 4px solid var(--color-fridge); }
.stat-card.loc-freezer { border-left: 4px solid var(--color-freezer); }
.stat-card.loc-leftovers { border-left: 4px solid var(--color-leftovers); }

.section-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 24px 0 10px;
}
.section-heading h2 { font-size: 15px; font-weight: 800; }
.section-heading .count-badge {
  font-size: 12px;
  color: var(--color-ink-soft);
}

.expiry-list { display: flex; flex-direction: column; gap: 8px; }
.expiry-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
}
.expiry-row.urgent { background: var(--color-warn-bg); border-color: #E3C3B7; }
.expiry-row .name { flex: 1; font-size: 14px; font-weight: 600; }
.expiry-row .when { font-size: 12px; color: var(--color-warn); font-weight: 700; }
.expiry-row.urgent .when { color: var(--color-warn); }

/* ============================================================
   INVENTORY LIST (Kitchen screen)
   ============================================================ */
.location-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 16px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.location-tabs::-webkit-scrollbar { display: none; }
.loc-tab {
  flex: 0 0 auto;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  border: 1px solid var(--color-line);
  background: var(--color-paper);
  color: var(--color-ink-soft);
  cursor: pointer;
  white-space: nowrap;
}
.loc-tab.active {
  background: var(--color-ink);
  border-color: var(--color-ink);
  color: var(--color-bg);
}

.item-card {
  display: flex;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-card);
  margin-bottom: 10px;
  overflow: hidden;
  cursor: pointer;
}
.item-card .edge {
  width: 5px;
  flex-shrink: 0;
}
.item-card.loc-pantry .edge { background: var(--color-accent); }
.item-card.loc-fridge .edge { background: var(--color-fridge); }
.item-card.loc-freezer .edge { background: var(--color-freezer); }
.item-card.loc-leftovers .edge { background: var(--color-leftovers); }

.item-card .body { flex: 1; padding: 12px 14px; }
.item-card .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.item-card .name { font-size: 15px; font-weight: 700; }
.item-card .qty { font-size: 13px; color: var(--color-ink-soft); font-weight: 600; white-space: nowrap; }
.item-card .meta-row {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.tag {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 2px 8px;
  border-radius: 20px;
  background: var(--color-bg);
  color: var(--color-ink-soft);
  border: 1px solid var(--color-line);
}
.tag.state-frozen { color: var(--color-freezer); }
.tag.state-defrosting { color: var(--color-warn); }
.tag.state-leftover, .tag.state-cooked { color: var(--color-leftovers); }
.tag.state-opened { color: var(--color-warn); }
.tag.state-prepared { color: var(--color-fridge); }
.tag.staple-badge { background: var(--color-accent); color: white; border-color: var(--color-accent); }
.item-card .expiry-flag { font-size: 11px; font-weight: 700; color: var(--color-warn); margin-top: 4px; }
.use-by-suggestion {
  font-size: 12px;
  color: var(--color-ink-soft);
  background: var(--color-bg);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  margin-top: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.use-by-suggestion .apply-btn {
  font-size: 11px;
  font-weight: 700;
  color: var(--color-accent);
  background: none;
  border: none;
  cursor: pointer;
  white-space: nowrap;
}
.state-chip-grid { display: flex; gap: 6px; flex-wrap: wrap; }
.state-chip {
  padding: 8px 12px;
  border-radius: 20px;
  border: 1px solid var(--color-line);
  background: var(--color-paper);
  color: var(--color-ink-soft);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.state-chip.selected {
  background: var(--color-ink);
  border-color: var(--color-ink);
  color: var(--color-bg);
}
.staple-toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 14px;
}
.staple-toggle-row .label-group { display: flex; flex-direction: column; }
.staple-toggle-row .label { font-size: 14px; font-weight: 700; }
.staple-toggle-row .desc { font-size: 12px; color: var(--color-ink-soft); margin-top: 2px; }
.toggle-switch {
  position: relative;
  width: 44px;
  height: 26px;
  border-radius: 13px;
  background: var(--color-line);
  border: none;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s ease;
}
.toggle-switch.on { background: var(--color-accent); }
.toggle-switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: white;
  transition: transform 0.15s ease;
}
.toggle-switch.on::after { transform: translateX(18px); }

.quick-add-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 16px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.quick-add-row::-webkit-scrollbar { display: none; }
.quick-add-chip {
  flex: 0 0 auto;
  padding: 9px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  border: 1px dashed var(--color-line);
  background: var(--color-paper);
  color: var(--color-ink);
  cursor: pointer;
  white-space: nowrap;
}
.quick-add-chip:active { background: var(--color-bg); }

/* ============================================================
   FAB
   ============================================================ */
.fab {
  position: fixed;
  right: 18px;
  bottom: calc(var(--nav-height) + var(--safe-bottom) + 18px);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--color-accent);
  color: white;
  border: none;
  font-size: 28px;
  line-height: 1;
  box-shadow: 0 6px 16px rgba(31,38,32,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 15;
}
.fab:active { transform: scale(0.94); }

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(var(--nav-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--color-paper);
  border-top: 1px solid var(--color-line);
  display: flex;
  z-index: 20;
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--color-ink-soft);
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  padding: 6px 0;
}
.nav-btn .icon { font-size: 20px; line-height: 1; }
.nav-btn.active { color: var(--color-accent); }

/* ============================================================
   MODAL / FORM
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(31,38,32,0.45);
  z-index: 30;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }

.modal-sheet {
  background: var(--color-bg);
  width: 100%;
  max-height: 85vh;
  overflow: hidden;
  border-radius: 20px 20px 0 0;
  padding: 18px 18px 0;
  transform: translateY(16px);
  transition: transform 0.2s ease;
  display: flex;
  flex-direction: column;
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }

#item-form { display: flex; flex-direction: column; min-height: 0; flex: 1; }

.modal-scroll-area {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 12px;
  min-height: 0;
}

.modal-action-bar {
  flex-shrink: 0;
  padding: 10px 0 calc(16px + var(--safe-bottom));
  background: var(--color-bg);
  border-top: 1px solid var(--color-line);
}

.more-fields { margin-top: 4px; }
.more-fields summary {
  font-size: 13px;
  font-weight: 700;
  color: var(--color-accent);
  cursor: pointer;
  padding: 10px 0;
  list-style: none;
}
.more-fields summary::-webkit-details-marker { display: none; }
.more-fields summary::before { content: "+ "; }
.more-fields[open] summary::before { content: "− "; }
.more-fields-inner { padding-top: 6px; }

.modal-handle {
  width: 36px;
  height: 4px;
  background: var(--color-line);
  border-radius: 4px;
  margin: 0 auto 14px;
}

.modal-title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.modal-title-row h2 { font-size: 18px; }
.close-btn {
  background: none;
  border: none;
  font-size: 22px;
  color: var(--color-ink-soft);
  cursor: pointer;
  padding: 4px 8px;
}

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-ink-soft);
  margin-bottom: 6px;
}
.field input[type="text"],
.field input[type="number"],
.field input[type="date"],
.field select,
.field textarea {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: var(--font-body);
  background: var(--color-paper);
  color: var(--color-ink);
}
.field textarea { resize: vertical; min-height: 60px; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }

.segmented {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.segmented button {
  flex: 1 1 auto;
  min-width: 70px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-line);
  background: var(--color-paper);
  color: var(--color-ink-soft);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.segmented button.selected {
  background: var(--color-ink);
  border-color: var(--color-ink);
  color: var(--color-bg);
}

.btn-primary {
  width: 100%;
  padding: 14px;
  background: var(--color-accent);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 6px;
}
.btn-primary:active { background: var(--color-accent-dark); }

.btn-secondary {
  width: 100%;
  padding: 12px;
  background: none;
  color: var(--color-ink-soft);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}

.btn-danger {
  width: 100%;
  padding: 12px;
  background: none;
  color: var(--color-warn);
  border: 1px solid #E3C3B7;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}

/* History trail */
.history-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.history-row {
  font-size: 13px;
  padding: 8px 10px;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
}
.history-row .h-action { font-weight: 700; }
.history-row .h-date { font-size: 11px; color: var(--color-ink-soft); margin-top: 2px; }

/* Settings */
.settings-row {
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.settings-row .label { font-size: 14px; font-weight: 700; }
.settings-row .desc { font-size: 12px; color: var(--color-ink-soft); margin-top: 2px; }
.settings-row .chev { color: var(--color-ink-soft); }

.toast {
  position: fixed;
  bottom: calc(var(--nav-height) + var(--safe-bottom) + 18px);
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--color-ink);
  color: var(--color-bg);
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ============================================================
   STOCKTAKE
   ============================================================ */
.stocktake-btn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 12px;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-left: 4px solid var(--color-accent);
  border-radius: var(--radius-sm);
  text-align: left;
  cursor: pointer;
  font-family: inherit;
  color: var(--color-ink);
}
.stocktake-btn .st-btn-title { font-size: 15px; font-weight: 800; }
.stocktake-btn .st-btn-desc { font-size: 12px; color: var(--color-ink-soft); margin-top: 2px; }
.modal-sheet.tall { height: 92vh; max-height: 92vh; }
.st-intro { font-size: 13px; color: var(--color-ink-soft); margin: 0 0 10px; }
.st-body { flex: 1; }
.st-add { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.st-add input, .st-add select {
  flex: 1 1 140px;
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: var(--font-body);
  background: var(--color-paper);
  color: var(--color-ink);
}
.st-add .btn-secondary { flex: 0 0 auto; width: auto; margin-top: 0; padding: 10px 14px; }
.st-group-title {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-ink-soft);
  margin: 16px 0 6px;
}
.st-row {
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
}
.st-row.ticked { border-color: var(--color-accent); }
.st-tick {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 12px;
  background: none;
  border: none;
  text-align: left;
  font-family: inherit;
  font-size: 15px;
  color: var(--color-ink);
  cursor: pointer;
}
.st-box {
  flex: 0 0 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid var(--color-line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  color: white;
}
.st-row.ticked .st-box { background: var(--color-accent); border-color: var(--color-accent); }
.st-row.have .st-box { background: var(--color-line); border-color: var(--color-line); color: var(--color-ink-soft); }
.st-row.have .st-name { color: var(--color-ink-soft); }
.st-name { flex: 1; font-weight: 600; }
.st-have { font-size: 11px; font-weight: 700; color: var(--color-ink-soft); text-transform: uppercase; }
.st-qty { display: flex; gap: 8px; padding: 0 12px 11px 44px; }
.st-qty input, .st-qty select {
  padding: 8px 10px;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: var(--font-body);
  background: var(--color-bg);
  color: var(--color-ink);
}
.st-qty input { flex: 1; min-width: 0; }
.st-qty select { flex: 0 0 90px; }

/* ============================================================
   RECIPES
   ============================================================ */
#recipe-form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.recipe-search { margin-bottom: 12px; }
.recipe-search input[type="search"] {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: var(--font-body);
  background: var(--color-paper);
  color: var(--color-ink);
}
.recipe-filter-row { margin-bottom: 16px; }
.recipe-card.region-south-asian .edge { background: var(--color-accent); }
.recipe-card.region-east-asian .edge,
.recipe-card.region-southeast-asian .edge { background: var(--color-warn); }
.recipe-card.region-mideast-africa .edge { background: var(--color-leftovers); }
.recipe-card.region-european .edge,
.recipe-card.region-other .edge { background: var(--color-freezer); }
.recipe-card.region-americas .edge,
.recipe-card.region-oceania .edge { background: var(--color-fridge); }
.fav-star { color: var(--color-accent); }
.tag.tag-protein { color: var(--color-fridge); }
.recipe-stats { display: flex; gap: 8px; margin-bottom: 10px; }
.recipe-stat {
  flex: 1;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  padding: 8px 6px;
  text-align: center;
}
.recipe-stat .v { display: block; font-size: 15px; font-weight: 800; }
.recipe-stat .l { display: block; font-size: 11px; color: var(--color-ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
.recipe-muted { font-size: 13px; color: var(--color-ink-soft); }
.recipe-notes { font-size: 14px; line-height: 1.5; margin: 0; white-space: pre-line; }
.rating-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
.rating-label { font-size: 14px; font-weight: 700; }
.star-btn {
  background: none;
  border: none;
  font-size: 24px;
  line-height: 1;
  padding: 2px 3px;
  color: var(--color-line);
  cursor: pointer;
}
.star-btn.on { color: var(--color-accent); }
.ingredient-list { list-style: none; padding: 0; margin: 0; }
.ingredient-list li {
  display: flex;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--color-line);
  font-size: 14px;
}
.ingredient-list .ing-qty { flex: 0 0 72px; font-weight: 700; color: var(--color-ink-soft); }
.ingredient-list .ing-note { color: var(--color-ink-soft); }
.ingredient-list .ing-flag {
  display: inline-block;
  margin-left: 6px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--color-ink-soft);
  border: 1px solid var(--color-line);
  border-radius: 10px;
  padding: 0 6px;
}
.method-list { padding-left: 20px; margin: 0; }
.method-list li { font-size: 14px; line-height: 1.5; margin-bottom: 8px; }

/* ============================================================
   STEP 2: MATCHING, AI SUGGESTIONS, ONLINE SEARCH
   ============================================================ */
.recipe-online-row { display: flex; gap: 8px; }
.recipe-online-row .stocktake-btn { flex: 1; min-width: 0; }
.stocktake-btn.alt { border-left-color: var(--color-fridge); }
.tag.match-pct { color: var(--color-ink); }
.tag.match-pct.high { color: var(--color-fridge); border-color: var(--color-fridge); }
.tag.kcal-ok { color: var(--color-fridge); }
.tag.kcal-over { color: var(--color-warn); }
.match-line { font-size: 12px; color: var(--color-ink-soft); margin: 5px 0 0; }
.match-line.uses { color: var(--color-warn); font-weight: 700; }
.ing-have { font-size: 11px; font-weight: 700; color: var(--color-fridge); margin-left: 6px; }
.settings-card {
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  padding: 14px;
}
.settings-card .field input[type="password"] {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: var(--font-body);
  background: var(--color-paper);
  color: var(--color-ink);
}
.ai-meal {
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-top: 12px;
}
.ai-meal-head { display: flex; justify-content: space-between; gap: 8px; }
.ai-meal-head .name { font-size: 15px; font-weight: 800; }
.ai-meal-head .qty { font-size: 13px; color: var(--color-ink-soft); white-space: nowrap; }
.ai-meal .meta-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.ai-why { font-size: 13px; margin: 8px 0 0; }
.ai-error { font-size: 14px; color: var(--color-warn); font-weight: 600; margin-top: 12px; }
.ai-wait { margin-top: 12px; }
.online-result {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px;
  margin-bottom: 6px;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--color-ink);
  text-align: left;
  cursor: pointer;
}
.online-result img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; flex: 0 0 48px; }

/* ============================================================
   PHOTO SCAN & ITEM CALORIES
   ============================================================ */
.tag.kcal-tag { color: var(--color-warn); }
.ps-thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.ps-thumb { position: relative; width: 96px; height: 96px; }
.ps-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-sm); }
.ps-remove {
  position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%;
  border: none; background: rgba(31,38,32,0.7); color: white; font-size: 16px; line-height: 1; cursor: pointer;
}
.ps-add {
  width: 96px; height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border: 2px dashed var(--color-line); border-radius: var(--radius-sm); background: var(--color-paper);
  font-size: 26px; cursor: pointer;
}
.ps-add span { font-size: 12px; font-weight: 700; color: var(--color-ink-soft); }
.ps-row { padding: 10px 12px; }
.ps-top { display: flex; align-items: center; gap: 10px; }
.ps-top .st-box { cursor: pointer; padding: 0; }
.st-row.ticked .ps-tick { background: var(--color-accent); border-color: var(--color-accent); }
.ps-name, .ps-fields input, .ps-fields select {
  padding: 8px 10px; border: 1px solid var(--color-line); border-radius: var(--radius-sm);
  font-size: 15px; font-family: var(--font-body); background: var(--color-bg); color: var(--color-ink); min-width: 0;
}
.ps-name { flex: 1; font-weight: 700; }
.ps-tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 0 32px; }
.ps-fields { display: flex; gap: 6px; align-items: center; margin: 8px 0 0 32px; }
.ps-fields input { flex: 1 1 70px; }
.ps-fields select { flex: 0 1 auto; }
.ps-fields select.ps-unit { flex: 0 0 88px; }
.ps-fields select.ps-cat { flex: 1 1 0; }
.ps-knote { font-size: 11px; font-weight: 700; color: var(--color-ink-soft); white-space: nowrap; }

/* ============================================================
   BARCODE SCAN
   ============================================================ */
.stocktake-btn.alt2 { border-left-color: var(--color-freezer); }
.recipe-online-row .stocktake-btn { padding: 10px; }
.bc-camera { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: var(--radius-sm); overflow: hidden; }
.bc-camera video { width: 100%; height: 100%; object-fit: cover; }
.bc-aim { position: absolute; left: 12%; right: 12%; top: 38%; bottom: 38%; border: 3px solid rgba(255,255,255,0.85); border-radius: 10px; }
.bc-product { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.bc-product img, .bc-noimg { width: 72px; height: 72px; object-fit: contain; border-radius: var(--radius-sm); background: var(--color-paper); border: 1px solid var(--color-line); flex: 0 0 72px; }
.bc-noimg { display: flex; align-items: center; justify-content: center; font-size: 30px; color: var(--color-ink-soft); }
.bc-code { font-size: 12px; color: var(--color-ink-soft); margin-bottom: 4px; }
.bc-product .tag { display: inline-block; }
#bc-kunit, .ps-fields select.ps-kunit { flex: 0 0 auto; }
#bc-kcal { flex: 1 1 80px; }

/* ============================================================
   INSTALL
   ============================================================ */
.install-card {
  display: flex; flex-direction: column; align-items: flex-start; width: 100%;
  padding: 14px; margin-bottom: 14px; border-radius: var(--radius-sm);
  background: var(--color-ink); color: var(--color-bg); border: none;
  font-family: inherit; text-align: left; cursor: pointer;
}
.install-card .install-title { font-size: 15px; font-weight: 800; }
.install-card .install-desc { font-size: 12px; opacity: 0.85; margin-top: 3px; }

/* ============================================================
   MEAL PLANNER
   ============================================================ */
.plan-week-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.plan-week-label { font-size: 16px; font-weight: 800; text-align: center; }
.link-btn { background: none; border: none; color: var(--color-accent); font-weight: 700; font-size: 13px; cursor: pointer; padding: 0 0 0 6px; }
.plan-ai-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin: 4px 0 6px; }
.plan-ai-toggle input { width: 18px; height: 18px; accent-color: var(--color-accent); }
.plan-day { background: var(--color-paper); border: 1px solid var(--color-line); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 10px; }
.plan-day.today { border-color: var(--color-accent); box-shadow: 0 0 0 1px var(--color-accent); }
.plan-day.past { opacity: 0.6; }
.plan-day-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; margin-bottom: 6px; }
.plan-total { color: var(--color-ink-soft); font-weight: 700; }
.plan-slot {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; width: 100%;
  padding: 9px 10px; margin-top: 6px; border-radius: var(--radius-sm);
  border: 1px solid var(--color-line); background: var(--color-bg); color: var(--color-ink);
  font-family: inherit; text-align: left; cursor: pointer;
}
.plan-slot.empty { border-style: dashed; }
.plan-slot:disabled { cursor: default; }
.plan-meal { flex: 0 0 72px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-ink-soft); }
.plan-add { color: var(--color-accent); font-weight: 700; font-size: 14px; }
.plan-title { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; }
.plan-tags { display: flex; gap: 4px; flex-wrap: wrap; flex-basis: 100%; padding-left: 82px; }
.plan-tags:empty { display: none; }
.plan-slot.type-leftover { background: #F3EFE2; }
.plan-slot.type-out .plan-title { color: var(--color-ink-soft); font-weight: 600; }
.pick-row {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 100%;
  padding: 10px 12px; margin-bottom: 6px; border-radius: var(--radius-sm);
  border: 1px solid var(--color-line); background: var(--color-paper); color: var(--color-ink);
  font-family: inherit; text-align: left; cursor: pointer;
}
.pick-name { font-size: 14px; font-weight: 700; }
.pick-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.plan-pick-day { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--color-line); font-size: 13px; font-weight: 700; }
.plan-pick-slots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.plan-pick-slots .state-chip { padding: 6px 10px; font-size: 12px; }
.plan-pick-slots .state-chip.dim { opacity: 0.75; }
.plan-pick-slots .state-chip:disabled { opacity: 0.4; cursor: default; }

.cuisine-group { border-bottom: 1px solid var(--color-line); padding: 6px 0; }
.cuisine-group summary { font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px 0; }
.cuisine-group .state-chip-grid { padding: 6px 0 4px; }

.suggest-kitchen-btn {
  display: flex; flex-direction: column; align-items: flex-start; width: 100%;
  padding: 12px 14px; margin-bottom: 12px; border-radius: var(--radius-sm);
  background: var(--color-accent); color: white; border: none;
  font-family: inherit; text-align: left; cursor: pointer;
}
.suggest-kitchen-btn .st-btn-title { font-size: 15px; font-weight: 800; }
.suggest-kitchen-btn .st-btn-desc { font-size: 12px; opacity: 0.9; margin-top: 2px; }
.suggest-kitchen-btn:active { background: var(--color-accent-dark); }

/* ============================================================
   FOOD DIARY
   Macro colours: validated categorical slots 1–3 (blue, orange, aqua);
   every meter also carries a text label and numbers.
   ============================================================ */
:root { --macro-protein: #2a78d6; --macro-carbs: #eb6834; --macro-fat: #1baf7a; }
.diary-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.diary-nav .loc-tab:disabled { opacity: 0.35; }
.diary-summary {
  display: flex; gap: 14px; align-items: center; background: var(--color-paper);
  border: 1px solid var(--color-line); border-radius: var(--radius-sm); padding: 12px;
}
.ring-wrap { flex: 0 0 132px; text-align: center; }
.kcal-ring { width: 132px; height: 132px; display: block; }
.ring-track { stroke: #F1DFCF; }
.ring-fill { stroke: var(--color-accent); }
.ring-fill.over { stroke: var(--color-warn); }
.ring-num { font-size: 24px; font-weight: 800; fill: var(--color-ink); }
.ring-sub { font-size: 11px; font-weight: 600; fill: var(--color-ink-soft); }
.ring-left { font-size: 12px; font-weight: 700; color: var(--color-ink-soft); margin-top: 2px; }
.ring-left.over { color: var(--color-warn); }
.macro-list { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.macro-head { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; margin-bottom: 4px; }
.macro-name { font-weight: 800; display: flex; align-items: center; gap: 6px; }
.macro-key { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.macro-val { color: var(--color-ink-soft); font-weight: 600; white-space: nowrap; }
.macro-track { height: 8px; border-radius: 4px; overflow: hidden; }
.macro-fill { height: 100%; border-radius: 4px; }
.m-protein.macro-key, .m-protein.macro-fill { background: var(--macro-protein); }
.m-carbs.macro-key, .m-carbs.macro-fill { background: var(--macro-carbs); }
.m-fat.macro-key, .m-fat.macro-fill { background: var(--macro-fat); }
.m-protein.macro-track { background: #DCE8F7; }
.m-carbs.macro-track { background: #FBE3D8; }
.m-fat.macro-track { background: #D6F1E6; }
.diary-meal { background: var(--color-paper); border: 1px solid var(--color-line); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 10px; }
.diary-meal-head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 800; }
.diary-meal-kcal { font-weight: 600; color: var(--color-ink-soft); font-size: 12px; margin-left: 4px; }
.diary-add { padding: 4px 0 4px 8px; }
.diary-entry {
  display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 8px 0 2px; margin: 0;
  border: none; border-top: 1px solid var(--color-line); background: none; text-align: left;
  font-family: inherit; color: var(--color-ink); cursor: pointer; font-size: 14px;
}
.diary-entry .de-name { font-weight: 600; min-width: 0; }
.diary-entry .de-main { display: flex; flex-direction: column; min-width: 0; }
.macro-line { display: flex; gap: 10px; font-size: 12px; font-weight: 700; margin-top: 2px; }
.ml-p { color: var(--macro-protein); }
.ml-c { color: var(--macro-carbs); }
.ml-f { color: var(--macro-fat); }
.recipe-card .macro-line { margin-top: 6px; }
.diary-entry .de-amt, .diary-planned .de-amt { color: var(--color-ink-soft); font-weight: 500; }
.diary-entry .de-num { color: var(--color-ink-soft); font-size: 12px; font-weight: 700; white-space: nowrap; }
.diary-planned { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0 2px; border-top: 1px dashed var(--color-line); font-size: 13px; color: var(--color-ink-soft); }
.diary-planned .state-chip { padding: 5px 10px; font-size: 12px; }
.add-food-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-bottom: 16px; }
.add-food-opt {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 8px;
  border: 1px solid var(--color-line); border-radius: var(--radius-sm); background: var(--color-paper);
  font-family: inherit; font-size: 14px; font-weight: 700; color: var(--color-ink); cursor: pointer;
}
.add-food-opt span { font-size: 26px; }
.add-food-opt.wide { grid-column: span 2; flex-direction: row; justify-content: center; }
.add-food-opt.wide span { font-size: 20px; }
.nutrient-row { gap: 6px; }
.nutrient-row .field input { padding: 9px 8px; }
.plan-ai-toggle input.lki-use { width: 76px; height: auto; padding: 5px 6px; border: 1px solid var(--color-line); border-radius: 6px; font-size: 14px; }
#lki-amount { flex: 1 1 100px; }
#lki-unit { flex: 0 0 120px; }
.pp-nums label { display: flex; flex-direction: column; font-size: 10px; font-weight: 700; color: var(--color-ink-soft); flex: 1; min-width: 0; }
.pp-nums input { width: 100%; }
.goal-subhead { display: block; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-ink-soft); margin: 4px 0 6px; }
.goal-macros { gap: 6px; }
.goal-macros .field label { font-size: 11px; }
.macro-fields { margin-top: 6px; }

/* ============================================================
   MODERN THEME
   A layer over the base styles: brighter palette matching the app
   icon, white cards with soft shadows instead of borders, pill
   controls, a floating bottom bar. Remove this block to go back.
   Font: Plus Jakarta Sans (SIL Open Font License, fonts/), served
   with the app so it works offline.
   ============================================================ */
@font-face {
  font-family: 'Plus Jakarta Sans';
  src: url('./fonts/plus-jakarta-sans.woff2') format('woff2');
  font-weight: 200 800;
  font-style: normal;
  font-display: swap;
}
:root {
  --color-bg: #F5F4F1;
  --color-ink: #17191C;
  --color-ink-soft: #62666D;
  --color-paper: #FFFFFF;
  --color-line: #ECEAE6;
  --color-fill: #F0EFEB;
  --color-accent: #EE6A2F;
  --color-accent-dark: #D4541C;
  --color-accent-tint: #FDEBE2;
  --color-fridge: #2E9E72;
  --color-freezer: #3F86D8;
  --color-leftovers: #D69A12;
  --color-warn: #D8443A;
  --color-warn-bg: #FCE9E7;
  --font-display: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --radius-card: 20px;
  --radius-sm: 14px;
  --shadow-card: 0 1px 2px rgba(23, 25, 28, 0.04), 0 6px 20px rgba(23, 25, 28, 0.06);
  --shadow-float: 0 8px 30px rgba(23, 25, 28, 0.14);
  --nav-height: 68px;
}
body { padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 28px); }
button, input, select, textarea { font-family: inherit; }
.ingredient-list .ing-flag { text-transform: none; border: none; background: var(--color-fill); font-size: 11px; font-weight: 600; padding: 1px 8px; }
.recipe-stat .l { text-transform: none; letter-spacing: 0; font-size: 12px; }
h1, h2, h3 { letter-spacing: -0.02em; }

/* Header: large title on a frosted bar */
.app-header {
  background: rgba(245, 244, 241, 0.86);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: none;
  padding: 20px 20px 12px;
}
.app-header h1 { font-size: 28px; font-weight: 800; }
.app-header .subtitle { font-size: 13px; font-weight: 500; }
#app-content { padding: 8px 16px 16px; }

/* Cards: white, rounded, soft shadow, no outline */
.item-card, .stat-card, .settings-row, .settings-card, .diary-summary, .diary-meal, .plan-day,
.st-row, .pick-row, .ai-meal, .online-result, .recipe-stat, .stocktake-btn, .phase-placeholder {
  border: none;
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  background: var(--color-paper);
}
.item-card { margin-bottom: 10px; overflow: hidden; }
.item-card .edge { width: 6px; margin: 12px 0 12px 12px; border-radius: 6px; }
.item-card .body { padding: 14px 16px 14px 12px; }
.item-card .name { font-size: 16px; font-weight: 700; }
.stat-card { padding: 16px; }
.stat-card.loc-pantry, .stat-card.loc-fridge, .stat-card.loc-freezer, .stat-card.loc-leftovers { border-left: none; position: relative; }
.stat-card::before { content: ''; position: absolute; left: 16px; top: 16px; width: 10px; height: 10px; border-radius: 50%; }
.stat-card.loc-pantry::before { background: var(--color-accent); }
.stat-card.loc-fridge::before { background: var(--color-fridge); }
.stat-card.loc-freezer::before { background: var(--color-freezer); }
.stat-card.loc-leftovers::before { background: var(--color-leftovers); }
.stat-card .count { margin-top: 14px; }
.st-row.ticked, .plan-day.today { box-shadow: 0 0 0 2px var(--color-accent), var(--shadow-card); }
.plan-slot { border: none; background: var(--color-fill); border-radius: var(--radius-sm); }
.plan-slot.empty { border: 1.5px dashed #D9D6D0; background: transparent; }
.plan-slot.type-leftover { background: #FFF4DF; }
.diary-entry, .diary-planned { border-top-color: var(--color-line); }
.recipe-stat { box-shadow: none; background: var(--color-fill); }

/* Section headings: sentence case, bolder */
.section-heading h2 { font-size: 18px; font-weight: 800; }
.st-group-title, .goal-subhead, .field label, .plan-meal {
  text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 700; color: var(--color-ink-soft);
}

/* Tags: soft tinted pills */
.tag {
  border: none; background: var(--color-fill); color: var(--color-ink-soft);
  text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 600; padding: 3px 10px;
}
.tag.kcal-ok, .tag.tag-protein { background: #E3F4EC; color: #1E7A55; }
.tag.kcal-over, .tag.state-defrosting, .tag.state-opened { background: var(--color-warn-bg); color: #B2332A; }
.tag.state-frozen { background: #E5EFFB; color: #2B6CB8; }
.tag.state-leftover, .tag.state-cooked { background: #FFF2D9; color: #9A6B00; }
.tag.match-pct { background: var(--color-fill); color: var(--color-ink); }
.tag.match-pct.high { background: #E3F4EC; color: #1E7A55; border: none; }
.tag.kcal-tag { background: var(--color-accent-tint); color: var(--color-accent-dark); }
.tag.staple-badge { background: var(--color-accent-tint); color: var(--color-accent-dark); }

/* Chips and tabs */
.loc-tab, .state-chip, .quick-add-chip {
  border: none; background: var(--color-paper); box-shadow: var(--shadow-card);
  border-radius: 999px; font-weight: 600; color: var(--color-ink-soft);
}
.loc-tab.active, .state-chip.selected { background: var(--color-ink); color: #fff; box-shadow: none; }
.quick-add-chip { color: var(--color-ink); }

/* Segmented control: tinted track, white selected pill */
.segmented { background: var(--color-fill); border-radius: 14px; padding: 4px; gap: 4px; }
.segmented button { border: none; background: transparent; border-radius: 10px; font-weight: 600; color: var(--color-ink-soft); }
.segmented button.selected { background: var(--color-paper); color: var(--color-ink); box-shadow: 0 1px 3px rgba(23, 25, 28, 0.12); }

/* Buttons */
.btn-primary {
  border-radius: 16px; padding: 15px; font-weight: 700;
  background: linear-gradient(135deg, #F58A42, var(--color-accent));
  box-shadow: 0 6px 18px rgba(238, 106, 47, 0.28);
}
.btn-primary:active { background: var(--color-accent-dark); }
.btn-primary:disabled { opacity: 0.5; box-shadow: none; }
.btn-secondary { border: none; background: var(--color-fill); color: var(--color-ink); border-radius: 14px; font-weight: 700; }
.btn-danger { border: none; background: var(--color-warn-bg); color: #B2332A; border-radius: 14px; font-weight: 700; }
.link-btn { color: var(--color-accent-dark); }

/* Big feature buttons */
.stocktake-btn { border-left: none; padding: 14px; }
.stocktake-btn .st-btn-title { font-size: 15px; }
.suggest-kitchen-btn, .install-card { border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
.suggest-kitchen-btn { background: linear-gradient(135deg, #F58A42, #E4572E); }
.install-card { background: linear-gradient(135deg, #22262B, #3A3F46); }

/* Form fields: soft filled inputs */
.field input[type="text"], .field input[type="number"], .field input[type="date"], .field select, .field textarea,
.recipe-search input[type="search"], .st-add input, .st-add select, .ps-name, .ps-fields input, .ps-fields select,
.st-qty input, .st-qty select, .settings-card .field input[type="password"] {
  border: 1.5px solid transparent; background: var(--color-fill); border-radius: 12px;
}
.field input:focus, .field select:focus, .field textarea:focus, .recipe-search input:focus, .st-add input:focus,
.ps-name:focus, .ps-fields input:focus, .st-qty input:focus { outline: none; border-color: var(--color-accent); background: var(--color-paper); }
.st-box { border-radius: 8px; }
.toggle-switch.on { background: var(--color-fridge); }

/* Bottom sheet */
.modal-sheet { border-radius: 28px 28px 0 0; background: var(--color-bg); padding: 16px 18px 0; }
.modal-title-row h2 { font-size: 22px; font-weight: 800; }
.close-btn { background: var(--color-fill); border-radius: 50%; width: 34px; height: 34px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.modal-action-bar { border-top: none; background: var(--color-bg); }

/* Floating bottom bar */
.bottom-nav {
  left: 12px; right: 12px; bottom: calc(10px + var(--safe-bottom)); height: var(--nav-height); padding: 6px;
  border-top: none; border-radius: 24px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  box-shadow: var(--shadow-float);
}
.nav-btn { border-radius: 18px; font-size: 11px; font-weight: 600; letter-spacing: 0; gap: 2px; }
.nav-btn .icon { width: 22px; height: 22px; }
.nav-btn.active .icon { stroke-width: 2.3; }
.nav-btn.active { background: var(--color-accent-tint); color: var(--color-accent-dark); }

/* Floating action button */
.fab {
  bottom: calc(var(--nav-height) + var(--safe-bottom) + 24px); right: 20px; width: 58px; height: 58px; border-radius: 20px;
  background: linear-gradient(135deg, #F58A42, var(--color-accent));
  box-shadow: 0 10px 24px rgba(238, 106, 47, 0.38);
}

/* Diary ring and meters on the new palette */
.ring-track { stroke: #F6E2D7; }
.diary-summary { padding: 16px; }
.toast { border-radius: 14px; bottom: calc(var(--nav-height) + var(--safe-bottom) + 24px); }

/* Eating-style tags */
.tag.tag-diet { background: #EEE8FA; color: #6440B0; }

/* Shopping list */
.shop-add { margin: 4px 0 12px; }
.shop-group { background: var(--color-paper); border-radius: var(--radius-card); box-shadow: var(--shadow-card); overflow: hidden; margin-bottom: 8px; }
.shop-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--color-fill); }
.shop-row:first-child { border-top: none; }
.shop-tick { background: none; border: none; padding: 4px; cursor: pointer; display: flex; }
.shop-tick .st-box { width: 22px; flex: 0 0 22px; color: #fff; }
.shop-row.done .st-box { background: var(--color-fridge); border-color: var(--color-fridge); color: #fff; }
.shop-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.shop-name { font-weight: 600; color: var(--color-ink); }
.shop-row.done .shop-name { text-decoration: line-through; color: var(--color-ink-soft); }
.shop-qty { font-weight: 500; color: var(--color-ink-soft); font-size: 13px; }
.shop-note { font-size: 12px; color: var(--color-ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shop-del { background: none; border: none; font-size: 22px; line-height: 1; color: var(--color-ink-soft); padding: 4px 6px; cursor: pointer; }
.shop-actions { margin-top: 14px; }
.sp-for { font-size: 12px; color: var(--color-ink-soft); padding: 0 12px 8px 44px; }
.sk-row { padding: 10px 0; border-bottom: 1px solid var(--color-fill); }
.sk-name { font-weight: 700; margin-bottom: 6px; }
.sk-adds { display: block; font-weight: 500; font-size: 12px; color: var(--color-fridge); }
.sk-fields { display: grid; grid-template-columns: 1fr 80px 100px; gap: 6px; }
.sk-fields input, .sk-fields select { min-width: 0; }

/* I cooked this */
.cook-split { gap: 10px; }
.cook-num input { width: 100%; }
.macro-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.macro-tiles .mt { background: var(--color-paper); border-radius: 14px; box-shadow: var(--shadow-card); padding: 10px 4px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.mt-v { font-size: 18px; font-weight: 800; }
.mt-v small { font-size: 12px; font-weight: 700; margin-left: 1px; }
.mt-l { font-size: 11px; font-weight: 600; color: var(--color-ink-soft); }
.mt-protein .mt-v { color: var(--macro-protein); }
.mt-carbs .mt-v { color: var(--macro-carbs); }
.mt-fat .mt-v { color: var(--macro-fat); }
.serves-stat .v { display: flex; align-items: center; justify-content: center; gap: 6px; }
.serves-btn { width: 24px; height: 24px; border-radius: 50%; border: none; background: var(--color-fill); color: var(--color-ink); font-size: 16px; font-weight: 800; line-height: 1; padding: 0; cursor: pointer; }
.section-heading #serves-note { font-size: 12px; font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper input { text-align: center; min-width: 0; }
.step-btn { flex: 0 0 40px; height: 40px; border: none; border-radius: 12px; background: var(--color-fill); color: var(--color-ink); font-size: 20px; font-weight: 700; cursor: pointer; }
.step-btn:active { background: var(--color-accent-tint); }
.cook-left { font-size: 14px; font-weight: 700; margin: 4px 0 8px; }
.cook-hint { display: block; font-size: 12px; color: var(--color-ink-soft); margin-top: 3px; }
.cook-check { font-size: 13px; font-weight: 600; margin: 2px 0 12px; }
.cook-check.ok { color: var(--color-fridge); }
.cook-check.warn { color: var(--color-warn); }
.cook-box { background: var(--color-fill); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
.cook-box .segmented { flex-wrap: wrap; }
.cook-use { padding: 8px 0; border-bottom: 1px solid var(--color-fill); }
.cook-use-amt { font-size: 13px; padding: 4px 0 0 28px; display: flex; align-items: center; gap: 6px; }
.cook-use-amt input.lki-use { width: 90px; flex: 0 0 90px; padding: 6px 8px; border: 1px solid var(--color-line); border-radius: 8px; font: inherit; }

/* ============================================================
   DARK MODE
   The page's <html> gets data-theme="dark" (set before first paint by the
   script in <head>, from Settings → Appearance or the phone's setting).
   Colours come from the tokens; the rest are the few fixed colours above.
   ============================================================ */
:root[data-theme="dark"] {
  color-scheme: dark;
  --color-bg: #121417;
  --color-ink: #ECEDEE;
  --color-ink-soft: #A3A8AF;
  --color-paper: #1D2024;
  --color-line: #33373D;
  --color-fill: #2A2E34;
  --color-accent: #F07A43;
  --color-accent-dark: #FFA477;
  --color-accent-tint: #3A2418;
  --color-fridge: #3DBB8A;
  --color-freezer: #5B9CE6;
  --color-leftovers: #E3AE3A;
  --color-warn: #F0645A;
  --color-warn-bg: #3A1F1D;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 20px rgba(0, 0, 0, 0.25);
  --shadow-float: 0 8px 30px rgba(0, 0, 0, 0.55);
  --macro-protein: #4C93E8; --macro-carbs: #F07A43; --macro-fat: #2EC48B;
}
:root[data-theme="dark"] .app-header { background: rgba(18, 20, 23, 0.86); }
:root[data-theme="dark"] .bottom-nav { background: rgba(29, 32, 36, 0.92); }
:root[data-theme="dark"] .modal-overlay { background: rgba(0, 0, 0, 0.6); }
:root[data-theme="dark"] .expiry-row.urgent { border-color: #5A2E28; }
:root[data-theme="dark"] .plan-slot.empty { border-color: #3A3F46; }
:root[data-theme="dark"] .plan-slot.type-leftover { background: #2E2717; }
:root[data-theme="dark"] .tag.kcal-ok, :root[data-theme="dark"] .tag.tag-protein,
:root[data-theme="dark"] .tag.match-pct.high { background: #173328; color: #6FD3A6; }
:root[data-theme="dark"] .tag.kcal-over, :root[data-theme="dark"] .tag.state-defrosting,
:root[data-theme="dark"] .tag.state-opened, :root[data-theme="dark"] .btn-danger { color: #FF8A80; }
:root[data-theme="dark"] .tag.state-frozen { background: #182A40; color: #8DBBF2; }
:root[data-theme="dark"] .tag.state-leftover, :root[data-theme="dark"] .tag.state-cooked { background: #33280F; color: #F0C35A; }
:root[data-theme="dark"] .tag.tag-diet { background: #2A2240; color: #B9A2F2; }
:root[data-theme="dark"] .loc-tab.active, :root[data-theme="dark"] .state-chip.selected { color: var(--color-bg); }
:root[data-theme="dark"] .segmented button.selected { background: #3A3F46; box-shadow: none; }
:root[data-theme="dark"] .install-card { background: linear-gradient(135deg, #2A2F36, #3A4048); color: #F2F3F4; }
:root[data-theme="dark"] .ring-track { stroke: #3A2A20; }
:root[data-theme="dark"] .m-protein.macro-track { background: #1B2B40; }
:root[data-theme="dark"] .m-carbs.macro-track { background: #3A2418; }
:root[data-theme="dark"] .m-fat.macro-track { background: #15332A; }
:root[data-theme="dark"] .toggle-switch::after { background: #F2F2F2; }
</style>
 </head>
 <body>
  <header class="app-header">
   <h1 id="header-title">PantryFit</h1>
   <div class="subtitle" id="header-subtitle">Know what you've got</div>
  </header>
  <main id="app-content"></main>
  <button class="fab" id="fab-btn" style="display:none;" aria-label="Add item">+</button>
  <nav class="bottom-nav">
   <button class="nav-btn" data-route="home"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a8 8 0 1 0 0-16"/><path d="M12 5a8 8 0 0 0-8 8"/><path d="M12 9v4l2.5 1.5"/></svg>Today</button>
   <button class="nav-btn" data-route="planner"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h3M8 17h6"/></svg>Planner</button>

   <button class="nav-btn" data-route="kitchen"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="3" width="13" height="18" rx="3"/><path d="M5.5 10h13"/><path d="M9 6.5v1.2M9 13v3"/></svg>Kitchen</button>
   <button class="nav-btn" data-route="shopping"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 10.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>Shopping</button>
   <button class="nav-btn" data-route="settings"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>

  <div class="modal-overlay" id="modal-overlay">
   <div class="modal-sheet" id="modal-sheet"></div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
/* ============================================================
   DATABASE
   ============================================================ */
// The app was called Kitchen Companion; the database keeps that name so existing data stays put.
const DB_NAME = 'KitchenCompanionDB';
const DB_VERSION = 4;
let db = null;

// Controlled category list (PROJECT_VISION.md)
const CATEGORIES = [
  'Protein', 'Vegetables', 'Fruit', 'Carbs & Grains', 'Canned & Jarred',
  'Dairy & Refrigerated', 'Sauces & Condiments', 'Spices & Seasonings',
  'Snacks & Treats', 'Ready Meals', 'Other'
];

// Controlled, combinable state vocabulary (PROJECT_VISION.md)
const STATES_V2 = ['Fresh', 'Frozen', 'Defrosting', 'Raw', 'Cooked', 'Leftover', 'Opened', 'Prepared'];

// Maps old single-value `state` strings (schema v1) to new `states` arrays (schema v2)
const STATE_MIGRATION_MAP = {
  'raw': ['Raw'],
  'frozen': ['Frozen', 'Raw'],
  'defrosting': ['Defrosting', 'Raw'],
  'fresh': ['Fresh'],
  'cooked': ['Cooked'],
  'leftover': ['Leftover', 'Cooked'],
  'prepared-component': ['Prepared'],
  'ready-meal': ['Frozen']
};

// Maps old free-text category guesses (schema v1 seed data) to the new controlled list
const CATEGORY_MIGRATION_MAP = {
  'meat': 'Protein',
  'grain': 'Carbs & Grains',
  'produce': 'Vegetables',
  'homemade-meal': 'Ready Meals'
};

function migrateStateV1toV2(oldState) {
  return STATE_MIGRATION_MAP[oldState] || (oldState ? [oldState] : ['Fresh']);
}

function migrateCategoryV1toV2(oldCategory) {
  if (!oldCategory) return 'Other';
  if (CATEGORIES.includes(oldCategory)) return oldCategory;
  const mapped = CATEGORY_MIGRATION_MAP[oldCategory.toLowerCase().trim()];
  return mapped || 'Other';
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = (event) => {
      const _db = event.target.result;
      const tx = event.target.transaction;
      const oldVersion = event.oldVersion;

      let itemsStore;
      if (!_db.objectStoreNames.contains('inventoryItems')) {
        itemsStore = _db.createObjectStore('inventoryItems', { keyPath: 'id', autoIncrement: true });
        itemsStore.createIndex('location', 'location', { unique: false });
        itemsStore.createIndex('expiryDate', 'expiryDate', { unique: false });
        itemsStore.createIndex('category', 'category', { unique: false });
      } else {
        itemsStore = tx.objectStore('inventoryItems');
      }

      // v1 -> v2: states became a multi-value array, category became a controlled list
      if (oldVersion < 2) {
        if (itemsStore.indexNames.contains('state')) {
          itemsStore.deleteIndex('state');
        }
        if (!itemsStore.indexNames.contains('states')) {
          itemsStore.createIndex('states', 'states', { unique: false, multiEntry: true });
        }
        if (!itemsStore.indexNames.contains('isStaple')) {
          itemsStore.createIndex('isStaple', 'isStaple', { unique: false });
        }

        // Migrate every existing record from old shape to new shape
        itemsStore.openCursor().onsuccess = (cursorEvent) => {
          const cursor = cursorEvent.target.result;
          if (!cursor) return;
          const record = cursor.value;
          let changed = false;

          if (record.state !== undefined && record.states === undefined) {
            record.states = migrateStateV1toV2(record.state);
            delete record.state;
            changed = true;
          }
          if (record.category !== undefined && !CATEGORIES.includes(record.category)) {
            record.category = migrateCategoryV1toV2(record.category);
            changed = true;
          }
          if (record.isStaple === undefined) {
            record.isStaple = false;
            changed = true;
          }
          if (record.useByOverrideDays === undefined) {
            record.useByOverrideDays = null;
            changed = true;
          }

          if (changed) cursor.update(record);
          cursor.continue();
        };
      }

      if (!_db.objectStoreNames.contains('inventoryHistory')) {
        const store = _db.createObjectStore('inventoryHistory', { keyPath: 'id', autoIncrement: true });
        store.createIndex('inventoryItemId', 'inventoryItemId', { unique: false });
        store.createIndex('date', 'date', { unique: false });
      }

      if (!_db.objectStoreNames.contains('freezerRatingsReference')) {
        _db.createObjectStore('freezerRatingsReference', { keyPath: 'ingredientName' });
      }

      if (!_db.objectStoreNames.contains('useByReference')) {
        _db.createObjectStore('useByReference', { keyPath: 'lookupKey' });
      }

      if (!_db.objectStoreNames.contains('quickAddTemplates')) {
        const store = _db.createObjectStore('quickAddTemplates', { keyPath: 'id', autoIncrement: true });
        store.createIndex('usageCount', 'usageCount', { unique: false });
      }

      if (!_db.objectStoreNames.contains('recipes')) {
        const store = _db.createObjectStore('recipes', { keyPath: 'id', autoIncrement: true });
        store.createIndex('cuisine', 'cuisine', { unique: false });
        store.createIndex('mealType', 'mealType', { unique: false });
      }

      if (!_db.objectStoreNames.contains('mealPlans')) {
        _db.createObjectStore('mealPlans', { keyPath: 'id', autoIncrement: true });
      }

      if (!_db.objectStoreNames.contains('batchCookEvents')) {
        _db.createObjectStore('batchCookEvents', { keyPath: 'id', autoIncrement: true });
      }

      if (!_db.objectStoreNames.contains('purchaseEvents')) {
        _db.createObjectStore('purchaseEvents', { keyPath: 'id', autoIncrement: true });
      }

      if (!_db.objectStoreNames.contains('settings')) {
        _db.createObjectStore('settings', { keyPath: 'key' });
      }

      // v3: food diary
      if (!_db.objectStoreNames.contains('foodLog')) {
        const store = _db.createObjectStore('foodLog', { keyPath: 'id', autoIncrement: true });
        store.createIndex('date', 'date', { unique: false });
      }

      // v4: shopping list
      if (!_db.objectStoreNames.contains('shoppingList')) {
        _db.createObjectStore('shoppingList', { keyPath: 'id', autoIncrement: true });
      }
    };

    request.onsuccess = (event) => {
      db = event.target.result;
      resolve(db);
    };

    request.onerror = (event) => reject(event.target.error);
  });
}

function dbGetAll(storeName, indexName, query) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const source = indexName ? store.index(indexName) : store;
    const request = query !== undefined ? source.getAll(query) : source.getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function dbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    if (!db) { reject(new Error('Database is not open')); return; }
    try {
      const tx = db.transaction(storeName, 'readonly');
      tx.onerror = () => reject(tx.error || new Error('Transaction failed'));
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      const request = tx.objectStore(storeName).get(key);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    } catch (err) { reject(err); }
  });
}

function dbPut(storeName, value) {
  return new Promise((resolve, reject) => {
    if (!db) { reject(new Error('Database is not open')); return; }
    try {
      const tx = db.transaction(storeName, 'readwrite');
      tx.onerror = () => reject(tx.error || new Error('Transaction failed'));
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      const request = tx.objectStore(storeName).put(value);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    } catch (err) { reject(err); }
  });
}

function dbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    if (!db) { reject(new Error('Database is not open')); return; }
    try {
      const tx = db.transaction(storeName, 'readwrite');
      tx.onerror = () => reject(tx.error || new Error('Transaction failed'));
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      const request = tx.objectStore(storeName).delete(key);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    } catch (err) { reject(err); }
  });
}

function dbClearAndBulkPut(storeName, items) {
  return new Promise((resolve, reject) => {
    if (!db) { reject(new Error('Database is not open')); return; }
    try {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      store.clear();
      items.forEach((item) => store.put(item));
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
    } catch (err) { reject(err); }
  });
}

async function seedIfEmpty() {
  const existingRatings = await dbGetAll('freezerRatingsReference');
  if (existingRatings.length === 0) {
    for (const r of FREEZER_RATINGS_SEED) await dbPut('freezerRatingsReference', r);
  }
  const existingTemplates = await dbGetAll('quickAddTemplates');
  if (existingTemplates.length === 0) {
    for (const t of QUICK_ADD_SEED) await dbPut('quickAddTemplates', t);
  }
  const existingUseBy = await dbGetAll('useByReference');
  if (existingUseBy.length === 0) {
    for (const u of USE_BY_REFERENCE_SEED) await dbPut('useByReference', u);
  }
  const existingSettings = await dbGet('settings', 'profiles');
  if (!existingSettings) {
    await dbPut('settings', {
      key: 'profiles',
      userProfile: { name: '', spicePreference: '', favouriteCuisines: [], dislikedFoods: [] },
      partnerProfile: { name: '', spicePreference: '', favouriteCuisines: [], dislikedFoods: [] }
    });
  }
}

// Looks up a suggested use-by window for an ingredient + its current states.
// Tries state-specific keys first (e.g. "chicken|defrosting"), then falls back to the plain name.
async function getSuggestedUseBy(ingredientName, states) {
  const nameKey = ingredientName.toLowerCase().trim();
  const selectedStates = (states || []).map((s) => s.toLowerCase());

  // Try exact compound keys first (fast path for single-state entries, e.g. "yoghurt|opened")
  for (const s of selectedStates) {
    const compound = await dbGet('useByReference', `${nameKey}|${s}`);
    if (compound) return compound;
  }

  // Fall back to scanning all entries for this ingredient name and matching by applicableStates,
  // so a single seed entry covering multiple states (e.g. Chicken: ['Fresh','Raw']) is found
  // regardless of which one of those states the user actually selected.
  const allEntries = await dbGetAll('useByReference');
  const nameMatches = allEntries.filter((e) => e.lookupKey === nameKey || e.lookupKey.split('|')[0] === nameKey);
  for (const entry of nameMatches) {
    const entryStates = (entry.applicableStates || []).map((s) => s.toLowerCase());
    if (selectedStates.some((s) => entryStates.includes(s))) return entry;
  }

  // Last resort: plain name with no state qualifier at all
  return await dbGet('useByReference', nameKey);
}
